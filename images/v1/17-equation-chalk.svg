<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#2d4a3e"/>
  <!-- Chalkboard texture (subtle lines) -->
  <g stroke="#345549" stroke-width="0.3" opacity="0.5">
    <line x1="0" y1="50" x2="1280" y2="52"/><line x1="0" y1="130" x2="1280" y2="128"/>
    <line x1="0" y1="210" x2="1280" y2="213"/><line x1="0" y1="310" x2="1280" y2="308"/>
    <line x1="0" y1="400" x2="1280" y2="402"/><line x1="0" y1="490" x2="1280" y2="488"/>
    <line x1="0" y1="570" x2="1280" y2="572"/>
  </g>
  <!-- Chalk border -->
  <rect x="30" y="20" width="1220" height="600" rx="0" fill="none" stroke="#c9c4a1" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8,4"/>
  <!-- "Chalk" equations -->
  <g font-family="'Brush Script MT', 'Comic Sans MS', cursive" fill="#c9c4a1">
    <text x="180" y="120" font-size="28" opacity="0.7" transform="rotate(-2,180,120)">Water + Fire = Steam</text>
    <text x="700" y="100" font-size="22" opacity="0.5" transform="rotate(1,700,100)">Earth + Wind = Dust</text>
    <text x="120" y="230" font-size="20" opacity="0.4" transform="rotate(-1,120,230)">Steam + Earth = Mud</text>
    <text x="800" y="250" font-size="24" opacity="0.5" transform="rotate(2,800,250)">Fire + Dust = Ash</text>
    <text x="400" y="180" font-size="18" opacity="0.35" transform="rotate(-1,400,180)">Mud + Fire = Brick</text>
    <text x="900" y="180" font-size="16" opacity="0.3">Brick + Brick = Wall</text>
    <!-- Crossed out wrong guesses -->
    <text x="150" y="350" font-size="18" opacity="0.2" text-decoration="line-through">Water + Water = ?</text>
    <text x="850" y="380" font-size="16" opacity="0.2" text-decoration="line-through">Wind + Wind = ?</text>
  </g>
  <!-- Main title in chalk -->
  <text x="640" y="440" font-family="'Brush Script MT', Georgia, serif" font-size="72" fill="white" text-anchor="middle" opacity="0.9" transform="rotate(-1,640,440)">Infinite Craft</text>
  <text x="640" y="490" font-family="'Courier New', monospace" font-size="16" fill="#c9c4a1" text-anchor="middle" opacity="0.6">PULSE EXPLORER</text>
  <!-- Chalk dust smudge effect -->
  <ellipse cx="500" cy="530" rx="80" ry="20" fill="#c9c4a1" opacity="0.04"/>
  <text x="640" y="570" font-family="'Courier New', monospace" font-size="12" fill="#6a8a7a" text-anchor="middle">8,500+ elements discovered and counting...</text>
</svg>
