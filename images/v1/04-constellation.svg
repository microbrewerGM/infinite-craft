<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#080810"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg4)"/>
  <!-- Stars background -->
  <g fill="white">
    <circle cx="100" cy="50" r="1" opacity="0.3"/><circle cx="250" cy="90" r="0.8" opacity="0.2"/>
    <circle cx="400" cy="30" r="1.2" opacity="0.4"/><circle cx="600" cy="60" r="0.6" opacity="0.2"/>
    <circle cx="800" cy="40" r="1" opacity="0.3"/><circle cx="1000" cy="80" r="0.8" opacity="0.25"/>
    <circle cx="1150" cy="50" r="1.1" opacity="0.35"/><circle cx="150" cy="500" r="0.7" opacity="0.2"/>
    <circle cx="350" cy="550" r="1" opacity="0.3"/><circle cx="550" cy="580" r="0.5" opacity="0.15"/>
    <circle cx="900" cy="530" r="0.9" opacity="0.25"/><circle cx="1100" cy="560" r="0.8" opacity="0.2"/>
    <circle cx="50" cy="300" r="0.6" opacity="0.2"/><circle cx="1230" cy="350" r="0.7" opacity="0.2"/>
  </g>
  <!-- Constellation pattern - 4 base elements as bright stars -->
  <g stroke="white" stroke-opacity="0.12" stroke-width="1">
    <line x1="440" y1="180" x2="640" y2="260"/>
    <line x1="840" y1="180" x2="640" y2="260"/>
    <line x1="440" y1="380" x2="640" y2="260"/>
    <line x1="840" y1="380" x2="640" y2="260"/>
    <line x1="440" y1="180" x2="440" y2="380"/>
    <line x1="840" y1="180" x2="840" y2="380"/>
    <line x1="440" y1="180" x2="840" y2="180"/>
    <line x1="440" y1="380" x2="840" y2="380"/>
    <!-- Outer connections -->
    <line x1="440" y1="180" x2="280" y2="120"/>
    <line x1="840" y1="180" x2="1000" y2="120"/>
    <line x1="440" y1="380" x2="280" y2="440"/>
    <line x1="840" y1="380" x2="1000" y2="440"/>
    <line x1="640" y1="260" x2="640" y2="130"/>
    <line x1="640" y1="260" x2="640" y2="420"/>
  </g>
  <!-- Element stars -->
  <circle cx="440" cy="180" r="6" fill="#ff6b35"/>
  <circle cx="440" cy="180" r="14" fill="#ff6b35" opacity="0.15"/>
  <text x="440" y="165" font-family="Georgia, serif" font-size="12" fill="#ff6b35" text-anchor="middle" opacity="0.8">Fire</text>

  <circle cx="840" cy="180" r="6" fill="#4ecdc4"/>
  <circle cx="840" cy="180" r="14" fill="#4ecdc4" opacity="0.15"/>
  <text x="840" y="165" font-family="Georgia, serif" font-size="12" fill="#4ecdc4" text-anchor="middle" opacity="0.8">Water</text>

  <circle cx="440" cy="380" r="6" fill="#a8e06c"/>
  <circle cx="440" cy="380" r="14" fill="#a8e06c" opacity="0.15"/>
  <text x="440" y="410" font-family="Georgia, serif" font-size="12" fill="#a8e06c" text-anchor="middle" opacity="0.8">Earth</text>

  <circle cx="840" cy="380" r="6" fill="#c4b5fd"/>
  <circle cx="840" cy="380" r="14" fill="#c4b5fd" opacity="0.15"/>
  <text x="840" y="410" font-family="Georgia, serif" font-size="12" fill="#c4b5fd" text-anchor="middle" opacity="0.8">Wind</text>

  <!-- Center discovery -->
  <circle cx="640" cy="260" r="8" fill="white"/>
  <circle cx="640" cy="260" r="20" fill="white" opacity="0.08"/>
  <circle cx="640" cy="260" r="35" fill="white" opacity="0.03"/>

  <!-- Smaller discovery nodes -->
  <circle cx="280" cy="120" r="3" fill="#ffd93d" opacity="0.6"/>
  <circle cx="1000" cy="120" r="3" fill="#ffd93d" opacity="0.6"/>
  <circle cx="280" cy="440" r="3" fill="#ffd93d" opacity="0.6"/>
  <circle cx="1000" cy="440" r="3" fill="#ffd93d" opacity="0.6"/>
  <circle cx="640" cy="130" r="4" fill="#ffd93d" opacity="0.7"/>
  <circle cx="640" cy="420" r="4" fill="#ffd93d" opacity="0.7"/>

  <!-- Title -->
  <text x="640" y="540" font-family="Georgia, serif" font-size="46" fill="white" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <text x="640" y="575" font-family="Georgia, serif" font-size="15" fill="#888" text-anchor="middle" letter-spacing="4" font-style="italic">Pulse Explorer</text>
</svg>
