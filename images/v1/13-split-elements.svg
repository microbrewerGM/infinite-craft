<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <!-- Four quadrants, each an element color -->
  <rect x="0" y="0" width="640" height="320" fill="#1a0a05"/>
  <rect x="640" y="0" width="640" height="320" fill="#051a18"/>
  <rect x="0" y="320" width="640" height="320" fill="#0a1a05"/>
  <rect x="640" y="320" width="640" height="320" fill="#0d0a1a"/>
  <!-- Gradient overlays -->
  <rect x="0" y="0" width="640" height="320" fill="#ff6b35" opacity="0.06"/>
  <rect x="640" y="0" width="640" height="320" fill="#4ecdc4" opacity="0.06"/>
  <rect x="0" y="320" width="640" height="320" fill="#a8e06c" opacity="0.06"/>
  <rect x="640" y="320" width="640" height="320" fill="#c4b5fd" opacity="0.06"/>
  <!-- Dividing lines -->
  <line x1="640" y1="0" x2="640" y2="640" stroke="white" stroke-width="1" stroke-opacity="0.1"/>
  <line x1="0" y1="320" x2="1280" y2="320" stroke="white" stroke-width="1" stroke-opacity="0.1"/>
  <!-- Element names -->
  <text x="320" y="175" font-family="'Helvetica Neue', sans-serif" font-size="56" fill="#ff6b35" text-anchor="middle" font-weight="200" opacity="0.4">Fire</text>
  <text x="960" y="175" font-family="'Helvetica Neue', sans-serif" font-size="56" fill="#4ecdc4" text-anchor="middle" font-weight="200" opacity="0.4">Water</text>
  <text x="320" y="490" font-family="'Helvetica Neue', sans-serif" font-size="56" fill="#a8e06c" text-anchor="middle" font-weight="200" opacity="0.4">Earth</text>
  <text x="960" y="490" font-family="'Helvetica Neue', sans-serif" font-size="56" fill="#c4b5fd" text-anchor="middle" font-weight="200" opacity="0.4">Wind</text>
  <!-- Center overlay -->
  <rect x="390" y="220" width="500" height="200" rx="8" fill="black" opacity="0.7"/>
  <rect x="390" y="220" width="500" height="200" rx="8" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.15"/>
  <text x="640" y="310" font-family="'Helvetica Neue', sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="700">INFINITE CRAFT</text>
  <text x="640" y="345" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#888" text-anchor="middle" font-weight="300">Pulse Explorer</text>
  <text x="640" y="390" font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#555" text-anchor="middle">4 elements &#x2022; 8,500+ discoveries &#x2022; $0/month</text>
</svg>
