    <line x1="80" y1="0" x2="80" y2="640"/><line x1="120" y1="0" x2="120" y2="640"/>
    <line x1="160" y1="0" x2="160" y2="640"/><line x1="200" y1="0" x2="200" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="640"/><line x1="280" y1="0" x2="280" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/><line x1="360" y1="0" x2="360" y2="640"/>
    <line x1="400" y1="0" x2="400" y2="640"/><line x1="440" y1="0" x2="440" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/><line x1="520" y1="0" x2="520" y2="640"/>
    <line x1="560" y1="0" x2="560" y2="640"/><line x1="600" y1="0" x2="600" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/><line x1="680" y1="0" x2="680" y2="640"/>
    <line x1="720" y1="0" x2="720" y2="640"/><line x1="760" y1="0" x2="760" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/><line x1="840" y1="0" x2="840" y2="640"/>
    <line x1="880" y1="0" x2="880" y2="640"/><line x1="920" y1="0" x2="920" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/><line x1="1000" y1="0" x2="1000" y2="640"/>
    <line x1="1040" y1="0" x2="1040" y2="640"/><line x1="1080" y1="0" x2="1080" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/><line x1="1160" y1="0" x2="1160" y2="640"/>
    <line x1="1200" y1="0" x2="1200" y2="640"/><line x1="1240" y1="0" x2="1240" y2="640"/>
    <line x1="1280" y1="0" x2="1280" y2="640"/>
    <line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="440" x2="1280" y2="440"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="520" x2="1280" y2="520"/><line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>
  <!-- Architecture diagram -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#6eaadc">
    <!-- EventBridge -->
    <rect x="200" y="120" width="160" height="60" rx="2" fill="none" stroke="#6eaadc" stroke-width="1.5"/>
    <text x="280" y="148" text-anchor="middle" font-size="10">EventBridge</text>
    <text x="280" y="165" text-anchor="middle" font-size="14" fill="white">rate(4h)</text>

    <!-- Arrow -->
    <line x1="360" y1="150" x2="440" y2="150" stroke="#6eaadc" stroke-width="1"/>
    <polygon points="440,145 450,150 440,155" fill="#6eaadc"/>

    <!-- Lambda -->
    <rect x="460" y="120" width="160" height="60" rx="2" fill="none" stroke="#6eaadc" stroke-width="1.5"/>
    <text x="540" y="148" text-anchor="middle" font-size="10">Lambda</text>
    <text x="540" y="165" text-anchor="middle" font-size="14" fill="white">Worker</text>

    <!-- Arrow down -->
    <line x1="540" y1="180" x2="540" y2="240" stroke="#6eaadc" stroke-width="1"/>
    <polygon points="535,240 540,250 545,240" fill="#6eaadc"/>

    <!-- DynamoDB -->
    <rect x="460" y="260" width="360" height="60" rx="2" fill="none" stroke="#6eaadc" stroke-width="1.5"/>
    <text x="640" y="288" text-anchor="middle" font-size="10">DynamoDB</text>
    <text x="640" y="305" text-anchor="middle" font-size="14" fill="white">discoveries | recipes | tried-pairs</text>

    <!-- Arrow up from API -->
    <line x1="740" y1="260" x2="740" y2="200" stroke="#6eaadc" stroke-width="1"/>
    <polygon points="735,200 740,190 745,200" fill="#6eaadc"/>

    <!-- API Lambda -->
    <rect x="660" y="120" width="160" height="60" rx="2" fill="none" stroke="#6eaadc" stroke-width="1.5"/>
    <text x="740" y="148" text-anchor="middle" font-size="10">Lambda</text>
    <text x="740" y="165" text-anchor="middle" font-size="14" fill="white">API (R/O)</text>

    <!-- Arrow from CloudFront -->
    <line x1="940" y1="150" x2="820" y2="150" stroke="#6eaadc" stroke-width="1"/>
    <polygon points="820,145 810,150 820,155" fill="#6eaadc"/>

    <!-- CloudFront -->
    <rect x="940" y="120" width="160" height="60" rx="2" fill="none" stroke="#6eaadc" stroke-width="1.5"/>
    <text x="1020" y="148" text-anchor="middle" font-size="10">CloudFront</text>
    <text x="1020" y="165" text-anchor="middle" font-size="14" fill="white">Dashboard</text>

    <!-- Arrow to S3 -->
    <line x1="1020" y1="180" x2="1020" y2="240" stroke="#6eaadc" stroke-width="1"/>
    <polygon points="1015,240 1020,250 1025,240" fill="#6eaadc"/>

    <!-- S3 -->
    <rect x="940" y="260" width="160" height="60" rx="2" fill="none" stroke="#6eaadc" stroke-width="1.5"/>
    <text x="1020" y="288" text-anchor="middle" font-size="10">S3</text>
    <text x="1020" y="305" text-anchor="middle" font-size="14" fill="white">index.html</text>
  </g>

  <!-- Title -->
  <text x="640" y="460" font-family="'Courier New', monospace" font-size="52" fill="white" text-anchor="middle" font-weight="bold">INFINITE CRAFT</text>
  <text x="640" y="500" font-family="'Courier New', monospace" font-size="16" fill="#6eaadc" text-anchor="middle">PULSE EXPLORER — SERVERLESS ARCHITECTURE</text>
  <!-- Annotation -->
  <text x="200" y="580" font-family="'Courier New', monospace" font-size="11" fill="#4a6a9a" opacity="0.6">TOTAL MONTHLY COST: $0.00 (FREE TIER)</text>
  <text x="880" y="580" font-family="'Courier New', monospace" font-size="11" fill="#4a6a9a" opacity="0.6">REV 1.0 — SAM TEMPLATE</text>
</svg>
