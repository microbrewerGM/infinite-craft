<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0d1117"/>
  <!-- Grid of element cards -->
  <g font-family="'SF Mono', 'Courier New', monospace">
    <!-- Row 1 -->
    <rect x="180" y="80" width="80" height="90" rx="4" fill="none" stroke="#ff6b35" stroke-opacity="0.4"/>
    <text x="195" y="105" font-size="11" fill="#ff6b35" opacity="0.6">001</text>
    <text x="220" y="140" font-size="24" fill="white" text-anchor="middle" font-weight="bold">Wa</text>
    <text x="220" y="160" font-size="10" fill="#888" text-anchor="middle">Water</text>

    <rect x="280" y="80" width="80" height="90" rx="4" fill="none" stroke="#ff6b35" stroke-opacity="0.4"/>
    <text x="295" y="105" font-size="11" fill="#ff6b35" opacity="0.6">002</text>
    <text x="320" y="140" font-size="24" fill="white" text-anchor="middle" font-weight="bold">Fi</text>
    <text x="320" y="160" font-size="10" fill="#888" text-anchor="middle">Fire</text>

    <rect x="380" y="80" width="80" height="90" rx="4" fill="none" stroke="#4ecdc4" stroke-opacity="0.4"/>
    <text x="395" y="105" font-size="11" fill="#4ecdc4" opacity="0.6">003</text>
    <text x="420" y="140" font-size="24" fill="white" text-anchor="middle" font-weight="bold">Wi</text>
    <text x="420" y="160" font-size="10" fill="#888" text-anchor="middle">Wind</text>

    <rect x="480" y="80" width="80" height="90" rx="4" fill="none" stroke="#4ecdc4" stroke-opacity="0.4"/>
    <text x="495" y="105" font-size="11" fill="#4ecdc4" opacity="0.6">004</text>
    <text x="520" y="140" font-size="24" fill="white" text-anchor="middle" font-weight="bold">Ea</text>
    <text x="520" y="160" font-size="10" fill="#888" text-anchor="middle">Earth</text>

    <!-- Row 2 - Gen 1 -->
    <rect x="280" y="190" width="80" height="90" rx="4" fill="none" stroke="#a8e06c" stroke-opacity="0.3"/>
    <text x="295" y="215" font-size="11" fill="#a8e06c" opacity="0.6">005</text>
    <text x="320" y="250" font-size="24" fill="white" text-anchor="middle" font-weight="bold">St</text>
    <text x="320" y="270" font-size="10" fill="#888" text-anchor="middle">Steam</text>

    <rect x="380" y="190" width="80" height="90" rx="4" fill="none" stroke="#a8e06c" stroke-opacity="0.3"/>
    <text x="395" y="215" font-size="11" fill="#a8e06c" opacity="0.6">006</text>
    <text x="420" y="250" font-size="24" fill="white" text-anchor="middle" font-weight="bold">La</text>
    <text x="420" y="270" font-size="10" fill="#888" text-anchor="middle">Lava</text>

    <rect x="480" y="190" width="80" height="90" rx="4" fill="none" stroke="#a8e06c" stroke-opacity="0.3"/>
    <text x="495" y="215" font-size="11" fill="#a8e06c" opacity="0.6">007</text>
    <text x="520" y="250" font-size="24" fill="white" text-anchor="middle" font-weight="bold">Du</text>
    <text x="520" y="270" font-size="10" fill="#888" text-anchor="middle">Dust</text>

    <!-- Fading dots -->
    <rect x="580" y="190" width="80" height="90" rx="4" fill="none" stroke="#666" stroke-opacity="0.15"/>
    <rect x="680" y="190" width="80" height="90" rx="4" fill="none" stroke="#666" stroke-opacity="0.08"/>
    <rect x="780" y="190" width="80" height="90" rx="4" fill="none" stroke="#666" stroke-opacity="0.04"/>

    <!-- Row 3 fading -->
    <rect x="380" y="300" width="80" height="90" rx="4" fill="none" stroke="#c4b5fd" stroke-opacity="0.2"/>
    <text x="395" y="325" font-size="11" fill="#c4b5fd" opacity="0.4">042</text>
    <text x="420" y="360" font-size="24" fill="white" text-anchor="middle" font-weight="bold" opacity="0.6">Pl</text>
    <text x="420" y="380" font-size="10" fill="#888" text-anchor="middle" opacity="0.5">Plant</text>

    <rect x="480" y="300" width="80" height="90" rx="4" fill="none" stroke="#c4b5fd" stroke-opacity="0.15"/>
    <rect x="580" y="300" width="80" height="90" rx="4" fill="none" stroke="#c4b5fd" stroke-opacity="0.08"/>
    <rect x="680" y="300" width="80" height="90" rx="4" fill="none" stroke="#c4b5fd" stroke-opacity="0.04"/>
  </g>

  <!-- Counter -->
  <text x="950" y="200" font-family="'SF Mono', monospace" font-size="72" fill="white" text-anchor="middle" font-weight="bold">8,579</text>
  <text x="950" y="235" font-family="'SF Mono', monospace" font-size="16" fill="#4ecdc4" text-anchor="middle">elements discovered</text>

  <!-- Title -->
  <text x="640" y="530" font-family="'SF Mono', monospace" font-size="44" fill="white" text-anchor="middle" font-weight="bold">INFINITE CRAFT</text>
  <text x="640" y="565" font-family="'SF Mono', monospace" font-size="14" fill="#666" text-anchor="middle">P U L S E   E X P L O R E R</text>
</svg>
