<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#030b03"/>
  <!-- Matrix-style falling element names -->
  <g font-family="'Courier New', monospace" font-size="12" opacity="0.15">
    <text x="40" y="30" fill="#4ecdc4">Water</text><text x="40" y="55" fill="#4ecdc4">Steam</text>
    <text x="40" y="80" fill="#4ecdc4">Cloud</text><text x="40" y="105" fill="#4ecdc4">Rain</text>
    <text x="40" y="130" fill="#4ecdc4">Flood</text><text x="40" y="155" fill="#4ecdc4" opacity="0.5">Ocean</text>
    <text x="40" y="180" fill="#4ecdc4" opacity="0.3">Wave</text>

    <text x="160" y="80" fill="#a8e06c">Earth</text><text x="160" y="105" fill="#a8e06c">Mud</text>
    <text x="160" y="130" fill="#a8e06c">Clay</text><text x="160" y="155" fill="#a8e06c">Brick</text>
    <text x="160" y="180" fill="#a8e06c">Wall</text><text x="160" y="205" fill="#a8e06c" opacity="0.5">House</text>
    <text x="160" y="230" fill="#a8e06c" opacity="0.3">Castle</text>

    <text x="280" y="150" fill="#ff6b35">Fire</text><text x="280" y="175" fill="#ff6b35">Lava</text>
    <text x="280" y="200" fill="#ff6b35">Obsidian</text><text x="280" y="225" fill="#ff6b35">Blade</text>
    <text x="280" y="250" fill="#ff6b35" opacity="0.5">Sword</text>
    <text x="280" y="275" fill="#ff6b35" opacity="0.3">Knight</text>

    <text x="400" y="50" fill="#c4b5fd">Wind</text><text x="400" y="75" fill="#c4b5fd">Dust</text>
    <text x="400" y="100" fill="#c4b5fd">Sand</text><text x="400" y="125" fill="#c4b5fd">Glass</text>
    <text x="400" y="150" fill="#c4b5fd">Mirror</text><text x="400" y="175" fill="#c4b5fd" opacity="0.5">Reflection</text>

    <text x="520" y="120" fill="#ffd93d">Plant</text><text x="520" y="145" fill="#ffd93d">Tree</text>
    <text x="520" y="170" fill="#ffd93d">Forest</text><text x="520" y="195" fill="#ffd93d" opacity="0.5">Jungle</text>

    <text x="760" y="40" fill="#4ecdc4">Ice</text><text x="760" y="65" fill="#4ecdc4">Glacier</text>
    <text x="760" y="90" fill="#4ecdc4">Arctic</text><text x="760" y="115" fill="#4ecdc4" opacity="0.5">Penguin</text>

    <text x="880" y="100" fill="#a8e06c">Mountain</text><text x="880" y="125" fill="#a8e06c">Volcano</text>
    <text x="880" y="150" fill="#a8e06c">Eruption</text><text x="880" y="175" fill="#a8e06c" opacity="0.5">Ash</text>

    <text x="1000" y="60" fill="#ff6b35">Sun</text><text x="1000" y="85" fill="#ff6b35">Solar</text>
    <text x="1000" y="110" fill="#ff6b35">Eclipse</text><text x="1000" y="135" fill="#ff6b35" opacity="0.5">Moon</text>

    <text x="1120" y="130" fill="#c4b5fd">Storm</text><text x="1120" y="155" fill="#c4b5fd">Thunder</text>
    <text x="1120" y="180" fill="#c4b5fd">Lightning</text><text x="1120" y="205" fill="#c4b5fd" opacity="0.5">Zeus</text>

    <text x="640" y="200" fill="#4ecdc4">Robot</text><text x="640" y="225" fill="#4ecdc4" opacity="0.5">AI</text>
  </g>
  <!-- Bottom fade columns -->
  <g font-family="'Courier New', monospace" font-size="12" opacity="0.06">
    <text x="40" y="450" fill="#4ecdc4">Whale</text><text x="160" y="500" fill="#a8e06c">Diamond</text>
    <text x="280" y="480" fill="#ff6b35">Dragon</text><text x="400" y="520" fill="#c4b5fd">Ghost</text>
    <text x="760" y="460" fill="#4ecdc4">Unicorn</text><text x="880" y="490" fill="#a8e06c">Titan</text>
    <text x="1000" y="470" fill="#ff6b35">Phoenix</text><text x="1120" y="510" fill="#c4b5fd">Galaxy</text>
  </g>
  <!-- Central title (bright, cutting through the rain) -->
  <rect x="340" y="310" width="600" height="120" rx="4" fill="#030b03" opacity="0.9"/>
  <text x="640" y="370" font-family="'Courier New', monospace" font-size="52" fill="#4ecdc4" text-anchor="middle" font-weight="bold">INFINITE CRAFT</text>
  <text x="640" y="410" font-family="'Courier New', monospace" font-size="14" fill="#1a5a4a" text-anchor="middle" letter-spacing="4">PULSE EXPLORER</text>
  <!-- Bottom stats -->
  <text x="640" y="580" font-family="'Courier New', monospace" font-size="11" fill="#0a3a2a" text-anchor="middle">ELEMENTS_DISCOVERED=8579 | RECIPES=48847 | COST=$0.00</text>
</svg>
