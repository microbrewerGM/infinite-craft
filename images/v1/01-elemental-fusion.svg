<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a15"/>
    </radialGradient>
    <radialGradient id="fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="water" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8e06c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a8e06c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wind" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#g1)"/>
  <!-- Four elements converging -->
  <circle cx="540" cy="250" r="120" fill="url(#fire)"/>
  <circle cx="740" cy="250" r="120" fill="url(#water)"/>
  <circle cx="540" cy="390" r="120" fill="url(#earth)"/>
  <circle cx="740" cy="390" r="120" fill="url(#wind)"/>
  <circle cx="640" cy="320" r="80" fill="url(#center)"/>
  <!-- Element labels -->
  <text x="500" y="220" font-family="Georgia, serif" font-size="16" fill="#ff6b35" opacity="0.7" text-anchor="middle">Fire</text>
  <text x="780" y="220" font-family="Georgia, serif" font-size="16" fill="#4ecdc4" opacity="0.7" text-anchor="middle">Water</text>
  <text x="500" y="430" font-family="Georgia, serif" font-size="16" fill="#a8e06c" opacity="0.7" text-anchor="middle">Earth</text>
  <text x="780" y="430" font-family="Georgia, serif" font-size="16" fill="#c4b5fd" opacity="0.7" text-anchor="middle">Wind</text>
  <!-- Title -->
  <text x="640" y="325" font-family="Georgia, serif" font-size="28" fill="white" text-anchor="middle" opacity="0.9">+</text>
  <text x="640" y="540" font-family="'Courier New', monospace" font-size="42" fill="white" text-anchor="middle" font-weight="bold">INFINITE CRAFT</text>
  <text x="640" y="575" font-family="'Courier New', monospace" font-size="16" fill="#888" text-anchor="middle">PULSE EXPLORER</text>
</svg>
