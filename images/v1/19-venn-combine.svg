<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0a0a14"/>
  <!-- Large venn diagram -->
  <circle cx="520" cy="280" r="180" fill="#ff6b35" opacity="0.08" stroke="#ff6b35" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="760" cy="280" r="180" fill="#4ecdc4" opacity="0.08" stroke="#4ecdc4" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Labels -->
  <text x="420" y="285" font-family="'Helvetica Neue', sans-serif" font-size="22" fill="#ff6b35" text-anchor="middle" opacity="0.7">Element A</text>
  <text x="860" y="285" font-family="'Helvetica Neue', sans-serif" font-size="22" fill="#4ecdc4" text-anchor="middle" opacity="0.7">Element B</text>
  <!-- Intersection glow -->
  <ellipse cx="640" cy="280" rx="60" ry="100" fill="white" opacity="0.06"/>
  <!-- Result in center -->
  <text x="640" y="270" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600" opacity="0.9">New</text>
  <text x="640" y="295" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600" opacity="0.9">Discovery</text>
  <!-- Plus sign -->
  <text x="640" y="140" font-family="'Helvetica Neue', sans-serif" font-size="36" fill="white" text-anchor="middle" opacity="0.15">+</text>
  <!-- Title -->
  <text x="640" y="510" font-family="'Helvetica Neue', sans-serif" font-size="58" fill="white" text-anchor="middle" font-weight="800">INFINITE CRAFT</text>
  <text x="640" y="550" font-family="'Helvetica Neue', sans-serif" font-size="16" fill="#666" text-anchor="middle" font-weight="300">Every combination is a possibility</text>
  <text x="640" y="600" font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#333" text-anchor="middle">PULSE EXPLORER</text>
</svg>
