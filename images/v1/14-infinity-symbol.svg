<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- Large infinity symbol made of dots -->
  <g fill="white">
    <!-- Left loop -->
    <circle cx="440" cy="240" r="3" opacity="0.8"/>
    <circle cx="420" cy="260" r="3" opacity="0.7"/>
    <circle cx="405" cy="285" r="3" opacity="0.65"/>
    <circle cx="400" cy="310" r="3" opacity="0.6"/>
    <circle cx="405" cy="335" r="3" opacity="0.55"/>
    <circle cx="420" cy="360" r="3" opacity="0.5"/>
    <circle cx="440" cy="380" r="3" opacity="0.45"/>
    <circle cx="465" cy="392" r="3" opacity="0.4"/>
    <circle cx="495" cy="395" r="3" opacity="0.38"/>
    <circle cx="525" cy="388" r="3" opacity="0.35"/>
    <circle cx="550" cy="372" r="3" opacity="0.32"/>
    <circle cx="570" cy="350" r="3" opacity="0.3"/>
    <!-- Cross center -->
    <circle cx="590" cy="325" r="3.5" opacity="0.7"/>
    <circle cx="610" cy="310" r="4" opacity="0.9"/>
    <circle cx="640" cy="310" r="4.5" opacity="1.0"/>
    <circle cx="670" cy="310" r="4" opacity="0.9"/>
    <circle cx="690" cy="295" r="3.5" opacity="0.7"/>
    <!-- Right loop -->
    <circle cx="710" cy="270" r="3" opacity="0.65"/>
    <circle cx="730" cy="250" r="3" opacity="0.6"/>
    <circle cx="755" cy="238" r="3" opacity="0.55"/>
    <circle cx="785" cy="232" r="3" opacity="0.5"/>
    <circle cx="815" cy="235" r="3" opacity="0.48"/>
    <circle cx="840" cy="248" r="3" opacity="0.45"/>
    <circle cx="858" cy="268" r="3" opacity="0.42"/>
    <circle cx="865" cy="295" r="3" opacity="0.4"/>
    <circle cx="860" cy="320" r="3" opacity="0.38"/>
    <circle cx="845" cy="342" r="3" opacity="0.35"/>
    <circle cx="822" cy="358" r="3" opacity="0.32"/>
    <circle cx="795" cy="368" r="3" opacity="0.3"/>
    <circle cx="765" cy="370" r="3" opacity="0.28"/>
    <circle cx="735" cy="365" r="3" opacity="0.26"/>
    <circle cx="710" cy="350" r="3" opacity="0.24"/>
    <!-- Cross back -->
    <circle cx="690" cy="330" r="3" opacity="0.5"/>
    <circle cx="590" cy="295" r="3" opacity="0.5"/>
    <circle cx="570" cy="270" r="3" opacity="0.55"/>
    <circle cx="545" cy="250" r="3" opacity="0.58"/>
    <circle cx="518" cy="235" r="3" opacity="0.6"/>
    <circle cx="490" cy="228" r="3" opacity="0.65"/>
    <circle cx="462" cy="230" r="3" opacity="0.7"/>
  </g>
  <!-- Element color accents on the infinity path -->
  <circle cx="400" cy="310" r="5" fill="#ff6b35" opacity="0.6"/>
  <circle cx="640" cy="310" r="6" fill="white" opacity="0.9"/>
  <circle cx="865" cy="295" r="5" fill="#4ecdc4" opacity="0.6"/>
  <circle cx="525" cy="388" r="4" fill="#a8e06c" opacity="0.5"/>
  <circle cx="785" cy="232" r="4" fill="#c4b5fd" opacity="0.5"/>
  <!-- Title -->
  <text x="640" y="500" font-family="'Helvetica Neue', sans-serif" font-size="52" fill="white" text-anchor="middle" font-weight="100" letter-spacing="10">INFINITE CRAFT</text>
  <text x="640" y="540" font-family="'Helvetica Neue', sans-serif" font-size="14" fill="#444" text-anchor="middle" letter-spacing="6">PULSE EXPLORER</text>
</svg>
