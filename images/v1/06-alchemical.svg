<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0f0e0c"/>
  <!-- Aged parchment border -->
  <rect x="40" y="30" width="1200" height="580" rx="3" fill="none" stroke="#8b7355" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="50" y="40" width="1180" height="560" rx="2" fill="none" stroke="#8b7355" stroke-width="0.5" stroke-opacity="0.2"/>
  <!-- Alchemical circle -->
  <circle cx="640" cy="280" r="180" fill="none" stroke="#c9a96e" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="640" cy="280" r="150" fill="none" stroke="#c9a96e" stroke-width="0.5" stroke-opacity="0.2"/>
  <circle cx="640" cy="280" r="210" fill="none" stroke="#c9a96e" stroke-width="0.5" stroke-opacity="0.15"/>
  <!-- Triangle inscribed -->
  <polygon points="640,110 490,370 790,370" fill="none" stroke="#c9a96e" stroke-width="0.8" stroke-opacity="0.25"/>
  <!-- Inverted triangle -->
  <polygon points="640,450 490,190 790,190" fill="none" stroke="#c9a96e" stroke-width="0.8" stroke-opacity="0.25"/>
  <!-- Element symbols at cardinal points -->
  <text x="640" y="115" font-family="Georgia, serif" font-size="22" fill="#ff6b35" text-anchor="middle" opacity="0.8">&#x1F702;</text>
  <text x="640" y="90" font-family="Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" opacity="0.5">FIRE</text>
  <text x="840" y="290" font-family="Georgia, serif" font-size="22" fill="#4ecdc4" text-anchor="middle" opacity="0.8">&#x1F704;</text>
  <text x="870" y="290" font-family="Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="start" opacity="0.5">WATER</text>
  <text x="640" y="470" font-family="Georgia, serif" font-size="22" fill="#a8e06c" text-anchor="middle" opacity="0.8">&#x1F703;</text>
  <text x="640" y="495" font-family="Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="middle" opacity="0.5">EARTH</text>
  <text x="440" y="290" font-family="Georgia, serif" font-size="22" fill="#c4b5fd" text-anchor="middle" opacity="0.8">&#x1F701;</text>
  <text x="405" y="290" font-family="Georgia, serif" font-size="11" fill="#c9a96e" text-anchor="end" opacity="0.5">AIR</text>
  <!-- Center symbol -->
  <text x="640" y="290" font-family="Georgia, serif" font-size="36" fill="#c9a96e" text-anchor="middle" opacity="0.6">&#x2728;</text>
  <!-- Title -->
  <text x="640" y="555" font-family="Georgia, serif" font-size="42" fill="#c9a96e" text-anchor="middle" letter-spacing="6">INFINITE CRAFT</text>
  <text x="640" y="585" font-family="Georgia, serif" font-size="13" fill="#8b7355" text-anchor="middle" letter-spacing="4" font-style="italic">Autonomous Element Discovery</text>
</svg>
