<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#151530"/>
      <stop offset="100%" stop-color="#080810"/>
    </radialGradient>
    <linearGradient id="serpent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8e06c"/>
      <stop offset="30%" stop-color="#4ecdc4"/>
      <stop offset="60%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a8e06c"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg3)"/>
  <!-- Ouroboros serpent body as thick ring -->
  <g transform="translate(640,320)">
    <!-- Outer glow ring -->
    <circle r="210" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.15" filter="url(#glow3)"/>
    <!-- Main serpent body - segmented arc -->
    <circle r="200" fill="none" stroke="url(#serpent)" stroke-width="18" stroke-dasharray="8 3" opacity="0.7"/>
    <circle r="200" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.3"/>
    <circle r="182" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
    <circle r="218" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
    <!-- Scale pattern overlay -->
    <circle r="200" fill="none" stroke="#a8e06c" stroke-width="12" stroke-dasharray="3 8" opacity="0.3"/>
    <!-- Serpent head (top, eating tail) -->
    <g transform="translate(0,-200)">
      <ellipse rx="28" ry="18" fill="#2a4a2a" stroke="#a8e06c" stroke-width="1.5"/>
      <circle cx="-10" cy="-5" r="3" fill="#ffd93d"/>
      <circle cx="10" cy="-5" r="3" fill="#ffd93d"/>
      <circle cx="-10" cy="-5" r="1.5" fill="#0a0a1a"/>
      <circle cx="10" cy="-5" r="1.5" fill="#0a0a1a"/>
      <!-- Mouth/jaw eating tail -->
      <path d="M-15,8 Q0,18 15,8" fill="none" stroke="#a8e06c" stroke-width="1"/>
    </g>
    <!-- Interior: inscribed hexagram -->
    <g fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.4">
      <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"/>
      <polygon points="0,-120 -104,60 104,60"/>
      <polygon points="0,120 -104,-60 104,-60"/>
    </g>
    <!-- Central eye / all-seeing eye -->
    <g filter="url(#glow3)">
      <ellipse rx="40" ry="25" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
      <circle r="12" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
      <circle r="5" fill="#ffd93d" opacity="0.6"/>
    </g>
    <!-- Element symbols inside -->
    <text x="0" y="-70" text-anchor="middle" font-family="serif" font-size="18" fill="#ff6b35" opacity="0.7">&#x1F702;</text>
    <text x="70" y="5" text-anchor="middle" font-family="serif" font-size="18" fill="#4ecdc4" opacity="0.7">&#x1F704;</text>
    <text x="0" y="80" text-anchor="middle" font-family="serif" font-size="18" fill="#a8e06c" opacity="0.7">&#x1F703;</text>
    <text x="-70" y="5" text-anchor="middle" font-family="serif" font-size="18" fill="#c4b5fd" opacity="0.7">&#x1F701;</text>
  </g>
  <!-- Title at bottom -->
  <text x="640" y="585" text-anchor="middle" font-family="serif" font-size="40" fill="#c9a96e" letter-spacing="12" filter="url(#glow3)">INFINITE CRAFT</text>
  <!-- Subtitle -->
  <text x="640" y="615" text-anchor="middle" font-family="serif" font-size="12" fill="#4ecdc4" opacity="0.5" letter-spacing="8">ETERNAL CREATION</text>
  <!-- Stars -->
  <g fill="#ffd93d" opacity="0.2">
    <circle cx="80" cy="60" r="1.5"/><circle cx="180" cy="140" r="1"/><circle cx="100" cy="520" r="1"/>
    <circle cx="1200" cy="80" r="1.5"/><circle cx="1100" cy="500" r="1"/><circle cx="1180" cy="320" r="1.5"/>
  </g>
</svg>