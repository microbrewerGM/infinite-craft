<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0a1a15"/>
  <!-- River delta: branching water channels from single source -->
  <g stroke="#4ecdc4" fill="none" stroke-linecap="round">
    <!-- Main channel -->
    <path d="M640,40 Q630,100 640,160 Q650,200 640,240" stroke-width="6" stroke-opacity="0.5"/>
    <!-- First split -->
    <path d="M640,240 Q580,300 500,340 Q430,370 350,380" stroke-width="4" stroke-opacity="0.4"/>
    <path d="M640,240 Q700,300 780,340 Q850,370 930,380" stroke-width="4" stroke-opacity="0.4"/>
    <!-- Second split left -->
    <path d="M500,340 Q460,370 400,410 Q340,440 260,460" stroke-width="2.5" stroke-opacity="0.3"/>
    <path d="M500,340 Q520,380 530,430 Q540,470 540,520" stroke-width="2.5" stroke-opacity="0.3"/>
    <!-- Second split right -->
    <path d="M780,340 Q810,380 820,430 Q830,470 840,520" stroke-width="2.5" stroke-opacity="0.3"/>
    <path d="M780,340 Q820,370 880,410 Q940,440 1020,460" stroke-width="2.5" stroke-opacity="0.3"/>
    <!-- Fine branches -->
    <path d="M350,380 Q300,400 240,420" stroke-width="1.5" stroke-opacity="0.2"/>
    <path d="M350,380 Q360,430 370,480" stroke-width="1.5" stroke-opacity="0.2"/>
    <path d="M930,380 Q980,400 1040,420" stroke-width="1.5" stroke-opacity="0.2"/>
    <path d="M930,380 Q920,430 910,480" stroke-width="1.5" stroke-opacity="0.2"/>
    <path d="M260,460 Q220,490 180,520" stroke-width="1" stroke-opacity="0.15"/>
    <path d="M1020,460 Q1060,490 1100,520" stroke-width="1" stroke-opacity="0.15"/>
  </g>
  <!-- Element deposits at delta tips -->
  <circle cx="640" cy="40" r="8" fill="white" opacity="0.8"/>
  <circle cx="350" cy="380" r="5" fill="#ff6b35" opacity="0.6"/>
  <circle cx="260" cy="460" r="4" fill="#a8e06c" opacity="0.5"/>
  <circle cx="540" cy="520" r="4" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="930" cy="380" r="5" fill="#ffd93d" opacity="0.6"/>
  <circle cx="840" cy="520" r="4" fill="#ff6b35" opacity="0.5"/>
  <circle cx="1020" cy="460" r="4" fill="#4ecdc4" opacity="0.5"/>
  <text x="640" y="590" font-family="'Helvetica Neue', sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="300" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="620" font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#4ecdc4" text-anchor="middle" letter-spacing="6">BRANCHING DISCOVERY</text>
</svg>