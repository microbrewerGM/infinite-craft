<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e1a"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <filter id="glow7">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="innerglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="100%" stop-color="#2a1a0a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg7)"/>
  <!-- Wooden shelf -->
  <rect x="100" y="470" width="1080" height="12" fill="url(#shelf)" rx="2"/>
  <rect x="100" y="482" width="1080" height="4" fill="#1a1008" opacity="0.5"/>
  <!-- Bottle 1: Tall flask with fire potion -->
  <g transform="translate(240,280)">
    <rect x="-12" y="-100" width="24" height="30" rx="3" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.6"/>
    <path d="M-12,-70 Q-40,20 -40,80 Q-40,120 0,120 Q40,120 40,80 Q40,20 12,-70" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.6"/>
    <!-- Liquid fill -->
    <path d="M-35,30 Q-40,80 0,120 Q40,80 35,30 Z" fill="#ff6b35" opacity="0.15"/>
    <path d="M-30,50 Q-35,80 0,110 Q35,80 30,50 Z" fill="#ff6b35" opacity="0.1"/>
    <!-- Bubbles -->
    <circle cx="-10" cy="60" r="4" fill="none" stroke="#ff6b35" stroke-width="0.5" opacity="0.4"/>
    <circle cx="8" cy="80" r="3" fill="none" stroke="#ff6b35" stroke-width="0.5" opacity="0.3"/>
    <circle cx="-5" cy="95" r="2" fill="none" stroke="#ff6b35" stroke-width="0.5" opacity="0.4"/>
    <!-- Glow -->
    <ellipse cx="0" cy="80" rx="20" ry="30" fill="#ff6b35" opacity="0.08" filter="url(#glow7)"/>
    <!-- Cork -->
    <rect x="-10" y="-105" width="20" height="10" rx="2" fill="#8b7355" opacity="0.5"/>
    <text x="0" y="150" text-anchor="middle" font-family="serif" font-size="11" fill="#ff6b35" opacity="0.6">IGNIS</text>
  </g>
  <!-- Bottle 2: Round flask with water potion -->
  <g transform="translate(440,300)">
    <rect x="-8" y="-110" width="16" height="25" rx="2" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.6"/>
    <path d="M-8,-85 L-8,-60 Q-55,-20 -55,30 Q-55,100 0,100 Q55,100 55,30 Q55,-20 8,-60 L8,-85" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="30" rx="50" ry="60" fill="#4ecdc4" opacity="0.08"/>
    <path d="M-45,10 Q-50,60 0,95 Q50,60 45,10 Z" fill="#4ecdc4" opacity="0.12"/>
    <!-- Wave lines -->
    <path d="M-35,20 Q-20,15 0,20 Q20,25 35,20" fill="none" stroke="#4ecdc4" stroke-width="0.5" opacity="0.4"/>
    <path d="M-30,35 Q-15,30 0,35 Q15,40 30,35" fill="none" stroke="#4ecdc4" stroke-width="0.5" opacity="0.3"/>
    <ellipse cx="0" cy="40" rx="25" ry="35" fill="#4ecdc4" opacity="0.06" filter="url(#glow7)"/>
    <rect x="-6" y="-115" width="12" height="8" rx="2" fill="#8b7355" opacity="0.5"/>
    <text x="0" y="130" text-anchor="middle" font-family="serif" font-size="11" fill="#4ecdc4" opacity="0.6">AQUA</text>
  </g>
  <!-- Bottle 3: Triangular/erlenmeyer with earth potion -->
  <g transform="translate(640,300)">
    <rect x="-10" y="-100" width="20" height="20" rx="2" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.6"/>
    <path d="M-10,-80 L-60,100 Q-60,110 0,110 Q60,110 60,100 L10,-80" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.6"/>
    <path d="M-50,60 L-58,100 Q-58,108 0,108 Q58,108 58,100 L50,60 Z" fill="#a8e06c" opacity="0.12"/>
    <!-- Sediment layers -->
    <path d="M-55,80 Q-20,75 0,80 Q20,85 55,80 L58,100 Q58,108 0,108 Q-58,108 -58,100 Z" fill="#a8e06c" opacity="0.08"/>
    <!-- Crystal shapes inside -->
    <polygon points="-15,85 -10,70 -5,85" fill="none" stroke="#a8e06c" stroke-width="0.5" opacity="0.4"/>
    <polygon points="10,90 15,75 20,90" fill="none" stroke="#a8e06c" stroke-width="0.5" opacity="0.3"/>
    <ellipse cx="0" cy="80" rx="30" ry="20" fill="#a8e06c" opacity="0.06" filter="url(#glow7)"/>
    <rect x="-8" y="-105" width="16" height="8" rx="2" fill="#8b7355" opacity="0.5"/>
    <text x="0" y="140" text-anchor="middle" font-family="serif" font-size="11" fill="#a8e06c" opacity="0.6">TERRA</text>
  </g>
  <!-- Bottle 4: Tall narrow with air/ether potion -->
  <g transform="translate(840,280)">
    <rect x="-14" y="-100" width="28" height="25" rx="3" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.6"/>
    <path d="M-14,-75 Q-30,-40 -25,40 Q-22,100 0,120 Q22,100 25,40 Q30,-40 14,-75" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.6"/>
    <!-- Swirling vapor -->
    <path d="M-10,-20 Q0,-30 10,-20 Q20,-10 10,0 Q0,10 -10,0 Q-20,-10 -10,-20" fill="none" stroke="#c4b5fd" stroke-width="0.5" opacity="0.4"/>
    <path d="M-8,20 Q0,10 8,20 Q16,30 8,40 Q0,50 -8,40 Q-16,30 -8,20" fill="none" stroke="#c4b5fd" stroke-width="0.5" opacity="0.3"/>
    <ellipse cx="0" cy="20" rx="15" ry="50" fill="#c4b5fd" opacity="0.06"/>
    <!-- Rising mist -->
    <circle cx="-5" cy="-40" r="6" fill="#c4b5fd" opacity="0.04" filter="url(#glow7)"/>
    <circle cx="5" cy="-55" r="4" fill="#c4b5fd" opacity="0.03" filter="url(#glow7)"/>
    <rect x="-10" y="-105" width="20" height="8" rx="2" fill="#8b7355" opacity="0.5"/>
    <text x="0" y="150" text-anchor="middle" font-family="serif" font-size="11" fill="#c4b5fd" opacity="0.6">AER</text>
  </g>
  <!-- Bottle 5: Central golden quintessence -->
  <g transform="translate(1040,290)">
    <rect x="-10" y="-95" width="20" height="20" rx="2" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.7"/>
    <path d="M-10,-75 Q-45,0 -40,60 Q-35,110 0,110 Q35,110 40,60 Q45,0 10,-75" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.7"/>
    <!-- Golden liquid -->
    <path d="M-35,20 Q-38,70 0,108 Q38,70 35,20 Z" fill="#ffd93d" opacity="0.1"/>
    <!-- Sparkles -->
    <g fill="#ffd93d" opacity="0.5">
      <circle cx="-10" cy="40" r="1.5"/><circle cx="8" cy="60" r="1"/><circle cx="-5" cy="80" r="1.5"/>
      <circle cx="12" cy="35" r="1"/><circle cx="-15" cy="65" r="1"/>
    </g>
    <ellipse cx="0" cy="50" rx="25" ry="40" fill="#ffd93d" opacity="0.08" filter="url(#glow7)"/>
    <rect x="-8" y="-100" width="16" height="8" rx="2" fill="#c9a96e" opacity="0.6"/>
    <text x="0" y="140" text-anchor="middle" font-family="serif" font-size="11" fill="#ffd93d" opacity="0.7">AETHER</text>
  </g>
  <!-- Title -->
  <text x="640" y="60" text-anchor="middle" font-family="serif" font-size="48" fill="#c9a96e" letter-spacing="10" filter="url(#glow7)">INFINITE CRAFT</text>
  <line x1="320" y1="75" x2="960" y2="75" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
  <!-- Ambient particles -->
  <g fill="#ffd93d" opacity="0.15">
    <circle cx="160" cy="200" r="1"/><circle cx="300" cy="150" r="1.5"/><circle cx="500" cy="180" r="1"/>
    <circle cx="780" cy="160" r="1.5"/><circle cx="950" cy="200" r="1"/><circle cx="1120" cy="170" r="1.5"/>
  </g>
</svg>