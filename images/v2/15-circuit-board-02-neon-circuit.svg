<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon-strong">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon-soft">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#080520"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg-grad)"/>
  <!-- Grid overlay -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="0" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="880" y1="0" x2="880" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="1040" y1="0" x2="1040" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="640" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#4ecdc4" stroke-width="1"/>
  </g>
  <!-- Neon circuit traces - orange -->
  <path d="M80,320 H240 L280,280 H480 L520,320 H580" stroke="#ff6b35" stroke-width="3" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <path d="M80,240 H200 L240,200 H400" stroke="#ff6b35" stroke-width="2" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <path d="M80,400 H300 L340,440 H500" stroke="#ff6b35" stroke-width="2" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <!-- Neon circuit traces - teal -->
  <path d="M700,320 H860 L900,280 H1060 L1100,320 H1200" stroke="#4ecdc4" stroke-width="3" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <path d="M780,200 H940 L980,240 H1200" stroke="#4ecdc4" stroke-width="2" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <path d="M700,440 H880 L920,400 H1100" stroke="#4ecdc4" stroke-width="2" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <!-- Neon circuit traces - purple -->
  <path d="M320,80 V180 L360,220 V280" stroke="#c4b5fd" stroke-width="2" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <path d="M960,80 V180 L920,220 V280" stroke="#c4b5fd" stroke-width="2" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <path d="M320,560 V460 L360,420 V360" stroke="#c4b5fd" stroke-width="2" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <path d="M960,560 V460 L920,420 V360" stroke="#c4b5fd" stroke-width="2" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <!-- Green traces -->
  <path d="M500,160 L560,200 H720 L780,160" stroke="#a8e06c" stroke-width="2" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <path d="M500,480 L560,440 H720 L780,480" stroke="#a8e06c" stroke-width="2" fill="none" filter="url(#neon-glow)" stroke-linecap="round"/>
  <!-- Junction nodes with strong neon -->
  <circle cx="240" cy="320" r="6" fill="#ff6b35" filter="url(#neon-strong)"/>
  <circle cx="480" cy="320" r="6" fill="#ff6b35" filter="url(#neon-strong)"/>
  <circle cx="860" cy="320" r="6" fill="#4ecdc4" filter="url(#neon-strong)"/>
  <circle cx="1060" cy="320" r="6" fill="#4ecdc4" filter="url(#neon-strong)"/>
  <circle cx="320" cy="180" r="5" fill="#c4b5fd" filter="url(#neon-strong)"/>
  <circle cx="960" cy="180" r="5" fill="#c4b5fd" filter="url(#neon-strong)"/>
  <circle cx="320" cy="460" r="5" fill="#c4b5fd" filter="url(#neon-strong)"/>
  <circle cx="960" cy="460" r="5" fill="#c4b5fd" filter="url(#neon-strong)"/>
  <circle cx="560" cy="200" r="5" fill="#a8e06c" filter="url(#neon-strong)"/>
  <circle cx="720" cy="200" r="5" fill="#a8e06c" filter="url(#neon-strong)"/>
  <circle cx="560" cy="440" r="5" fill="#a8e06c" filter="url(#neon-strong)"/>
  <circle cx="720" cy="440" r="5" fill="#a8e06c" filter="url(#neon-strong)"/>
  <!-- Central hexagonal chip -->
  <polygon points="640,240 700,280 700,360 640,400 580,360 580,280" fill="none" stroke="#ffd93d" stroke-width="3" filter="url(#neon-strong)"/>
  <polygon points="640,260 688,292 688,348 640,380 592,348 592,292" fill="#0a1628" stroke="#ffd93d" stroke-width="1" opacity="0.8"/>
  <!-- Element labels with neon -->
  <text x="140" y="175" font-family="'Courier New', monospace" font-size="18" fill="#ff6b35" filter="url(#neon-glow)" font-weight="bold">FIRE</text>
  <text x="1080" y="175" font-family="'Courier New', monospace" font-size="18" fill="#4ecdc4" filter="url(#neon-glow)" font-weight="bold">WATER</text>
  <text x="140" y="470" font-family="'Courier New', monospace" font-size="18" fill="#a8e06c" filter="url(#neon-glow)" font-weight="bold">EARTH</text>
  <text x="1080" y="470" font-family="'Courier New', monospace" font-size="18" fill="#c4b5fd" filter="url(#neon-glow)" font-weight="bold">WIND</text>
  <!-- Title -->
  <text x="640" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#ffd93d" filter="url(#neon-glow)" font-weight="bold" letter-spacing="2">IC</text>
  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" fill="#fff" filter="url(#neon-strong)" font-weight="bold" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="600" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#4ecdc4" filter="url(#neon-glow)" letter-spacing="6">CYBERPUNK EDITION</text>
</svg>