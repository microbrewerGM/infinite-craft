<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
    <filter id="clockGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dimGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- Infinity path (subtle guide) -->
  <path d="M270,300 C270,185 395,148 475,205 C530,245 565,282 640,282 C715,282 750,245 805,205 C885,148 1010,185 1010,300 C1010,415 885,452 805,395 C750,355 715,318 640,318 C565,318 530,355 475,395 C395,452 270,415 270,300Z" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.1"/>
  <!-- Background glow -->
  <ellipse cx="400" cy="300" rx="200" ry="170" fill="#ffd93d" opacity="0.02" filter="url(#dimGlow)"/>
  <ellipse cx="880" cy="300" rx="200" ry="170" fill="#c4b5fd" opacity="0.02" filter="url(#dimGlow)"/>
  <!-- Clock faces arranged along infinity path -->
  <!-- Clock function: cx,cy,r,hour,minute,color -->
  <!-- Large clock - left extremity -->
  <g filter="url(#clockGlow)">
    <circle cx="290" cy="300" r="45" fill="none" stroke="#ffd93d" stroke-width="2" opacity="0.6"/>
    <circle cx="290" cy="300" r="42" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="290" cy="300" r="2" fill="#ffd93d"/>
    <!-- Hour markers -->
    <g stroke="#ffd93d" stroke-width="1.5" opacity="0.5">
      <line x1="290" y1="262" x2="290" y2="268"/><line x1="290" y1="332" x2="290" y2="338"/>
      <line x1="252" y1="300" x2="258" y2="300"/><line x1="322" y1="300" x2="328" y2="300"/>
    </g>
    <!-- Hands: 3:00 -->
    <line x1="290" y1="300" x2="290" y2="275" stroke="#ffd93d" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="290" y1="300" x2="315" y2="300" stroke="#ff6b35" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Clock - top left -->
  <g filter="url(#clockGlow)">
    <circle cx="390" cy="210" r="32" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5"/>
    <circle cx="390" cy="210" r="29" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="390" cy="210" r="1.5" fill="#4ecdc4"/>
    <g stroke="#4ecdc4" stroke-width="1" opacity="0.4">
      <line x1="390" y1="184" x2="390" y2="188"/><line x1="390" y1="232" x2="390" y2="236"/>
      <line x1="361" y1="210" x2="365" y2="210"/><line x1="415" y1="210" x2="419" y2="210"/>
    </g>
    <line x1="390" y1="210" x2="380" y2="192" stroke="#4ecdc4" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="390" y1="210" x2="408" y2="202" stroke="#a8e06c" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Clock - upper center-left -->
  <g filter="url(#clockGlow)">
    <circle cx="510" cy="255" r="25" fill="none" stroke="#c4b5fd" stroke-width="1.2" opacity="0.5"/>
    <circle cx="510" cy="255" r="22" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="510" cy="255" r="1.2" fill="#c4b5fd"/>
    <line x1="510" y1="255" x2="510" y2="240" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round"/>
    <line x1="510" y1="255" x2="525" y2="260" stroke="#ffd93d" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Clock - center top -->
  <g filter="url(#clockGlow)">
    <circle cx="640" cy="280" r="22" fill="none" stroke="#ff6b35" stroke-width="1.2" opacity="0.5"/>
    <circle cx="640" cy="280" r="19" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="640" cy="280" r="1.2" fill="#ff6b35"/>
    <line x1="640" y1="280" x2="634" y2="266" stroke="#ff6b35" stroke-width="1" stroke-linecap="round"/>
    <line x1="640" y1="280" x2="652" y2="275" stroke="#4ecdc4" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Clock - upper center-right -->
  <g filter="url(#clockGlow)">
    <circle cx="770" cy="255" r="25" fill="none" stroke="#a8e06c" stroke-width="1.2" opacity="0.5"/>
    <circle cx="770" cy="255" r="22" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="770" cy="255" r="1.2" fill="#a8e06c"/>
    <line x1="770" y1="255" x2="770" y2="240" stroke="#a8e06c" stroke-width="1" stroke-linecap="round"/>
    <line x1="770" y1="255" x2="755" y2="248" stroke="#ff6b35" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Clock - top right -->
  <g filter="url(#clockGlow)">
    <circle cx="890" cy="210" r="32" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.5"/>
    <circle cx="890" cy="210" r="29" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="890" cy="210" r="1.5" fill="#ffd93d"/>
    <g stroke="#ffd93d" stroke-width="1" opacity="0.4">
      <line x1="890" y1="184" x2="890" y2="188"/><line x1="890" y1="232" x2="890" y2="236"/>
      <line x1="861" y1="210" x2="865" y2="210"/><line x1="915" y1="210" x2="919" y2="210"/>
    </g>
    <line x1="890" y1="210" x2="900" y2="192" stroke="#ffd93d" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="890" y1="210" x2="872" y2="202" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Large clock - right extremity -->
  <g filter="url(#clockGlow)">
    <circle cx="990" cy="300" r="45" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.6"/>
    <circle cx="990" cy="300" r="42" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="990" cy="300" r="2" fill="#c4b5fd"/>
    <g stroke="#c4b5fd" stroke-width="1.5" opacity="0.5">
      <line x1="990" y1="262" x2="990" y2="268"/><line x1="990" y1="332" x2="990" y2="338"/>
      <line x1="952" y1="300" x2="958" y2="300"/><line x1="1022" y1="300" x2="1028" y2="300"/>
    </g>
    <line x1="990" y1="300" x2="990" y2="275" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="990" y1="300" x2="965" y2="300" stroke="#4ecdc4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Bottom clocks -->
  <g filter="url(#clockGlow)">
    <circle cx="890" cy="390" r="32" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.45"/>
    <circle cx="890" cy="390" r="29" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="890" cy="390" r="1.5" fill="#ff6b35"/>
    <line x1="890" y1="390" x2="882" y2="370" stroke="#ff6b35" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="890" y1="390" x2="905" y2="382" stroke="#ffd93d" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g filter="url(#clockGlow)">
    <circle cx="770" cy="345" r="25" fill="none" stroke="#4ecdc4" stroke-width="1.2" opacity="0.4"/>
    <circle cx="770" cy="345" r="22" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="770" cy="345" r="1.2" fill="#4ecdc4"/>
    <line x1="770" y1="345" x2="770" y2="330" stroke="#4ecdc4" stroke-width="1" stroke-linecap="round"/>
    <line x1="770" y1="345" x2="785" y2="352" stroke="#c4b5fd" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g filter="url(#clockGlow)">
    <circle cx="640" cy="320" r="22" fill="none" stroke="#a8e06c" stroke-width="1.2" opacity="0.4"/>
    <circle cx="640" cy="320" r="19" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="640" cy="320" r="1.2" fill="#a8e06c"/>
    <line x1="640" y1="320" x2="648" y2="334" stroke="#a8e06c" stroke-width="1" stroke-linecap="round"/>
    <line x1="640" y1="320" x2="628" y2="325" stroke="#ff6b35" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g filter="url(#clockGlow)">
    <circle cx="510" cy="345" r="25" fill="none" stroke="#ffd93d" stroke-width="1.2" opacity="0.4"/>
    <circle cx="510" cy="345" r="22" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="510" cy="345" r="1.2" fill="#ffd93d"/>
    <line x1="510" y1="345" x2="510" y2="360" stroke="#ffd93d" stroke-width="1" stroke-linecap="round"/>
    <line x1="510" y1="345" x2="495" y2="338" stroke="#ff6b35" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g filter="url(#clockGlow)">
    <circle cx="390" cy="390" r="32" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.45"/>
    <circle cx="390" cy="390" r="29" fill="#0a0a0a" opacity="0.8"/>
    <circle cx="390" cy="390" r="1.5" fill="#c4b5fd"/>
    <line x1="390" y1="390" x2="398" y2="410" stroke="#c4b5fd" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="390" y1="390" x2="375" y2="398" stroke="#a8e06c" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Title -->
  <text x="640" y="560" text-anchor="middle" font-family="'Courier New', monospace" font-size="40" font-weight="bold" fill="#ffffff" letter-spacing="12" opacity="0.9">INFINITE CRAFT</text>
</svg>