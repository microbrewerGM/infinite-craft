<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87642a"/>
      <stop offset="8%" stop-color="#5a3a1a"/>
      <stop offset="15%" stop-color="#2a1a0a"/>
      <stop offset="100%" stop-color="#0a0800"/>
    </linearGradient>
    <linearGradient id="soil12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="100%" stop-color="#1a0d00"/>
    </linearGradient>
    <filter id="rootGlow"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg12)"/>
  <!-- Ground line -->
  <line x1="0" y1="95" x2="1280" y2="95" stroke="#5a3a1a" stroke-width="2" opacity="0.6"/>
  <!-- Tree trunk above ground -->
  <path d="M620,95 L615,60 Q618,30 630,10 Q640,0 650,10 Q662,30 665,60 L660,95" fill="#4a2a0a" stroke="#6a4a2a" stroke-width="1"/>
