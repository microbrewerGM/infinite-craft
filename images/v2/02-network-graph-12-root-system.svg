    <path d="M940,200 Q960,195 980,205"/><path d="M1140,210 Q1160,200 1180,210"/>
    <path d="M300,290 Q280,285 260,295"/><path d="M980,290 Q1000,285 1020,295"/>
    <path d="M300,400 Q280,395 260,405"/><path d="M980,400 Q1000,395 1020,405"/>
    <path d="M120,180 Q100,175 80,185"/><path d="M1160,180 Q1180,175 1200,185"/>
    <path d="M80,290 Q60,285 40,295"/><path d="M1200,290 Q1220,285 1240,295"/>
    <path d="M230,400 Q210,395 190,405"/><path d="M1050,400 Q1070,395 1090,405"/>
    <path d="M300,520 Q280,530 260,520"/><path d="M980,520 Q1000,530 1020,520"/>
    <path d="M600,310 Q580,320 570,340"/><path d="M680,310 Q700,320 710,340"/>
    <path d="M410,520 Q390,530 370,520"/><path d="M870,520 Q890,530 910,520"/>
