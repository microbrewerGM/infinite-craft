  <!-- Title -->
  <text x="640" y="320" font-family="Georgia, serif" font-size="68" font-weight="bold" fill="#ffd93d" text-anchor="middle" dominant-baseline="central" opacity="0.85" filter="url(#rootGlow)">INFINITE CRAFT</text>
  <text x="640" y="375" font-family="Georgia, serif" font-size="15" fill="#a8e06c" text-anchor="middle" letter-spacing="8" opacity="0.5">ROOT SYSTEM</text>
</svg>