    <path d="M640,120 Q700,130 800,140 Q900,150 1000,170 Q1080,185 1160,180" stroke-width="5"/>
    <path d="M638,200 Q560,220 440,240 Q340,255 240,280 Q160,300 80,290" stroke-width="4.5"/>
    <path d="M640,200 Q720,220 840,240 Q940,255 1040,280 Q1120,300 1200,290" stroke-width="4.5"/>
    <path d="M636,320 Q560,340 440,360 Q340,375 230,400" stroke-width="4"/>
    <path d="M640,320 Q720,340 840,360 Q940,375 1050,400" stroke-width="4"/>
    <path d="M635,440 Q570,460 470,480 Q380,495 300,520" stroke-width="3"/>
    <path d="M640,440 Q710,460 810,480 Q900,495 980,520" stroke-width="3"/>
