    <circle cx="80" cy="290" r="3"/><circle cx="1200" cy="290" r="3"/>
    <circle cx="230" cy="400" r="2.5"/><circle cx="1050" cy="400" r="2.5"/>
    <circle cx="300" cy="520" r="2.5"/><circle cx="980" cy="520" r="2.5"/>
    <circle cx="640" cy="630" r="3.5"/>
    <circle cx="340" cy="200" r="2"/><circle cx="940" cy="200" r="2"/>
    <circle cx="300" cy="290" r="2"/><circle cx="980" cy="290" r="2"/>
  </g>
  <!-- Soil particles -->
  <g fill="#5a3a1a" opacity="0.15">
    <circle cx="150" cy="250" r="12"/><circle cx="350" cy="320" r="15"/>
    <circle cx="550" cy="430" r="10"/><circle cx="750" cy="200" r="13"/>
    <circle cx="950" cy="350" r="11"/><circle cx="1100" cy="250" r="14"/>
    <circle cx="200" cy="500" r="10"/><circle cx="450" cy="550" r="12"/>
