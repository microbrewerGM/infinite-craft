    <circle cx="700" cy="12" r="8"/><circle cx="710" cy="18" r="6"/>
    <circle cx="555" cy="47" r="7"/><circle cx="547" cy="53" r="5"/>
    <circle cx="725" cy="47" r="7"/><circle cx="733" cy="53" r="5"/>
  </g>
