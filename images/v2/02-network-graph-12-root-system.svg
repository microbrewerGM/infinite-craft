    <path d="M280,170 Q260,200 220,210 Q180,220 140,210"/>
    <path d="M800,140 Q820,170 860,190 Q900,210 940,200"/>
    <path d="M1000,170 Q1020,200 1060,210 Q1100,220 1140,210"/>
    <path d="M440,240 Q420,270 380,285 Q340,300 300,290"/>
    <path d="M840,240 Q860,270 900,285 Q940,300 980,290"/>
    <path d="M440,360 Q420,390 380,400 Q340,410 300,400"/>
    <path d="M840,360 Q860,390 900,400 Q940,410 980,400"/>
    <path d="M640,260 Q610,280 600,310"/>
    <path d="M640,260 Q670,280 680,310"/>
    <path d="M470,480 Q450,510 410,520"/>
    <path d="M810,480 Q830,510 870,520"/>
