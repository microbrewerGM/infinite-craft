<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>

  <!-- Title -->
  <text x="640" y="50" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="62" x2="980" y2="62" stroke="#ffd93d" stroke-width="2"/>
  <text x="640" y="82" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">INDUSTRIAL PROCESS FLOW</text>

  <!-- Input tanks (top) -->
  <!-- Fire input -->
  <rect x="80" y="110" width="110" height="60" rx="8" fill="none" stroke="#ff6b35" stroke-width="2.5"/>
  <text x="135" y="140" fill="#ff6b35" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">FIRE</text>
  <text x="135" y="155" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">INPUT A</text>

  <!-- Water input -->
  <rect x="280" y="110" width="110" height="60" rx="8" fill="none" stroke="#4ecdc4" stroke-width="2.5"/>
  <text x="335" y="140" fill="#4ecdc4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">WATER</text>
  <text x="335" y="155" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">INPUT B</text>

  <!-- Earth input -->
  <rect x="480" y="110" width="110" height="60" rx="8" fill="none" stroke="#a8e06c" stroke-width="2.5"/>
  <text x="535" y="140" fill="#a8e06c" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">EARTH</text>
  <text x="535" y="155" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">INPUT C</text>

  <!-- Wind input -->
  <rect x="680" y="110" width="110" height="60" rx="8" fill="none" stroke="#c4b5fd" stroke-width="2.5"/>
  <text x="735" y="140" fill="#c4b5fd" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">WIND</text>
  <text x="735" y="155" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">INPUT D</text>

  <!-- Arrows down from inputs -->
  <line x1="135" y1="170" x2="135" y2="220" stroke="#ff6b35" stroke-width="2"/>
  <polygon points="130,215 135,225 140,215" fill="#ff6b35"/>
  <line x1="335" y1="170" x2="335" y2="220" stroke="#4ecdc4" stroke-width="2"/>
  <polygon points="330,215 335,225 340,215" fill="#4ecdc4"/>
  <line x1="535" y1="170" x2="535" y2="220" stroke="#a8e06c" stroke-width="2"/>
  <polygon points="530,215 535,225 540,215" fill="#a8e06c"/>
  <line x1="735" y1="170" x2="735" y2="220" stroke="#c4b5fd" stroke-width="2"/>
  <polygon points="730,215 735,225 740,215" fill="#c4b5fd"/>

  <!-- Preprocess boxes -->
  <rect x="90" y="225" width="90" height="45" fill="none" stroke="#ff6b35" stroke-width="1.5" rx="3"/>
  <text x="135" y="252" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">HEAT</text>
  <rect x="290" y="225" width="90" height="45" fill="none" stroke="#4ecdc4" stroke-width="1.5" rx="3"/>
  <text x="335" y="252" fill="#4ecdc4" font-family="monospace" font-size="9" text-anchor="middle">FILTER</text>
  <rect x="490" y="225" width="90" height="45" fill="none" stroke="#a8e06c" stroke-width="1.5" rx="3"/>
  <text x="535" y="252" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">GRIND</text>
  <rect x="690" y="225" width="90" height="45" fill="none" stroke="#c4b5fd" stroke-width="1.5" rx="3"/>
  <text x="735" y="252" fill="#c4b5fd" font-family="monospace" font-size="9" text-anchor="middle">COMPRESS</text>

  <!-- Arrows converging -->
  <line x1="135" y1="270" x2="135" y2="310" stroke="#ff6b35" stroke-width="1.5"/>
  <line x1="135" y1="310" x2="380" y2="330" stroke="#ff6b35" stroke-width="1.5"/>
  <line x1="335" y1="270" x2="335" y2="310" stroke="#4ecdc4" stroke-width="1.5"/>
  <line x1="335" y1="310" x2="395" y2="330" stroke="#4ecdc4" stroke-width="1.5"/>
  <line x1="535" y1="270" x2="535" y2="310" stroke="#a8e06c" stroke-width="1.5"/>
  <line x1="535" y1="310" x2="435" y2="330" stroke="#a8e06c" stroke-width="1.5"/>
  <line x1="735" y1="270" x2="735" y2="310" stroke="#c4b5fd" stroke-width="1.5"/>
  <line x1="735" y1="310" x2="450" y2="330" stroke="#c4b5fd" stroke-width="1.5"/>

  <!-- Main mixer (diamond decision shape) -->
  <polygon points="415,330 490,370 415,410 340,370" fill="none" stroke="#ffd93d" stroke-width="2.5"/>
  <text x="415" y="367" fill="#ffd93d" font-family="monospace" font-size="11" text-anchor="middle">COMBINE</text>
  <text x="415" y="382" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="middle">MIXER</text>

  <!-- Decision: New element? -->
  <line x1="415" y1="410" x2="415" y2="460" stroke="#ffd93d" stroke-width="2"/>
  <polygon points="410,455 415,465 420,455" fill="#ffd93d"/>

  <polygon points="415,465 510,505 415,545 320,505" fill="none" stroke="white" stroke-width="2"/>
  <text x="415" y="500" fill="white" font-family="monospace" font-size="10" text-anchor="middle">NEW</text>
  <text x="415" y="515" fill="white" font-family="monospace" font-size="10" text-anchor="middle">ELEMENT?</text>

  <!-- Yes path -->
  <line x1="510" y1="505" x2="620" y2="505" stroke="#a8e06c" stroke-width="2"/>
  <polygon points="615,500 625,505 615,510" fill="#a8e06c"/>
  <text x="560" y="498" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">YES</text>

  <!-- Output: Store -->
  <rect x="630" y="475" width="140" height="60" rx="8" fill="none" stroke="#a8e06c" stroke-width="2.5"/>
  <text x="700" y="502" fill="#a8e06c" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">STORE</text>
  <text x="700" y="520" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">ELEMENT DB</text>

  <!-- Arrow to final output -->
  <line x1="770" y1="505" x2="850" y2="505" stroke="#a8e06c" stroke-width="2"/>
  <polygon points="845,500 855,505 845,510" fill="#a8e06c"/>

  <!-- Final output -->
  <ellipse cx="940" cy="505" rx="80" ry="35" fill="none" stroke="#ff6b35" stroke-width="2.5"/>
  <text x="940" y="502" fill="#ff6b35" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">OUTPUT</text>
  <text x="940" y="518" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">2847 ELEMENTS</text>

  <!-- No path (loop back) -->
  <line x1="320" y1="505" x2="200" y2="505" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="260" y="498" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">NO</text>
  <line x1="200" y1="505" x2="200" y2="370" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="200" y1="370" x2="340" y2="370" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="335,365 345,370 335,375" fill="#ff6b35"/>
  <text x="200" y="440" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">RETRY</text>

  <!-- Side process: Quality check -->
  <line x1="490" y1="370" x2="600" y2="370" stroke="#6eaadc" stroke-width="1.5"/>
  <rect x="600" y="345" width="100" height="50" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="3"/>
  <text x="650" y="367" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">VALIDATE</text>
  <text x="650" y="382" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">API CHECK</text>

  <!-- Monitoring panel (right side) -->
  <rect x="900" y="110" width="300" height="200" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="5"/>
  <text x="1050" y="135" fill="white" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">PROCESS MONITOR</text>
  <line x1="900" y1="143" x2="1200" y2="143" stroke="#6eaadc" stroke-width="0.5"/>

  <!-- Bar chart -->
  <rect x="930" y="220" width="30" height="70" fill="#ff6b35" opacity="0.4"/>
  <rect x="970" y="200" width="30" height="90" fill="#4ecdc4" opacity="0.4"/>
  <rect x="1010" y="240" width="30" height="50" fill="#a8e06c" opacity="0.4"/>
  <rect x="1050" y="230" width="30" height="60" fill="#c4b5fd" opacity="0.4"/>
  <text x="945" y="300" fill="#ff6b35" font-family="monospace" font-size="7" text-anchor="middle">F</text>
  <text x="985" y="300" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle">W</text>
  <text x="1025" y="300" fill="#a8e06c" font-family="monospace" font-size="7" text-anchor="middle">E</text>
  <text x="1065" y="300" fill="#c4b5fd" font-family="monospace" font-size="7" text-anchor="middle">A</text>

  <text x="920" y="165" fill="#a8e06c" font-family="monospace" font-size="10">THROUGHPUT: 42/hr</text>
  <text x="920" y="182" fill="#ffd93d" font-family="monospace" font-size="10">EFFICIENCY: 94.2%</text>
  <text x="920" y="199" fill="#4ecdc4" font-family="monospace" font-size="10">DUPLICATES: 5.8%</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#ffd93d" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#ffd93d" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#ffd93d" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#ffd93d" stroke-width="2" fill="none"/>

  <rect x="900" y="580" width="360" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="1080" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-FLOW-015 | P&amp;ID</text>
</svg>