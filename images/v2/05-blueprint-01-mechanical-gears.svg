<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
    <clipPath id="gear-tooth">
      <rect x="0" y="0" width="1280" height="640"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.6"/>

  <!-- Large gear 1 -->
  <g transform="translate(320,340)">
    <circle r="140" fill="none" stroke="#6eaadc" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle r="120" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <circle r="30" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <circle r="8" fill="#ff6b35"/>
    <!-- Teeth -->
    <g stroke="#ff6b35" stroke-width="2" fill="none">
      <rect x="-12" y="-140" width="24" height="25" rx="3"/>
      <rect x="-12" y="115" width="24" height="25" rx="3" transform="rotate(0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(30 0 0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(60 0 0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(90 0 0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(120 0 0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(150 0 0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(180 0 0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(210 0 0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(240 0 0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(270 0 0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(300 0 0)"/>
      <rect x="-12" y="-140" width="24" height="25" rx="3" transform="rotate(330 0 0)"/>
    </g>
    <!-- Spokes -->
    <line x1="30" y1="0" x2="120" y2="0" stroke="#ff6b35" stroke-width="1" opacity="0.5"/>
    <line x1="-30" y1="0" x2="-120" y2="0" stroke="#ff6b35" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="30" x2="0" y2="120" stroke="#ff6b35" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="-30" x2="0" y2="-120" stroke="#ff6b35" stroke-width="1" opacity="0.5"/>
    <text x="0" y="80" fill="#ffd93d" font-family="monospace" font-size="11" text-anchor="middle">FIRE</text>
    <text x="70" y="5" fill="#ffd93d" font-family="monospace" font-size="11" text-anchor="middle">WATER</text>
  </g>

  <!-- Medium gear 2 (meshing) -->
  <g transform="translate(530,240)">
    <circle r="90" fill="none" stroke="#6eaadc" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle r="75" fill="none" stroke="#4ecdc4" stroke-width="2"/>
    <circle r="20" fill="none" stroke="#4ecdc4" stroke-width="2"/>
    <circle r="6" fill="#4ecdc4"/>
    <g stroke="#4ecdc4" stroke-width="2" fill="none">
      <rect x="-10" y="-90" width="20" height="20" rx="3"/>
      <rect x="-10" y="-90" width="20" height="20" rx="3" transform="rotate(40 0 0)"/>
      <rect x="-10" y="-90" width="20" height="20" rx="3" transform="rotate(80 0 0)"/>
      <rect x="-10" y="-90" width="20" height="20" rx="3" transform="rotate(120 0 0)"/>
      <rect x="-10" y="-90" width="20" height="20" rx="3" transform="rotate(160 0 0)"/>
      <rect x="-10" y="-90" width="20" height="20" rx="3" transform="rotate(200 0 0)"/>
      <rect x="-10" y="-90" width="20" height="20" rx="3" transform="rotate(240 0 0)"/>
      <rect x="-10" y="-90" width="20" height="20" rx="3" transform="rotate(280 0 0)"/>
      <rect x="-10" y="-90" width="20" height="20" rx="3" transform="rotate(320 0 0)"/>
    </g>
    <text x="0" y="50" fill="#ffd93d" font-family="monospace" font-size="11" text-anchor="middle">EARTH</text>
  </g>

  <!-- Small gear 3 -->
  <g transform="translate(640,400)">
    <circle r="55" fill="none" stroke="#6eaadc" stroke-width="1" stroke-dasharray="3,3"/>
    <circle r="45" fill="none" stroke="#a8e06c" stroke-width="2"/>
    <circle r="12" fill="none" stroke="#a8e06c" stroke-width="2"/>
    <circle r="4" fill="#a8e06c"/>
    <g stroke="#a8e06c" stroke-width="2" fill="none">
      <rect x="-8" y="-55" width="16" height="14" rx="2"/>
      <rect x="-8" y="-55" width="16" height="14" rx="2" transform="rotate(51.4 0 0)"/>
      <rect x="-8" y="-55" width="16" height="14" rx="2" transform="rotate(102.8 0 0)"/>
      <rect x="-8" y="-55" width="16" height="14" rx="2" transform="rotate(154.2 0 0)"/>
      <rect x="-8" y="-55" width="16" height="14" rx="2" transform="rotate(205.7 0 0)"/>
      <rect x="-8" y="-55" width="16" height="14" rx="2" transform="rotate(257.1 0 0)"/>
      <rect x="-8" y="-55" width="16" height="14" rx="2" transform="rotate(308.5 0 0)"/>
    </g>
    <text x="0" y="5" fill="#ffd93d" font-family="monospace" font-size="10" text-anchor="middle">WIND</text>
  </g>

  <!-- Large gear right side -->
  <g transform="translate(900,320)">
    <circle r="160" fill="none" stroke="#6eaadc" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle r="140" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    <circle r="35" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    <circle r="10" fill="#c4b5fd"/>
    <g stroke="#c4b5fd" stroke-width="2" fill="none">
      <rect x="-14" y="-160" width="28" height="25" rx="3"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(25.7 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(51.4 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(77.1 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(102.8 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(128.5 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(154.2 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(180 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(205.7 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(231.4 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(257.1 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(282.8 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(308.5 0 0)"/>
      <rect x="-14" y="-160" width="28" height="25" rx="3" transform="rotate(334.2 0 0)"/>
    </g>
    <text x="0" y="-60" fill="#ffd93d" font-family="monospace" font-size="12" text-anchor="middle">COMBINE</text>
    <text x="0" y="70" fill="#ffd93d" font-family="monospace" font-size="11" text-anchor="middle">ENGINE</text>
  </g>

  <!-- Connection lines (chain/belt) -->
  <path d="M 450 280 Q 500 350 530 340" fill="none" stroke="#ffd93d" stroke-width="1.5" stroke-dasharray="6,3"/>
  <path d="M 600 360 Q 650 380 680 400" fill="none" stroke="#ffd93d" stroke-width="1.5" stroke-dasharray="6,3"/>
  <path d="M 700 370 Q 740 340 760 320" fill="none" stroke="#ffd93d" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Dimension lines -->
  <line x1="180" y1="520" x2="460" y2="520" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="180" y1="515" x2="180" y2="525" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="460" y1="515" x2="460" y2="525" stroke="#6eaadc" stroke-width="0.8"/>
  <text x="320" y="540" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">280 UNITS</text>

  <!-- Title -->
  <text x="640" y="68" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="340" y1="80" x2="940" y2="80" stroke="#ff6b35" stroke-width="2"/>
  <text x="640" y="100" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">MECHANICAL GEAR ASSEMBLY</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 60 M 20 20 L 60 20" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 60 M 1260 20 L 1220 20" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 580 M 20 620 L 60 620" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 580 M 1260 620 L 1220 620" stroke="#ff6b35" stroke-width="2" fill="none"/>

  <!-- Drawing info block -->
  <rect x="900" y="580" width="360" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <line x1="1080" y1="580" x2="1080" y2="620" stroke="#6eaadc" stroke-width="0.5"/>
  <text x="990" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-GEARS-001</text>
  <text x="1170" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">SCALE: 1:4</text>
</svg>