<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
  </defs>

  <!-- Aged parchment background -->
  <rect width="1280" height="640" fill="#2c2416"/>
  <!-- Parchment overlay -->
  <rect width="1280" height="640" fill="#3d3220" opacity="0.8"/>
  <!-- Aged spots -->
  <circle cx="200" cy="150" r="80" fill="#2a2010" opacity="0.3"/>
  <circle cx="900" cy="400" r="120" fill="#2a2010" opacity="0.2"/>
  <circle cx="1100" cy="100" r="60" fill="#2a2010" opacity="0.25"/>
  <circle cx="400" cy="500" r="90" fill="#2a2010" opacity="0.2"/>

  <!-- Border - worn edges -->
  <rect x="30" y="30" width="1220" height="580" fill="none" stroke="#8b7355" stroke-width="2" rx="5"/>
  <rect x="40" y="40" width="1200" height="560" fill="none" stroke="#8b7355" stroke-width="0.5" rx="3"/>

  <!-- Title in Da Vinci style -->
  <text x="640" y="80" fill="#c4a265" font-family="Georgia, serif" font-size="44" font-weight="bold" text-anchor="middle" font-style="italic" letter-spacing="6">INFINITE CRAFT</text>
  <line x1="250" y1="92" x2="1030" y2="92" stroke="#c4a265" stroke-width="1"/>
  <text x="640" y="115" fill="#8b7355" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-style="italic" letter-spacing="2">Studies on the Transmutation of Elemental Forms</text>

  <!-- Da Vinci style element wheel -->
  <g transform="translate(350,350)">
    <!-- Outer circle -->
    <circle r="180" fill="none" stroke="#c4a265" stroke-width="1.5"/>
    <circle r="160" fill="none" stroke="#8b7355" stroke-width="0.5"/>
    <circle r="50" fill="none" stroke="#c4a265" stroke-width="1"/>

    <!-- Quadrant lines -->
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#8b7355" stroke-width="0.8"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#8b7355" stroke-width="0.8"/>
    <line x1="-127" y1="-127" x2="127" y2="127" stroke="#8b7355" stroke-width="0.5" stroke-dasharray="5,5"/>
    <line x1="127" y1="-127" x2="-127" y2="127" stroke="#8b7355" stroke-width="0.5" stroke-dasharray="5,5"/>

    <!-- Element symbols at cardinal points -->
    <!-- Fire (top) -->
    <polygon points="0,-140 -15,-115 15,-115" fill="none" stroke="#c4a265" stroke-width="1.5"/>
    <text x="0" y="-150" fill="#c4a265" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-style="italic">IGNIS</text>

    <!-- Water (bottom) -->
    <polygon points="0,140 -15,115 15,115" fill="none" stroke="#c4a265" stroke-width="1.5"/>
    <line x1="-10" y1="125" x2="10" y2="125" stroke="#c4a265" stroke-width="1"/>
    <text x="0" y="165" fill="#c4a265" font-family="Georgia, serif" font-size="14" text-anchor="middle" font-style="italic">AQUA</text>

    <!-- Earth (left) -->
    <polygon points="-140,0 -115,-15 -115,15" fill="none" stroke="#c4a265" stroke-width="1.5"/>
    <line x1="-130" y1="10" x2="-110" y2="10" stroke="#c4a265" stroke-width="1"/>
    <text x="-140" y="-15" fill="#c4a265" font-family="Georgia, serif" font-size="14" text-anchor="end" font-style="italic">TERRA</text>

    <!-- Air (right) -->
    <polygon points="140,0 115,-15 115,15" fill="none" stroke="#c4a265" stroke-width="1.5"/>
    <text x="145" y="-15" fill="#c4a265" font-family="Georgia, serif" font-size="14" font-style="italic">VENTUS</text>

    <!-- Inner alchemical symbols -->
    <text x="0" y="8" fill="#c4a265" font-family="Georgia, serif" font-size="20" text-anchor="middle" font-style="italic">CRAFT</text>

    <!-- Connecting arcs -->
    <path d="M -35,-35 A 50 50 0 0 1 35,-35" fill="none" stroke="#c4a265" stroke-width="0.8"/>
    <path d="M 35,-35 A 50 50 0 0 1 35,35" fill="none" stroke="#c4a265" stroke-width="0.8"/>
    <path d="M 35,35 A 50 50 0 0 1 -35,35" fill="none" stroke="#c4a265" stroke-width="0.8"/>
    <path d="M -35,35 A 50 50 0 0 1 -35,-35" fill="none" stroke="#c4a265" stroke-width="0.8"/>

    <!-- Decorative dots at intersections -->
    <circle cx="0" cy="-50" r="3" fill="#c4a265"/>
    <circle cx="50" cy="0" r="3" fill="#c4a265"/>
    <circle cx="0" cy="50" r="3" fill="#c4a265"/>
    <circle cx="-50" cy="0" r="3" fill="#c4a265"/>
  </g>

  <!-- Sketched mechanical device (right side) -->
  <g transform="translate(850,280)">
    <!-- Frame -->
    <rect x="-120" y="-130" width="300" height="280" fill="none" stroke="#8b7355" stroke-width="0.5" rx="3"/>

    <!-- Mortar and pestle sketch -->
    <path d="M -60,40 Q -60,-20 0,-30 Q 60,-20 60,40" fill="none" stroke="#c4a265" stroke-width="1.5"/>
    <line x1="-70" y1="40" x2="70" y2="40" stroke="#c4a265" stroke-width="1.5"/>
    <!-- Pestle -->
    <line x1="20" y1="-80" x2="0" y2="10" stroke="#c4a265" stroke-width="2"/>
    <ellipse cx="25" cy="-85" rx="12" ry="8" fill="none" stroke="#c4a265" stroke-width="1.5"/>

    <!-- Combination arrows -->
    <path d="M -80,-60 L -40,-30" fill="none" stroke="#c4a265" stroke-width="1"/>
    <polygon points="-45,-28 -40,-30 -42,-35" fill="#c4a265"/>
    <text x="-90" y="-65" fill="#c4a265" font-family="Georgia, serif" font-size="10" font-style="italic">Ignis</text>

    <path d="M 80,-60 L 40,-30" fill="none" stroke="#c4a265" stroke-width="1"/>
    <polygon points="45,-28 40,-30 42,-35" fill="#c4a265"/>
    <text x="85" y="-65" fill="#c4a265" font-family="Georgia, serif" font-size="10" font-style="italic">Aqua</text>

    <!-- Output arrow -->
    <line x1="0" y1="50" x2="0" y2="90" stroke="#c4a265" stroke-width="1"/>
    <polygon points="-4,85 0,95 4,85" fill="#c4a265"/>
    <text x="0" y="115" fill="#c4a265" font-family="Georgia, serif" font-size="12" text-anchor="middle" font-style="italic">Vapor (Steam)</text>

    <!-- Notes -->
    <text x="-110" y="-110" fill="#8b7355" font-family="Georgia, serif" font-size="9" font-style="italic">Fig. II - On the Art of</text>
    <text x="-110" y="-98" fill="#8b7355" font-family="Georgia, serif" font-size="9" font-style="italic">Combining Elements</text>

    <!-- Gear sketch -->
    <circle cx="130" cy="50" r="30" fill="none" stroke="#c4a265" stroke-width="1"/>
    <circle cx="130" cy="50" r="8" fill="none" stroke="#c4a265" stroke-width="1"/>
    <line x1="130" y1="20" x2="130" y2="80" stroke="#c4a265" stroke-width="0.5"/>
    <line x1="100" y1="50" x2="160" y2="50" stroke="#c4a265" stroke-width="0.5"/>
    <circle cx="130" cy="100" r="20" fill="none" stroke="#c4a265" stroke-width="1"/>
    <circle cx="130" cy="100" r="5" fill="none" stroke="#c4a265" stroke-width="1"/>
  </g>

  <!-- Mirror text note (Da Vinci style) -->
  <text x="640" y="580" fill="#8b7355" font-family="Georgia, serif" font-size="11" text-anchor="middle" font-style="italic">
    "The elements, when combined with craft and knowledge, yield infinite possibilities" - Codex Elementorum
  </text>

  <!-- Page number -->
  <text x="640" y="610" fill="#8b7355" font-family="Georgia, serif" font-size="10" text-anchor="middle">- FOLIO XIV -</text>

  <!-- Decorative corners -->
  <path d="M 50 50 Q 50 40 60 40 L 80 40 M 50 50 Q 40 50 40 60 L 40 80" fill="none" stroke="#c4a265" stroke-width="1.5"/>
  <path d="M 1230 50 Q 1230 40 1220 40 L 1200 40 M 1230 50 Q 1240 50 1240 60 L 1240 80" fill="none" stroke="#c4a265" stroke-width="1.5"/>
  <path d="M 50 590 Q 50 600 60 600 L 80 600 M 50 590 Q 40 590 40 580 L 40 560" fill="none" stroke="#c4a265" stroke-width="1.5"/>
  <path d="M 1230 590 Q 1230 600 1220 600 L 1200 600 M 1230 590 Q 1240 590 1240 580 L 1240 560" fill="none" stroke="#c4a265" stroke-width="1.5"/>
</svg>