<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="sw-glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="sw-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8e06c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>
  <ellipse cx="640" cy="320" rx="300" ry="200" fill="url(#sw-center)" opacity="0.4"/>

  <!-- Left speaker/source -->
  <g transform="translate(180, 320)">
    <rect x="-30" y="-40" width="60" height="80" rx="8" fill="none" stroke="#ff6b35" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="20" fill="#ff6b35" opacity="0.3"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="8" fill="#ff6b35" opacity="0.6"/>
  </g>

  <!-- Left sound waves -->
  <path d="M 230 320 Q 280 220 330 320 Q 380 420 430 320" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.7"/>
  <path d="M 260 320 Q 310 240 360 320 Q 410 400 460 320" fill="none" stroke="#ff6b35" stroke-width="2.5" opacity="0.55"/>
  <path d="M 290 320 Q 340 260 390 320 Q 440 380 490 320" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.4"/>
  <path d="M 320 320 Q 370 275 420 320 Q 470 365 520 320" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.3"/>

  <!-- Right speaker/source -->
  <g transform="translate(1100, 320)">
    <rect x="-30" y="-40" width="60" height="80" rx="8" fill="none" stroke="#4ecdc4" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="20" fill="#4ecdc4" opacity="0.3"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="8" fill="#4ecdc4" opacity="0.6"/>
  </g>

  <!-- Right sound waves (mirrored) -->
  <path d="M 1050 320 Q 1000 220 950 320 Q 900 420 850 320" fill="none" stroke="#4ecdc4" stroke-width="3" opacity="0.7"/>
  <path d="M 1020 320 Q 970 240 920 320 Q 870 400 820 320" fill="none" stroke="#4ecdc4" stroke-width="2.5" opacity="0.55"/>
  <path d="M 990 320 Q 940 260 890 320 Q 840 380 790 320" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.4"/>
  <path d="M 960 320 Q 910 275 860 320 Q 810 365 760 320" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.3"/>

  <!-- Constructive interference zone (center) -->
  <!-- Amplified combined wave -->
  <path d="M 540 320 Q 570 160 600 320 Q 630 480 660 320 Q 690 160 720 320 Q 750 480 780 320" fill="none" stroke="#a8e06c" stroke-width="4" opacity="0.8" filter="url(#sw-glow)"/>
  <path d="M 540 320 Q 570 160 600 320 Q 630 480 660 320 Q 690 160 720 320 Q 750 480 780 320" fill="none" stroke="#a8e06c" stroke-width="2" opacity="0.9"/>

  <!-- Peak energy dots -->
  <circle cx="570" cy="185" r="4" fill="#ffd93d" opacity="0.6"/>
  <circle cx="630" cy="455" r="4" fill="#ffd93d" opacity="0.6"/>
  <circle cx="690" cy="185" r="4" fill="#ffd93d" opacity="0.6"/>
  <circle cx="750" cy="455" r="4" fill="#ffd93d" opacity="0.5"/>

  <!-- Interference pattern nodes -->
  <circle cx="540" cy="320" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="600" cy="320" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="660" cy="320" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="720" cy="320" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="780" cy="320" r="3" fill="#fff" opacity="0.5"/>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#a8e06c" opacity="0.6" letter-spacing="4">SOUND WAVES</text>
</svg>