<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="dh-glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="dh-soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <radialGradient id="dh-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>
  <ellipse cx="640" cy="320" rx="500" ry="300" fill="url(#dh-center)"/>

  <!-- Left spiral strand (orange) - coming from left -->
  <path d="M 80 200 Q 150 180 220 220 Q 290 280 340 240 Q 390 200 440 240 Q 490 290 520 260" fill="none" stroke="#ff6b35" stroke-width="4" opacity="0.7"/>
  <path d="M 80 280 Q 150 300 220 260 Q 290 200 340 260 Q 390 320 440 260 Q 490 210 520 240" fill="none" stroke="#ff6b35" stroke-width="4" opacity="0.5"/>
  <!-- Rungs -->
  <line x1="150" y1="190" x2="150" y2="290" stroke="#ff6b35" stroke-width="1.5" opacity="0.25"/>
  <line x1="220" y1="220" x2="220" y2="260" stroke="#ff6b35" stroke-width="1.5" opacity="0.3"/>
  <line x1="290" y1="240" x2="290" y2="240" stroke="#ff6b35" stroke-width="1.5" opacity="0.3"/>
  <line x1="340" y1="240" x2="340" y2="260" stroke="#ff6b35" stroke-width="1.5" opacity="0.3"/>
  <line x1="390" y1="210" x2="390" y2="310" stroke="#ff6b35" stroke-width="1.5" opacity="0.25"/>
  <line x1="440" y1="240" x2="440" y2="260" stroke="#ff6b35" stroke-width="1.5" opacity="0.3"/>
  <!-- Nodes -->
  <circle cx="220" cy="220" r="4" fill="#ff6b35" opacity="0.6"/>
  <circle cx="340" cy="240" r="4" fill="#ff6b35" opacity="0.6"/>
  <circle cx="440" cy="240" r="4" fill="#ff6b35" opacity="0.6"/>

  <!-- Right spiral strand (teal) - coming from right -->
  <path d="M 1200 360 Q 1130 340 1060 380 Q 990 440 940 400 Q 890 360 840 400 Q 790 450 760 420" fill="none" stroke="#4ecdc4" stroke-width="4" opacity="0.7"/>
  <path d="M 1200 440 Q 1130 460 1060 420 Q 990 360 940 420 Q 890 480 840 420 Q 790 370 760 400" fill="none" stroke="#4ecdc4" stroke-width="4" opacity="0.5"/>
  <!-- Rungs -->
  <line x1="1130" y1="350" x2="1130" y2="450" stroke="#4ecdc4" stroke-width="1.5" opacity="0.25"/>
  <line x1="1060" y1="380" x2="1060" y2="420" stroke="#4ecdc4" stroke-width="1.5" opacity="0.3"/>
  <line x1="940" y1="400" x2="940" y2="420" stroke="#4ecdc4" stroke-width="1.5" opacity="0.3"/>
  <line x1="840" y1="400" x2="840" y2="420" stroke="#4ecdc4" stroke-width="1.5" opacity="0.3"/>
  <line x1="890" y1="370" x2="890" y2="470" stroke="#4ecdc4" stroke-width="1.5" opacity="0.25"/>
  <circle cx="1060" cy="380" r="4" fill="#4ecdc4" opacity="0.6"/>
  <circle cx="940" cy="400" r="4" fill="#4ecdc4" opacity="0.6"/>
  <circle cx="840" cy="400" r="4" fill="#4ecdc4" opacity="0.6"/>

  <!-- Merged double helix (center) -->
  <!-- Strand A -->
  <path d="M 560 280 Q 600 240 640 280 Q 680 340 720 280 Q 760 220 640 280" fill="none" stroke="#a8e06c" stroke-width="5" opacity="0.0"/>
  <path d="M 560 270 Q 590 230 620 260 Q 650 310 680 270 Q 710 230 740 270" fill="none" stroke="#a8e06c" stroke-width="5" opacity="0.8"/>
  <!-- Strand B -->
  <path d="M 560 350 Q 590 390 620 360 Q 650 310 680 360 Q 710 400 740 350" fill="none" stroke="#ffd93d" stroke-width="5" opacity="0.7"/>
  <!-- Merged rungs with base pair colors -->
  <line x1="575" y1="250" x2="575" y2="370" stroke="#c4b5fd" stroke-width="2.5" opacity="0.4"/>
  <line x1="605" y1="255" x2="605" y2="365" stroke="#fff" stroke-width="2" opacity="0.25"/>
  <line x1="635" y1="280" x2="635" y2="340" stroke="#c4b5fd" stroke-width="2.5" opacity="0.4"/>
  <line x1="665" y1="285" x2="665" y2="345" stroke="#fff" stroke-width="2" opacity="0.25"/>
  <line x1="695" y1="250" x2="695" y2="370" stroke="#c4b5fd" stroke-width="2.5" opacity="0.4"/>
  <line x1="725" y1="260" x2="725" y2="360" stroke="#fff" stroke-width="2" opacity="0.25"/>
  <!-- Merged nodes -->
  <circle cx="590" cy="245" r="5" fill="#a8e06c" opacity="0.7" filter="url(#dh-soft)"/>
  <circle cx="650" cy="310" r="6" fill="#ffd93d" opacity="0.7" filter="url(#dh-soft)"/>
  <circle cx="710" cy="240" r="5" fill="#a8e06c" opacity="0.7" filter="url(#dh-soft)"/>
  <circle cx="590" cy="375" r="5" fill="#ffd93d" opacity="0.6" filter="url(#dh-soft)"/>
  <circle cx="650" cy="310" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="710" cy="380" r="5" fill="#ffd93d" opacity="0.6" filter="url(#dh-soft)"/>

  <!-- Connection trails from separate helixes to merged -->
  <path d="M 520 260 Q 540 260 560 270" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3" stroke-dasharray="4 3"/>
  <path d="M 520 240 Q 540 250 560 260" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.25" stroke-dasharray="4 3"/>
  <path d="M 760 400 Q 755 390 740 370" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.3" stroke-dasharray="4 3"/>
  <path d="M 760 420 Q 755 400 740 385" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.25" stroke-dasharray="4 3"/>

  <!-- Central glow -->
  <ellipse cx="650" cy="310" rx="60" ry="50" fill="#c4b5fd" opacity="0.05" filter="url(#dh-glow)"/>

  <!-- Floating base pair letters -->
  <text x="575" y="315" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd" opacity="0.3">A-T</text>
  <text x="635" y="315" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd" opacity="0.3">G-C</text>
  <text x="695" y="315" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4b5fd" opacity="0.3">T-A</text>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#c4b5fd" opacity="0.6" letter-spacing="4">DOUBLE HELIX MERGE</text>
</svg>