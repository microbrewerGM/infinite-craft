<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg12" cx="50%" cy="70%">
      <stop offset="0%" stop-color="#1a1020"/>
      <stop offset="100%" stop-color="#080410"/>
    </radialGradient>
    <linearGradient id="cauldron12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glow12">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg12)"/>
  <!-- Fire under cauldron -->
  <g transform="translate(640,530)" filter="url(#glow12)">
    <path d="M-60,0 Q-50,-30 -40,-10 Q-30,-45 -15,-15 Q0,-60 15,-15 Q30,-45 40,-10 Q50,-30 60,0" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.6"/>
    <path d="M-40,0 Q-30,-20 -20,-5 Q-10,-35 0,-10 Q10,-35 20,-5 Q30,-20 40,0" fill="#ff6b35" opacity="0.1"/>
    <ellipse cx="0" cy="5" rx="70" ry="15" fill="#ff6b35" opacity="0.05" filter="url(#softglow)"/>
  </g>
  <!-- Cauldron body -->
  <g transform="translate(640,400)">
    <!-- Rim -->
    <ellipse rx="130" ry="20" fill="none" stroke="#4a4a4a" stroke-width="3"/>
    <ellipse rx="125" ry="18" fill="#1a1a1a"/>
    <!-- Body -->
    <path d="M-130,0 Q-135,60 -100,100 Q-50,130 0,135 Q50,130 100,100 Q135,60 130,0" fill="url(#cauldron12)" stroke="#3a3a3a" stroke-width="2"/>
    <!-- Legs -->
    <line x1="-80" y1="120" x2="-95" y2="145" stroke="#3a3a3a" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="120" x2="95" y2="145" stroke="#3a3a3a" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="135" x2="0" y2="148" stroke="#3a3a3a" stroke-width="4" stroke-linecap="round"/>
    <!-- Handle -->
    <path d="M-120,-10 Q-150,-60 0,-70 Q150,-60 120,-10" fill="none" stroke="#3a3a3a" stroke-width="3"/>
    <!-- Liquid surface glow -->
    <ellipse rx="120" ry="16" fill="#4ecdc4" opacity="0.08" filter="url(#softglow)"/>
    <!-- Bubbles in liquid -->
    <circle cx="-30" cy="-5" r="6" fill="none" stroke="#4ecdc4" stroke-width="0.8" opacity="0.4"/>
    <circle cx="40" cy="-8" r="4" fill="none" stroke="#a8e06c" stroke-width="0.8" opacity="0.3"/>
    <circle cx="-60" cy="-3" r="3" fill="none" stroke="#ffd93d" stroke-width="0.8" opacity="0.3"/>
    <circle cx="70" cy="-6" r="5" fill="none" stroke="#c4b5fd" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- Rising element vapors -->
  <g filter="url(#glow12)">
    <!-- Fire vapor -->
    <path d="M580,350 Q570,300 585,250 Q575,200 590,150" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 6"/>
    <circle cx="590" cy="150" r="12" fill="#ff6b35" opacity="0.15"/>
    <text x="590" y="155" text-anchor="middle" font-family="serif" font-size="18" fill="#ff6b35" opacity="0.6">&#x1F702;</text>
    <!-- Water vapor -->
    <path d="M620,345 Q630,290 615,240 Q625,190 620,130" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 6"/>
    <circle cx="620" cy="130" r="12" fill="#4ecdc4" opacity="0.15"/>
    <text x="620" y="135" text-anchor="middle" font-family="serif" font-size="18" fill="#4ecdc4" opacity="0.6">&#x1F704;</text>
    <!-- Earth vapor -->
    <path d="M660,345 Q650,295 665,245 Q655,195 660,140" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 6"/>
    <circle cx="660" cy="140" r="12" fill="#a8e06c" opacity="0.15"/>
    <text x="660" y="145" text-anchor="middle" font-family="serif" font-size="18" fill="#a8e06c" opacity="0.6">&#x1F703;</text>
    <!-- Air vapor -->
    <path d="M700,350 Q710,295 695,240 Q705,185 700,125" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 6"/>
    <circle cx="700" cy="125" r="12" fill="#c4b5fd" opacity="0.15"/>
    <text x="700" y="130" text-anchor="middle" font-family="serif" font-size="18" fill="#c4b5fd" opacity="0.6">&#x1F701;</text>
  </g>
  <!-- Ambient steam -->
  <g fill="none" stroke="white" stroke-width="0.5" opacity="0.08">
    <path d="M550,320 Q540,280 560,240 Q550,200 560,160"/>
    <path d="M730,315 Q740,275 720,235 Q730,195 720,155"/>
  </g>
  <!-- Title -->
  <text x="640" y="60" text-anchor="middle" font-family="serif" font-size="46" fill="#c9a96e" letter-spacing="10" filter="url(#glow12)">INFINITE CRAFT</text>
  <line x1="350" y1="75" x2="930" y2="75" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
</svg>