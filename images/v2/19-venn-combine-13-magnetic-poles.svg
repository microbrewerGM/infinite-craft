<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="mg-glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="mg-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mg-n" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="mg-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>
  <ellipse cx="640" cy="320" rx="400" ry="250" fill="url(#mg-center)" opacity="0.4"/>

  <!-- North pole magnet (left) -->
  <g transform="translate(280, 320)">
    <rect x="-60" y="-50" width="120" height="100" rx="10" fill="url(#mg-n)" opacity="0.7"/>
    <rect x="-60" y="-50" width="120" height="100" rx="10" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <text x="0" y="12" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="bold" fill="#0a0a14" opacity="0.7">N</text>
  </g>

  <!-- South pole magnet (right) -->
  <g transform="translate(1000, 320)">
    <rect x="-60" y="-50" width="120" height="100" rx="10" fill="url(#mg-s)" opacity="0.7"/>
    <rect x="-60" y="-50" width="120" height="100" rx="10" fill="none" stroke="#4ecdc4" stroke-width="2"/>
    <text x="0" y="12" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="bold" fill="#0a0a14" opacity="0.7">S</text>
  </g>

  <!-- Magnetic field lines (flowing from N to S) -->
  <!-- Top lines -->
  <path d="M 340 290 Q 500 120 640 120 Q 780 120 940 290" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.35"/>
  <path d="M 340 280 Q 520 160 640 160 Q 760 160 940 280" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.4"/>
  <path d="M 340 295 Q 530 190 640 190 Q 750 190 940 295" fill="none" stroke="#c4b5fd" stroke-width="1.8" opacity="0.45"/>
  <path d="M 340 305 Q 540 220 640 220 Q 740 220 940 305" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <path d="M 340 310 Q 540 250 640 250 Q 740 250 940 310" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.45"/>

  <!-- Direct center line -->
  <path d="M 340 320 L 940 320" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.5"/>

  <!-- Bottom lines -->
  <path d="M 340 330 Q 540 390 640 390 Q 740 390 940 330" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.45"/>
  <path d="M 340 335 Q 540 420 640 420 Q 740 420 940 335" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <path d="M 340 345 Q 530 450 640 450 Q 750 450 940 345" fill="none" stroke="#c4b5fd" stroke-width="1.8" opacity="0.45"/>
  <path d="M 340 360 Q 520 480 640 480 Q 760 480 940 360" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.4"/>
  <path d="M 340 350 Q 500 520 640 520 Q 780 520 940 350" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.35"/>

  <!-- Arrowheads on field lines (at midpoint, pointing right) -->
  <polygon points="636,120 644,116 644,124" fill="#c4b5fd" opacity="0.4"/>
  <polygon points="636,190 644,186 644,194" fill="#c4b5fd" opacity="0.5"/>
  <polygon points="636,250 644,246 644,254" fill="#c4b5fd" opacity="0.5"/>
  <polygon points="636,320 644,316 644,324" fill="#c4b5fd" opacity="0.5"/>
  <polygon points="636,390 644,386 644,394" fill="#c4b5fd" opacity="0.5"/>
  <polygon points="636,450 644,446 644,454" fill="#c4b5fd" opacity="0.5"/>
  <polygon points="636,520 644,516 644,524" fill="#c4b5fd" opacity="0.4"/>

  <!-- Iron filing dots along field lines -->
  <circle cx="440" cy="180" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="540" cy="155" r="1.5" fill="#fff" opacity="0.25"/>
  <circle cx="740" cy="155" r="1.5" fill="#fff" opacity="0.25"/>
  <circle cx="840" cy="180" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="440" cy="460" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="540" cy="485" r="1.5" fill="#fff" opacity="0.25"/>
  <circle cx="740" cy="485" r="1.5" fill="#fff" opacity="0.25"/>
  <circle cx="840" cy="460" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="500" cy="320" r="1.5" fill="#ffd93d" opacity="0.3"/>
  <circle cx="640" cy="320" r="2" fill="#ffd93d" opacity="0.4"/>
  <circle cx="780" cy="320" r="1.5" fill="#ffd93d" opacity="0.3"/>

  <!-- Title -->
  <text x="640" y="75" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#c4b5fd" opacity="0.6" letter-spacing="4">MAGNETIC POLES</text>
</svg>