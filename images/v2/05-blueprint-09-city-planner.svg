<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>

  <!-- Title -->
  <text x="640" y="50" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="62" x2="980" y2="62" stroke="#a8e06c" stroke-width="2"/>
  <text x="640" y="82" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">ELEMENT CITY ZONING MAP</text>

  <!-- Main roads -->
  <rect x="400" y="100" width="30" height="500" fill="#2a3d6a" stroke="#ffd93d" stroke-width="1.5"/>
  <rect x="800" y="100" width="30" height="500" fill="#2a3d6a" stroke="#ffd93d" stroke-width="1.5"/>
  <rect x="100" y="280" width="1080" height="25" fill="#2a3d6a" stroke="#ffd93d" stroke-width="1.5"/>
  <rect x="100" y="440" width="1080" height="25" fill="#2a3d6a" stroke="#ffd93d" stroke-width="1.5"/>

  <!-- Road labels -->
  <text x="415" y="610" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="middle">CRAFT AVE</text>
  <text x="815" y="610" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="middle">ELEMENT BLVD</text>
  <text x="1190" y="297" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="end">FIRE ST</text>
  <text x="1190" y="458" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="end">WATER ST</text>

  <!-- Road center lines -->
  <line x1="415" y1="100" x2="415" y2="600" stroke="#ffd93d" stroke-width="1" stroke-dasharray="8,8"/>
  <line x1="815" y1="100" x2="815" y2="600" stroke="#ffd93d" stroke-width="1" stroke-dasharray="8,8"/>

  <!-- Zone: Fire District (top-left) -->
  <rect x="120" y="110" width="270" height="160" fill="#ff6b35" opacity="0.08" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="255" y="140" fill="#ff6b35" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">FIRE DISTRICT</text>
  <text x="255" y="158" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">ZONE: R-FIRE</text>
  <!-- Buildings -->
  <rect x="140" y="170" width="40" height="30" fill="none" stroke="#ff6b35" stroke-width="1"/>
  <rect x="190" y="175" width="30" height="25" fill="none" stroke="#ff6b35" stroke-width="1"/>
  <rect x="235" y="165" width="50" height="35" fill="none" stroke="#ff6b35" stroke-width="1"/>
  <rect x="300" y="175" width="35" height="25" fill="none" stroke="#ff6b35" stroke-width="1"/>
  <rect x="140" y="210" width="60" height="40" fill="none" stroke="#ff6b35" stroke-width="1"/>
  <rect x="220" y="215" width="45" height="35" fill="none" stroke="#ff6b35" stroke-width="1"/>

  <!-- Zone: Wind District (top-right) -->
  <rect x="440" y="110" width="350" height="160" fill="#c4b5fd" opacity="0.08" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="615" y="140" fill="#c4b5fd" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">WIND DISTRICT</text>
  <text x="615" y="158" fill="#c4b5fd" font-family="monospace" font-size="9" text-anchor="middle">ZONE: C-WIND</text>
  <!-- Buildings -->
  <rect x="460" y="170" width="60" height="50" fill="none" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="540" y="175" width="40" height="35" fill="none" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="600" y="170" width="55" height="45" fill="none" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="680" y="180" width="30" height="30" fill="none" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="720" y="170" width="45" height="40" fill="none" stroke="#c4b5fd" stroke-width="1"/>
  <!-- Park area -->
  <circle cx="530" cy="240" r="15" fill="none" stroke="#a8e06c" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="560" cy="235" r="10" fill="none" stroke="#a8e06c" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Zone: Central Hub (top-far-right) -->
  <rect x="840" y="110" width="330" height="160" fill="white" opacity="0.04" stroke="white" stroke-width="1.5"/>
  <text x="1005" y="140" fill="white" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">CRAFT CENTER</text>
  <text x="1005" y="158" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">ZONE: MIX-CENTRAL</text>
  <!-- Large central building -->
  <rect x="900" y="170" width="120" height="80" fill="none" stroke="white" stroke-width="1.5" rx="5"/>
  <text x="960" y="205" fill="white" font-family="monospace" font-size="9" text-anchor="middle">CRAFT</text>
  <text x="960" y="220" fill="white" font-family="monospace" font-size="9" text-anchor="middle">HALL</text>
  <rect x="1040" y="180" width="50" height="40" fill="none" stroke="white" stroke-width="1"/>
  <rect x="1100" y="175" width="55" height="55" fill="none" stroke="white" stroke-width="1"/>

  <!-- Zone: Earth District (bottom-left) -->
  <rect x="120" y="315" width="270" height="115" fill="#a8e06c" opacity="0.08" stroke="#a8e06c" stroke-width="1.5"/>
  <text x="255" y="345" fill="#a8e06c" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">EARTH DISTRICT</text>
  <text x="255" y="363" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">ZONE: I-EARTH</text>
  <rect x="140" y="375" width="80" height="35" fill="none" stroke="#a8e06c" stroke-width="1"/>
  <rect x="240" y="380" width="60" height="30" fill="none" stroke="#a8e06c" stroke-width="1"/>
  <rect x="320" y="375" width="50" height="35" fill="none" stroke="#a8e06c" stroke-width="1"/>

  <!-- Zone: Water District (bottom) -->
  <rect x="120" y="475" width="270" height="115" fill="#4ecdc4" opacity="0.08" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="255" y="505" fill="#4ecdc4" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">WATER DISTRICT</text>
  <text x="255" y="523" fill="#4ecdc4" font-family="monospace" font-size="9" text-anchor="middle">ZONE: R-WATER</text>
  <path d="M 130 550 Q 200 540 255 550 Q 310 560 380 550" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.5"/>
  <path d="M 130 565 Q 200 555 255 565 Q 310 575 380 565" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.5"/>

  <!-- Zone: Mixed use (bottom-right) -->
  <rect x="440" y="475" width="350" height="115" fill="#ffd93d" opacity="0.05" stroke="#ffd93d" stroke-width="1"/>
  <text x="615" y="510" fill="#ffd93d" font-family="monospace" font-size="12" text-anchor="middle">MIXED-USE ZONE</text>
  <rect x="460" y="525" width="30" height="30" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.6"/>
  <rect x="500" y="530" width="25" height="25" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.6"/>
  <rect x="535" y="525" width="35" height="30" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.6"/>

  <!-- Legend -->
  <rect x="850" y="475" width="320" height="115" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="3"/>
  <text x="1010" y="498" fill="white" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">LEGEND</text>
  <line x1="850" y1="505" x2="1170" y2="505" stroke="#6eaadc" stroke-width="0.5"/>
  <rect x="870" y="515" width="12" height="12" fill="#ff6b35" opacity="0.3" stroke="#ff6b35" stroke-width="1"/>
  <text x="892" y="525" fill="#ff6b35" font-family="monospace" font-size="9">FIRE ZONE</text>
  <rect x="870" y="535" width="12" height="12" fill="#4ecdc4" opacity="0.3" stroke="#4ecdc4" stroke-width="1"/>
  <text x="892" y="545" fill="#4ecdc4" font-family="monospace" font-size="9">WATER ZONE</text>
  <rect x="870" y="555" width="12" height="12" fill="#a8e06c" opacity="0.3" stroke="#a8e06c" stroke-width="1"/>
  <text x="892" y="565" fill="#a8e06c" font-family="monospace" font-size="9">EARTH ZONE</text>
  <rect x="870" y="575" width="12" height="12" fill="#c4b5fd" opacity="0.3" stroke="#c4b5fd" stroke-width="1"/>
  <text x="892" y="585" fill="#c4b5fd" font-family="monospace" font-size="9">WIND ZONE</text>
  <rect x="1020" y="515" width="12" height="12" fill="#ffd93d" opacity="0.2"/>
  <text x="1042" y="525" fill="#ffd93d" font-family="monospace" font-size="9">ROADS</text>
  <rect x="1020" y="535" width="12" height="12" fill="white" opacity="0.1" stroke="white" stroke-width="1"/>
  <text x="1042" y="545" fill="white" font-family="monospace" font-size="9">CRAFT CENTER</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#a8e06c" stroke-width="2" fill="none"/>
</svg>