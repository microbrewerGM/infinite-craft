<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="cs-glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="cs-star">
      <feGaussianBlur stdDeviation="2"/>
      <feComposite in="SourceGraphic"/>
    </filter>
    <radialGradient id="cs-nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>

  <!-- Background nebula haze -->
  <ellipse cx="640" cy="320" rx="500" ry="300" fill="url(#cs-nebula)"/>
  <ellipse cx="350" cy="300" rx="200" ry="150" fill="#ff6b35" opacity="0.02"/>
  <ellipse cx="930" cy="300" rx="200" ry="150" fill="#4ecdc4" opacity="0.02"/>

  <!-- Distant background stars -->
  <circle cx="50" cy="60" r="0.8" fill="#fff" opacity="0.3"/>
  <circle cx="180" cy="520" r="0.8" fill="#fff" opacity="0.25"/>
  <circle cx="320" cy="580" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="500" cy="560" r="0.8" fill="#fff" opacity="0.25"/>
  <circle cx="780" cy="570" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="1100" cy="550" r="0.8" fill="#fff" opacity="0.3"/>
  <circle cx="1200" cy="60" r="0.8" fill="#fff" opacity="0.25"/>
  <circle cx="100" cy="300" r="0.8" fill="#fff" opacity="0.2"/>
  <circle cx="1180" cy="350" r="0.8" fill="#fff" opacity="0.2"/>

  <!-- Left constellation (orange) - resembles a simple shape -->
  <g>
    <!-- Stars -->
    <circle cx="220" cy="200" r="5" fill="#ff6b35" opacity="0.9" filter="url(#cs-star)"/>
    <circle cx="300" cy="150" r="4" fill="#ff6b35" opacity="0.8" filter="url(#cs-star)"/>
    <circle cx="350" cy="240" r="6" fill="#ff6b35" opacity="0.9" filter="url(#cs-star)"/>
    <circle cx="280" cy="320" r="4.5" fill="#ff6b35" opacity="0.85" filter="url(#cs-star)"/>
    <circle cx="200" cy="380" r="5" fill="#ff6b35" opacity="0.8" filter="url(#cs-star)"/>
    <circle cx="380" cy="360" r="4" fill="#ff6b35" opacity="0.75" filter="url(#cs-star)"/>
    <circle cx="420" cy="280" r="5.5" fill="#ff6b35" opacity="0.9" filter="url(#cs-star)"/>
    <!-- Lines connecting -->
    <line x1="220" y1="200" x2="300" y2="150" stroke="#ff6b35" stroke-width="1.5" opacity="0.35"/>
    <line x1="300" y1="150" x2="350" y2="240" stroke="#ff6b35" stroke-width="1.5" opacity="0.35"/>
    <line x1="350" y1="240" x2="420" y2="280" stroke="#ff6b35" stroke-width="1.5" opacity="0.35"/>
    <line x1="350" y1="240" x2="280" y2="320" stroke="#ff6b35" stroke-width="1.5" opacity="0.35"/>
    <line x1="280" y1="320" x2="200" y2="380" stroke="#ff6b35" stroke-width="1.5" opacity="0.35"/>
    <line x1="280" y1="320" x2="380" y2="360" stroke="#ff6b35" stroke-width="1.5" opacity="0.35"/>
    <!-- Reaching toward center -->
    <line x1="420" y1="280" x2="520" y2="300" stroke="#ff6b35" stroke-width="1" opacity="0.2" stroke-dasharray="6 4"/>
  </g>

  <!-- Right constellation (teal) -->
  <g>
    <circle cx="1060" cy="200" r="5" fill="#4ecdc4" opacity="0.9" filter="url(#cs-star)"/>
    <circle cx="980" cy="150" r="4" fill="#4ecdc4" opacity="0.8" filter="url(#cs-star)"/>
    <circle cx="930" cy="240" r="6" fill="#4ecdc4" opacity="0.9" filter="url(#cs-star)"/>
    <circle cx="1000" cy="320" r="4.5" fill="#4ecdc4" opacity="0.85" filter="url(#cs-star)"/>
    <circle cx="1080" cy="380" r="5" fill="#4ecdc4" opacity="0.8" filter="url(#cs-star)"/>
    <circle cx="900" cy="360" r="4" fill="#4ecdc4" opacity="0.75" filter="url(#cs-star)"/>
    <circle cx="860" cy="280" r="5.5" fill="#4ecdc4" opacity="0.9" filter="url(#cs-star)"/>
    <line x1="1060" y1="200" x2="980" y2="150" stroke="#4ecdc4" stroke-width="1.5" opacity="0.35"/>
    <line x1="980" y1="150" x2="930" y2="240" stroke="#4ecdc4" stroke-width="1.5" opacity="0.35"/>
    <line x1="930" y1="240" x2="860" y2="280" stroke="#4ecdc4" stroke-width="1.5" opacity="0.35"/>
    <line x1="930" y1="240" x2="1000" y2="320" stroke="#4ecdc4" stroke-width="1.5" opacity="0.35"/>
    <line x1="1000" y1="320" x2="1080" y2="380" stroke="#4ecdc4" stroke-width="1.5" opacity="0.35"/>
    <line x1="1000" y1="320" x2="900" y2="360" stroke="#4ecdc4" stroke-width="1.5" opacity="0.35"/>
    <line x1="860" y1="280" x2="760" y2="300" stroke="#4ecdc4" stroke-width="1" opacity="0.2" stroke-dasharray="6 4"/>
  </g>

  <!-- Central merged constellation (new pattern) -->
  <g>
    <!-- New combined stars -->
    <circle cx="560" cy="280" r="5" fill="#a8e06c" opacity="0.9" filter="url(#cs-star)"/>
    <circle cx="640" cy="250" r="7" fill="#ffd93d" opacity="0.95" filter="url(#cs-star)"/>
    <circle cx="720" cy="280" r="5" fill="#a8e06c" opacity="0.9" filter="url(#cs-star)"/>
    <circle cx="600" cy="340" r="5" fill="#c4b5fd" opacity="0.85" filter="url(#cs-star)"/>
    <circle cx="680" cy="340" r="5" fill="#c4b5fd" opacity="0.85" filter="url(#cs-star)"/>
    <circle cx="640" cy="380" r="6" fill="#ffd93d" opacity="0.9" filter="url(#cs-star)"/>
    <!-- New pattern lines -->
    <line x1="560" y1="280" x2="640" y2="250" stroke="#a8e06c" stroke-width="2" opacity="0.5"/>
    <line x1="640" y1="250" x2="720" y2="280" stroke="#a8e06c" stroke-width="2" opacity="0.5"/>
    <line x1="560" y1="280" x2="600" y2="340" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
    <line x1="720" y1="280" x2="680" y2="340" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
    <line x1="600" y1="340" x2="640" y2="380" stroke="#ffd93d" stroke-width="2" opacity="0.45"/>
    <line x1="680" y1="340" x2="640" y2="380" stroke="#ffd93d" stroke-width="2" opacity="0.45"/>
    <line x1="600" y1="340" x2="680" y2="340" stroke="#fff" stroke-width="1" opacity="0.2"/>
    <!-- Glow at center -->
    <circle cx="640" cy="310" r="50" fill="#ffd93d" opacity="0.04" filter="url(#cs-glow)"/>
  </g>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#c4b5fd" opacity="0.6" letter-spacing="4">CONSTELLATION MERGE</text>
</svg>