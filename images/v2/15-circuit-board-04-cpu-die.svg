<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="die-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="silicon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a3a"/>
      <stop offset="30%" stop-color="#252550"/>
      <stop offset="60%" stop-color="#1e1e45"/>
      <stop offset="100%" stop-color="#151535"/>
    </linearGradient>
    <pattern id="transistor-grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <rect width="3" height="3" x="1" y="1" fill="#2a2a5a" opacity="0.5"/>
      <rect width="3" height="3" x="5" y="5" fill="#2a2a5a" opacity="0.3"/>
    </pattern>
    <linearGradient id="gold-wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8942e"/>
      <stop offset="50%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#b8942e"/>
    </linearGradient>
  </defs>
  <!-- Dark substrate -->
  <rect width="1280" height="640" fill="#080818"/>
  <!-- Die package frame -->
  <rect x="140" y="20" width="1000" height="600" fill="#111" stroke="#333" stroke-width="3" rx="2"/>
  <!-- Silicon die -->
  <rect x="240" y="70" width="800" height="500" fill="url(#silicon)" stroke="#4a4a8a" stroke-width="1"/>
  <rect x="240" y="70" width="800" height="500" fill="url(#transistor-grid)"/>
  <!-- Die regions - functional blocks with rainbow tints -->
  <!-- ALU block -->
  <rect x="260" y="90" width="220" height="180" fill="#ff6b35" opacity="0.08" stroke="#ff6b35" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="370" y="185" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#ff6b35" opacity="0.6">FIRE CORE</text>
  <!-- Cache block -->
  <rect x="500" y="90" width="280" height="120" fill="#4ecdc4" opacity="0.08" stroke="#4ecdc4" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="640" y="155" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#4ecdc4" opacity="0.6">L2 CACHE</text>
  <!-- Memory controller -->
  <rect x="800" y="90" width="220" height="180" fill="#a8e06c" opacity="0.08" stroke="#a8e06c" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="910" y="185" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#a8e06c" opacity="0.6">EARTH CTRL</text>
  <!-- FPU -->
  <rect x="260" y="290" width="220" height="130" fill="#c4b5fd" opacity="0.08" stroke="#c4b5fd" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="370" y="360" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#c4b5fd" opacity="0.6">WIND FPU</text>
  <!-- Interconnect -->
  <rect x="500" y="230" width="280" height="80" fill="#ffd93d" opacity="0.06" stroke="#ffd93d" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="640" y="275" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#ffd93d" opacity="0.6">INTERCONNECT BUS</text>
  <!-- I/O block -->
  <rect x="500" y="330" width="280" height="100" fill="#4ecdc4" opacity="0.06" stroke="#4ecdc4" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="640" y="385" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#4ecdc4" opacity="0.6">WATER I/O</text>
  <!-- Power delivery -->
  <rect x="800" y="290" width="220" height="130" fill="#ff6b35" opacity="0.06" stroke="#ff6b35" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="910" y="360" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#ff6b35" opacity="0.6">PWR DELIVERY</text>
  <!-- Bottom row -->
  <rect x="260" y="440" width="380" height="110" fill="#a8e06c" opacity="0.06" stroke="#a8e06c" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="450" y="500" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#a8e06c" opacity="0.6">COMBINATION ENGINE</text>
  <rect x="660" y="440" width="360" height="110" fill="#c4b5fd" opacity="0.06" stroke="#c4b5fd" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="840" y="500" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#c4b5fd" opacity="0.6">ELEMENT REGISTER FILE</text>
  <!-- Bond wires - top -->
  <line x1="280" y1="70" x2="260" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="340" y1="70" x2="320" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="400" y1="70" x2="380" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="460" y1="70" x2="440" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="520" y1="70" x2="500" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="580" y1="70" x2="560" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="640" y1="70" x2="640" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="700" y1="70" x2="720" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="760" y1="70" x2="780" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="820" y1="70" x2="840" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="880" y1="70" x2="900" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="940" y1="70" x2="960" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="1000" y1="70" x2="1020" y2="35" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <!-- Bond wires - bottom -->
  <line x1="280" y1="570" x2="260" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="340" y1="570" x2="320" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="400" y1="570" x2="380" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="460" y1="570" x2="440" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="520" y1="570" x2="500" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="580" y1="570" x2="560" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="640" y1="570" x2="640" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="700" y1="570" x2="720" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="760" y1="570" x2="780" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="820" y1="570" x2="840" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="880" y1="570" x2="900" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="940" y1="570" x2="960" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="1000" y1="570" x2="1020" y2="605" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <!-- Bond wires - left -->
  <line x1="240" y1="120" x2="175" y2="100" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="240" y1="180" x2="175" y2="170" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="240" y1="240" x2="175" y2="240" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="240" y1="300" x2="175" y2="310" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="240" y1="360" x2="175" y2="380" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="240" y1="420" x2="175" y2="450" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="240" y1="480" x2="175" y2="520" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <!-- Bond wires - right -->
  <line x1="1040" y1="120" x2="1105" y2="100" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="1040" y1="180" x2="1105" y2="170" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="1040" y1="240" x2="1105" y2="240" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="1040" y1="300" x2="1105" y2="310" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="1040" y1="360" x2="1105" y2="380" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="1040" y1="420" x2="1105" y2="450" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <line x1="1040" y1="480" x2="1105" y2="520" stroke="url(#gold-wire)" stroke-width="1" filter="url(#die-glow)"/>
  <!-- Bond pads on die -->
  <rect x="275" y="66" width="8" height="8" fill="#ffd93d" opacity="0.8"/>
  <rect x="335" y="66" width="8" height="8" fill="#ffd93d" opacity="0.8"/>
  <rect x="395" y="66" width="8" height="8" fill="#ffd93d" opacity="0.8"/>
  <rect x="455" y="66" width="8" height="8" fill="#ffd93d" opacity="0.8"/>
  <rect x="515" y="66" width="8" height="8" fill="#ffd93d" opacity="0.8"/>
  <rect x="575" y="66" width="8" height="8" fill="#ffd93d" opacity="0.8"/>
  <rect x="635" y="66" width="8" height="8" fill="#ffd93d" opacity="0.8"/>
  <rect x="695" y="66" width="8" height="8" fill="#ffd93d" opacity="0.8"/>
  <rect x="755" y="66" width="8" height="8" fill="#ffd93d" opacity="0.8"/>
  <!-- Die marking -->
  <text x="640" y="250" text-anchor="middle" font-family="'Courier New', monospace" font-size="36" fill="#fff" opacity="0.12" font-weight="bold" letter-spacing="6">INFINITE CRAFT</text>
  <!-- Package label -->
  <text x="640" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#666">IC-2026 Rev.A  14nm FinFET  4.2B Transistors</text>
  <!-- Main title overlay -->
  <text x="640" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="#ffd93d" font-weight="bold" letter-spacing="8" filter="url(#die-glow)" opacity="0.9">INFINITE CRAFT</text>
  <text x="640" y="370" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#c4b5fd" opacity="0.7" letter-spacing="4">SILICON DIE SHOT</text>
</svg>