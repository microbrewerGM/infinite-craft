<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="640" y="50" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="62" x2="980" y2="62" stroke="#ff6b35" stroke-width="2"/>
  <text x="640" y="82" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">COMBINATION ENGINE CUTAWAY</text>

  <!-- Engine block outline -->
  <rect x="200" y="140" width="500" height="400" rx="20" fill="url(#hatch)" stroke="#6eaadc" stroke-width="2"/>

  <!-- Cylinder 1 (Fire) -->
  <rect x="240" y="170" width="100" height="200" rx="8" fill="#1a2744" stroke="#ff6b35" stroke-width="2"/>
  <text x="290" y="195" fill="#ff6b35" font-family="monospace" font-size="11" text-anchor="middle">CYL 1</text>
  <!-- Piston -->
  <rect x="255" y="280" width="70" height="25" fill="none" stroke="#ff6b35" stroke-width="2" rx="3"/>
  <text x="290" y="297" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">FIRE</text>
  <!-- Piston rod -->
  <line x1="290" y1="305" x2="290" y2="360" stroke="#ff6b35" stroke-width="3"/>
  <!-- Spark -->
  <line x1="275" y1="220" x2="290" y2="240" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="305" y1="220" x2="290" y2="240" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="290" y1="210" x2="290" y2="240" stroke="#ffd93d" stroke-width="1.5"/>
  <text x="290" y="260" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">IGNITION</text>

  <!-- Cylinder 2 (Water) -->
  <rect x="360" y="170" width="100" height="200" rx="8" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
  <text x="410" y="195" fill="#4ecdc4" font-family="monospace" font-size="11" text-anchor="middle">CYL 2</text>
  <rect x="375" y="250" width="70" height="25" fill="none" stroke="#4ecdc4" stroke-width="2" rx="3"/>
  <text x="410" y="267" fill="#4ecdc4" font-family="monospace" font-size="9" text-anchor="middle">WATER</text>
  <line x1="410" y1="275" x2="410" y2="360" stroke="#4ecdc4" stroke-width="3"/>

  <!-- Cylinder 3 (Earth) -->
  <rect x="480" y="170" width="100" height="200" rx="8" fill="#1a2744" stroke="#a8e06c" stroke-width="2"/>
  <text x="530" y="195" fill="#a8e06c" font-family="monospace" font-size="11" text-anchor="middle">CYL 3</text>
  <rect x="495" y="310" width="70" height="25" fill="none" stroke="#a8e06c" stroke-width="2" rx="3"/>
  <text x="530" y="327" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">EARTH</text>
  <line x1="530" y1="335" x2="530" y2="360" stroke="#a8e06c" stroke-width="3"/>

  <!-- Crankshaft -->
  <line x1="220" y1="400" x2="680" y2="400" stroke="#ffd93d" stroke-width="4"/>
  <!-- Crank pins -->
  <circle cx="290" cy="400" r="12" fill="#1a2744" stroke="#ffd93d" stroke-width="2"/>
  <circle cx="410" cy="400" r="12" fill="#1a2744" stroke="#ffd93d" stroke-width="2"/>
  <circle cx="530" cy="400" r="12" fill="#1a2744" stroke="#ffd93d" stroke-width="2"/>
  <text x="450" y="435" fill="#ffd93d" font-family="monospace" font-size="10" text-anchor="middle">CRANKSHAFT</text>

  <!-- Flywheel -->
  <circle cx="680" cy="400" r="50" fill="#1a2744" stroke="#c4b5fd" stroke-width="2.5"/>
  <circle cx="680" cy="400" r="35" fill="none" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="680" cy="400" r="10" fill="none" stroke="#c4b5fd" stroke-width="2"/>
  <text x="680" y="470" fill="#c4b5fd" font-family="monospace" font-size="10" text-anchor="middle">FLYWHEEL</text>

  <!-- Cam shaft (top) -->
  <line x1="240" y1="160" x2="580" y2="160" stroke="#6eaadc" stroke-width="2"/>
  <ellipse cx="290" cy="160" rx="12" ry="8" fill="none" stroke="#6eaadc" stroke-width="1.5"/>
  <ellipse cx="410" cy="160" rx="12" ry="8" fill="none" stroke="#6eaadc" stroke-width="1.5"/>
  <ellipse cx="530" cy="160" rx="12" ry="8" fill="none" stroke="#6eaadc" stroke-width="1.5"/>
  <text x="410" y="148" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">CAMSHAFT</text>

  <!-- Oil sump -->
  <rect x="220" y="480" width="480" height="40" rx="10" fill="none" stroke="#a8e06c" stroke-width="1.5"/>
  <text x="460" y="505" fill="#a8e06c" font-family="monospace" font-size="10" text-anchor="middle">OIL SUMP</text>
  <path d="M 240 490 Q 340 495 460 490 Q 580 485 680 490" fill="none" stroke="#a8e06c" stroke-width="0.8" opacity="0.5"/>

  <!-- Labels with leader lines (right side) -->
  <g font-family="monospace" font-size="11">
    <!-- Label 1 -->
    <line x1="600" y1="185" x2="800" y2="155" stroke="#6eaadc" stroke-width="0.8"/>
    <circle cx="600" cy="185" r="3" fill="#6eaadc"/>
    <text x="810" y="160" fill="#6eaadc">INTAKE VALVE ASSEMBLY</text>

    <!-- Label 2 -->
    <line x1="600" y1="260" x2="800" y2="210" stroke="#ff6b35" stroke-width="0.8"/>
    <circle cx="600" cy="260" r="3" fill="#ff6b35"/>
    <text x="810" y="215" fill="#ff6b35">COMBUSTION CHAMBER</text>

    <!-- Label 3 -->
    <line x1="600" y1="330" x2="800" y2="270" stroke="#4ecdc4" stroke-width="0.8"/>
    <circle cx="600" cy="330" r="3" fill="#4ecdc4"/>
    <text x="810" y="275" fill="#4ecdc4">PISTON ASSEMBLY</text>

    <!-- Label 4 -->
    <line x1="700" y1="400" x2="800" y2="330" stroke="#ffd93d" stroke-width="0.8"/>
    <circle cx="730" cy="400" r="3" fill="#ffd93d"/>
    <text x="810" y="335" fill="#ffd93d">CRANKSHAFT MAIN</text>

    <!-- Label 5 -->
    <line x1="680" y1="455" x2="800" y2="390" stroke="#c4b5fd" stroke-width="0.8"/>
    <circle cx="680" cy="455" r="3" fill="#c4b5fd"/>
    <text x="810" y="395" fill="#c4b5fd">FLYWHEEL OUTPUT</text>

    <!-- Label 6 -->
    <line x1="460" y1="520" x2="800" y2="450" stroke="#a8e06c" stroke-width="0.8"/>
    <circle cx="460" cy="520" r="3" fill="#a8e06c"/>
    <text x="810" y="455" fill="#a8e06c">LUBRICATION SYSTEM</text>
  </g>

  <!-- Specifications box -->
  <rect x="800" y="480" width="280" height="100" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="3"/>
  <text x="940" y="500" fill="white" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">SPECIFICATIONS</text>
  <line x1="800" y1="508" x2="1080" y2="508" stroke="#6eaadc" stroke-width="0.5"/>
  <text x="815" y="525" fill="#6eaadc" font-family="monospace" font-size="9">TYPE: INLINE-3 ELEMENT</text>
  <text x="815" y="540" fill="#6eaadc" font-family="monospace" font-size="9">DISPLACEMENT: INFINITE cc</text>
  <text x="815" y="555" fill="#6eaadc" font-family="monospace" font-size="9">OUTPUT: NEW ELEMENTS/CYCLE</text>
  <text x="815" y="570" fill="#6eaadc" font-family="monospace" font-size="9">COOLING: WATER ELEMENT</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#ff6b35" stroke-width="2" fill="none"/>

  <rect x="1100" y="580" width="160" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="1180" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-ENG-008</text>
</svg>