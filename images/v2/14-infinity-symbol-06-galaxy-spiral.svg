<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="galaxy1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#ff6b35" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#4ecdc4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="galaxy2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#c4b5fd" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#ff6b35" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="galaxyGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nebulaBlur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- Deep field background stars -->
  <g opacity="0.4">
    <circle cx="50" cy="80" r="0.6" fill="#fff"/><circle cx="130" cy="200" r="0.8" fill="#fff"/>
    <circle cx="210" cy="50" r="0.5" fill="#fff"/><circle cx="310" cy="500" r="0.7" fill="#fff"/>
    <circle cx="1200" cy="100" r="0.6" fill="#fff"/><circle cx="1100" cy="400" r="0.5" fill="#fff"/>
    <circle cx="80" cy="450" r="0.7" fill="#fff"/><circle cx="1230" cy="550" r="0.6" fill="#fff"/>
    <circle cx="600" cy="80" r="0.5" fill="#fff"/><circle cx="700" cy="520" r="0.6" fill="#fff"/>
    <circle cx="150" cy="350" r="0.4" fill="#ffd93d"/><circle cx="1150" cy="250" r="0.5" fill="#4ecdc4"/>
  </g>
  <!-- Nebula clouds -->
  <ellipse cx="420" cy="290" rx="200" ry="160" fill="url(#galaxy1)" filter="url(#nebulaBlur)"/>
  <ellipse cx="860" cy="290" rx="200" ry="160" fill="url(#galaxy2)" filter="url(#nebulaBlur)"/>
  <!-- Connection bridge nebula -->
  <ellipse cx="640" cy="290" rx="100" ry="60" fill="#c4b5fd" opacity="0.04" filter="url(#nebulaBlur)"/>
  <!-- Left galaxy - spiral arms -->
  <g filter="url(#galaxyGlow)">
    <!-- Arm 1 -->
    <path d="M420,290 C420,240 460,210 490,220 C520,230 530,260 510,280 C490,300 460,310 450,330 C440,350 450,380 480,385 C510,390 540,370 550,340 C560,310 570,290 600,280" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0.5"/>
    <!-- Arm 2 -->
    <path d="M420,290 C420,340 380,370 350,360 C320,350 310,320 330,300 C350,280 380,270 390,250 C400,230 390,200 360,195 C330,190 300,210 290,240 C280,270 270,290 240,300" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.5"/>
    <!-- Star clusters along arms -->
    <circle cx="490" cy="225" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="510" cy="275" r="1.5" fill="#c4b5fd" opacity="0.7"/>
    <circle cx="470" cy="345" r="1.8" fill="#ffd93d" opacity="0.6"/>
    <circle cx="350" cy="355" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="335" cy="305" r="1.5" fill="#ff6b35" opacity="0.6"/>
    <circle cx="380" cy="240" r="1.8" fill="#fff" opacity="0.7"/>
    <circle cx="350" cy="200" r="1.2" fill="#ffd93d" opacity="0.5"/>
    <!-- Core -->
    <circle cx="420" cy="290" r="12" fill="#fff" opacity="0.15"/>
    <circle cx="420" cy="290" r="6" fill="#fff" opacity="0.4"/>
    <circle cx="420" cy="290" r="2" fill="#fff" opacity="0.9"/>
  </g>
  <!-- Right galaxy - spiral arms -->
  <g filter="url(#galaxyGlow)">
    <!-- Arm 1 -->
    <path d="M860,290 C860,240 900,210 930,220 C960,230 970,260 950,280 C930,300 900,310 890,330 C880,350 890,380 920,385 C950,390 980,370 990,340 C1000,310 1010,290 1040,280" fill="none" stroke="#4ecdc4" stroke-width="3" opacity="0.5"/>
    <!-- Arm 2 -->
    <path d="M860,290 C860,340 820,370 790,360 C760,350 750,320 770,300 C790,280 820,270 830,250 C840,230 830,200 800,195 C770,190 740,210 730,240 C720,270 710,290 680,300" fill="none" stroke="#a8e06c" stroke-width="3" opacity="0.5"/>
    <!-- Star clusters -->
    <circle cx="930" cy="225" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="950" cy="275" r="1.5" fill="#4ecdc4" opacity="0.7"/>
    <circle cx="910" cy="345" r="1.8" fill="#ffd93d" opacity="0.6"/>
    <circle cx="790" cy="355" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="775" cy="305" r="1.5" fill="#a8e06c" opacity="0.6"/>
    <circle cx="820" cy="240" r="1.8" fill="#fff" opacity="0.7"/>
    <circle cx="790" cy="200" r="1.2" fill="#ffd93d" opacity="0.5"/>
    <!-- Core -->
    <circle cx="860" cy="290" r="12" fill="#fff" opacity="0.15"/>
    <circle cx="860" cy="290" r="6" fill="#fff" opacity="0.4"/>
    <circle cx="860" cy="290" r="2" fill="#fff" opacity="0.9"/>
  </g>
  <!-- Gravitational bridge stars -->
  <g opacity="0.5">
    <circle cx="620" cy="282" r="1.5" fill="#c4b5fd"/>
    <circle cx="640" cy="278" r="1" fill="#fff"/>
    <circle cx="660" cy="282" r="1.5" fill="#4ecdc4"/>
    <circle cx="640" cy="298" r="1.2" fill="#ffd93d"/>
  </g>
  <!-- Infinity path outline (subtle) -->
  <path d="M260,290 C260,175 380,135 460,195 C520,240 565,280 640,280 C715,280 760,240 820,195 C900,135 1020,175 1020,290 C1020,405 900,445 820,385 C760,340 715,300 640,300 C565,300 520,340 460,385 C380,445 260,405 260,290Z" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.1" stroke-dasharray="2,8"/>
  <!-- Title -->
  <text x="640" y="560" text-anchor="middle" font-family="'Courier New', monospace" font-size="38" font-weight="bold" fill="#ffffff" letter-spacing="14" opacity="0.85">INFINITE CRAFT</text>
  <text x="640" y="560" text-anchor="middle" font-family="'Courier New', monospace" font-size="38" font-weight="bold" fill="#c4b5fd" letter-spacing="14" opacity="0.15">INFINITE CRAFT</text>
</svg>