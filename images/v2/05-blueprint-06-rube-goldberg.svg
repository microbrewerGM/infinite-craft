<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>

  <!-- Title -->
  <text x="640" y="55" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="67" x2="980" y2="67" stroke="#ffd93d" stroke-width="2"/>
  <text x="640" y="87" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">CHAIN REACTION MACHINE</text>

  <!-- Step 1: Ball drop -->
  <circle cx="100" cy="130" r="12" fill="#ff6b35" opacity="0.8"/>
  <text x="100" y="110" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">FIRE</text>
  <!-- Ramp 1 -->
  <line x1="90" y1="145" x2="220" y2="200" stroke="#6eaadc" stroke-width="3"/>
  <!-- Ball rolling indicator -->
  <path d="M 120 155 L 140 165 L 160 175 L 180 185" fill="none" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,5"/>

  <!-- Step 2: Lever -->
  <g transform="translate(230,210)">
    <circle cx="0" cy="20" r="8" fill="none" stroke="#ffd93d" stroke-width="2"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#ffd93d" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="12" stroke="#ffd93d" stroke-width="2"/>
    <text x="0" y="45" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">LEVER</text>
  </g>

  <!-- Step 2: Catapult action -->
  <circle cx="280" cy="195" r="10" fill="#4ecdc4" opacity="0.8"/>
  <text x="280" y="183" fill="#4ecdc4" font-family="monospace" font-size="9" text-anchor="middle">WATER</text>
  <!-- Arc path -->
  <path d="M 285 195 Q 340 120 400 180" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Step 3: Funnel -->
  <polygon points="370,170 430,170 420,200 380,200" fill="none" stroke="#a8e06c" stroke-width="2"/>
  <line x1="400" y1="200" x2="400" y2="240" stroke="#a8e06c" stroke-width="2"/>
  <text x="400" y="165" fill="#a8e06c" font-family="monospace" font-size="8" text-anchor="middle">FUNNEL</text>

  <!-- Step 4: Dominoes -->
  <rect x="390" y="250" width="8" height="35" fill="none" stroke="#c4b5fd" stroke-width="1.5" transform="rotate(-5,394,267)"/>
  <rect x="410" y="250" width="8" height="35" fill="none" stroke="#c4b5fd" stroke-width="1.5" transform="rotate(-10,414,267)"/>
  <rect x="430" y="250" width="8" height="35" fill="none" stroke="#c4b5fd" stroke-width="1.5" transform="rotate(-15,434,267)"/>
  <rect x="450" y="250" width="8" height="35" fill="none" stroke="#c4b5fd" stroke-width="1.5" transform="rotate(-20,454,267)"/>
  <rect x="470" y="250" width="8" height="35" fill="none" stroke="#c4b5fd" stroke-width="1.5" transform="rotate(-25,474,267)"/>
  <text x="434" y="300" fill="#c4b5fd" font-family="monospace" font-size="8" text-anchor="middle">DOMINOES</text>

  <!-- Step 5: Wheel and axle -->
  <g transform="translate(540,270)">
    <circle r="30" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <circle r="8" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ff6b35" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#ff6b35" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="0" y="45" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">WHEEL</text>
  </g>

  <!-- Rope from wheel -->
  <path d="M 570 270 Q 610 270 620 310 Q 630 350 660 350" fill="none" stroke="#ffd93d" stroke-width="1.5"/>

  <!-- Step 6: Weight drops -->
  <rect x="650" y="340" width="30" height="30" fill="none" stroke="#a8e06c" stroke-width="2"/>
  <text x="665" y="360" fill="#a8e06c" font-family="monospace" font-size="10" text-anchor="middle">W</text>
  <line x1="665" y1="370" x2="665" y2="420" stroke="#a8e06c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="659,410 665,425 671,410" fill="#a8e06c" opacity="0.6"/>
  <text x="665" y="440" fill="#a8e06c" font-family="monospace" font-size="8" text-anchor="middle">WEIGHT</text>

  <!-- Step 7: Spring launch -->
  <g transform="translate(720,420)">
    <path d="M 0,0 L 10,-10 L -10,-20 L 10,-30 L -10,-40 L 10,-50 L 0,-60" fill="none" stroke="#4ecdc4" stroke-width="2"/>
    <text x="25" y="-25" fill="#4ecdc4" font-family="monospace" font-size="8">SPRING</text>
  </g>

  <!-- Launched ball arc -->
  <circle cx="720" cy="340" r="10" fill="#a8e06c" opacity="0.6"/>
  <path d="M 725 335 Q 800 200 900 300" fill="none" stroke="#a8e06c" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Step 8: Bucket/Seesaw -->
  <g transform="translate(900,310)">
    <polygon points="-20,0 20,0 15,20 -15,20" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <text x="0" y="15" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">CUP</text>
    <line x1="0" y1="20" x2="0" y2="40" stroke="#ffd93d" stroke-width="2"/>
    <line x1="-40" y1="40" x2="40" y2="40" stroke="#ffd93d" stroke-width="3"/>
    <circle cx="0" cy="50" r="6" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
  </g>

  <!-- Step 9: Ramp down -->
  <line x1="940" y1="340" x2="1050" y2="410" stroke="#6eaadc" stroke-width="3"/>
  <circle cx="980" cy="365" r="8" fill="#c4b5fd" opacity="0.6"/>
  <path d="M 985 360 Q 1000 375 1020 390" fill="none" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Step 10: Final combination -->
  <g transform="translate(1080,430)">
    <rect x="-50" y="-30" width="100" height="60" fill="none" stroke="#ff6b35" stroke-width="2.5" rx="8"/>
    <text x="0" y="-10" fill="white" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">COMBINE!</text>
    <text x="0" y="10" fill="#ffd93d" font-family="monospace" font-size="10" text-anchor="middle">NEW ELEMENT</text>
    <!-- Explosion lines -->
    <line x1="-60" y1="-40" x2="-75" y2="-55" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="60" y1="-40" x2="75" y2="-55" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="-65" y1="0" x2="-80" y2="0" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="65" y1="0" x2="80" y2="0" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="-60" y1="40" x2="-75" y2="55" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="60" y1="40" x2="75" y2="55" stroke="#ffd93d" stroke-width="1.5"/>
  </g>

  <!-- Step numbers -->
  <g fill="#ffd93d" font-family="monospace" font-size="18" font-weight="bold">
    <text x="100" y="170"><tspan fill="#6eaadc" font-size="10">STEP </tspan>1</text>
    <text x="280" y="245"><tspan fill="#6eaadc" font-size="10">STEP </tspan>2</text>
    <text x="400" y="255"><tspan fill="#6eaadc" font-size="10">STEP </tspan>3</text>
    <text x="540" y="330"><tspan fill="#6eaadc" font-size="10">STEP </tspan>4</text>
    <text x="665" y="460"><tspan fill="#6eaadc" font-size="10">STEP </tspan>5</text>
    <text x="810" y="275"><tspan fill="#6eaadc" font-size="10">STEP </tspan>6</text>
    <text x="1080" y="510"><tspan fill="#6eaadc" font-size="10">STEP </tspan>7</text>
  </g>

  <!-- Decorative trajectory lines -->
  <path d="M 50 100 Q 640 550 1200 100" fill="none" stroke="#6eaadc" stroke-width="0.5" opacity="0.3"/>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 55 M 20 20 L 55 20" stroke="#ffd93d" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 55 M 1260 20 L 1225 20" stroke="#ffd93d" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 585 M 20 620 L 55 620" stroke="#ffd93d" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 585 M 1260 620 L 1225 620" stroke="#ffd93d" stroke-width="2" fill="none"/>

  <!-- Info block -->
  <rect x="900" y="575" width="360" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="1080" y="600" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-GOLDBERG-006</text>
</svg>