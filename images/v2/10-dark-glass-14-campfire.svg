<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="cfGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cfSoft">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="cfEmber">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="fireAmbient" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ff6b35" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="30%" stop-color="#ffd93d"/>
      <stop offset="70%" stop-color="#ffd93d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#050403"/>

  <!-- Warm ambient light from fire -->
  <rect width="1280" height="640" fill="url(#fireAmbient)"/>
  <ellipse cx="640" cy="480" rx="300" ry="120" fill="#ff6b35" opacity="0.04" filter="url(#cfSoft)"/>

  <!-- Stars -->
  <circle cx="100" cy="60" r="1" fill="white" opacity="0.6"/>
  <circle cx="250" cy="30" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="420" cy="80" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="580" cy="40" r="0.7" fill="white" opacity="0.4"/>
  <circle cx="750" cy="70" r="1" fill="white" opacity="0.55"/>
  <circle cx="900" cy="25" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="1050" cy="55" r="1.1" fill="white" opacity="0.45"/>
  <circle cx="1200" cy="40" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="180" cy="120" r="0.6" fill="white" opacity="0.3"/>
  <circle cx="1100" cy="100" r="0.7" fill="white" opacity="0.3"/>

  <!-- Log pile -->
  <line x1="560" y1="510" x2="720" y2="490" stroke="#1a1210" stroke-width="18" stroke-linecap="round"/>
  <line x1="580" y1="500" x2="700" y2="510" stroke="#1c1412" stroke-width="14" stroke-linecap="round"/>
  <line x1="600" y1="515" x2="680" y2="495" stroke="#181010" stroke-width="12" stroke-linecap="round"/>

  <!-- Fire flames -->
  <g filter="url(#cfGlow)">
    <path d="M640,490 Q620,440 630,400 Q635,370 640,360 Q645,370 650,400 Q660,440 640,490Z" fill="url(#flame)" opacity="0.9"/>
    <path d="M620,495 Q610,460 615,430 Q618,415 620,410 Q625,420 628,440 Q635,470 620,495Z" fill="url(#flame)" opacity="0.7"/>
    <path d="M660,492 Q665,455 662,425 Q660,412 658,408 Q655,418 654,435 Q650,465 660,492Z" fill="url(#flame)" opacity="0.75"/>
    <path d="M635,488 Q625,450 628,420 Q630,410 632,405 Q636,415 638,430 Q642,460 635,488Z" fill="#ffd93d" opacity="0.5"/>
    <path d="M650,486 Q655,450 652,425 Q650,415 648,412 Q645,420 644,435 Q642,458 650,486Z" fill="#ffd93d" opacity="0.45"/>
  </g>

  <!-- Rising embers/sparks -->
  <circle cx="635" cy="340" r="1.5" fill="#ff6b35" opacity="0.8" filter="url(#cfEmber)"/>
  <circle cx="650" cy="300" r="1.2" fill="#ffd93d" opacity="0.7" filter="url(#cfEmber)"/>
  <circle cx="625" cy="270" r="1" fill="#ff6b35" opacity="0.6" filter="url(#cfEmber)"/>
  <circle cx="660" cy="240" r="0.8" fill="#ffd93d" opacity="0.5" filter="url(#cfEmber)"/>
  <circle cx="615" cy="210" r="0.7" fill="#ff6b35" opacity="0.4" filter="url(#cfEmber)"/>
  <circle cx="645" cy="180" r="0.6" fill="#ffd93d" opacity="0.35" filter="url(#cfEmber)"/>
  <circle cx="655" cy="150" r="0.5" fill="#ff6b35" opacity="0.25" filter="url(#cfEmber)"/>
  <circle cx="630" cy="130" r="0.4" fill="#ffd93d" opacity="0.2" filter="url(#cfEmber)"/>
  <circle cx="640" cy="100" r="0.3" fill="#ff6b35" opacity="0.15" filter="url(#cfEmber)"/>

  <!-- Scattered embers drifting -->
  <circle cx="600" cy="280" r="1" fill="#ff6b35" opacity="0.5" filter="url(#cfEmber)"/>
  <circle cx="680" cy="260" r="0.8" fill="#ffd93d" opacity="0.45" filter="url(#cfEmber)"/>
  <circle cx="590" cy="200" r="0.7" fill="#ff6b35" opacity="0.35" filter="url(#cfEmber)"/>
  <circle cx="700" cy="220" r="0.6" fill="#ffd93d" opacity="0.3" filter="url(#cfEmber)"/>
  <circle cx="575" cy="160" r="0.5" fill="#ff6b35" opacity="0.2" filter="url(#cfEmber)"/>
  <circle cx="710" cy="170" r="0.5" fill="#ffd93d" opacity="0.2" filter="url(#cfEmber)"/>

  <!-- Element emojis arranged around the fire -->
  <text x="500" y="460" font-size="36" text-anchor="middle" opacity="0.6">🔥</text>
  <text x="550" y="530" font-size="32" text-anchor="middle" opacity="0.5">💧</text>
  <text x="730" y="530" font-size="34" text-anchor="middle" opacity="0.55">🌍</text>
  <text x="780" y="460" font-size="32" text-anchor="middle" opacity="0.5">💨</text>

  <!-- Ground -->
  <ellipse cx="640" cy="530" rx="200" ry="15" fill="#0a0806" opacity="0.5"/>

  <!-- Title -->
  <text x="640" y="590" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#ffd93d" text-anchor="middle" letter-spacing="16" opacity="0.85" filter="url(#cfGlow)">INFINITE CRAFT</text>
</svg>