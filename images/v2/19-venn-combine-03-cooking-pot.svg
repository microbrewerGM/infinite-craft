<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="steam-glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft03">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="pot-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a4a"/>
      <stop offset="100%" stop-color="#1a1a2a"/>
    </linearGradient>
    <radialGradient id="pot-glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a8e06c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>
  <ellipse cx="640" cy="350" rx="400" ry="200" fill="url(#pot-glow)" opacity="0.3"/>

  <!-- Pot body -->
  <path d="M 420 350 Q 420 480 530 500 L 750 500 Q 860 480 860 350 Z" fill="url(#pot-body)" stroke="#555" stroke-width="2"/>
  <!-- Pot rim -->
  <ellipse cx="640" cy="350" rx="225" ry="40" fill="#2a2a3a" stroke="#666" stroke-width="2"/>
  <!-- Pot handles -->
  <path d="M 418 380 Q 370 380 370 410 Q 370 440 420 440" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <path d="M 862 380 Q 910 380 910 410 Q 910 440 860 440" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round"/>

  <!-- Liquid surface shimmer -->
  <ellipse cx="640" cy="352" rx="218" ry="36" fill="#a8e06c" opacity="0.15"/>

  <!-- Left ingredient falling — orange cube -->
  <g transform="translate(480, 200) rotate(-15)">
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="#ff6b35" opacity="0.85"/>
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <!-- Trail -->
    <line x1="0" y1="-25" x2="-10" y2="-80" stroke="#ff6b35" stroke-width="2" opacity="0.4" stroke-dasharray="6 4"/>
    <line x1="5" y1="-25" x2="0" y2="-90" stroke="#ff6b35" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4"/>
  </g>

  <!-- Right ingredient falling — teal sphere -->
  <g transform="translate(780, 180)">
    <circle cx="0" cy="0" r="25" fill="#4ecdc4" opacity="0.85"/>
    <circle cx="-8" cy="-8" r="8" fill="#fff" opacity="0.2"/>
    <!-- Trail -->
    <line x1="0" y1="-30" x2="8" y2="-90" stroke="#4ecdc4" stroke-width="2" opacity="0.4" stroke-dasharray="6 4"/>
    <line x1="-5" y1="-30" x2="0" y2="-95" stroke="#4ecdc4" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4"/>
  </g>

  <!-- Center ingredient — purple star -->
  <g transform="translate(640, 260)">
    <polygon points="0,-20 6,-8 20,-6 10,4 12,18 0,12 -12,18 -10,4 -20,-6 -6,-8" fill="#c4b5fd" opacity="0.8"/>
    <line x1="0" y1="-25" x2="2" y2="-60" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4" stroke-dasharray="5 3"/>
  </g>

  <!-- Steam wisps -->
  <path d="M 560 320 Q 550 280 560 240 Q 570 200 555 160" fill="none" stroke="#fff" stroke-width="2" opacity="0.15"/>
  <path d="M 640 310 Q 635 260 645 220 Q 650 180 640 140" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.12"/>
  <path d="M 720 320 Q 730 280 720 240 Q 710 200 725 160" fill="none" stroke="#fff" stroke-width="2" opacity="0.15"/>
  <path d="M 590 325 Q 580 290 590 250 Q 600 215 585 180" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.1"/>
  <path d="M 690 315 Q 695 275 685 235 Q 680 200 695 170" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.1"/>

  <!-- Splash particles inside pot -->
  <circle cx="580" cy="340" r="4" fill="#ffd93d" opacity="0.5"/>
  <circle cx="700" cy="345" r="3" fill="#a8e06c" opacity="0.6"/>
  <circle cx="640" cy="335" r="5" fill="#fff" opacity="0.3"/>
  <circle cx="550" cy="348" r="2.5" fill="#ff6b35" opacity="0.4"/>
  <circle cx="730" cy="342" r="3" fill="#4ecdc4" opacity="0.4"/>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#a8e06c" opacity="0.6" letter-spacing="4">COOKING POT</text>
</svg>