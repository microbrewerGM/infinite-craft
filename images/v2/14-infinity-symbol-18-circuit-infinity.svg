<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="circuitGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ledGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="pcbGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <circle cx="10" cy="10" r="0.5" fill="#1a3a1a" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- PCB substrate feel -->
  <rect x="100" y="80" width="1080" height="480" rx="10" fill="#0a120a" opacity="0.5"/>
  <rect x="100" y="80" width="1080" height="480" rx="10" fill="url(#pcbGrid)"/>
  <!-- Main circuit trace - infinity shape (right-angle routed style) -->
  <!-- Top-left segment -->
  <path d="M270,300 L270,220 L320,180 L420,180 L480,220 L520,260 L580,280 L640,280" fill="none" stroke="#a8e06c" stroke-width="4" opacity="0.7" filter="url(#circuitGlow)"/>
  <!-- Top-right segment -->
  <path d="M640,280 L700,280 L760,260 L800,220 L860,180 L960,180 L1010,220 L1010,300" fill="none" stroke="#a8e06c" stroke-width="4" opacity="0.7" filter="url(#circuitGlow)"/>
  <!-- Bottom-right segment -->
  <path d="M1010,300 L1010,380 L960,420 L860,420 L800,380 L760,340 L700,320 L640,320" fill="none" stroke="#a8e06c" stroke-width="4" opacity="0.6" filter="url(#circuitGlow)"/>
  <!-- Bottom-left segment -->
  <path d="M640,320 L580,320 L520,340 L480,380 L420,420 L320,420 L270,380 L270,300" fill="none" stroke="#a8e06c" stroke-width="4" opacity="0.6" filter="url(#circuitGlow)"/>
  <!-- Secondary parallel trace -->
  <path d="M275,300 L275,225 L323,185 L417,185 L478,224 L518,264 L578,283 L640,283" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
  <path d="M640,283 L702,283 L762,264 L802,224 L863,185 L957,185 L1005,225 L1005,300" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
  <path d="M1005,300 L1005,375 L957,415 L863,415 L802,376 L762,336 L702,317 L640,317" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.25"/>
  <path d="M640,317 L578,317 L518,336 L478,376 L417,415 L323,415 L275,375 L275,300" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.25"/>
  <!-- Component pads (via holes) at trace junctions -->
  <g fill="none" stroke-width="1.5" opacity="0.6">
    <circle cx="270" cy="300" r="6" stroke="#ffd93d" fill="#0a0a0a"/>
    <circle cx="270" cy="300" r="3" fill="#ffd93d" opacity="0.4"/>
    <circle cx="320" cy="180" r="5" stroke="#ff6b35" fill="#0a0a0a"/>
    <circle cx="320" cy="180" r="2.5" fill="#ff6b35" opacity="0.4"/>
    <circle cx="420" cy="180" r="5" stroke="#c4b5fd" fill="#0a0a0a"/>
    <circle cx="420" cy="180" r="2.5" fill="#c4b5fd" opacity="0.4"/>
    <circle cx="640" cy="280" r="6" stroke="#4ecdc4" fill="#0a0a0a"/>
    <circle cx="640" cy="280" r="3" fill="#4ecdc4" opacity="0.4"/>
    <circle cx="640" cy="320" r="6" stroke="#ff6b35" fill="#0a0a0a"/>
    <circle cx="640" cy="320" r="3" fill="#ff6b35" opacity="0.4"/>
    <circle cx="860" cy="180" r="5" stroke="#ffd93d" fill="#0a0a0a"/>
    <circle cx="860" cy="180" r="2.5" fill="#ffd93d" opacity="0.4"/>
    <circle cx="960" cy="180" r="5" stroke="#a8e06c" fill="#0a0a0a"/>
    <circle cx="960" cy="180" r="2.5" fill="#a8e06c" opacity="0.4"/>
    <circle cx="1010" cy="300" r="6" stroke="#c4b5fd" fill="#0a0a0a"/>
    <circle cx="1010" cy="300" r="3" fill="#c4b5fd" opacity="0.4"/>
    <circle cx="320" cy="420" r="5" stroke="#4ecdc4" fill="#0a0a0a"/>
    <circle cx="320" cy="420" r="2.5" fill="#4ecdc4" opacity="0.4"/>
    <circle cx="420" cy="420" r="5" stroke="#ff6b35" fill="#0a0a0a"/>
    <circle cx="420" cy="420" r="2.5" fill="#ff6b35" opacity="0.4"/>
    <circle cx="860" cy="420" r="5" stroke="#a8e06c" fill="#0a0a0a"/>
    <circle cx="860" cy="420" r="2.5" fill="#a8e06c" opacity="0.4"/>
    <circle cx="960" cy="420" r="5" stroke="#ffd93d" fill="#0a0a0a"/>
    <circle cx="960" cy="420" r="2.5" fill="#ffd93d" opacity="0.4"/>
  </g>
  <!-- IC chip at center -->
  <rect x="618" y="288" width="44" height="24" rx="2" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <g stroke="#a8e06c" stroke-width="0.8" opacity="0.5">
    <line x1="622" y1="288" x2="622" y2="282"/><line x1="630" y1="288" x2="630" y2="282"/>
    <line x1="638" y1="288" x2="638" y2="282"/><line x1="646" y1="288" x2="646" y2="282"/>
    <line x1="654" y1="288" x2="654" y2="282"/>
    <line x1="622" y1="312" x2="622" y2="318"/><line x1="630" y1="312" x2="630" y2="318"/>
    <line x1="638" y1="312" x2="638" y2="318"/><line x1="646" y1="312" x2="646" y2="318"/>
    <line x1="654" y1="312" x2="654" y2="318"/>
  </g>
  <circle cx="625" cy="295" r="2" fill="#a8e06c" opacity="0.3"/>
  <!-- Resistor symbols on traces -->
  <g stroke="#888" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M345,180 L350,175 L356,185 L362,175 L368,185 L374,175 L380,180"/>
    <path d="M900,180 L905,175 L911,185 L917,175 L923,185 L929,175 L935,180"/>
    <path d="M345,420 L350,415 L356,425 L362,415 L368,425 L374,415 L380,420"/>
    <path d="M900,420 L905,415 L911,425 L917,415 L923,425 L929,415 L935,420"/>
  </g>
  <!-- Capacitor symbols -->
  <g stroke="#4ecdc4" stroke-width="1.5" opacity="0.3">
    <line x1="495" y1="268" x2="495" y2="252"/><line x1="505" y1="268" x2="505" y2="252"/>
    <line x1="775" y1="268" x2="775" y2="252"/><line x1="785" y1="268" x2="785" y2="252"/>
  </g>
  <!-- LED indicators (glowing dots) -->
  <g filter="url(#ledGlow)">
    <circle cx="480" cy="220" r="4" fill="#ff6b35" opacity="0.8"/>
    <circle cx="800" cy="220" r="4" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="480" cy="380" r="4" fill="#c4b5fd" opacity="0.6"/>
    <circle cx="800" cy="380" r="4" fill="#ffd93d" opacity="0.6"/>
  </g>
  <!-- Ground traces -->
  <g stroke="#333" stroke-width="1" opacity="0.4">
    <path d="M270,310 L250,310 M246,305 L246,315 M242,308 L242,312 M239,310 L239,310"/>
    <path d="M1010,310 L1030,310 M1034,305 L1034,315 M1038,308 L1038,312 M1041,310 L1041,310"/>
  </g>
  <!-- Title -->
  <text x="640" y="560" text-anchor="middle" font-family="'Courier New', monospace" font-size="38" font-weight="bold" fill="#a8e06c" letter-spacing="14" opacity="0.8">INFINITE CRAFT</text>
</svg>