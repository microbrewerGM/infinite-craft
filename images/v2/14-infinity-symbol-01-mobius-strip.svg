<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="mobius1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="25%" stop-color="#4ecdc4"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="75%" stop-color="#a8e06c"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="mobius2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="50%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- Mobius strip - back face -->
  <path d="M280,320 C280,200 400,160 480,220 C540,260 560,300 640,300 C720,300 740,260 800,220 C880,160 1000,200 1000,320 C1000,440 880,480 800,420 C740,380 720,340 640,340 C560,340 540,380 480,420 C400,480 280,440 280,320Z" fill="none" stroke="#4ecdc4" stroke-width="45" opacity="0.2" filter="url(#shadow1)"/>
  <!-- Mobius strip - twist surface left -->
  <path d="M380,270 C420,230 470,220 510,250 C540,270 560,300 590,310" fill="none" stroke="url(#mobius2)" stroke-width="40" stroke-linecap="round" opacity="0.4"/>
  <!-- Mobius strip - main band top -->
  <path d="M280,310 C280,195 405,155 485,215 C545,255 562,295 640,295 C718,295 735,255 795,215 C875,155 1000,195 1000,310" fill="none" stroke="url(#mobius1)" stroke-width="28" stroke-linecap="round" filter="url(#glow1)"/>
  <!-- Mobius strip - main band bottom -->
  <path d="M280,330 C280,445 405,485 485,425 C545,385 562,345 640,345 C718,345 735,385 795,425 C875,485 1000,445 1000,330" fill="none" stroke="url(#mobius1)" stroke-width="28" stroke-linecap="round" filter="url(#glow1)"/>
  <!-- Twist highlights -->
  <path d="M620,295 C630,295 640,298 650,305 C660,312 665,325 670,340" fill="none" stroke="#fff" stroke-width="3" opacity="0.7"/>
  <path d="M610,345 C620,345 630,342 640,335 C650,328 655,315 660,300" fill="none" stroke="#fff" stroke-width="3" opacity="0.7"/>
  <!-- Edge highlight strips for 3D effect -->
  <path d="M300,315 C300,210 415,170 490,225 C548,263 564,298 640,298" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <path d="M640,298 C716,298 732,263 790,225 C865,170 980,210 980,315" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <!-- Surface shading strips -->
  <path d="M310,320 C310,215 420,178 495,230 C550,265 565,300 640,300" fill="none" stroke="#c4b5fd" stroke-width="8" opacity="0.15"/>
  <path d="M640,300 C715,300 730,265 785,230 C860,178 970,215 970,320" fill="none" stroke="#ff6b35" stroke-width="8" opacity="0.15"/>
  <path d="M310,320 C310,425 420,462 495,410 C550,375 565,340 640,340" fill="none" stroke="#ff6b35" stroke-width="8" opacity="0.15"/>
  <path d="M640,340 C715,340 730,375 785,410 C860,462 970,425 970,320" fill="none" stroke="#c4b5fd" stroke-width="8" opacity="0.15"/>
  <!-- Accent dots at key points -->
  <circle cx="280" cy="320" r="6" fill="#ff6b35" filter="url(#glow1)"/>
  <circle cx="1000" cy="320" r="6" fill="#4ecdc4" filter="url(#glow1)"/>
  <circle cx="640" cy="295" r="5" fill="#ffd93d" filter="url(#glow1)"/>
  <circle cx="640" cy="345" r="5" fill="#a8e06c" filter="url(#glow1)"/>
  <circle cx="460" cy="230" r="4" fill="#c4b5fd" filter="url(#glow1)"/>
  <circle cx="820" cy="230" r="4" fill="#c4b5fd" filter="url(#glow1)"/>
  <circle cx="460" cy="410" r="4" fill="#ffd93d" filter="url(#glow1)"/>
  <circle cx="820" cy="410" r="4" fill="#ffd93d" filter="url(#glow1)"/>
  <!-- Title -->
  <text x="640" y="565" text-anchor="middle" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="12" opacity="0.9">INFINITE CRAFT</text>
  <text x="640" y="565" text-anchor="middle" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="url(#mobius1)" letter-spacing="12" opacity="0.3">INFINITE CRAFT</text>
</svg>