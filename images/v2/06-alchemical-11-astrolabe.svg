<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg11" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#14100a"/>
      <stop offset="100%" stop-color="#080604"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="30%" stop-color="#b8944a"/>
      <stop offset="60%" stop-color="#d4b87a"/>
      <stop offset="100%" stop-color="#a8843a"/>
    </linearGradient>
    <filter id="glow11">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg11)"/>
  <g transform="translate(640,320)">
    <!-- Main plate (mater) -->
    <circle r="270" fill="none" stroke="url(#brass)" stroke-width="3" opacity="0.7"/>
    <circle r="265" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
    <circle r="258" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
    <!-- Throne/suspension ring at top -->
    <circle cx="0" cy="-280" r="25" fill="none" stroke="#c9a96e" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="-280" r="18" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.3"/>
    <!-- Degree markings around edge -->
    <g stroke="#c9a96e" stroke-width="0.5" opacity="0.4">
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(0,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(15,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(30,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(45,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(60,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(75,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(90,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(105,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(120,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(135,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(150,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(165,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(180,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(195,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(210,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(225,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(240,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(255,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(270,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(285,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(300,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(315,0,0)"/>
      <line x1="0" y1="-258" x2="0" y2="-270" transform="rotate(330,0,0)"/>
      <line x1="0" y1="-260" x2="0" y2="-268" transform="rotate(345,0,0)"/>
    </g>
    <!-- Tympanum - altitude circles -->
    <circle r="220" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
    <circle r="180" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
    <circle r="140" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
    <circle r="100" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
    <!-- Horizon line -->
    <line x1="-258" y1="0" x2="258" y2="0" stroke="#c9a96e" stroke-width="0.8" opacity="0.3"/>
    <!-- Meridian -->
    <line x1="0" y1="-258" x2="0" y2="258" stroke="#c9a96e" stroke-width="0.8" opacity="0.3"/>
    <!-- Rete (star pointer network) - ornate overlay -->
    <g fill="none" stroke="#ffd93d" stroke-width="1.2" opacity="0.5">
      <!-- Ecliptic circle, offset -->
      <circle cx="30" cy="-20" r="150"/>
      <!-- Star pointers -->
      <path d="M-100,-180 L-80,-160 L-110,-160 Z"/>
      <path d="M150,-120 L170,-100 L140,-100 Z"/>
      <path d="M-180,50 L-160,70 L-190,70 Z"/>
      <path d="M120,160 L140,180 L110,180 Z"/>
    </g>
    <!-- Star dots at pointer tips -->
    <g fill="#ffd93d" opacity="0.6" filter="url(#glow11)">
      <circle cx="-95" cy="-175" r="3"/>
      <circle cx="155" cy="-115" r="3"/>
      <circle cx="-175" cy="55" r="3"/>
      <circle cx="125" cy="165" r="3"/>
    </g>
    <!-- Element color accents -->
    <circle cx="0" cy="-230" r="4" fill="#ff6b35" opacity="0.4"/>
    <circle cx="230" cy="0" r="4" fill="#4ecdc4" opacity="0.4"/>
    <circle cx="0" cy="230" r="4" fill="#a8e06c" opacity="0.4"/>
    <circle cx="-230" cy="0" r="4" fill="#c4b5fd" opacity="0.4"/>
    <!-- Central pin -->
    <circle r="8" fill="#c9a96e" opacity="0.5"/>
    <circle r="4" fill="#ffd93d" opacity="0.3"/>
  </g>
  <!-- Title -->
  <text x="640" y="42" text-anchor="middle" font-family="serif" font-size="36" fill="url(#brass)" letter-spacing="10" filter="url(#glow11)">INFINITE CRAFT</text>
  <text x="640" y="630" text-anchor="middle" font-family="serif" font-size="10" fill="#c9a96e" opacity="0.4" letter-spacing="5">ASTROLABIUM INFINITUM</text>
</svg>