<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg13" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#180818"/>
      <stop offset="100%" stop-color="#08030a"/>
    </radialGradient>
    <filter id="glow13">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg13)"/>
  <g transform="translate(640,310)">
    <!-- Outer seal circles -->
    <circle r="260" fill="none" stroke="#c9a96e" stroke-width="2" opacity="0.4"/>
    <circle r="250" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.25"/>
    <circle r="240" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.3"/>
    <!-- Text around outer ring -->
    <g font-family="serif" font-size="10" fill="#c9a96e" opacity="0.3">
      <text transform="rotate(-80) translate(0,-245)" text-anchor="middle">IGNIS</text>
      <text transform="rotate(-40) translate(0,-245)" text-anchor="middle">AQUA</text>
      <text transform="rotate(0) translate(0,-245)" text-anchor="middle">TERRA</text>
      <text transform="rotate(40) translate(0,-245)" text-anchor="middle">AER</text>
      <text transform="rotate(80) translate(0,-245)" text-anchor="middle">SPIRITUS</text>
      <text transform="rotate(120) translate(0,-245)" text-anchor="middle">IGNIS</text>
      <text transform="rotate(160) translate(0,-245)" text-anchor="middle">AQUA</text>
      <text transform="rotate(200) translate(0,-245)" text-anchor="middle">TERRA</text>
      <text transform="rotate(240) translate(0,-245)" text-anchor="middle">AER</text>
    </g>
    <!-- Main sigil geometry -->
    <g fill="none" stroke-width="1.5" filter="url(#glow13)">
      <!-- Large outer heptagram (7-pointed star) -->
      <polygon points="0,-200 78,-152 171,-62 156,62 95,162 -95,162 -156,62 -171,-62 -78,-152" stroke="#c4b5fd" opacity="0.4"/>
      <!-- Inner connecting lines creating the sigil pattern -->
      <line x1="0" y1="-200" x2="156" y2="62" stroke="#ff6b35" opacity="0.35"/>
      <line x1="156" y1="62" x2="-171" y2="-62" stroke="#ff6b35" opacity="0.35"/>
      <line x1="-171" y1="-62" x2="95" y2="162" stroke="#ff6b35" opacity="0.35"/>
      <line x1="95" y1="162" x2="-78" y2="-152" stroke="#ff6b35" opacity="0.35"/>
      <line x1="-78" y1="-152" x2="171" y2="-62" stroke="#ff6b35" opacity="0.35"/>
      <line x1="171" y1="-62" x2="-95" y2="162" stroke="#ff6b35" opacity="0.35"/>
      <line x1="-95" y1="162" x2="78" y2="-152" stroke="#ff6b35" opacity="0.35"/>
      <line x1="78" y1="-152" x2="-156" y2="62" stroke="#ff6b35" opacity="0.35"/>
      <line x1="-156" y1="62" x2="0" y2="-200" stroke="#ff6b35" opacity="0.35"/>
    </g>
    <!-- Inner circles -->
    <circle r="130" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.3"/>
    <circle r="80" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.3"/>
    <!-- Central sigil mark -->
    <g stroke="#ffd93d" stroke-width="2" fill="none" filter="url(#glow13)" opacity="0.7">
      <line x1="0" y1="-50" x2="0" y2="50"/>
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <circle r="20"/>
      <line x1="-35" y1="-35" x2="35" y2="35"/>
      <line x1="-35" y1="35" x2="35" y2="-35"/>
    </g>
    <!-- Node circles at star points -->
    <g fill="none" stroke-width="1" opacity="0.5">
      <circle cx="0" cy="-200" r="6" stroke="#ff6b35"/>
      <circle cx="171" cy="-62" r="6" stroke="#4ecdc4"/>
      <circle cx="156" cy="62" r="6" stroke="#a8e06c"/>
      <circle cx="95" cy="162" r="6" stroke="#c4b5fd"/>
      <circle cx="-95" cy="162" r="6" stroke="#ffd93d"/>
      <circle cx="-156" cy="62" r="6" stroke="#ff6b35"/>
      <circle cx="-171" cy="-62" r="6" stroke="#4ecdc4"/>
      <circle cx="-78" cy="-152" r="6" stroke="#a8e06c"/>
      <circle cx="78" cy="-152" r="6" stroke="#c4b5fd"/>
    </g>
  </g>
  <!-- Title -->
  <text x="640" y="46" text-anchor="middle" font-family="serif" font-size="40" fill="#c9a96e" letter-spacing="12" filter="url(#glow13)">INFINITE CRAFT</text>
  <text x="640" y="628" text-anchor="middle" font-family="serif" font-size="10" fill="#c4b5fd" opacity="0.4" letter-spacing="6">SIGILLUM INFINITATIS</text>
</svg>