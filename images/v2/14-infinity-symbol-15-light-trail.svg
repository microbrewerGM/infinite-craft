  <path d="M638,313 C566,313 533,350 473,393 C388,458 258,418 258,298" fill="none" stroke="#4ecdc4" stroke-width="2.5" opacity="0.45" filter="url(#lightGlow)" stroke-linecap="round"/>
  <!-- Light trail 3 - Purple (another offset) -->
  <path d="M265,296 C265,176 395,136 480,201 C540,244 573,281 645,281" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0.6" filter="url(#medGlow)" stroke-linecap="round"/>
  <path d="M645,281 C717,281 750,244 810,201 C895,136 1025,176 1025,296" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0.55" filter="url(#medGlow)" stroke-linecap="round"/>
