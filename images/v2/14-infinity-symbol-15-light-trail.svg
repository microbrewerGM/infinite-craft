  <path d="M642,317 C570,317 537,354 477,397 C392,462 262,422 262,302" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.5" filter="url(#lightGlow)" stroke-linecap="round"/>
  <!-- Light trail 2 - Teal (slightly offset) -->
  <path d="M258,298 C258,178 388,138 473,203 C533,246 566,283 638,283" fill="none" stroke="#4ecdc4" stroke-width="4" opacity="0.7" filter="url(#lightGlow)" stroke-linecap="round"/>
  <path d="M638,283 C710,283 743,246 803,203 C888,138 1018,178 1018,298" fill="none" stroke="#4ecdc4" stroke-width="4" opacity="0.65" filter="url(#lightGlow)" stroke-linecap="round"/>
