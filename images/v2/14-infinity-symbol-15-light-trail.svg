    <circle cx="730" cy="260" r="1.2" fill="#ffd93d"/>
    <circle cx="850" cy="180" r="1" fill="#a8e06c"/>
    <circle cx="940" cy="200" r="1.5" fill="#ff6b35"/>
    <circle cx="970" cy="350" r="1" fill="#4ecdc4"/>
