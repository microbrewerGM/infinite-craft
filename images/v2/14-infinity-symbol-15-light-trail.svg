<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigLightGlow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="medGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- Long exposure background haze -->
  <path d="M260,300 C260,180 390,140 475,205 C535,248 568,285 640,285 C712,285 745,248 805,205 C890,140 1020,180 1020,300 C1020,420 890,460 805,395 C745,352 712,315 640,315 C568,315 535,352 475,395 C390,460 260,420 260,300Z" fill="none" stroke="#ff6b35" stroke-width="40" opacity="0.04" filter="url(#bigLightGlow)"/>
  <path d="M260,300 C260,180 390,140 475,205 C535,248 568,285 640,285 C712,285 745,248 805,205 C890,140 1020,180 1020,300 C1020,420 890,460 805,395 C745,352 712,315 640,315 C568,315 535,352 475,395 C390,460 260,420 260,300Z" fill="none" stroke="#4ecdc4" stroke-width="30" opacity="0.04" filter="url(#bigLightGlow)"/>
  <!-- Light trail 1 - Orange/red -->
