<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>

  <!-- Title -->
  <text x="640" y="55" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="67" x2="980" y2="67" stroke="#4ecdc4" stroke-width="2"/>
  <text x="640" y="87" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">CIRCUIT SCHEMATIC REV 2.4</text>

  <!-- IC Chip 1 - Main processor -->
  <rect x="200" y="200" width="180" height="240" fill="none" stroke="#4ecdc4" stroke-width="2"/>
  <text x="290" y="310" fill="#4ecdc4" font-family="monospace" font-size="16" text-anchor="middle">IC-CRAFT</text>
  <text x="290" y="330" fill="#4ecdc4" font-family="monospace" font-size="11" text-anchor="middle">ELEMENT</text>
  <text x="290" y="350" fill="#4ecdc4" font-family="monospace" font-size="11" text-anchor="middle">PROCESSOR</text>
  <!-- Pins left -->
  <line x1="160" y1="230" x2="200" y2="230" stroke="#ff6b35" stroke-width="2"/>
  <text x="155" y="234" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="end">FIRE_IN</text>
  <line x1="160" y1="270" x2="200" y2="270" stroke="#4ecdc4" stroke-width="2"/>
  <text x="155" y="274" fill="#4ecdc4" font-family="monospace" font-size="9" text-anchor="end">WATER_IN</text>
  <line x1="160" y1="310" x2="200" y2="310" stroke="#a8e06c" stroke-width="2"/>
  <text x="155" y="314" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="end">EARTH_IN</text>
  <line x1="160" y1="350" x2="200" y2="350" stroke="#ffd93d" stroke-width="2"/>
  <text x="155" y="354" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="end">WIND_IN</text>
  <line x1="160" y1="390" x2="200" y2="390" stroke="#c4b5fd" stroke-width="2"/>
  <text x="155" y="394" fill="#c4b5fd" font-family="monospace" font-size="9" text-anchor="end">VCC</text>
  <line x1="160" y1="420" x2="200" y2="420" stroke="#6eaadc" stroke-width="2"/>
  <text x="155" y="424" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="end">GND</text>
  <!-- Pins right -->
  <line x1="380" y1="250" x2="440" y2="250" stroke="#ff6b35" stroke-width="2"/>
  <text x="445" y="254" fill="#ff6b35" font-family="monospace" font-size="9">OUT_A</text>
  <line x1="380" y1="310" x2="440" y2="310" stroke="#4ecdc4" stroke-width="2"/>
  <text x="445" y="314" fill="#4ecdc4" font-family="monospace" font-size="9">OUT_B</text>
  <line x1="380" y1="370" x2="440" y2="370" stroke="#a8e06c" stroke-width="2"/>
  <text x="445" y="374" fill="#a8e06c" font-family="monospace" font-size="9">OUT_C</text>

  <!-- Resistors -->
  <g transform="translate(540,250)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#ffd93d" stroke-width="1.5"/>
    <polyline points="20,0 25,-10 35,10 45,-10 55,10 65,-10 75,10 80,0" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="100" y2="0" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="50" y="-18" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="middle">R1 4.7K</text>
  </g>

  <g transform="translate(540,310)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#ffd93d" stroke-width="1.5"/>
    <polyline points="20,0 25,-10 35,10 45,-10 55,10 65,-10 75,10 80,0" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="100" y2="0" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="50" y="-18" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="middle">R2 10K</text>
  </g>

  <!-- Capacitors -->
  <g transform="translate(540,370)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#a8e06c" stroke-width="1.5"/>
    <line x1="40" y1="-12" x2="40" y2="12" stroke="#a8e06c" stroke-width="2"/>
    <line x1="48" y1="-12" x2="48" y2="12" stroke="#a8e06c" stroke-width="2"/>
    <line x1="48" y1="0" x2="100" y2="0" stroke="#a8e06c" stroke-width="1.5"/>
    <text x="44" y="-20" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">C1 100uF</text>
  </g>

  <!-- IC Chip 2 - Combiner -->
  <rect x="700" y="180" width="200" height="280" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <text x="800" y="310" fill="#ff6b35" font-family="monospace" font-size="16" text-anchor="middle">IC-COMBINE</text>
  <text x="800" y="330" fill="#ff6b35" font-family="monospace" font-size="11" text-anchor="middle">FUSION</text>
  <text x="800" y="350" fill="#ff6b35" font-family="monospace" font-size="11" text-anchor="middle">CONTROLLER</text>
  <!-- Pins -->
  <line x1="640" y1="250" x2="700" y2="250" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="640" y1="310" x2="700" y2="310" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="640" y1="370" x2="700" y2="370" stroke="#a8e06c" stroke-width="1.5"/>
  <text x="695" y="234" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="end">A_IN</text>
  <text x="695" y="294" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="end">B_IN</text>
  <text x="695" y="354" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="end">C_IN</text>

  <!-- Output -->
  <line x1="900" y1="310" x2="1000" y2="310" stroke="#ff6b35" stroke-width="2"/>
  <text x="905" y="304" fill="#ff6b35" font-family="monospace" font-size="9">NEW_ELEMENT</text>

  <!-- Output block -->
  <rect x="1000" y="270" width="140" height="80" fill="none" stroke="#c4b5fd" stroke-width="2" rx="5"/>
  <text x="1070" y="305" fill="#c4b5fd" font-family="monospace" font-size="14" text-anchor="middle">OUTPUT</text>
  <text x="1070" y="325" fill="#c4b5fd" font-family="monospace" font-size="10" text-anchor="middle">REGISTER</text>

  <!-- Traces connecting chips -->
  <line x1="440" y1="250" x2="540" y2="250" stroke="#ff6b35" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="440" y1="310" x2="540" y2="310" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="440" y1="370" x2="540" y2="370" stroke="#a8e06c" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Ground symbol -->
  <g transform="translate(290,470)">
    <line x1="0" y1="-30" x2="0" y2="0" stroke="#6eaadc" stroke-width="1.5"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#6eaadc" stroke-width="1.5"/>
    <line x1="-13" y1="8" x2="13" y2="8" stroke="#6eaadc" stroke-width="1.5"/>
    <line x1="-6" y1="16" x2="6" y2="16" stroke="#6eaadc" stroke-width="1.5"/>
    <text x="0" y="32" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">GND</text>
  </g>

  <!-- VCC rail -->
  <line x1="80" y1="160" x2="1200" y2="160" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="85" y="155" fill="#c4b5fd" font-family="monospace" font-size="10">VCC +5V</text>

  <!-- GND rail -->
  <line x1="80" y1="520" x2="1200" y2="520" stroke="#6eaadc" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="85" y="515" fill="#6eaadc" font-family="monospace" font-size="10">GND</text>

  <!-- Diode -->
  <g transform="translate(1070,370)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#ff6b35" stroke-width="1.5"/>
    <polygon points="-12,30 12,30 0,50" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <line x1="-12" y1="50" x2="12" y2="50" stroke="#ff6b35" stroke-width="1.5"/>
    <line x1="0" y1="50" x2="0" y2="70" stroke="#ff6b35" stroke-width="1.5"/>
    <text x="20" y="45" fill="#ff6b35" font-family="monospace" font-size="9">D1</text>
  </g>

  <!-- Op-amp triangle -->
  <g transform="translate(500,470)">
    <polygon points="0,0 0,50 45,25" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="-15" y="15" fill="#4ecdc4" font-family="monospace" font-size="10">+</text>
    <text x="-15" y="45" fill="#4ecdc4" font-family="monospace" font-size="10">-</text>
    <line x1="-30" y1="12" x2="0" y2="12" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="-30" y1="38" x2="0" y2="38" stroke="#4ecdc4" stroke-width="1"/>
    <line x1="45" y1="25" x2="75" y2="25" stroke="#4ecdc4" stroke-width="1"/>
    <text x="22" y="70" fill="#4ecdc4" font-family="monospace" font-size="9" text-anchor="middle">U3 AMPLIFIER</text>
  </g>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 60 M 20 20 L 60 20" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 60 M 1260 20 L 1220 20" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 580 M 20 620 L 60 620" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 580 M 1260 620 L 1220 620" stroke="#4ecdc4" stroke-width="2" fill="none"/>

  <!-- Drawing info -->
  <rect x="900" y="580" width="360" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <line x1="1080" y1="580" x2="1080" y2="620" stroke="#6eaadc" stroke-width="0.5"/>
  <text x="990" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">SCH: IC-CIRCUIT-002</text>
  <text x="1170" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">REV: 2.4</text>
</svg>