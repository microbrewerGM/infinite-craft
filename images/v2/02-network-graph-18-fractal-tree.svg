  <!-- Title -->
  <text x="640" y="330" font-family="'Futura', 'Trebuchet MS', sans-serif" font-size="70" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central" letter-spacing="3" opacity="0.9" filter="url(#fGlow)">INFINITE CRAFT</text>
  <text x="640" y="385" font-family="'Futura', sans-serif" font-size="14" fill="#a8e06c" text-anchor="middle" letter-spacing="10" opacity="0.5">FRACTAL TREE</text>
