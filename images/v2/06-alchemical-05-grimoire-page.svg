<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="parchment5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="50%" stop-color="#1e180e"/>
      <stop offset="100%" stop-color="#141008"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#parchment5)"/>
  <!-- Page texture overlay -->
  <rect width="1280" height="640" fill="#c9a96e" opacity="0.03"/>
  <!-- Page border / margin lines -->
  <rect x="60" y="30" width="1160" height="580" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
  <rect x="70" y="40" width="1140" height="560" fill="none" stroke="#c9a96e" stroke-width="0.3" opacity="0.15"/>
  <!-- Left margin line -->
  <line x1="180" y1="40" x2="180" y2="600" stroke="#c9a96e" stroke-width="0.3" opacity="0.2"/>
  <!-- Horizontal ruled lines -->
  <g stroke="#c9a96e" stroke-width="0.2" opacity="0.1">
    <line x1="70" y1="100" x2="1210" y2="100"/>
    <line x1="70" y1="130" x2="1210" y2="130"/>
    <line x1="70" y1="160" x2="1210" y2="160"/>
    <line x1="70" y1="190" x2="1210" y2="190"/>
    <line x1="70" y1="220" x2="1210" y2="220"/>
    <line x1="70" y1="480" x2="1210" y2="480"/>
    <line x1="70" y1="510" x2="1210" y2="510"/>
    <line x1="70" y1="540" x2="1210" y2="540"/>
    <line x1="70" y1="570" x2="1210" y2="570"/>
  </g>
  <!-- Title in manuscript style -->
  <text x="640" y="85" text-anchor="middle" font-family="serif" font-size="36" fill="#c9a96e" letter-spacing="8" filter="url(#glow5)">INFINITE CRAFT</text>
  <line x1="350" y1="95" x2="930" y2="95" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
  <!-- "Handwritten" recipe text -->
  <g font-family="serif" font-size="13" fill="#8b7355" opacity="0.6">
    <text x="200" y="125" font-style="italic">Take ye the four primal essences and combine them thus:</text>
    <text x="200" y="155">Fire + Water = Steam ... Steam + Earth = Mud ... Mud + Air = Dust</text>
    <text x="200" y="185">From Dust all things may be wrought, for it contains the seeds of</text>
    <text x="200" y="215">creation itself. Observe the diagram below with great care...</text>
  </g>
  <!-- Central diagram - alchemical combination chart -->
  <g transform="translate(640,350)">
    <!-- Central circle -->
    <circle r="100" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.5"/>
    <circle r="70" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
    <!-- Cross dividing circle -->
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
    <!-- Element symbols in quadrants -->
    <text x="-40" y="-30" text-anchor="middle" font-family="serif" font-size="28" fill="#ff6b35" opacity="0.7">&#x1F702;</text>
    <text x="40" y="-30" text-anchor="middle" font-family="serif" font-size="28" fill="#4ecdc4" opacity="0.7">&#x1F704;</text>
    <text x="-40" y="45" text-anchor="middle" font-family="serif" font-size="28" fill="#a8e06c" opacity="0.7">&#x1F703;</text>
    <text x="40" y="45" text-anchor="middle" font-family="serif" font-size="28" fill="#c4b5fd" opacity="0.7">&#x1F701;</text>
    <!-- Connecting arrows outside -->
    <g stroke="#c9a96e" stroke-width="0.8" opacity="0.4" fill="none">
      <path d="M-120,-20 Q-140,0 -120,20"/>
      <path d="M120,-20 Q140,0 120,20"/>
      <path d="M-20,-120 Q0,-140 20,-120"/>
      <path d="M-20,120 Q0,140 20,120"/>
    </g>
    <!-- Labels -->
    <text x="-140" y="5" text-anchor="middle" font-family="serif" font-size="10" fill="#c9a96e" opacity="0.5" transform="rotate(-90,-140,0)">HOT</text>
    <text x="140" y="5" text-anchor="middle" font-family="serif" font-size="10" fill="#c9a96e" opacity="0.5" transform="rotate(90,140,0)">COLD</text>
    <text x="0" y="-140" text-anchor="middle" font-family="serif" font-size="10" fill="#c9a96e" opacity="0.5">DRY</text>
    <text x="0" y="150" text-anchor="middle" font-family="serif" font-size="10" fill="#c9a96e" opacity="0.5">WET</text>
  </g>
  <!-- Marginalia: small doodles in the margins -->
  <g transform="translate(100,300)" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.25">
    <circle r="20"/><polygon points="0,-15 13,8 -13,8"/>
    <text x="0" y="35" text-anchor="middle" font-family="serif" font-size="8" fill="#c9a96e">nota bene</text>
  </g>
  <g transform="translate(1180,350)" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.25">
    <circle r="15"/><line x1="-15" y1="0" x2="15" y2="0"/><line x1="0" y1="-15" x2="0" y2="15"/>
    <text x="0" y="25" text-anchor="middle" font-family="serif" font-size="7" fill="#c9a96e">opus magnum</text>
  </g>
  <!-- Bottom "handwritten" notes -->
  <g font-family="serif" font-size="12" fill="#8b7355" opacity="0.45" font-style="italic">
    <text x="200" y="500">N.B. — The quintessence arises only when balance is achieved.</text>
    <text x="200" y="530">All elements must flow freely through the vessel of creation.</text>
    <text x="200" y="560">Reference: Hermes Trismegistus, Tabula Smaragdina, v. 23</text>
  </g>
  <!-- Ink stain -->
  <circle cx="1100" cy="520" r="8" fill="#1a1408" opacity="0.3"/>
  <circle cx="1103" cy="523" r="5" fill="#1a1408" opacity="0.2"/>
</svg>