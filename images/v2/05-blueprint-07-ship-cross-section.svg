<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="640" y="50" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="62" x2="980" y2="62" stroke="#4ecdc4" stroke-width="2"/>
  <text x="640" y="82" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">EXPLORATION VESSEL CROSS-SECTION</text>

  <!-- Ship hull outline -->
  <path d="M 150 350 Q 150 200 300 180 L 500 160 L 800 150 L 1000 155 Q 1150 165 1180 250 L 1200 350 Q 1180 480 1000 500 L 300 490 Q 150 480 150 350 Z" fill="none" stroke="#4ecdc4" stroke-width="2.5"/>

  <!-- Waterline -->
  <line x1="120" y1="380" x2="1220" y2="380" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="1230" y="384" fill="#4ecdc4" font-family="monospace" font-size="9">WL</text>

  <!-- Bow -->
  <path d="M 1180 250 L 1200 350 Q 1180 480 1050 500" fill="none" stroke="#4ecdc4" stroke-width="2"/>

  <!-- Deck lines -->
  <line x1="180" y1="250" x2="1150" y2="240" stroke="#6eaadc" stroke-width="1.5"/>
  <line x1="170" y1="320" x2="1170" y2="315" stroke="#6eaadc" stroke-width="1.5"/>
  <line x1="160" y1="420" x2="1180" y2="415" stroke="#6eaadc" stroke-width="1"/>

  <!-- Bridge/Command deck -->
  <rect x="800" y="110" width="150" height="45" rx="5" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <line x1="810" y1="120" x2="940" y2="120" stroke="#ff6b35" stroke-width="0.5"/>
  <text x="875" y="138" fill="#ff6b35" font-family="monospace" font-size="10" text-anchor="middle">BRIDGE</text>
  <!-- Windows -->
  <rect x="815" y="112" width="12" height="6" fill="#ffd93d" opacity="0.5" rx="1"/>
  <rect x="835" y="112" width="12" height="6" fill="#ffd93d" opacity="0.5" rx="1"/>
  <rect x="855" y="112" width="12" height="6" fill="#ffd93d" opacity="0.5" rx="1"/>
  <rect x="875" y="112" width="12" height="6" fill="#ffd93d" opacity="0.5" rx="1"/>
  <rect x="895" y="112" width="12" height="6" fill="#ffd93d" opacity="0.5" rx="1"/>

  <!-- Room: Fire Engine Room -->
  <rect x="220" y="330" width="160" height="80" fill="none" stroke="#ff6b35" stroke-width="1.5" rx="3"/>
  <text x="300" y="360" fill="#ff6b35" font-family="monospace" font-size="11" text-anchor="middle">ENGINE ROOM</text>
  <text x="300" y="378" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">[FIRE CORE]</text>
  <!-- Engine detail -->
  <circle cx="270" cy="395" r="8" fill="none" stroke="#ffd93d" stroke-width="1"/>
  <circle cx="300" cy="395" r="8" fill="none" stroke="#ffd93d" stroke-width="1"/>
  <circle cx="330" cy="395" r="8" fill="none" stroke="#ffd93d" stroke-width="1"/>

  <!-- Room: Water Ballast -->
  <rect x="220" y="430" width="160" height="55" fill="none" stroke="#4ecdc4" stroke-width="1.5" rx="3"/>
  <text x="300" y="460" fill="#4ecdc4" font-family="monospace" font-size="10" text-anchor="middle">WATER BALLAST</text>
  <path d="M 225 470 Q 260 465 300 470 Q 340 475 375 470" fill="none" stroke="#4ecdc4" stroke-width="0.8" opacity="0.5"/>

  <!-- Room: Earth Cargo Hold -->
  <rect x="420" y="260" width="180" height="120" fill="none" stroke="#a8e06c" stroke-width="1.5" rx="3"/>
  <text x="510" y="300" fill="#a8e06c" font-family="monospace" font-size="11" text-anchor="middle">CARGO HOLD</text>
  <text x="510" y="318" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">[EARTH ELEMENTS]</text>
  <!-- Crates -->
  <rect x="440" y="340" width="20" height="20" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.6"/>
  <rect x="465" y="340" width="20" height="20" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.6"/>
  <rect x="490" y="340" width="20" height="20" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.6"/>
  <rect x="515" y="330" width="20" height="30" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.6"/>
  <rect x="540" y="340" width="20" height="20" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.6"/>
  <rect x="565" y="335" width="20" height="25" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.6"/>

  <!-- Room: Wind Navigation -->
  <rect x="650" y="260" width="160" height="60" fill="none" stroke="#c4b5fd" stroke-width="1.5" rx="3"/>
  <text x="730" y="290" fill="#c4b5fd" font-family="monospace" font-size="10" text-anchor="middle">NAVIGATION</text>
  <text x="730" y="305" fill="#c4b5fd" font-family="monospace" font-size="9" text-anchor="middle">[WIND CHARTS]</text>

  <!-- Room: Crew Quarters -->
  <rect x="650" y="335" width="160" height="60" fill="none" stroke="#ffd93d" stroke-width="1.5" rx="3"/>
  <text x="730" y="365" fill="#ffd93d" font-family="monospace" font-size="10" text-anchor="middle">CREW QUARTERS</text>
  <!-- Bunks -->
  <line x1="660" y1="375" x2="700" y2="375" stroke="#ffd93d" stroke-width="1" opacity="0.5"/>
  <line x1="660" y1="385" x2="700" y2="385" stroke="#ffd93d" stroke-width="1" opacity="0.5"/>
  <line x1="720" y1="375" x2="760" y2="375" stroke="#ffd93d" stroke-width="1" opacity="0.5"/>
  <line x1="720" y1="385" x2="760" y2="385" stroke="#ffd93d" stroke-width="1" opacity="0.5"/>

  <!-- Room: Combination Lab -->
  <rect x="860" y="260" width="200" height="110" fill="none" stroke="#ff6b35" stroke-width="2" rx="3"/>
  <text x="960" y="295" fill="white" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">CRAFT LAB</text>
  <text x="960" y="315" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">ELEMENT COMBINATION</text>
  <!-- Lab equipment -->
  <circle cx="900" cy="345" r="10" fill="none" stroke="#ff6b35" stroke-width="1"/>
  <circle cx="930" cy="345" r="10" fill="none" stroke="#4ecdc4" stroke-width="1"/>
  <circle cx="960" cy="345" r="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
  <circle cx="990" cy="345" r="10" fill="none" stroke="#c4b5fd" stroke-width="1"/>
  <text x="960" y="362" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">MIXING STATIONS</text>

  <!-- Propeller -->
  <g transform="translate(175,370)">
    <circle r="5" fill="#6eaadc"/>
    <ellipse rx="25" ry="6" fill="none" stroke="#6eaadc" stroke-width="1.5" transform="rotate(30)"/>
    <ellipse rx="25" ry="6" fill="none" stroke="#6eaadc" stroke-width="1.5" transform="rotate(-30)"/>
    <ellipse rx="25" ry="6" fill="none" stroke="#6eaadc" stroke-width="1.5" transform="rotate(90)"/>
  </g>

  <!-- Dimension annotations -->
  <line x1="150" y1="530" x2="1200" y2="530" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="150" y1="525" x2="150" y2="535" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="1200" y1="525" x2="1200" y2="535" stroke="#6eaadc" stroke-width="0.8"/>
  <text x="675" y="548" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">OVERALL LENGTH: 340m</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#4ecdc4" stroke-width="2" fill="none"/>

  <rect x="900" y="580" width="360" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="1080" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-VESSEL-007</text>
</svg>