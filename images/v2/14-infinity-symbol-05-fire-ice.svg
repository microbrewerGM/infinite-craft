<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="fireGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="40%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="40%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <radialGradient id="fireAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iceAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <filter id="fireGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iceGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- Auras behind each loop -->
  <ellipse cx="420" cy="300" rx="220" ry="180" fill="url(#fireAura)"/>
  <ellipse cx="860" cy="300" rx="220" ry="180" fill="url(#iceAura)"/>
  <!-- Fire loop - base -->
  <path d="M260,300 C260,185 380,145 460,205 C515,245 560,285 640,285" fill="none" stroke="#ff6b35" stroke-width="22" stroke-linecap="round" opacity="0.8" filter="url(#fireGlow)"/>
  <path d="M640,315 C560,315 515,355 460,395 C380,455 260,415 260,300" fill="none" stroke="#ff6b35" stroke-width="22" stroke-linecap="round" opacity="0.8" filter="url(#fireGlow)"/>
  <!-- Fire flames emanating from path -->
  <g filter="url(#fireGlow)" opacity="0.7">
    <path d="M300,260 C295,240 310,220 305,200 C315,220 320,235 310,260" fill="#ffd93d" opacity="0.6"/>
    <path d="M340,230 C338,210 350,190 348,165 C358,190 355,210 348,230" fill="#ff6b35" opacity="0.5"/>
    <path d="M380,210 C375,190 388,170 385,150 C395,170 392,190 385,210" fill="#ffd93d" opacity="0.6"/>
    <path d="M420,200 C418,178 430,158 428,138 C438,158 435,178 428,200" fill="#ff6b35" opacity="0.5"/>
    <path d="M460,210 C455,188 468,170 465,148 C475,170 470,188 465,210" fill="#ffd93d" opacity="0.55"/>
    <path d="M500,230 C498,210 508,192 505,172 C515,192 512,210 505,230" fill="#ff6b35" opacity="0.45"/>
    <path d="M300,340 C295,360 310,380 305,400 C315,380 320,365 310,340" fill="#ffd93d" opacity="0.5"/>
    <path d="M360,380 C355,400 368,420 365,440 C375,420 372,400 365,380" fill="#ff6b35" opacity="0.45"/>
    <path d="M420,400 C418,420 430,438 428,458 C438,438 435,420 428,400" fill="#ffd93d" opacity="0.5"/>
    <path d="M500,370 C498,388 508,405 505,425 C515,405 510,388 505,370" fill="#ff6b35" opacity="0.4"/>
  </g>
  <!-- Inner fire glow -->
  <path d="M280,300 C280,195 390,160 465,215 C518,250 562,288 640,288" fill="none" stroke="#ffd93d" stroke-width="8" opacity="0.4"/>
  <path d="M640,312 C562,312 518,350 465,385 C390,440 280,405 280,300" fill="none" stroke="#ffd93d" stroke-width="8" opacity="0.4"/>
  <!-- Ice loop - base -->
  <path d="M640,285 C720,285 765,245 820,205 C900,145 1020,185 1020,300" fill="none" stroke="#4ecdc4" stroke-width="22" stroke-linecap="round" opacity="0.8" filter="url(#iceGlow)"/>
  <path d="M1020,300 C1020,415 900,455 820,395 C765,355 720,315 640,315" fill="none" stroke="#4ecdc4" stroke-width="22" stroke-linecap="round" opacity="0.8" filter="url(#iceGlow)"/>
  <!-- Ice crystals -->
  <g opacity="0.5" stroke="#fff" stroke-width="1.5" fill="none">
    <path d="M750,230 L750,210 M745,215 L755,225 M755,215 L745,225"/>
    <path d="M820,195 L820,175 M815,180 L825,190 M825,180 L815,190"/>
    <path d="M900,210 L900,190 M895,195 L905,205 M905,195 L895,205"/>
    <path d="M950,240 L950,220 M945,225 L955,235 M955,225 L945,235"/>
    <path d="M980,270 L980,255 M976,260 L984,270"/>
    <path d="M750,370 L750,390 M745,385 L755,375 M755,385 L745,375"/>
    <path d="M820,405 L820,425 M815,420 L825,410 M825,420 L815,410"/>
    <path d="M900,390 L900,410 M895,405 L905,395 M905,405 L895,395"/>
    <path d="M950,360 L950,380 M945,375 L955,365 M955,375 L945,365"/>
  </g>
  <!-- Ice shimmer -->
  <path d="M640,288 C718,288 762,248 818,210 C895,155 1005,190 1005,300" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
  <path d="M1005,300 C1005,410 895,445 818,390 C762,352 718,312 640,312" fill="none" stroke="#fff" stroke-width="2" opacity="0.25"/>
  <!-- Steam/collision at center -->
  <g filter="url(#fireGlow)" opacity="0.3">
    <circle cx="640" cy="270" r="8" fill="#fff"/>
    <circle cx="635" cy="260" r="5" fill="#fff"/>
    <circle cx="648" cy="255" r="4" fill="#fff"/>
    <circle cx="640" cy="330" r="7" fill="#fff"/>
    <circle cx="635" cy="340" r="5" fill="#fff"/>
    <circle cx="648" cy="345" r="4" fill="#fff"/>
  </g>
  <!-- Ember particles -->
  <g opacity="0.6">
    <circle cx="320" cy="200" r="2" fill="#ffd93d"/><circle cx="400" cy="170" r="1.5" fill="#ff6b35"/>
    <circle cx="480" cy="195" r="1.8" fill="#ffd93d"/><circle cx="350" cy="400" r="1.5" fill="#ff6b35"/>
    <circle cx="450" cy="420" r="2" fill="#ffd93d"/>
  </g>
  <!-- Title -->
  <text x="640" y="560" text-anchor="middle" font-family="'Courier New', monospace" font-size="42" font-weight="bold" letter-spacing="10" opacity="0.9">
    <tspan fill="#ff6b35">INFIN</tspan><tspan fill="#ffffff">I</tspan><tspan fill="#4ecdc4">TE CR</tspan><tspan fill="#ffffff">A</tspan><tspan fill="#4ecdc4">FT</tspan>
  </text>
</svg>