<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="cityGlow">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <filter id="citySharp">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="70%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffd93d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#skyGrad)"/>

  <!-- City light pollution glow on horizon -->
  <rect x="0" y="380" width="1280" height="260" fill="url(#horizonGlow)" filter="url(#cityGlow)"/>
  <ellipse cx="640" cy="480" rx="600" ry="60" fill="#ff6b35" opacity="0.04" filter="url(#cityGlow)"/>
  <ellipse cx="400" cy="490" rx="200" ry="30" fill="#ffd93d" opacity="0.03" filter="url(#cityGlow)"/>
  <ellipse cx="900" cy="485" rx="180" ry="25" fill="#4ecdc4" opacity="0.02" filter="url(#cityGlow)"/>

  <!-- Distant city skyline silhouette -->
  <path d="M0,500 L0,490 L50,490 L50,470 L70,470 L70,460 L80,460 L80,470 L120,470 L120,450 L130,450 L130,440 L135,430 L140,440 L140,450 L170,450 L170,480 L200,480 L200,440 L210,440 L210,420 L215,415 L220,420 L220,440 L240,440 L240,460 L280,460 L280,430 L290,430 L290,400 L295,390 L300,400 L300,430 L320,430 L320,460 L360,460 L360,435 L380,435 L380,410 L385,400 L390,410 L390,435 L420,435 L420,460 L440,460 L440,420 L445,380 L450,370 L455,380 L460,420 L460,460 L500,460 L500,440 L520,440 L520,420 L530,420 L530,410 L535,405 L540,410 L540,440 L570,440 L570,465 L600,465 L600,430 L610,430 L610,395 L615,385 L620,395 L620,430 L640,430 L640,445 L660,445 L660,410 L670,410 L670,380 L675,370 L680,380 L680,410 L700,410 L700,440 L730,440 L730,455 L760,455 L760,430 L770,430 L770,415 L775,410 L780,415 L780,430 L800,430 L800,460 L840,460 L840,435 L860,435 L860,400 L865,390 L870,400 L870,435 L900,435 L900,450 L930,450 L930,425 L940,425 L940,410 L945,405 L950,410 L950,425 L970,425 L970,460 L1000,460 L1000,440 L1020,440 L1020,455 L1060,455 L1060,470 L1100,470 L1100,450 L1110,450 L1110,465 L1150,465 L1150,475 L1200,475 L1200,485 L1250,485 L1250,490 L1280,490 L1280,500Z" fill="#0a0808"/>

  <!-- Tiny building windows (warm light) -->
  <rect x="292" y="405" width="2" height="2" fill="#ffd93d" opacity="0.6"/>
  <rect x="296" y="410" width="2" height="2" fill="#ffd93d" opacity="0.5"/>
  <rect x="447" y="385" width="2" height="2" fill="#ff6b35" opacity="0.7"/>
  <rect x="451" y="390" width="2" height="2" fill="#ffd93d" opacity="0.5"/>
  <rect x="613" y="400" width="2" height="2" fill="#ffd93d" opacity="0.6"/>
  <rect x="617" y="408" width="2" height="2" fill="#ff6b35" opacity="0.5"/>
  <rect x="672" y="385" width="2" height="2" fill="#ffd93d" opacity="0.65"/>
  <rect x="676" y="392" width="2" height="2" fill="#ff6b35" opacity="0.5"/>
  <rect x="862" y="405" width="2" height="2" fill="#ffd93d" opacity="0.55"/>
  <rect x="866" y="412" width="2" height="2" fill="#4ecdc4" opacity="0.4"/>
  <rect x="942" y="412" width="2" height="2" fill="#ffd93d" opacity="0.5"/>
  <rect x="532" y="414" width="2" height="2" fill="#ff6b35" opacity="0.5"/>

  <!-- Aircraft warning lights on tall buildings -->
  <circle cx="450" cy="370" r="1.5" fill="#ff6b35" opacity="0.8" filter="url(#citySharp)"/>
  <circle cx="675" cy="370" r="1.5" fill="#ff6b35" opacity="0.8" filter="url(#citySharp)"/>
  <circle cx="295" cy="390" r="1" fill="#ff6b35" opacity="0.6" filter="url(#citySharp)"/>

  <!-- Stars above city -->
  <circle cx="200" cy="80" r="1" fill="white" opacity="0.5"/>
  <circle cx="500" cy="50" r="1.2" fill="white" opacity="0.4"/>
  <circle cx="750" cy="100" r="0.8" fill="white" opacity="0.3"/>
  <circle cx="1000" cy="60" r="1" fill="white" opacity="0.35"/>
  <circle cx="350" cy="150" r="0.7" fill="white" opacity="0.25"/>
  <circle cx="900" cy="130" r="0.9" fill="white" opacity="0.2"/>

  <!-- Ground/water reflection -->
  <rect x="0" y="500" width="1280" height="140" fill="#050505"/>
  <line x1="0" y1="500" x2="1280" y2="500" stroke="#ff6b35" stroke-opacity="0.05" stroke-width="1"/>
  <!-- Reflection streaks -->
  <line x1="450" y1="505" x2="450" y2="560" stroke="#ffd93d" stroke-opacity="0.04" stroke-width="3" filter="url(#cityGlow)"/>
  <line x1="675" y1="505" x2="675" y2="550" stroke="#ff6b35" stroke-opacity="0.04" stroke-width="3" filter="url(#cityGlow)"/>
  <line x1="295" y1="505" x2="295" y2="540" stroke="#ffd93d" stroke-opacity="0.03" stroke-width="2" filter="url(#cityGlow)"/>

  <!-- Element emojis as city elements -->
  <text x="250" y="350" font-size="30" text-anchor="middle" opacity="0.5">🔥</text>
  <text x="550" y="360" font-size="28" text-anchor="middle" opacity="0.45">💧</text>
  <text x="800" y="355" font-size="30" text-anchor="middle" opacity="0.5">🌍</text>
  <text x="1050" y="365" font-size="26" text-anchor="middle" opacity="0.4">💨</text>

  <!-- Title -->
  <text x="640" y="250" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="800" fill="white" text-anchor="middle" letter-spacing="20" opacity="0.9">INFINITE CRAFT</text>
  <text x="640" y="288" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffd93d" text-anchor="middle" letter-spacing="8" opacity="0.3">AFTER DARK</text>
</svg>