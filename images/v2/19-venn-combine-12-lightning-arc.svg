<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="la-glow">
      <feGaussianBlur stdDeviation="8"/>
      <feComposite in="SourceGraphic"/>
    </filter>
    <filter id="la-intense">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="la-soft">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="la-left" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="la-right" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>

  <!-- Left conductor -->
  <g transform="translate(280, 320)">
    <circle cx="0" cy="0" r="60" fill="url(#la-left)" opacity="0.5"/>
    <!-- Conductor shape (sphere/electrode) -->
    <circle cx="0" cy="0" r="40" fill="#0a0a14" stroke="#ff6b35" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.3"/>
    <!-- Inner glow -->
    <circle cx="0" cy="0" r="20" fill="#ff6b35" opacity="0.15"/>
    <circle cx="-8" cy="-8" r="8" fill="#ff6b35" opacity="0.1"/>
    <!-- Charge indicators -->
    <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="28" fill="#ff6b35" opacity="0.7" font-weight="bold">+</text>
    <!-- Base/stand -->
    <rect x="-15" y="42" width="30" height="80" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
    <rect x="-30" y="120" width="60" height="8" rx="2" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Right conductor -->
  <g transform="translate(1000, 320)">
    <circle cx="0" cy="0" r="60" fill="url(#la-right)" opacity="0.5"/>
    <circle cx="0" cy="0" r="40" fill="#0a0a14" stroke="#4ecdc4" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="20" fill="#4ecdc4" opacity="0.15"/>
    <circle cx="-8" cy="-8" r="8" fill="#4ecdc4" opacity="0.1"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial" font-size="24" fill="#4ecdc4" opacity="0.7" font-weight="bold">-</text>
    <rect x="-15" y="42" width="30" height="80" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
    <rect x="-30" y="120" width="60" height="8" rx="2" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Main lightning arc -->
  <path d="M 320 320 L 400 300 L 450 330 L 520 290 L 580 320 L 640 280 L 700 330 L 760 290 L 830 320 L 880 300 L 960 320" fill="none" stroke="#c4b5fd" stroke-width="6" opacity="0.15" filter="url(#la-intense)"/>
  <path d="M 320 320 L 400 300 L 450 330 L 520 290 L 580 320 L 640 280 L 700 330 L 760 290 L 830 320 L 880 300 L 960 320" fill="none" stroke="#c4b5fd" stroke-width="4" opacity="0.3" filter="url(#la-soft)"/>
  <path d="M 320 320 L 400 300 L 450 330 L 520 290 L 580 320 L 640 280 L 700 330 L 760 290 L 830 320 L 880 300 L 960 320" fill="none" stroke="#fff" stroke-width="2" opacity="0.9"/>

  <!-- Secondary arc (offset) -->
  <path d="M 325 325 L 390 340 L 460 310 L 530 340 L 600 305 L 660 340 L 720 300 L 780 335 L 840 310 L 900 335 L 955 320" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0.2" filter="url(#la-soft)"/>
  <path d="M 325 325 L 390 340 L 460 310 L 530 340 L 600 305 L 660 340 L 720 300 L 780 335 L 840 310 L 900 335 L 955 320" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.5"/>

  <!-- Branch arcs -->
  <path d="M 520 290 L 500 250 L 480 230" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  <path d="M 640 280 L 650 240 L 640 210" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <path d="M 760 290 L 780 255 L 800 240" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <path d="M 580 320 L 570 360 L 560 380" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.3"/>
  <path d="M 700 330 L 710 370 L 720 390" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.3"/>

  <!-- Central bright point -->
  <circle cx="640" cy="280" r="8" fill="#fff" opacity="0.5" filter="url(#la-soft)"/>
  <circle cx="640" cy="280" r="3" fill="#fff" opacity="0.9"/>

  <!-- Ambient charge particles -->
  <circle cx="450" cy="260" r="2" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="550" cy="350" r="1.5" fill="#ffd93d" opacity="0.3"/>
  <circle cx="730" cy="260" r="2" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="850" cy="350" r="1.5" fill="#ffd93d" opacity="0.3"/>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#c4b5fd" opacity="0.6" letter-spacing="4">LIGHTNING ARC</text>
</svg>