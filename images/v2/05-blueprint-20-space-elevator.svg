<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="0.7" fill="#6eaadc" opacity="0.4"/>
      <circle cx="80" cy="15" r="0.5" fill="#6eaadc" opacity="0.3"/>
      <circle cx="50" cy="80" r="0.6" fill="#6eaadc" opacity="0.3"/>
      <circle cx="100" cy="95" r="0.8" fill="#6eaadc" opacity="0.4"/>
      <circle cx="10" cy="100" r="0.4" fill="#6eaadc" opacity="0.2"/>
      <circle cx="110" cy="50" r="0.5" fill="#6eaadc" opacity="0.3"/>
    </pattern>
    <linearGradient id="atmosphere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1525"/>
      <stop offset="60%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2a4070"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#atmosphere)"/>
  <rect width="1280" height="640" fill="url(#stars)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.25"/>

  <!-- Title -->
  <text x="640" y="45" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="57" x2="980" y2="57" stroke="#c4b5fd" stroke-width="2"/>
  <text x="640" y="75" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">SPACE ELEVATOR BLUEPRINT</text>

  <!-- Earth surface (bottom, curved) -->
  <path d="M 0 600 Q 320 550 640 545 Q 960 550 1280 600" fill="#2a4070" stroke="#a8e06c" stroke-width="2"/>
  <text x="640" y="580" fill="#a8e06c" font-family="monospace" font-size="10" text-anchor="middle">EARTH SURFACE [EQUATOR]</text>

  <!-- Atmosphere layers -->
  <line x1="100" y1="500" x2="1180" y2="500" stroke="#4ecdc4" stroke-width="0.5" stroke-dasharray="8,8" opacity="0.4"/>
  <text x="1190" y="504" fill="#4ecdc4" font-family="monospace" font-size="7" opacity="0.6">TROPOSPHERE 12km</text>
  <line x1="100" y1="440" x2="1180" y2="440" stroke="#4ecdc4" stroke-width="0.5" stroke-dasharray="8,8" opacity="0.3"/>
  <text x="1190" y="444" fill="#4ecdc4" font-family="monospace" font-size="7" opacity="0.5">STRATOSPHERE 50km</text>
  <line x1="100" y1="360" x2="1180" y2="360" stroke="#4ecdc4" stroke-width="0.5" stroke-dasharray="8,8" opacity="0.2"/>
  <text x="1190" y="364" fill="#4ecdc4" font-family="monospace" font-size="7" opacity="0.4">MESOSPHERE 85km</text>
  <line x1="100" y1="280" x2="1180" y2="280" stroke="#4ecdc4" stroke-width="0.5" stroke-dasharray="8,8" opacity="0.15"/>
  <text x="1190" y="284" fill="#4ecdc4" font-family="monospace" font-size="7" opacity="0.3">THERMOSPHERE 600km</text>

  <!-- Main tether cable -->
  <line x1="640" y1="95" x2="640" y2="545" stroke="#ffd93d" stroke-width="3"/>
  <!-- Secondary cables -->
  <line x1="635" y1="95" x2="635" y2="545" stroke="#ffd93d" stroke-width="0.5" opacity="0.5"/>
  <line x1="645" y1="95" x2="645" y2="545" stroke="#ffd93d" stroke-width="0.5" opacity="0.5"/>
  <text x="625" y="320" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="end" transform="rotate(-90,625,320)">CARBON NANOTUBE TETHER</text>

  <!-- Ground anchor station -->
  <rect x="580" y="530" width="120" height="20" fill="none" stroke="#a8e06c" stroke-width="2.5" rx="3"/>
  <text x="640" y="544" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">GROUND ANCHOR</text>
  <!-- Base structure -->
  <rect x="600" y="515" width="80" height="15" fill="none" stroke="#a8e06c" stroke-width="1.5"/>
  <line x1="610" y1="515" x2="610" y2="530" stroke="#a8e06c" stroke-width="0.5"/>
  <line x1="630" y1="515" x2="630" y2="530" stroke="#a8e06c" stroke-width="0.5"/>
  <line x1="650" y1="515" x2="650" y2="530" stroke="#a8e06c" stroke-width="0.5"/>
  <line x1="670" y1="515" x2="670" y2="530" stroke="#a8e06c" stroke-width="0.5"/>

  <!-- Earth Station (bottom) -->
  <rect x="560" y="470" width="160" height="45" rx="5" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <text x="640" y="490" fill="#ff6b35" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">FIRE STATION</text>
  <text x="640" y="505" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">LAUNCH FACILITY</text>

  <!-- Climber pod (ascending) -->
  <g transform="translate(640,400)">
    <rect x="-20" y="-25" width="40" height="50" rx="5" fill="#1a2744" stroke="#4ecdc4" stroke-width="2"/>
    <rect x="-15" y="-20" width="30" height="15" fill="none" stroke="#4ecdc4" stroke-width="1"/>
    <text x="0" y="-7" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle">CARGO</text>
    <text x="0" y="10" fill="#4ecdc4" font-family="monospace" font-size="6" text-anchor="middle">CLIMBER</text>
    <!-- Grip wheels -->
    <circle cx="-22" cy="-10" r="4" fill="none" stroke="#ffd93d" stroke-width="1"/>
    <circle cx="22" cy="-10" r="4" fill="none" stroke="#ffd93d" stroke-width="1"/>
    <circle cx="-22" cy="10" r="4" fill="none" stroke="#ffd93d" stroke-width="1"/>
    <circle cx="22" cy="10" r="4" fill="none" stroke="#ffd93d" stroke-width="1"/>
    <!-- Ascending arrow -->
    <line x1="30" y1="10" x2="30" y2="-20" stroke="#4ecdc4" stroke-width="1.5"/>
    <polygon points="26,-15 30,-25 34,-15" fill="#4ecdc4"/>
    <text x="45" y="0" fill="#4ecdc4" font-family="monospace" font-size="7">ASCENDING</text>
    <text x="45" y="10" fill="#4ecdc4" font-family="monospace" font-size="7">200 km/h</text>
  </g>

  <!-- Low orbit station -->
  <rect x="570" y="335" width="140" height="35" rx="5" fill="none" stroke="#a8e06c" stroke-width="2"/>
  <text x="640" y="352" fill="#a8e06c" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">EARTH STATION</text>
  <text x="640" y="364" fill="#a8e06c" font-family="monospace" font-size="7" text-anchor="middle">LEO WAYPOINT - 400km</text>
  <!-- Solar panels -->
  <rect x="520" y="340" width="45" height="12" fill="none" stroke="#ffd93d" stroke-width="1"/>
  <rect x="715" y="340" width="45" height="12" fill="none" stroke="#ffd93d" stroke-width="1"/>
  <line x1="542" y1="340" x2="542" y2="352" stroke="#ffd93d" stroke-width="0.3"/>
  <line x1="737" y1="340" x2="737" y2="352" stroke="#ffd93d" stroke-width="0.3"/>

  <!-- Mid station -->
  <rect x="575" y="230" width="130" height="35" rx="5" fill="none" stroke="#c4b5fd" stroke-width="2"/>
  <text x="640" y="247" fill="#c4b5fd" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">WIND STATION</text>
  <text x="640" y="259" fill="#c4b5fd" font-family="monospace" font-size="7" text-anchor="middle">TRANSFER HUB - 10,000km</text>

  <!-- GEO Station (counterweight) -->
  <rect x="560" y="140" width="160" height="50" rx="8" fill="none" stroke="#ffd93d" stroke-width="2.5"/>
  <text x="640" y="162" fill="#ffd93d" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">CRAFT STATION</text>
  <text x="640" y="178" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">GEO - 35,786km</text>
  <!-- Solar arrays -->
  <rect x="480" y="150" width="75" height="18" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="497" y1="150" x2="497" y2="168" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="515" y1="150" x2="515" y2="168" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="533" y1="150" x2="533" y2="168" stroke="#ffd93d" stroke-width="0.5"/>
  <rect x="725" y="150" width="75" height="18" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="742" y1="150" x2="742" y2="168" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="760" y1="150" x2="760" y2="168" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="778" y1="150" x2="778" y2="168" stroke="#ffd93d" stroke-width="0.5"/>

  <!-- Counterweight -->
  <rect x="610" y="95" width="60" height="30" rx="5" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <text x="640" y="115" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">COUNTERWEIGHT</text>
  <text x="640" y="90" fill="#ff6b35" font-family="monospace" font-size="7" text-anchor="middle">100,000km</text>

  <!-- Altitude scale (left side) -->
  <line x1="80" y1="95" x2="80" y2="545" stroke="#6eaadc" stroke-width="0.8"/>
  <g fill="#6eaadc" font-family="monospace" font-size="8">
    <line x1="75" y1="545" x2="85" y2="545" stroke="#6eaadc" stroke-width="0.8"/>
    <text x="70" y="549" text-anchor="end">0 km</text>
    <line x1="75" y1="470" x2="85" y2="470" stroke="#6eaadc" stroke-width="0.8"/>
    <text x="70" y="474" text-anchor="end">100 km</text>
    <line x1="75" y1="350" x2="85" y2="350" stroke="#6eaadc" stroke-width="0.8"/>
    <text x="70" y="354" text-anchor="end">400 km</text>
    <line x1="75" y1="245" x2="85" y2="245" stroke="#6eaadc" stroke-width="0.8"/>
    <text x="70" y="249" text-anchor="end">10,000 km</text>
    <line x1="75" y1="165" x2="85" y2="165" stroke="#6eaadc" stroke-width="0.8"/>
    <text x="70" y="169" text-anchor="end">35,786 km</text>
    <line x1="75" y1="110" x2="85" y2="110" stroke="#6eaadc" stroke-width="0.8"/>
    <text x="70" y="114" text-anchor="end">100,000 km</text>
  </g>
  <text x="50" y="320" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(-90,50,320)">ALTITUDE (NOT TO SCALE)</text>

  <!-- Specifications panel -->
  <rect x="880" y="100" width="340" height="230" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="5"/>
  <text x="1050" y="125" fill="white" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">ELEVATOR SPECIFICATIONS</text>
  <line x1="880" y1="133" x2="1220" y2="133" stroke="#6eaadc" stroke-width="0.5"/>

  <text x="900" y="155" fill="#ffd93d" font-family="monospace" font-size="10">TETHER LENGTH: 100,000 km</text>
  <text x="900" y="173" fill="#ffd93d" font-family="monospace" font-size="10">TETHER MATERIAL: CNT COMPOSITE</text>
  <text x="900" y="191" fill="#4ecdc4" font-family="monospace" font-size="10">CLIMBER SPEED: 200 km/h</text>
  <text x="900" y="209" fill="#4ecdc4" font-family="monospace" font-size="10">TRANSIT TO GEO: 7.5 days</text>
  <text x="900" y="227" fill="#a8e06c" font-family="monospace" font-size="10">PAYLOAD: 20 tonnes/trip</text>
  <text x="900" y="245" fill="#a8e06c" font-family="monospace" font-size="10">STATIONS: 4 (incl. ground)</text>
  <text x="900" y="263" fill="#ff6b35" font-family="monospace" font-size="10">POWER: SOLAR + LASER BEAMING</text>
  <text x="900" y="281" fill="#c4b5fd" font-family="monospace" font-size="10">PURPOSE: ELEMENT TRANSPORT</text>
  <text x="900" y="299" fill="#6eaadc" font-family="monospace" font-size="10">ELEMENTS IN ORBIT: 2,847</text>
  <text x="900" y="317" fill="white" font-family="monospace" font-size="10">STATUS: OPERATIONAL</text>

  <!-- Gravity gradient note -->
  <rect x="880" y="380" width="340" height="60" fill="none" stroke="#6eaadc" stroke-width="1" rx="3"/>
  <text x="1050" y="400" fill="white" font-family="monospace" font-size="10" text-anchor="middle">GRAVITY GRADIENT</text>
  <line x1="910" y1="420" x2="1190" y2="420" stroke="#ff6b35" stroke-width="2"/>
  <line x1="910" y1="420" x2="1050" y2="415" stroke="#a8e06c" stroke-width="2"/>
  <text x="910" y="435" fill="#ff6b35" font-family="monospace" font-size="7">1g</text>
  <text x="1050" y="435" fill="#6eaadc" font-family="monospace" font-size="7" text-anchor="middle">0g (GEO)</text>
  <text x="1190" y="435" fill="#c4b5fd" font-family="monospace" font-size="7" text-anchor="end">OUTWARD</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 45 M 20 20 L 45 20" stroke="#c4b5fd" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 45 M 1260 20 L 1235 20" stroke="#c4b5fd" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 595 M 20 620 L 45 620" stroke="#c4b5fd" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 595 M 1260 620 L 1235 620" stroke="#c4b5fd" stroke-width="2" fill="none"/>

  <rect x="880" y="580" width="380" height="35" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="1070" y="602" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-ELEVATOR-020 | STRUCTURAL OVERVIEW</text>
</svg>