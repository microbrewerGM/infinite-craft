<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1e1020"/>
      <stop offset="100%" stop-color="#0a0510"/>
    </radialGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="goldg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="50%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg4)"/>
  <g transform="translate(640,320)">
    <!-- Outermost circle -->
    <circle r="280" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
    <!-- Concentric transmutation circles -->
    <circle r="250" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.5"/>
    <circle r="240" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
    <!-- Inscribed square in outer circle -->
    <rect x="-177" y="-177" width="354" height="354" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.4" transform="rotate(0)"/>
    <!-- Circle inscribed in square -->
    <circle r="177" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.5"/>
    <!-- Triangle inscribed in that circle -->
    <polygon points="0,-177 153,88 -153,88" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.6"/>
    <!-- Circle inscribed in triangle -->
    <circle r="88" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.5"/>
    <!-- Inverted triangle -->
    <polygon points="0,88 -76,-44 76,-44" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.5"/>
    <!-- Innermost circle -->
    <circle r="44" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.7"/>
    <!-- Central philosopher's stone -->
    <circle r="18" fill="none" stroke="url(#goldg4)" stroke-width="2" filter="url(#glow4)"/>
    <circle r="6" fill="#ffd93d" opacity="0.5"/>
    <!-- Radiating tick marks on outer circle -->
    <g stroke="#c9a96e" stroke-width="0.5" opacity="0.3">
      <line x1="0" y1="-250" x2="0" y2="-260"/>
      <line x1="0" y1="250" x2="0" y2="260"/>
      <line x1="250" y1="0" x2="260" y2="0"/>
      <line x1="-250" y1="0" x2="-260" y2="0"/>
      <line x1="177" y1="-177" x2="184" y2="-184"/>
      <line x1="177" y1="177" x2="184" y2="184"/>
      <line x1="-177" y1="-177" x2="-184" y2="-184"/>
      <line x1="-177" y1="177" x2="-184" y2="184"/>
    </g>
    <!-- Element labels at corners of square -->
    <text x="0" y="-195" text-anchor="middle" font-family="serif" font-size="14" fill="#ff6b35" opacity="0.8">IGNIS</text>
    <text x="195" y="5" text-anchor="middle" font-family="serif" font-size="14" fill="#4ecdc4" opacity="0.8">AQUA</text>
    <text x="0" y="205" text-anchor="middle" font-family="serif" font-size="14" fill="#a8e06c" opacity="0.8">TERRA</text>
    <text x="-195" y="5" text-anchor="middle" font-family="serif" font-size="14" fill="#c4b5fd" opacity="0.8">AER</text>
    <!-- Alchemical arrows between circles -->
    <g stroke="#c9a96e" stroke-width="0.5" opacity="0.3">
      <path d="M125,0 L135,0 M132,-3 L135,0 L132,3" fill="none"/>
      <path d="M-125,0 L-135,0 M-132,-3 L-135,0 L-132,3" fill="none"/>
      <path d="M0,125 L0,135 M-3,132 L0,135 L3,132" fill="none"/>
      <path d="M0,-125 L0,-135 M-3,-132 L0,-135 L3,-132" fill="none"/>
    </g>
  </g>
  <!-- Title -->
  <text x="640" y="50" text-anchor="middle" font-family="serif" font-size="38" fill="url(#goldg4)" letter-spacing="10" filter="url(#glow4)">INFINITE CRAFT</text>
  <line x1="380" y1="62" x2="900" y2="62" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
  <!-- Subtitle -->
  <text x="640" y="625" text-anchor="middle" font-family="serif" font-size="11" fill="#c9a96e" opacity="0.5" letter-spacing="6">SOLVE ET COAGULA</text>
</svg>