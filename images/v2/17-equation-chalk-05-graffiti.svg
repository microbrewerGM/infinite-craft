<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="spray">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="mask">
        <feFuncA type="linear" slope="2" intercept="-0.5"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="mask" operator="in"/>
    </filter>
    <filter id="drip-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="brick-mortar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
  </defs>
  <!-- Brick wall -->
  <rect width="1280" height="640" fill="#606060"/>
  <!-- Brick pattern -->
  <g fill="#787878" stroke="#555" stroke-width="1">
    <!-- Row 1 -->
    <rect x="0" y="0" width="160" height="40" rx="1"/><rect x="165" y="0" width="160" height="40" rx="1"/>
    <rect x="330" y="0" width="160" height="40" rx="1"/><rect x="495" y="0" width="160" height="40" rx="1"/>
    <rect x="660" y="0" width="160" height="40" rx="1"/><rect x="825" y="0" width="160" height="40" rx="1"/>
    <rect x="990" y="0" width="160" height="40" rx="1"/><rect x="1155" y="0" width="160" height="40" rx="1"/>
    <!-- Row 2 (offset) -->
    <rect x="-80" y="44" width="160" height="40" rx="1"/><rect x="85" y="44" width="160" height="40" rx="1"/>
    <rect x="250" y="44" width="160" height="40" rx="1"/><rect x="415" y="44" width="160" height="40" rx="1"/>
    <rect x="580" y="44" width="160" height="40" rx="1"/><rect x="745" y="44" width="160" height="40" rx="1"/>
    <rect x="910" y="44" width="160" height="40" rx="1"/><rect x="1075" y="44" width="160" height="40" rx="1"/>
    <!-- Rows 3-14 alternating -->
    <rect x="0" y="88" width="160" height="40" rx="1"/><rect x="165" y="88" width="160" height="40" rx="1"/>
    <rect x="330" y="88" width="160" height="40" rx="1"/><rect x="495" y="88" width="160" height="40" rx="1"/>
    <rect x="660" y="88" width="160" height="40" rx="1"/><rect x="825" y="88" width="160" height="40" rx="1"/>
    <rect x="990" y="88" width="160" height="40" rx="1"/><rect x="1155" y="88" width="160" height="40" rx="1"/>
    <rect x="-80" y="132" width="160" height="40" rx="1"/><rect x="85" y="132" width="160" height="40" rx="1"/>
    <rect x="250" y="132" width="160" height="40" rx="1"/><rect x="415" y="132" width="160" height="40" rx="1"/>
    <rect x="580" y="132" width="160" height="40" rx="1"/><rect x="745" y="132" width="160" height="40" rx="1"/>
    <rect x="910" y="132" width="160" height="40" rx="1"/><rect x="1075" y="132" width="160" height="40" rx="1"/>
    <rect x="0" y="176" width="160" height="40" rx="1"/><rect x="165" y="176" width="160" height="40" rx="1"/>
    <rect x="330" y="176" width="160" height="40" rx="1"/><rect x="495" y="176" width="160" height="40" rx="1"/>
    <rect x="660" y="176" width="160" height="40" rx="1"/><rect x="825" y="176" width="160" height="40" rx="1"/>
    <rect x="990" y="176" width="160" height="40" rx="1"/><rect x="1155" y="176" width="160" height="40" rx="1"/>
    <rect x="-80" y="220" width="160" height="40" rx="1"/><rect x="85" y="220" width="160" height="40" rx="1"/>
    <rect x="250" y="220" width="160" height="40" rx="1"/><rect x="415" y="220" width="160" height="40" rx="1"/>
    <rect x="580" y="220" width="160" height="40" rx="1"/><rect x="745" y="220" width="160" height="40" rx="1"/>
    <rect x="910" y="220" width="160" height="40" rx="1"/><rect x="1075" y="220" width="160" height="40" rx="1"/>
    <rect x="0" y="264" width="160" height="40" rx="1"/><rect x="165" y="264" width="160" height="40" rx="1"/>
    <rect x="330" y="264" width="160" height="40" rx="1"/><rect x="495" y="264" width="160" height="40" rx="1"/>
    <rect x="660" y="264" width="160" height="40" rx="1"/><rect x="825" y="264" width="160" height="40" rx="1"/>
    <rect x="990" y="264" width="160" height="40" rx="1"/><rect x="1155" y="264" width="160" height="40" rx="1"/>
    <rect x="-80" y="308" width="160" height="40" rx="1"/><rect x="85" y="308" width="160" height="40" rx="1"/>
    <rect x="250" y="308" width="160" height="40" rx="1"/><rect x="415" y="308" width="160" height="40" rx="1"/>
    <rect x="580" y="308" width="160" height="40" rx="1"/><rect x="745" y="308" width="160" height="40" rx="1"/>
    <rect x="910" y="308" width="160" height="40" rx="1"/><rect x="1075" y="308" width="160" height="40" rx="1"/>
    <rect x="0" y="352" width="160" height="40" rx="1"/><rect x="165" y="352" width="160" height="40" rx="1"/>
    <rect x="330" y="352" width="160" height="40" rx="1"/><rect x="495" y="352" width="160" height="40" rx="1"/>
    <rect x="660" y="352" width="160" height="40" rx="1"/><rect x="825" y="352" width="160" height="40" rx="1"/>
    <rect x="990" y="352" width="160" height="40" rx="1"/><rect x="1155" y="352" width="160" height="40" rx="1"/>
    <rect x="-80" y="396" width="160" height="40" rx="1"/><rect x="85" y="396" width="160" height="40" rx="1"/>
    <rect x="250" y="396" width="160" height="40" rx="1"/><rect x="415" y="396" width="160" height="40" rx="1"/>
    <rect x="580" y="396" width="160" height="40" rx="1"/><rect x="745" y="396" width="160" height="40" rx="1"/>
    <rect x="910" y="396" width="160" height="40" rx="1"/><rect x="1075" y="396" width="160" height="40" rx="1"/>
    <rect x="0" y="440" width="160" height="40" rx="1"/><rect x="165" y="440" width="160" height="40" rx="1"/>
    <rect x="330" y="440" width="160" height="40" rx="1"/><rect x="495" y="440" width="160" height="40" rx="1"/>
    <rect x="660" y="440" width="160" height="40" rx="1"/><rect x="825" y="440" width="160" height="40" rx="1"/>
