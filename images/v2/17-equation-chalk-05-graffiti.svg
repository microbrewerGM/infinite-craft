    <rect x="0" y="528" width="160" height="40" rx="1"/><rect x="165" y="528" width="160" height="40" rx="1"/>
    <rect x="330" y="528" width="160" height="40" rx="1"/><rect x="495" y="528" width="160" height="40" rx="1"/>
    <rect x="660" y="528" width="160" height="40" rx="1"/><rect x="825" y="528" width="160" height="40" rx="1"/>
    <rect x="990" y="528" width="160" height="40" rx="1"/><rect x="1155" y="528" width="160" height="40" rx="1"/>
    <rect x="-80" y="572" width="160" height="40" rx="1"/><rect x="85" y="572" width="160" height="40" rx="1"/>
    <rect x="250" y="572" width="160" height="40" rx="1"/><rect x="415" y="572" width="160" height="40" rx="1"/>
    <rect x="580" y="572" width="160" height="40" rx="1"/><rect x="745" y="572" width="160" height="40" rx="1"/>
    <rect x="910" y="572" width="160" height="40" rx="1"/><rect x="1075" y="572" width="160" height="40" rx="1"/>
  </g>
  <!-- Large background throw-up (bubble letters) -->
  <text x="640" y="430" font-family="Impact, sans-serif" font-size="260" fill="none" stroke="#333" stroke-width="8" text-anchor="middle" opacity="0.15" transform="rotate(-5 640 320)">CRAFT</text>
  <!-- Title - graffiti wildstyle -->
  <text x="640" y="160" font-family="Impact, sans-serif" font-size="100" fill="#ff6b35" text-anchor="middle" filter="url(#drip-shadow)" stroke="#333" stroke-width="3" transform="rotate(-3 640 130)">INFINITE CRAFT</text>
  <!-- Paint drips from title -->
  <path d="M280 160 L278 200 L282 200 Z" fill="#ff6b35" opacity="0.7"/>
  <path d="M520 165 L518 230 L522 230 Z" fill="#ff6b35" opacity="0.6"/>
  <path d="M1000 155 L998 195 L1002 195 Z" fill="#ff6b35" opacity="0.7"/>
  <!-- Graffiti equations -->
  <text x="80" y="280" font-family="Impact, sans-serif" font-size="48" fill="#4ecdc4" filter="url(#spray)">WATER + FIRE</text>
  <text x="580" y="280" font-family="Impact, sans-serif" font-size="48" fill="#ffd93d" filter="url(#spray)">= STEAM</text>
  <text x="120" y="370" font-family="Impact, sans-serif" font-size="44" fill="#c4b5fd" filter="url(#spray)">EARTH + WIND</text>
  <text x="600" y="370" font-family="Impact, sans-serif" font-size="44" fill="#a8e06c" filter="url(#spray)">= DUST</text>
  <text x="80" y="460" font-family="Impact, sans-serif" font-size="42" fill="#ffd93d" filter="url(#spray)">LAVA + WATER</text>
  <text x="560" y="460" font-family="Impact, sans-serif" font-size="42" fill="#ff6b35" filter="url(#spray)">= STONE</text>
  <!-- Spray paint splatters -->
  <g fill="#4ecdc4" opacity="0.3" filter="url(#spray)">
    <circle cx="850" cy="280" r="25"/><circle cx="870" cy="300" r="15"/><circle cx="830" cy="310" r="10"/>
  </g>
  <g fill="#c4b5fd" opacity="0.3" filter="url(#spray)">
    <circle cx="1100" cy="400" r="30"/><circle cx="1130" cy="380" r="18"/><circle cx="1080" cy="420" r="12"/>
  </g>
  <!-- Tag in corner -->
  <text x="1050" y="580" font-family="'Brush Script MT', cursive" font-size="36" fill="#c9c4a1" opacity="0.6" transform="rotate(-10 1050 580)">infinite</text>
  <!-- Crown symbol above title -->
  <path d="M580 50 L600 20 L620 45 L640 15 L660 45 L680 20 L700 50 Z" fill="none" stroke="#ffd93d" stroke-width="3"/>
  <!-- Arrow -->
  <path d="M900 330 Q950 310 980 340" stroke="#a8e06c" stroke-width="4" fill="none"/>
  <polygon points="985,335 995,345 980,345" fill="#a8e06c"/>
  <!-- Ground dirt/debris -->
  <rect x="0" y="615" width="1280" height="25" fill="#444" opacity="0.5"/>
