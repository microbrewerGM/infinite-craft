<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="auroraBlur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="auroraGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0"/>
      <stop offset="20%" stop-color="#4ecdc4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a8e06c" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#4ecdc4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c4b5fd" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ff6b35" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora3" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#a8e06c" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a8e06c" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ffd93d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a8e06c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#000"/>

  <!-- Aurora curtains -->
  <path d="M-50,100 Q200,50 400,120 Q550,160 700,80 Q900,20 1100,100 Q1200,130 1330,90 L1330,350 Q1100,280 900,320 Q700,360 500,300 Q300,250 100,310 L-50,280Z" fill="url(#aurora1)" filter="url(#auroraBlur)"/>
  <path d="M-50,150 Q150,80 350,160 Q500,210 650,130 Q850,60 1050,140 Q1200,190 1330,150 L1330,380 Q1100,320 900,360 Q650,400 400,340 Q200,300 -50,350Z" fill="url(#aurora2)" filter="url(#auroraBlur)"/>
  <path d="M100,120 Q300,70 500,150 Q700,210 900,130 Q1050,80 1200,140 L1200,320 Q1000,280 800,330 Q600,370 400,300 Q200,250 100,290Z" fill="url(#aurora3)" filter="url(#auroraBlur)"/>

  <!-- Sharper aurora streaks -->
  <path d="M200,100 Q300,200 250,350" stroke="#4ecdc4" stroke-opacity="0.15" fill="none" stroke-width="40" filter="url(#auroraBlur)"/>
  <path d="M500,60 Q550,180 480,320" stroke="#a8e06c" stroke-opacity="0.12" fill="none" stroke-width="35" filter="url(#auroraBlur)"/>
  <path d="M800,80 Q830,200 790,340" stroke="#4ecdc4" stroke-opacity="0.15" fill="none" stroke-width="30" filter="url(#auroraBlur)"/>
  <path d="M1050,70 Q1080,190 1040,310" stroke="#c4b5fd" stroke-opacity="0.1" fill="none" stroke-width="35" filter="url(#auroraBlur)"/>

  <!-- Stars -->
  <circle cx="100" cy="50" r="1" fill="white" opacity="0.7"/>
  <circle cx="250" cy="30" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="400" cy="45" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="600" cy="25" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="750" cy="55" r="1" fill="white" opacity="0.4"/>
  <circle cx="950" cy="35" r="1.1" fill="white" opacity="0.6"/>
  <circle cx="1150" cy="50" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="180" cy="420" r="0.8" fill="white" opacity="0.3"/>
  <circle cx="1080" cy="400" r="1" fill="white" opacity="0.3"/>

  <!-- Dark horizon line -->
  <rect x="0" y="480" width="1280" height="160" fill="#000"/>
  <line x1="0" y1="480" x2="1280" y2="480" stroke="white" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Element icons along horizon -->
  <text x="240" y="470" font-size="36" text-anchor="middle" opacity="0.7" filter="url(#auroraGlow)">🔥</text>
  <text x="480" y="460" font-size="36" text-anchor="middle" opacity="0.7" filter="url(#auroraGlow)">💧</text>
  <text x="780" y="465" font-size="36" text-anchor="middle" opacity="0.7" filter="url(#auroraGlow)">🌍</text>
  <text x="1020" y="470" font-size="36" text-anchor="middle" opacity="0.7" filter="url(#auroraGlow)">💨</text>

  <!-- Title -->
  <text x="640" y="560" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="white" text-anchor="middle" letter-spacing="18" opacity="0.92">INFINITE CRAFT</text>
  <text x="640" y="595" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#a8e06c" text-anchor="middle" letter-spacing="6" opacity="0.4">AURORA EDITION</text>
</svg>