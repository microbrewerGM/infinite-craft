<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg15" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#020208"/>
    </radialGradient>
    <filter id="qglow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="waveGlow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg15)"/>
  <!-- Entangled particle pairs with wavy connections -->
  <!-- Pair 1: top -->
  <g filter="url(#qglow)">
    <circle cx="280" cy="140" r="16" fill="none" stroke="#ff6b35" stroke-width="2.5" opacity="0.8"/>
    <circle cx="280" cy="140" r="6" fill="#ff6b35" opacity="0.9"/>
    <circle cx="280" cy="140" r="24" fill="none" stroke="#ff6b35" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>
    <circle cx="1000" cy="140" r="16" fill="none" stroke="#ff6b35" stroke-width="2.5" opacity="0.8"/>
    <circle cx="1000" cy="140" r="6" fill="#ff6b35" opacity="0.9"/>
    <circle cx="1000" cy="140" r="24" fill="none" stroke="#ff6b35" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>
  </g>
  <path d="M304,140 Q400,100 500,140 Q600,180 700,140 Q800,100 900,140 Q950,160 976,140" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.4" filter="url(#waveGlow)"/>
  <path d="M304,140 Q400,180 500,140 Q600,100 700,140 Q800,180 900,140 Q950,120 976,140" fill="none" stroke="#ff6b35" stroke-width="0.8" opacity="0.2"/>

  <!-- Pair 2: upper mid -->
  <g filter="url(#qglow)">
    <circle cx="180" cy="260" r="18" fill="none" stroke="#4ecdc4" stroke-width="2.5" opacity="0.8"/>
    <circle cx="180" cy="260" r="7" fill="#4ecdc4" opacity="0.9"/>
    <circle cx="180" cy="260" r="28" fill="none" stroke="#4ecdc4" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>
    <circle cx="1100" cy="260" r="18" fill="none" stroke="#4ecdc4" stroke-width="2.5" opacity="0.8"/>
    <circle cx="1100" cy="260" r="7" fill="#4ecdc4" opacity="0.9"/>
    <circle cx="1100" cy="260" r="28" fill="none" stroke="#4ecdc4" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>
  </g>
  <path d="M208,260 Q350,220 500,260 Q640,300 780,260 Q920,220 1000,260 Q1050,280 1072,260" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.4" filter="url(#waveGlow)"/>
  <path d="M208,260 Q350,300 500,260 Q640,220 780,260 Q920,300 1000,260 Q1050,240 1072,260" fill="none" stroke="#4ecdc4" stroke-width="0.8" opacity="0.2"/>

  <!-- Pair 3: center -->
  <g filter="url(#qglow)">
    <circle cx="320" cy="370" r="20" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0.8"/>
    <circle cx="320" cy="370" r="8" fill="#c4b5fd" opacity="0.9"/>
    <circle cx="320" cy="370" r="30" fill="none" stroke="#c4b5fd" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,3"/>
    <circle cx="960" cy="370" r="20" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0.8"/>
    <circle cx="960" cy="370" r="8" fill="#c4b5fd" opacity="0.9"/>
    <circle cx="960" cy="370" r="30" fill="none" stroke="#c4b5fd" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,3"/>
  </g>
  <path d="M350,370 Q450,330 550,370 Q640,410 730,370 Q830,330 900,370 Q930,385 940,370" fill="none" stroke="#c4b5fd" stroke-width="1.8" opacity="0.4" filter="url(#waveGlow)"/>
  <path d="M350,370 Q450,410 550,370 Q640,330 730,370 Q830,410 900,370 Q930,355 940,370" fill="none" stroke="#c4b5fd" stroke-width="0.8" opacity="0.2"/>

  <!-- Pair 4: lower -->
  <g filter="url(#qglow)">
    <circle cx="220" cy="490" r="15" fill="none" stroke="#ffd93d" stroke-width="2" opacity="0.7"/>
    <circle cx="220" cy="490" r="5.5" fill="#ffd93d" opacity="0.9"/>
    <circle cx="220" cy="490" r="22" fill="none" stroke="#ffd93d" stroke-width="0.7" opacity="0.25" stroke-dasharray="3,3"/>
    <circle cx="1060" cy="490" r="15" fill="none" stroke="#ffd93d" stroke-width="2" opacity="0.7"/>
    <circle cx="1060" cy="490" r="5.5" fill="#ffd93d" opacity="0.9"/>
    <circle cx="1060" cy="490" r="22" fill="none" stroke="#ffd93d" stroke-width="0.7" opacity="0.25" stroke-dasharray="3,3"/>
  </g>
  <path d="M242,490 Q380,455 520,490 Q640,525 760,490 Q900,455 980,490 Q1020,505 1038,490" fill="none" stroke="#ffd93d" stroke-width="1.2" opacity="0.35" filter="url(#waveGlow)"/>
  <path d="M242,490 Q380,525 520,490 Q640,455 760,490 Q900,525 980,490 Q1020,475 1038,490" fill="none" stroke="#ffd93d" stroke-width="0.7" opacity="0.18"/>

  <!-- Pair 5: bottom -->
  <g filter="url(#qglow)">
    <circle cx="400" cy="570" r="13" fill="none" stroke="#a8e06c" stroke-width="2" opacity="0.6"/>
    <circle cx="400" cy="570" r="5" fill="#a8e06c" opacity="0.8"/>
    <circle cx="880" cy="570" r="13" fill="none" stroke="#a8e06c" stroke-width="2" opacity="0.6"/>
    <circle cx="880" cy="570" r="5" fill="#a8e06c" opacity="0.8"/>
  </g>
  <path d="M415,570 Q500,545 580,570 Q640,590 700,570 Q780,545 865,570" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.3" filter="url(#waveGlow)"/>
  <path d="M415,570 Q500,595 580,570 Q640,550 700,570 Q780,595 865,570" fill="none" stroke="#a8e06c" stroke-width="0.6" opacity="0.15"/>

  <!-- Cross-entanglement faint lines -->
  <g fill="none" stroke="white" stroke-width="0.4" opacity="0.08">
    <line x1="280" y1="140" x2="180" y2="260"/>
    <line x1="1000" y1="140" x2="1100" y2="260"/>
    <line x1="180" y1="260" x2="320" y2="370"/>
    <line x1="1100" y1="260" x2="960" y2="370"/>
    <line x1="320" y1="370" x2="220" y2="490"/>
    <line x1="960" y1="370" x2="1060" y2="490"/>
    <line x1="220" y1="490" x2="400" y2="570"/>
    <line x1="1060" y1="490" x2="880" y2="570"/>
  </g>

  <!-- Spin arrows on particles -->
  <g fill="none" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <path d="M275,128 Q268,125 272,132" stroke="#ff6b35"/>
    <path d="M1005,152 Q1012,155 1008,148" stroke="#ff6b35"/>
    <path d="M175,248 Q168,245 172,252" stroke="#4ecdc4"/>
    <path d="M1105,272 Q1112,275 1108,268" stroke="#4ecdc4"/>
  </g>

  <!-- Title -->
  <text x="640" y="310" font-family="'Courier New', monospace" font-size="66" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central" filter="url(#qglow)" opacity="0.9" letter-spacing="2">INFINITE CRAFT</text>
  <text x="640" y="362" font-family="'Courier New', monospace" font-size="13" fill="#c4b5fd" text-anchor="middle" letter-spacing="10" opacity="0.5">QUANTUM ENTANGLEMENT</text>
</svg>