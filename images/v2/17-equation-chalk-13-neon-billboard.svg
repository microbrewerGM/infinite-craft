<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="neon-glow-orange">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff6b35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/><feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-glow-teal">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#4ecdc4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/><feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-glow-purple">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#c4b5fd" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/><feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-glow-yellow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ffd93d" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/><feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-glow-green">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#a8e06c" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/><feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-glow-white">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffffff" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/><feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark city night background -->
  <rect width="1280" height="640" fill="#0a0a14"/>
  <!-- Distant building silhouettes -->
  <g fill="#111120">
    <rect x="0" y="520" width="100" height="120"/>
    <rect x="110" y="480" width="80" height="160"/>
    <rect x="200" y="540" width="120" height="100"/>
    <rect x="340" y="500" width="90" height="140"/>
    <rect x="450" y="530" width="70" height="110"/>
    <rect x="540" y="490" width="110" height="150"/>
    <rect x="670" y="510" width="80" height="130"/>
    <rect x="770" y="470" width="100" height="170"/>
    <rect x="890" y="520" width="90" height="120"/>
    <rect x="990" y="480" width="120" height="160"/>
    <rect x="1130" y="500" width="80" height="140"/>
    <rect x="1220" y="530" width="60" height="110"/>
  </g>
  <!-- Window lights on buildings -->
  <g fill="#ffd93d" opacity="0.15">
    <rect x="120" y="500" width="6" height="8"/><rect x="140" y="510" width="6" height="8"/>
    <rect x="125" y="520" width="6" height="8"/><rect x="150" y="530" width="6" height="8"/>
    <rect x="790" y="490" width="6" height="8"/><rect x="810" y="510" width="6" height="8"/>
    <rect x="830" y="500" width="6" height="8"/><rect x="800" y="530" width="6" height="8"/>
    <rect x="1010" y="500" width="6" height="8"/><rect x="1030" y="510" width="6" height="8"/>
    <rect x="1050" y="490" width="6" height="8"/>
  </g>
  <!-- Main title neon sign -->
  <text x="640" y="100" font-family="'Arial Black', sans-serif" font-size="80" fill="#ff6b35" text-anchor="middle" filter="url(#neon-glow-orange)" letter-spacing="4">INFINITE CRAFT</text>
  <!-- Neon border around title -->
  <rect x="140" y="30" width="1000" height="95" fill="none" stroke="#ff6b35" stroke-width="2" rx="10" filter="url(#neon-glow-orange)" opacity="0.5"/>
  <!-- Equation neon signs -->
  <text x="200" y="200" font-family="'Arial', sans-serif" font-size="38" fill="#4ecdc4" filter="url(#neon-glow-teal)">Water + Fire</text>
  <text x="560" y="200" font-family="'Arial', sans-serif" font-size="38" fill="#ffd93d" filter="url(#neon-glow-yellow)">=</text>
  <text x="610" y="200" font-family="'Arial', sans-serif" font-size="38" fill="#c9c4a1" filter="url(#neon-glow-white)">Steam</text>
  <text x="200" y="270" font-family="'Arial', sans-serif" font-size="38" fill="#c4b5fd" filter="url(#neon-glow-purple)">Earth + Wind</text>
  <text x="575" y="270" font-family="'Arial', sans-serif" font-size="38" fill="#ffd93d" filter="url(#neon-glow-yellow)">=</text>
  <text x="625" y="270" font-family="'Arial', sans-serif" font-size="38" fill="#c9c4a1" filter="url(#neon-glow-white)">Dust</text>
  <text x="200" y="340" font-family="'Arial', sans-serif" font-size="38" fill="#a8e06c" filter="url(#neon-glow-green)">Fire + Earth</text>
  <text x="555" y="340" font-family="'Arial', sans-serif" font-size="38" fill="#ffd93d" filter="url(#neon-glow-yellow)">=</text>
  <text x="605" y="340" font-family="'Arial', sans-serif" font-size="38" fill="#ff6b35" filter="url(#neon-glow-orange)">Lava</text>
  <text x="200" y="410" font-family="'Arial', sans-serif" font-size="38" fill="#4ecdc4" filter="url(#neon-glow-teal)">Lava + Water</text>
  <text x="580" y="410" font-family="'Arial', sans-serif" font-size="38" fill="#ffd93d" filter="url(#neon-glow-yellow)">=</text>
  <text x="630" y="410" font-family="'Arial', sans-serif" font-size="38" fill="#c4b5fd" filter="url(#neon-glow-purple)">Stone</text>
  <!-- Right side vertical neon -->
  <text x="950" y="200" font-family="'Arial', sans-serif" font-size="32" fill="#a8e06c" filter="url(#neon-glow-green)">Clay</text>
  <text x="950" y="250" font-family="'Arial', sans-serif" font-size="32" fill="#ff6b35" filter="url(#neon-glow-orange)">Brick</text>
  <text x="950" y="300" font-family="'Arial', sans-serif" font-size="32" fill="#4ecdc4" filter="url(#neon-glow-teal)">Metal</text>
  <text x="950" y="350" font-family="'Arial', sans-serif" font-size="32" fill="#c4b5fd" filter="url(#neon-glow-purple)">Geyser</text>
  <!-- "OPEN" neon sign -->
  <rect x="920" y="400" width="200" height="60" fill="none" stroke="#ff6b35" stroke-width="2" rx="8" filter="url(#neon-glow-orange)" opacity="0.6"/>
  <text x="1020" y="442" font-family="'Arial', sans-serif" font-size="32" fill="#ff6b35" text-anchor="middle" filter="url(#neon-glow-orange)">OPEN 24/7</text>
  <!-- Ambient light reflections on ground -->
  <rect x="0" y="600" width="1280" height="40" fill="#0a0a14"/>
  <g opacity="0.1">
    <rect x="200" y="605" width="300" height="30" fill="#4ecdc4" rx="5"/>
    <rect x="600" y="608" width="200" height="25" fill="#ff6b35" rx="5"/>
    <rect x="900" y="605" width="250" height="30" fill="#c4b5fd" rx="5"/>
  </g>
</svg>