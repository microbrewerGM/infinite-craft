<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="holo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#0f001a"/>
      <stop offset="100%" stop-color="#050010"/>
    </linearGradient>
    <linearGradient id="holo1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/><stop offset="33%" stop-color="#4ecdc4"/><stop offset="66%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
    <linearGradient id="holo2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ecdc4"/><stop offset="50%" stop-color="#a8e06c"/><stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="glitch">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <filter id="holo-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#holo-bg)"/>
  <!-- Horizontal scan lines -->
  <g opacity="0.05">
    <rect x="0" y="0" width="1280" height="2" fill="white"/><rect x="0" y="4" width="1280" height="2" fill="white"/><rect x="0" y="8" width="1280" height="2" fill="white"/><rect x="0" y="12" width="1280" height="2" fill="white"/><rect x="0" y="16" width="1280" height="2" fill="white"/><rect x="0" y="20" width="1280" height="2" fill="white"/><rect x="0" y="24" width="1280" height="2" fill="white"/><rect x="0" y="28" width="1280" height="2" fill="white"/>
  </g>
  <!-- Glitched element grid - main layer -->
  <g font-family="monospace" filter="url(#holo-glow)">
    <g transform="translate(80,60)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo1)" stroke-width="1.5" opacity="0.8"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo1)">Wa</text>
      <text x="40" y="52" text-anchor="middle" font-size="8" fill="#4ecdc4" opacity="0.6">Water</text>
    </g>
    <g transform="translate(170,60)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo2)" stroke-width="1.5" opacity="0.8"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo2)">Fi</text>
      <text x="40" y="52" text-anchor="middle" font-size="8" fill="#ff6b35" opacity="0.6">Fire</text>
    </g>
    <g transform="translate(260,60)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo1)" stroke-width="1.5" opacity="0.8"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo1)">Ea</text>
      <text x="40" y="52" text-anchor="middle" font-size="8" fill="#a8e06c" opacity="0.6">Earth</text>
    </g>
    <g transform="translate(350,60)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo2)" stroke-width="1.5" opacity="0.8"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo2)">Wi</text>
      <text x="40" y="52" text-anchor="middle" font-size="8" fill="#ffd93d" opacity="0.6">Wind</text>
    </g>
    <g transform="translate(440,60)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo1)" stroke-width="1.5" opacity="0.8"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo1)">St</text>
    </g>
    <g transform="translate(530,60)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo2)" stroke-width="1.5" opacity="0.7"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo2)">Lv</text>
    </g>
    <g transform="translate(620,60)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo1)" stroke-width="1.5" opacity="0.6"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo1)">Ic</text>
    </g>
    <g transform="translate(710,60)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo2)" stroke-width="1.5" opacity="0.5"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo2)">Mu</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(110,135)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo2)" stroke-width="1.5" opacity="0.7"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo2)">Sm</text>
    </g>
    <g transform="translate(200,135)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo1)" stroke-width="1.5" opacity="0.7"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo1)">Du</text>
    </g>
    <g transform="translate(290,135)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo2)" stroke-width="1.5" opacity="0.6"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo2)">Pl</text>
    </g>
    <g transform="translate(380,135)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo1)" stroke-width="1.5" opacity="0.5"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo1)">Vo</text>
    </g>
    <g transform="translate(470,135)">
      <rect width="80" height="60" rx="2" fill="none" stroke="url(#holo2)" stroke-width="1.5" opacity="0.4"/>
      <text x="40" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#holo2)">Gl</text>
    </g>
  </g>
  <!-- Glitch offset layer (red channel) -->
  <g font-family="monospace" opacity="0.3">
    <text x="85" y="96" font-size="22" font-weight="bold" fill="#ff0040">Wa</text>
    <text x="175" y="96" font-size="22" font-weight="bold" fill="#ff0040">Fi</text>
    <text x="265" y="96" font-size="22" font-weight="bold" fill="#ff0040">Ea</text>
    <text x="355" y="96" font-size="22" font-weight="bold" fill="#ff0040">Wi</text>
  </g>
  <!-- Glitch offset layer (cyan channel) -->
  <g font-family="monospace" opacity="0.2">
    <text x="123" y="100" font-size="22" font-weight="bold" fill="#00ffff">Wa</text>
    <text x="213" y="100" font-size="22" font-weight="bold" fill="#00ffff">Fi</text>
    <text x="303" y="100" font-size="22" font-weight="bold" fill="#00ffff">Ea</text>
    <text x="393" y="100" font-size="22" font-weight="bold" fill="#00ffff">Wi</text>
  </g>
  <!-- Glitch bars -->
  <rect x="0" y="210" width="1280" height="3" fill="#ff6b35" opacity="0.15"/>
  <rect x="300" y="250" width="600" height="2" fill="#4ecdc4" opacity="0.1"/>
  <rect x="100" y="380" width="900" height="1" fill="#c4b5fd" opacity="0.15"/>
  <rect x="0" y="420" width="1280" height="4" fill="#a8e06c" opacity="0.08"/>
  <!-- Center holographic title -->
  <g filter="url(#holo-glow)">
    <text x="640" y="340" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="80" font-weight="900" fill="url(#holo1)" letter-spacing="8" opacity="0.9">INFINITE</text>
    <text x="640" y="430" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="80" font-weight="900" fill="url(#holo2)" letter-spacing="8" opacity="0.9">CRAFT</text>
  </g>
  <!-- Glitch offsets of title -->
  <text x="644" y="337" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="80" font-weight="900" fill="#ff0040" letter-spacing="8" opacity="0.08">INFINITE</text>
  <text x="636" y="343" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="80" font-weight="900" fill="#00ffff" letter-spacing="8" opacity="0.08">INFINITE</text>
  <text x="644" y="427" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="80" font-weight="900" fill="#ff0040" letter-spacing="8" opacity="0.08">CRAFT</text>
  <text x="636" y="433" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="80" font-weight="900" fill="#00ffff" letter-spacing="8" opacity="0.08">CRAFT</text>
  <!-- Bottom info -->
  <text x="640" y="500" text-anchor="middle" font-family="monospace" font-size="14" fill="#c4b5fd" opacity="0.6" letter-spacing="6">HOLOGRAPHIC ELEMENT INDEX</text>
  <text x="640" y="530" text-anchor="middle" font-family="monospace" font-size="13" fill="#ff6b35" opacity="0.5">8,579 elements discovered</text>
  <!-- Random noise rectangles -->
  <rect x="50" y="480" width="40" height="3" fill="#4ecdc4" opacity="0.2"/>
  <rect x="800" y="290" width="80" height="2" fill="#ff6b35" opacity="0.15"/>
  <rect x="1100" y="500" width="60" height="2" fill="#a8e06c" opacity="0.2"/>
  <rect x="200" y="550" width="30" height="4" fill="#ffd93d" opacity="0.1"/>
  <rect x="950" y="180" width="100" height="1" fill="#c4b5fd" opacity="0.2"/>
</svg>