<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="zp-glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="zp-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>
  <ellipse cx="640" cy="320" rx="250" ry="280" fill="url(#zp-center)" opacity="0.3"/>

  <!-- Left fabric -->
  <path d="M 0 0 L 580 0 L 580 640 L 0 640 Z" fill="#0f0f1e" opacity="0.5"/>
  <!-- Right fabric -->
  <path d="M 700 0 L 1280 0 L 1280 640 L 700 640 Z" fill="#0f0f1e" opacity="0.5"/>

  <!-- Left zipper tape -->
  <rect x="570" y="0" width="20" height="640" fill="#ff6b35" opacity="0.15"/>
  <line x1="580" y1="0" x2="580" y2="640" stroke="#ff6b35" stroke-width="2" opacity="0.4"/>

  <!-- Right zipper tape -->
  <rect x="690" y="0" width="20" height="640" fill="#4ecdc4" opacity="0.15"/>
  <line x1="700" y1="0" x2="700" y2="640" stroke="#4ecdc4" stroke-width="2" opacity="0.4"/>

  <!-- Interlocked teeth (top section - closed) -->
  <!-- Each tooth pair meshes together -->
  <g opacity="0.8">
    <!-- Tooth pair 1 -->
    <rect x="580" y="30" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.6"/>
    <rect x="670" y="30" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.6"/>
    <rect x="608" y="28" width="64" height="12" rx="2" fill="#ffd93d" opacity="0.2"/>
    <!-- Tooth pair 2 -->
    <rect x="580" y="60" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.6"/>
    <rect x="670" y="60" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.6"/>
    <rect x="608" y="58" width="64" height="12" rx="2" fill="#ffd93d" opacity="0.2"/>
    <!-- Tooth pair 3 -->
    <rect x="580" y="90" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.6"/>
    <rect x="670" y="90" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.6"/>
    <rect x="608" y="88" width="64" height="12" rx="2" fill="#ffd93d" opacity="0.2"/>
    <!-- Tooth pair 4 -->
    <rect x="580" y="120" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.6"/>
    <rect x="670" y="120" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.6"/>
    <rect x="608" y="118" width="64" height="12" rx="2" fill="#ffd93d" opacity="0.2"/>
    <!-- Tooth pair 5 -->
    <rect x="580" y="150" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.6"/>
    <rect x="670" y="150" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.6"/>
    <rect x="608" y="148" width="64" height="12" rx="2" fill="#ffd93d" opacity="0.2"/>
    <!-- Tooth pair 6 -->
    <rect x="580" y="180" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.6"/>
    <rect x="670" y="180" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.6"/>
    <rect x="608" y="178" width="64" height="12" rx="2" fill="#ffd93d" opacity="0.2"/>
    <!-- Tooth pair 7 -->
    <rect x="580" y="210" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.6"/>
    <rect x="670" y="210" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.6"/>
    <rect x="608" y="208" width="64" height="12" rx="2" fill="#ffd93d" opacity="0.2"/>
    <!-- Tooth pair 8 -->
    <rect x="580" y="240" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.6"/>
    <rect x="670" y="240" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.6"/>
    <rect x="608" y="238" width="64" height="12" rx="2" fill="#ffd93d" opacity="0.2"/>
    <!-- Tooth pair 9 -->
    <rect x="580" y="270" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.6"/>
    <rect x="670" y="270" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.6"/>
    <rect x="608" y="268" width="64" height="12" rx="2" fill="#ffd93d" opacity="0.2"/>
  </g>

  <!-- Slider/Pull tab -->
  <g transform="translate(640, 310)">
    <!-- Slider body -->
    <rect x="-30" y="-20" width="60" height="40" rx="6" fill="#2a2a3a" stroke="#ffd93d" stroke-width="2" opacity="0.9"/>
    <rect x="-25" y="-15" width="50" height="30" rx="4" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.3"/>
    <!-- Pull tab -->
    <path d="M 0 20 L 0 55 Q -8 62 0 68 Q 8 62 0 55" fill="none" stroke="#ffd93d" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="68" r="4" fill="#ffd93d" opacity="0.4"/>
    <!-- Glow -->
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="#ffd93d" opacity="0.08" filter="url(#zp-glow)"/>
  </g>

  <!-- Open teeth below slider (separated) -->
  <g opacity="0.6">
    <rect x="560" y="370" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.5"/>
    <rect x="690" y="370" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.5"/>
    <rect x="550" y="400" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.45"/>
    <rect x="700" y="400" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.45"/>
    <rect x="540" y="430" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.4"/>
    <rect x="710" y="430" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.4"/>
    <rect x="530" y="460" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.35"/>
    <rect x="720" y="460" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.35"/>
    <rect x="520" y="490" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.3"/>
    <rect x="730" y="490" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.3"/>
    <rect x="510" y="520" width="30" height="8" rx="1" fill="#ff6b35" opacity="0.25"/>
    <rect x="740" y="520" width="30" height="8" rx="1" fill="#4ecdc4" opacity="0.25"/>
  </g>

  <!-- Merge glow line where teeth interlock -->
  <line x1="640" y1="28" x2="640" y2="290" stroke="#ffd93d" stroke-width="2" opacity="0.2" filter="url(#zp-glow)"/>

  <!-- Title -->
  <text x="250" y="200" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE</text>
  <text x="1030" y="200" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">CRAFT</text>
  <text x="640" y="620" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#ffd93d" opacity="0.6" letter-spacing="4">ZIPPER</text>
</svg>