<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="spark">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wire-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="schematic-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1a2030" stroke-width="0.3"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1a2030" stroke-width="0.3"/>
    </pattern>
  </defs>
  <!-- Dark schematic background -->
  <rect width="1280" height="640" fill="#0a1020"/>
  <rect width="1280" height="640" fill="url(#schematic-grid)"/>
  <!-- High voltage transmission lines across top -->
  <g stroke="#ffd93d" stroke-width="2" filter="url(#wire-glow)" opacity="0.6">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="75" x2="1280" y2="75"/>
    <line x1="0" y1="90" x2="1280" y2="90"/>
  </g>
  <!-- Transmission towers -->
  <g stroke="#888" stroke-width="2" fill="none">
    <!-- Tower 1 -->
    <line x1="200" y1="40" x2="200" y2="130"/>
    <line x1="180" y1="130" x2="220" y2="130"/>
    <line x1="185" y1="55" x2="215" y2="55"/>
    <line x1="175" y1="70" x2="225" y2="70"/>
    <line x1="165" y1="85" x2="235" y2="85"/>
    <line x1="200" y1="55" x2="185" y2="70"/><line x1="200" y1="55" x2="215" y2="70"/>
    <line x1="200" y1="70" x2="185" y2="85"/><line x1="200" y1="70" x2="215" y2="85"/>
    <!-- Insulators -->
    <circle cx="175" cy="60" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="225" cy="60" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="165" cy="75" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="235" cy="75" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="160" cy="90" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="240" cy="90" r="3" fill="#4ecdc4" opacity="0.6"/>
  </g>
  <g stroke="#888" stroke-width="2" fill="none">
    <!-- Tower 2 -->
    <line x1="640" y1="40" x2="640" y2="130"/>
    <line x1="620" y1="130" x2="660" y2="130"/>
    <line x1="625" y1="55" x2="655" y2="55"/>
    <line x1="615" y1="70" x2="665" y2="70"/>
    <line x1="605" y1="85" x2="675" y2="85"/>
    <line x1="640" y1="55" x2="625" y2="70"/><line x1="640" y1="55" x2="655" y2="70"/>
    <line x1="640" y1="70" x2="625" y2="85"/><line x1="640" y1="70" x2="655" y2="85"/>
    <circle cx="615" cy="60" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="665" cy="60" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="605" cy="75" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="675" cy="75" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="600" cy="90" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="680" cy="90" r="3" fill="#4ecdc4" opacity="0.6"/>
  </g>
  <g stroke="#888" stroke-width="2" fill="none">
    <!-- Tower 3 -->
    <line x1="1080" y1="40" x2="1080" y2="130"/>
    <line x1="1060" y1="130" x2="1100" y2="130"/>
    <line x1="1065" y1="55" x2="1095" y2="55"/>
    <line x1="1055" y1="70" x2="1105" y2="70"/>
    <line x1="1045" y1="85" x2="1115" y2="85"/>
    <line x1="1080" y1="55" x2="1065" y2="70"/><line x1="1080" y1="55" x2="1095" y2="70"/>
    <line x1="1080" y1="70" x2="1065" y2="85"/><line x1="1080" y1="70" x2="1095" y2="85"/>
    <circle cx="1055" cy="60" r="3" fill="#4ecdc4" opacity="0.6"/>
    <circle cx="1105" cy="60" r="3" fill="#4ecdc4" opacity="0.6"/>
  </g>
  <!-- FIRE POWER PLANT (top left) -->
  <rect x="50" y="160" width="200" height="120" rx="4" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.7"/>
  <text x="150" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ff6b35">FIRE</text>
  <text x="150" y="210" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#ff6b35" opacity="0.7">THERMAL PLANT</text>
  <text x="150" y="225" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#ff6b35" opacity="0.5">500 MW</text>
  <!-- Generator symbol -->
  <circle cx="150" cy="250" r="12" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="150" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#ff6b35">G</text>
  <!-- Step-up transformer symbol -->
  <g transform="translate(300,210)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
    <circle cx="20" cy="0" r="15" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="10" y="-20" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ffd93d">STEP UP</text>
    <text x="10" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ffd93d">500kV</text>
  </g>
  <line x1="250" y1="220" x2="285" y2="210" stroke="#ff6b35" stroke-width="1.5"/>
  <line x1="335" y1="210" x2="400" y2="210" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="400" y1="210" x2="400" y2="90" stroke="#ffd93d" stroke-width="1.5"/>
  <!-- WATER HYDRO PLANT (left center) -->
  <rect x="50" y="340" width="200" height="120" rx="4" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.7"/>
  <text x="150" y="375" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#4ecdc4">WATER</text>
  <text x="150" y="390" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#4ecdc4" opacity="0.7">HYDRO PLANT</text>
  <text x="150" y="405" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#4ecdc4" opacity="0.5">300 MW</text>
  <circle cx="150" cy="430" r="12" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="150" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#4ecdc4">G</text>
  <line x1="250" y1="400" x2="400" y2="400" stroke="#4ecdc4" stroke-width="1.5"/>
  <line x1="400" y1="400" x2="400" y2="310" stroke="#4ecdc4" stroke-width="1.5"/>
  <!-- SUBSTATION 1 (center) -->
  <rect x="350" y="290" width="200" height="80" rx="4" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.5" stroke-dasharray="5 3"/>
  <text x="450" y="315" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#ffd93d">SUBSTATION A</text>
  <!-- Breaker symbols -->
  <g transform="translate(420,340)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="10" y2="0" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="10" y1="0" x2="10" y2="-5" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="5" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="6" fill="#ffd93d">CB1</text>
  </g>
  <g transform="translate(470,340)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="10" y2="0" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="10" y1="0" x2="10" y2="-5" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="5" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="6" fill="#ffd93d">CB2</text>
  </g>
  <!-- Bus bar -->
  <line x1="380" y1="330" x2="520" y2="330" stroke="#ffd93d" stroke-width="3"/>
  <!-- Distribution lines from substation -->
  <line x1="550" y1="330" x2="650" y2="330" stroke="#a8e06c" stroke-width="1.5"/>
  <!-- Step-down transformer -->
  <g transform="translate(660,320)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#a8e06c" stroke-width="1.5"/>
    <circle cx="16" cy="0" r="12" fill="none" stroke="#a8e06c" stroke-width="1.5"/>
    <text x="8" y="-18" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#a8e06c">STEP DN</text>
    <text x="8" y="24" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#a8e06c">33kV</text>
  </g>
  <!-- Distribution network right side -->
  <line x1="690" y1="320" x2="780" y2="320" stroke="#a8e06c" stroke-width="1.5"/>
  <!-- EARTH DISTRIBUTION -->
  <rect x="780" y="260" width="180" height="120" rx="4" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.5" stroke-dasharray="5 3"/>
  <text x="870" y="285" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#a8e06c">EARTH DISTRICT</text>
  <!-- Load symbols -->
  <g transform="translate(820,310)">
    <path d="M0,0 L15,25 L-15,25 Z" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <text x="0" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#a8e06c">LOAD</text>
  </g>
  <g transform="translate(870,310)">
    <path d="M0,0 L15,25 L-15,25 Z" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <text x="0" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#a8e06c">LOAD</text>
  </g>
  <g transform="translate(920,310)">
    <path d="M0,0 L15,25 L-15,25 Z" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <text x="0" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#a8e06c">LOAD</text>
  </g>
  <!-- WIND FARM (top right) -->
  <rect x="1020" y="160" width="200" height="120" rx="4" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.7"/>
  <text x="1120" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#c4b5fd">WIND</text>
  <text x="1120" y="210" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#c4b5fd" opacity="0.7">WIND FARM</text>
  <text x="1120" y="225" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#c4b5fd" opacity="0.5">200 MW</text>
  <circle cx="1120" cy="250" r="12" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1120" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c4b5fd">G</text>
  <line x1="1020" y1="220" x2="960" y2="220" stroke="#c4b5fd" stroke-width="1.5"/>
  <line x1="960" y1="220" x2="960" y2="330" stroke="#c4b5fd" stroke-width="1.5"/>
  <!-- SUBSTATION 2 (right) -->
  <rect x="1020" y="340" width="200" height="80" rx="4" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.5" stroke-dasharray="5 3"/>
  <text x="1120" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#ffd93d">SUBSTATION B</text>
  <line x1="960" y1="380" x2="1020" y2="380" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="1050" y1="390" x2="1050" y2="410" stroke="#ffd93d" stroke-width="1"/>
  <line x1="1100" y1="390" x2="1100" y2="410" stroke="#ffd93d" stroke-width="1"/>
  <line x1="1150" y1="390" x2="1150" y2="410" stroke="#ffd93d" stroke-width="1"/>
  <!-- Bus bar -->
  <line x1="1040" y1="380" x2="1180" y2="380" stroke="#ffd93d" stroke-width="3"/>
  <!-- Spark/arc effect -->
  <g filter="url(#spark)">
    <circle cx="400" cy="150" r="4" fill="#ffd93d" opacity="0.8"/>
    <circle cx="640" cy="130" r="3" fill="#ffd93d" opacity="0.6"/>
    <circle cx="960" cy="330" r="3" fill="#c4b5fd" opacity="0.7"/>
  </g>
  <!-- Monitoring panel -->
  <rect x="350" y="440" width="580" height="120" rx="5" fill="#0a0a15" stroke="#333" stroke-width="1"/>
  <text x="640" y="465" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#888">SCADA MONITORING</text>
  <!-- Status indicators -->
  <g font-family="'Courier New', monospace" font-size="9">
    <circle cx="380" cy="490" r="4" fill="#a8e06c"/><text x="395" y="494" fill="#a8e06c">FIRE GEN: ONLINE  500MW</text>
    <circle cx="380" cy="510" r="4" fill="#a8e06c"/><text x="395" y="514" fill="#4ecdc4">WATER GEN: ONLINE  285MW</text>
    <circle cx="380" cy="530" r="4" fill="#ffd93d"/><text x="395" y="534" fill="#ffd93d">WIND GEN: VARIABLE  142MW</text>
    <circle cx="700" cy="490" r="4" fill="#a8e06c"/><text x="715" y="494" fill="#a8e06c">GRID FREQ: 60.01 Hz</text>
    <circle cx="700" cy="510" r="4" fill="#a8e06c"/><text x="715" y="514" fill="#a8e06c">VOLTAGE: 500kV NOMINAL</text>
    <circle cx="700" cy="530" r="4" fill="#ff6b35"/><text x="715" y="534" fill="#ff6b35">LOAD: 87% CAPACITY</text>
  </g>
  <!-- Title -->
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#fff" font-weight="bold" letter-spacing="6">INFINITE CRAFT</text>
  <text x="640" y="625" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#ffd93d" letter-spacing="3">POWER GRID TOPOLOGY</text>
</svg>