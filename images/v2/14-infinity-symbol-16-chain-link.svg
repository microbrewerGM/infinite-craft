<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="30%" stop-color="#ccc"/>
      <stop offset="50%" stop-color="#fff"/>
      <stop offset="70%" stop-color="#ccc"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="30%" stop-color="#777"/>
      <stop offset="70%" stop-color="#777"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <filter id="chainGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="chainShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- Subtle floor reflection -->
  <ellipse cx="640" cy="450" rx="500" ry="50" fill="#111" opacity="0.5"/>
  <!-- Chain links forming infinity shape -->
  <!-- Each link is an elongated oval/rounded-rect -->
  <!-- Link 1 - far left (vertical orientation) -->
  <g filter="url(#chainShadow)">
    <rect x="260" y="268" width="30" height="64" rx="15" fill="none" stroke="url(#steel)" stroke-width="8"/>
    <rect x="264" y="272" width="22" height="56" rx="11" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
  </g>
  <!-- Link 2 - tilted left -->
  <g filter="url(#chainShadow)" transform="rotate(-35 320 270)">
    <rect x="295" y="238" width="28" height="58" rx="14" fill="none" stroke="url(#steel)" stroke-width="7"/>
    <rect x="299" y="242" width="20" height="50" rx="10" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
  </g>
  <!-- Link 3 - more tilted -->
  <g filter="url(#chainShadow)" transform="rotate(-55 380 230)">
    <rect x="356" y="200" width="28" height="56" rx="14" fill="none" stroke="url(#accent1)" stroke-width="7"/>
  </g>
  <!-- Link 4 -->
  <g filter="url(#chainShadow)" transform="rotate(-40 440 215)">
    <rect x="416" y="186" width="28" height="54" rx="14" fill="none" stroke="url(#steel)" stroke-width="7"/>
  </g>
  <!-- Link 5 -->
  <g filter="url(#chainShadow)" transform="rotate(-20 510 240)">
    <rect x="486" y="212" width="28" height="54" rx="14" fill="none" stroke="url(#steelDark)" stroke-width="7"/>
  </g>
  <!-- Link 6 -->
  <g filter="url(#chainShadow)" transform="rotate(-8 570 260)">
    <rect x="548" y="234" width="26" height="52" rx="13" fill="none" stroke="url(#steel)" stroke-width="6"/>
  </g>
  <!-- Link 7 - center crossing, colored -->
  <g filter="url(#chainShadow)">
    <rect x="614" y="268" width="28" height="60" rx="14" fill="none" stroke="#4ecdc4" stroke-width="8" filter="url(#chainGlow)"/>
    <rect x="618" y="272" width="20" height="52" rx="10" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Link 8 -->
  <g filter="url(#chainShadow)" transform="rotate(8 700 260)">
    <rect x="680" y="234" width="26" height="52" rx="13" fill="none" stroke="url(#steel)" stroke-width="6"/>
  </g>
  <!-- Link 9 -->
  <g filter="url(#chainShadow)" transform="rotate(20 760 240)">
    <rect x="738" y="212" width="28" height="54" rx="14" fill="none" stroke="url(#steelDark)" stroke-width="7"/>
  </g>
  <!-- Link 10 -->
  <g filter="url(#chainShadow)" transform="rotate(40 830 215)">
    <rect x="808" y="186" width="28" height="54" rx="14" fill="none" stroke="url(#steel)" stroke-width="7"/>
  </g>
  <!-- Link 11 - colored -->
  <g filter="url(#chainShadow)" transform="rotate(55 895 230)">
    <rect x="872" y="200" width="28" height="56" rx="14" fill="none" stroke="#c4b5fd" stroke-width="7" filter="url(#chainGlow)"/>
  </g>
  <!-- Link 12 -->
  <g filter="url(#chainShadow)" transform="rotate(35 950 270)">
    <rect x="928" y="238" width="28" height="58" rx="14" fill="none" stroke="url(#steel)" stroke-width="7"/>
  </g>
  <!-- Link 13 - far right -->
  <g filter="url(#chainShadow)">
    <rect x="980" y="268" width="30" height="64" rx="15" fill="none" stroke="url(#steel)" stroke-width="8"/>
    <rect x="984" y="272" width="22" height="56" rx="11" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
  </g>
  <!-- Bottom return path links -->
  <!-- Link B12 -->
  <g filter="url(#chainShadow)" transform="rotate(-35 950 330)">
    <rect x="928" y="304" width="28" height="58" rx="14" fill="none" stroke="url(#steelDark)" stroke-width="7"/>
  </g>
  <!-- Link B11 -->
  <g filter="url(#chainShadow)" transform="rotate(-55 895 370)">
    <rect x="872" y="344" width="28" height="56" rx="14" fill="none" stroke="url(#steel)" stroke-width="7"/>
  </g>
  <!-- Link B10 - colored -->
  <g filter="url(#chainShadow)" transform="rotate(-40 830 385)">
    <rect x="808" y="358" width="28" height="54" rx="14" fill="none" stroke="#ffd93d" stroke-width="7" filter="url(#chainGlow)"/>
  </g>
  <!-- Link B9 -->
  <g filter="url(#chainShadow)" transform="rotate(-20 760 360)">
    <rect x="738" y="334" width="28" height="54" rx="14" fill="none" stroke="url(#steelDark)" stroke-width="7"/>
  </g>
  <!-- Link B8 -->
  <g filter="url(#chainShadow)" transform="rotate(-8 700 340)">
    <rect x="680" y="314" width="26" height="52" rx="13" fill="none" stroke="url(#steel)" stroke-width="6"/>
  </g>
  <!-- Link B6 -->
  <g filter="url(#chainShadow)" transform="rotate(8 570 340)">
    <rect x="548" y="314" width="26" height="52" rx="13" fill="none" stroke="url(#steel)" stroke-width="6"/>
  </g>
  <!-- Link B5 -->
  <g filter="url(#chainShadow)" transform="rotate(20 510 360)">
    <rect x="486" y="334" width="28" height="54" rx="14" fill="none" stroke="url(#steelDark)" stroke-width="7"/>
  </g>
  <!-- Link B4 - colored -->
  <g filter="url(#chainShadow)" transform="rotate(40 440 385)">
    <rect x="416" y="358" width="28" height="54" rx="14" fill="none" stroke="#a8e06c" stroke-width="7" filter="url(#chainGlow)"/>
  </g>
  <!-- Link B3 -->
  <g filter="url(#chainShadow)" transform="rotate(55 380 370)">
    <rect x="356" y="344" width="28" height="56" rx="14" fill="none" stroke="url(#steel)" stroke-width="7"/>
  </g>
  <!-- Link B2 -->
  <g filter="url(#chainShadow)" transform="rotate(35 320 330)">
    <rect x="295" y="304" width="28" height="58" rx="14" fill="none" stroke="url(#steelDark)" stroke-width="7"/>
  </g>
  <!-- Title -->
  <text x="640" y="560" text-anchor="middle" font-family="'Courier New', monospace" font-size="40" font-weight="bold" fill="#ffffff" letter-spacing="12" opacity="0.9">INFINITE CRAFT</text>
  <line x1="360" y1="572" x2="920" y2="572" stroke="#888" stroke-width="0.5" opacity="0.3"/>
</svg>