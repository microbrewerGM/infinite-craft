<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="fw-glow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="fw-soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="fw-trail">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="fw-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#ffd93d" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ff6b35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>

  <!-- Night sky stars -->
  <circle cx="100" cy="60" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="300" cy="40" r="1" fill="#fff" opacity="0.25"/>
  <circle cx="500" cy="80" r="1.5" fill="#fff" opacity="0.2"/>
  <circle cx="900" cy="50" r="1" fill="#fff" opacity="0.35"/>
  <circle cx="1100" cy="70" r="1.5" fill="#fff" opacity="0.2"/>
  <circle cx="1200" cy="100" r="1" fill="#fff" opacity="0.3"/>

  <!-- Left trail (orange) rising from bottom-left -->
  <path d="M 300 600 Q 350 500 400 420 Q 450 350 520 300 Q 580 260 620 240" fill="none" stroke="#ff6b35" stroke-width="4" opacity="0.6"/>
  <path d="M 300 600 Q 350 500 400 420 Q 450 350 520 300 Q 580 260 620 240" fill="none" stroke="#ff6b35" stroke-width="10" opacity="0.1" filter="url(#fw-trail)"/>
  <!-- Trail sparkles -->
  <circle cx="350" cy="500" r="2" fill="#ff6b35" opacity="0.4"/>
  <circle cx="400" cy="420" r="2.5" fill="#ff6b35" opacity="0.45"/>
  <circle cx="450" cy="355" r="2" fill="#ffd93d" opacity="0.35"/>
  <circle cx="520" cy="300" r="2.5" fill="#ff6b35" opacity="0.5"/>
  <circle cx="580" cy="262" r="2" fill="#ffd93d" opacity="0.4"/>
  <!-- Smoke wisps -->
  <path d="M 340 520 Q 330 510 335 495" fill="none" stroke="#fff" stroke-width="1" opacity="0.08"/>
  <path d="M 430 390 Q 420 380 425 365" fill="none" stroke="#fff" stroke-width="1" opacity="0.06"/>

  <!-- Right trail (teal) rising from bottom-right -->
  <path d="M 980 600 Q 930 500 880 420 Q 830 350 760 300 Q 700 260 660 240" fill="none" stroke="#4ecdc4" stroke-width="4" opacity="0.6"/>
  <path d="M 980 600 Q 930 500 880 420 Q 830 350 760 300 Q 700 260 660 240" fill="none" stroke="#4ecdc4" stroke-width="10" opacity="0.1" filter="url(#fw-trail)"/>
  <circle cx="930" cy="500" r="2" fill="#4ecdc4" opacity="0.4"/>
  <circle cx="880" cy="420" r="2.5" fill="#4ecdc4" opacity="0.45"/>
  <circle cx="830" cy="355" r="2" fill="#a8e06c" opacity="0.35"/>
  <circle cx="760" cy="300" r="2.5" fill="#4ecdc4" opacity="0.5"/>
  <circle cx="700" cy="262" r="2" fill="#a8e06c" opacity="0.4"/>
  <path d="M 940 520 Q 950 510 945 495" fill="none" stroke="#fff" stroke-width="1" opacity="0.08"/>

  <!-- Central explosion burst -->
  <circle cx="640" cy="230" r="120" fill="url(#fw-burst)" opacity="0.7"/>
  <circle cx="640" cy="230" r="60" fill="#fff" opacity="0.08" filter="url(#fw-glow)"/>
  <circle cx="640" cy="230" r="15" fill="#fff" opacity="0.6"/>
  <circle cx="640" cy="230" r="8" fill="#fff" opacity="0.9"/>

  <!-- Explosion rays - multi-colored -->
  <!-- Orange rays -->
  <line x1="640" y1="230" x2="640" y2="90" stroke="#ff6b35" stroke-width="3" opacity="0.6"/>
  <line x1="640" y1="230" x2="740" y2="120" stroke="#ff6b35" stroke-width="2.5" opacity="0.5"/>
  <line x1="640" y1="230" x2="530" y2="130" stroke="#ff6b35" stroke-width="2.5" opacity="0.5"/>
  <!-- Teal rays -->
  <line x1="640" y1="230" x2="790" y2="190" stroke="#4ecdc4" stroke-width="3" opacity="0.55"/>
  <line x1="640" y1="230" x2="490" y2="190" stroke="#4ecdc4" stroke-width="3" opacity="0.55"/>
  <line x1="640" y1="230" x2="810" y2="270" stroke="#4ecdc4" stroke-width="2" opacity="0.4"/>
  <line x1="640" y1="230" x2="470" y2="270" stroke="#4ecdc4" stroke-width="2" opacity="0.4"/>
  <!-- Green rays -->
  <line x1="640" y1="230" x2="760" y2="310" stroke="#a8e06c" stroke-width="2.5" opacity="0.45"/>
  <line x1="640" y1="230" x2="520" y2="310" stroke="#a8e06c" stroke-width="2.5" opacity="0.45"/>
  <!-- Purple rays -->
  <line x1="640" y1="230" x2="700" y2="100" stroke="#c4b5fd" stroke-width="2" opacity="0.35"/>
  <line x1="640" y1="230" x2="580" y2="100" stroke="#c4b5fd" stroke-width="2" opacity="0.35"/>
  <!-- Yellow rays -->
  <line x1="640" y1="230" x2="820" y2="230" stroke="#ffd93d" stroke-width="2.5" opacity="0.5"/>
  <line x1="640" y1="230" x2="460" y2="230" stroke="#ffd93d" stroke-width="2.5" opacity="0.5"/>
  <line x1="640" y1="230" x2="640" y2="370" stroke="#ffd93d" stroke-width="2" opacity="0.35"/>

  <!-- Sparks at ray endpoints -->
  <circle cx="640" cy="90" r="4" fill="#ff6b35" opacity="0.7"/>
  <circle cx="740" cy="120" r="3.5" fill="#ff6b35" opacity="0.6"/>
  <circle cx="530" cy="130" r="3.5" fill="#ff6b35" opacity="0.6"/>
  <circle cx="790" cy="190" r="4" fill="#4ecdc4" opacity="0.65"/>
  <circle cx="490" cy="190" r="4" fill="#4ecdc4" opacity="0.65"/>
  <circle cx="810" cy="270" r="3" fill="#4ecdc4" opacity="0.5"/>
  <circle cx="470" cy="270" r="3" fill="#4ecdc4" opacity="0.5"/>
  <circle cx="760" cy="310" r="3.5" fill="#a8e06c" opacity="0.55"/>
  <circle cx="520" cy="310" r="3.5" fill="#a8e06c" opacity="0.55"/>
  <circle cx="700" cy="100" r="3" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="580" cy="100" r="3" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="820" cy="230" r="3.5" fill="#ffd93d" opacity="0.6"/>
  <circle cx="460" cy="230" r="3.5" fill="#ffd93d" opacity="0.6"/>
  <circle cx="640" cy="370" r="3" fill="#ffd93d" opacity="0.5"/>

  <!-- Falling ember particles -->
  <circle cx="580" cy="350" r="1.5" fill="#ff6b35" opacity="0.3"/>
  <circle cx="700" cy="340" r="1.5" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="550" cy="380" r="1" fill="#ffd93d" opacity="0.25"/>
  <circle cx="730" cy="370" r="1" fill="#a8e06c" opacity="0.25"/>
  <circle cx="620" cy="390" r="1.5" fill="#c4b5fd" opacity="0.2"/>
  <circle cx="660" cy="400" r="1" fill="#ff6b35" opacity="0.2"/>

  <!-- Title -->
  <text x="640" y="540" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="580" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#ffd93d" opacity="0.6" letter-spacing="4">FIREWORK BURST</text>
</svg>