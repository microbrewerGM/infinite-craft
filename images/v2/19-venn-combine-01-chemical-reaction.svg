<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow01" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur01">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow01f">
      <feGaussianBlur stdDeviation="8"/>
      <feComposite in="SourceGraphic"/>
    </filter>
    <linearGradient id="liquid-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="liquid-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>
  <ellipse cx="640" cy="320" rx="500" ry="280" fill="url(#glow01)" opacity="0.4"/>

  <!-- Left test tube -->
  <g transform="translate(320, 120) rotate(-30, 60, 200)">
    <rect x="40" y="20" width="40" height="200" rx="5" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.8"/>
    <ellipse cx="60" cy="220" rx="20" ry="8" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.8"/>
    <!-- Liquid -->
    <rect x="42" y="120" width="36" height="98" fill="url(#liquid-orange)" opacity="0.7"/>
    <!-- Pouring stream -->
    <path d="M 75 40 Q 120 80 160 160 Q 180 220 200 280" fill="none" stroke="#ff6b35" stroke-width="6" opacity="0.6" filter="url(#blur01)"/>
    <path d="M 75 40 Q 120 80 160 160 Q 180 220 200 280" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Right test tube -->
  <g transform="translate(760, 120) rotate(30, 60, 200)">
    <rect x="40" y="20" width="40" height="200" rx="5" fill="none" stroke="#4ecdc4" stroke-width="3" opacity="0.8"/>
    <ellipse cx="60" cy="220" rx="20" ry="8" fill="none" stroke="#4ecdc4" stroke-width="3" opacity="0.8"/>
    <!-- Liquid -->
    <rect x="42" y="120" width="36" height="98" fill="url(#liquid-teal)" opacity="0.7"/>
    <!-- Pouring stream -->
    <path d="M 45 40 Q 0 80 -40 160 Q -60 220 -80 280" fill="none" stroke="#4ecdc4" stroke-width="6" opacity="0.6" filter="url(#blur01)"/>
    <path d="M 45 40 Q 0 80 -40 160 Q -60 220 -80 280" fill="none" stroke="#4ecdc4" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Central beaker -->
  <g transform="translate(540, 300)">
    <path d="M 40 0 L 20 120 Q 10 160 40 180 L 160 180 Q 190 160 180 120 L 160 0" fill="none" stroke="#c4b5fd" stroke-width="3"/>
    <path d="M 30 80 L 22 120 Q 12 158 42 178 L 158 178 Q 188 158 178 120 L 170 80 Z" fill="#a8e06c" opacity="0.3"/>
    <path d="M 30 80 L 22 120 Q 12 158 42 178 L 158 178 Q 188 158 178 120 L 170 80 Z" fill="#a8e06c" opacity="0.2" filter="url(#blur01)"/>
    <!-- Bubbles -->
    <circle cx="80" cy="140" r="8" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.7"/>
    <circle cx="120" cy="120" r="5" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.6"/>
    <circle cx="100" cy="100" r="6" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <circle cx="140" cy="150" r="4" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.8"/>
    <circle cx="70" cy="110" r="3" fill="#ffd93d" opacity="0.4"/>
    <!-- Glow from reaction -->
    <ellipse cx="100" cy="130" rx="50" ry="30" fill="#a8e06c" opacity="0.15" filter="url(#glow01f)"/>
  </g>

  <!-- Sparkle particles rising from beaker -->
  <circle cx="640" cy="280" r="3" fill="#ffd93d" opacity="0.8"/>
  <circle cx="625" cy="260" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="660" cy="250" r="2.5" fill="#a8e06c" opacity="0.7"/>
  <circle cx="635" cy="240" r="1.5" fill="#ffd93d" opacity="0.5"/>
  <circle cx="650" cy="225" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="630" cy="210" r="1.5" fill="#c4b5fd" opacity="0.6"/>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#c4b5fd" opacity="0.6" letter-spacing="4">CHEMICAL REACTION</text>
</svg>