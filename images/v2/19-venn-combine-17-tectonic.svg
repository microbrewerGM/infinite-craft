<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="tc-glow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="tc-soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="tc-lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="tc-heat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>

  <!-- Deep earth heat glow -->
  <ellipse cx="640" cy="400" rx="400" ry="200" fill="url(#tc-heat)" opacity="0.5"/>

  <!-- Left plate -->
  <path d="M 0 300 L 200 295 L 400 300 L 550 310 L 610 330 L 620 400 L 600 500 L 500 640 L 0 640 Z" fill="#1a1a2e" stroke="#ff6b35" stroke-width="2" opacity="0.85"/>
  <!-- Left plate surface texture -->
  <path d="M 0 300 L 200 295 L 400 300 L 550 310 L 610 330" fill="none" stroke="#ff6b35" stroke-width="2.5" opacity="0.6"/>
  <line x1="100" y1="300" x2="80" y2="400" stroke="#ff6b35" stroke-width="1" opacity="0.15"/>
  <line x1="250" y1="298" x2="240" y2="380" stroke="#ff6b35" stroke-width="1" opacity="0.12"/>
  <line x1="450" y1="305" x2="430" y2="400" stroke="#ff6b35" stroke-width="1" opacity="0.1"/>
  <!-- Pressure arrows -->
  <path d="M 100 310 L 200 310" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
  <polygon points="200,305 210,310 200,315" fill="#ff6b35" opacity="0.3"/>
  <path d="M 150 330 L 280 325" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.2"/>
  <polygon points="280,320 290,325 280,330" fill="#ff6b35" opacity="0.2"/>

  <!-- Right plate -->
  <path d="M 1280 300 L 1080 295 L 880 300 L 730 310 L 670 330 L 660 400 L 680 500 L 780 640 L 1280 640 Z" fill="#1a1a2e" stroke="#4ecdc4" stroke-width="2" opacity="0.85"/>
  <path d="M 1280 300 L 1080 295 L 880 300 L 730 310 L 670 330" fill="none" stroke="#4ecdc4" stroke-width="2.5" opacity="0.6"/>
  <line x1="1180" y1="300" x2="1200" y2="400" stroke="#4ecdc4" stroke-width="1" opacity="0.15"/>
  <line x1="1030" y1="298" x2="1040" y2="380" stroke="#4ecdc4" stroke-width="1" opacity="0.12"/>
  <line x1="830" y1="305" x2="850" y2="400" stroke="#4ecdc4" stroke-width="1" opacity="0.1"/>
  <path d="M 1180 310 L 1080 310" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
  <polygon points="1080,305 1070,310 1080,315" fill="#4ecdc4" opacity="0.3"/>
  <path d="M 1130 330 L 1000 325" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.2"/>
  <polygon points="1000,320 990,325 1000,330" fill="#4ecdc4" opacity="0.2"/>

  <!-- Collision zone / fault line -->
  <path d="M 640 310 L 640 640" fill="none" stroke="#ffd93d" stroke-width="4" opacity="0.3" filter="url(#tc-soft)"/>

  <!-- Magma rising in fault -->
  <path d="M 630 640 Q 625 550 635 480 Q 640 440 640 400 Q 640 370 640 340" fill="none" stroke="url(#tc-lava)" stroke-width="12" opacity="0.4" filter="url(#tc-glow)"/>
  <path d="M 640 640 Q 645 540 640 460 Q 635 420 640 380 Q 642 360 640 340" fill="none" stroke="#ffd93d" stroke-width="4" opacity="0.5"/>

  <!-- Upheaval / mountain forming at collision -->
  <path d="M 580 310 Q 600 260 620 240 Q 640 220 660 240 Q 680 260 700 310" fill="#1a1a2e" stroke="#a8e06c" stroke-width="2" opacity="0.7"/>
  <path d="M 600 300 Q 620 270 640 250 Q 660 270 680 300" fill="#1a1a2e" stroke="#a8e06c" stroke-width="1.5" opacity="0.5"/>
  <!-- Mountain peak glow -->
  <circle cx="640" cy="235" r="10" fill="#ffd93d" opacity="0.15" filter="url(#tc-soft)"/>
  <circle cx="640" cy="235" r="4" fill="#ffd93d" opacity="0.3"/>

  <!-- Seismic wave lines -->
  <path d="M 640 340 Q 620 335 590 340 Q 560 345 520 340 Q 480 335 440 340" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.2"/>
  <path d="M 640 340 Q 660 335 690 340 Q 720 345 760 340 Q 800 335 840 340" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.2"/>
  <path d="M 640 370 Q 610 365 570 370 Q 530 375 480 370" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.15"/>
  <path d="M 640 370 Q 670 365 710 370 Q 750 375 800 370" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.15"/>

  <!-- Flying debris/particles -->
  <circle cx="620" cy="230" r="2" fill="#ff6b35" opacity="0.5"/>
  <circle cx="660" cy="220" r="1.5" fill="#4ecdc4" opacity="0.4"/>
  <circle cx="635" cy="210" r="1.5" fill="#ffd93d" opacity="0.4"/>
  <circle cx="650" cy="200" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="625" cy="195" r="1" fill="#a8e06c" opacity="0.3"/>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="175" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#ff6b35" opacity="0.6" letter-spacing="4">TECTONIC</text>
</svg>