<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="frost">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="3" result="blurNoise"/>
      <feComposite in="SourceGraphic" in2="blurNoise" operator="in"/>
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="frostPanel">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise"/>
      <feGaussianBlur stdDeviation="2"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.05  0 1 0 0 0.05  0 1 0 0 0.05  0 0 0 0.6 0"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Glowing orbs behind frosted panels -->
  <circle cx="200" cy="280" r="80" fill="#ff6b35" opacity="0.6" filter="url(#glow)"/>
  <circle cx="460" cy="320" r="90" fill="#4ecdc4" opacity="0.5" filter="url(#glow)"/>
  <circle cx="740" cy="260" r="75" fill="#a8e06c" opacity="0.55" filter="url(#glow)"/>
  <circle cx="1020" cy="300" r="85" fill="#c4b5fd" opacity="0.5" filter="url(#glow)"/>

  <!-- Frosted glass panels -->
  <rect x="120" y="160" width="200" height="280" rx="16" fill="white" opacity="0.06" filter="url(#frostPanel)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="380" y="140" width="200" height="300" rx="16" fill="white" opacity="0.06" filter="url(#frostPanel)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="650" y="150" width="200" height="290" rx="16" fill="white" opacity="0.06" filter="url(#frostPanel)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="930" y="145" width="200" height="295" rx="16" fill="white" opacity="0.06" filter="url(#frostPanel)" stroke="white" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Element emojis visible through frost -->
  <text x="220" y="310" font-size="60" text-anchor="middle" opacity="0.7" filter="url(#frost)">🔥</text>
  <text x="480" y="320" font-size="60" text-anchor="middle" opacity="0.7" filter="url(#frost)">💧</text>
  <text x="750" y="300" font-size="60" text-anchor="middle" opacity="0.7" filter="url(#frost)">🌍</text>
  <text x="1030" y="310" font-size="60" text-anchor="middle" opacity="0.7" filter="url(#frost)">💨</text>

  <!-- Glass edge highlights -->
  <line x1="120" y1="160" x2="120" y2="440" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="380" y1="140" x2="380" y2="440" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="650" y1="150" x2="650" y2="440" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="930" y1="145" x2="930" y2="440" stroke="white" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Title -->
  <text x="640" y="560" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="white" text-anchor="middle" letter-spacing="18" opacity="0.95">INFINITE CRAFT</text>
  <text x="640" y="595" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" letter-spacing="6" opacity="0.4">ELEMENT EXPLORER</text>
</svg>