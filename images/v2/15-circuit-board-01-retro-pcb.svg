<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="pcb-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#1a5c3a" opacity="0.5"/>
    </pattern>
    <filter id="copper-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a056"/>
      <stop offset="50%" stop-color="#c8943e"/>
      <stop offset="100%" stop-color="#b8842e"/>
    </linearGradient>
    <linearGradient id="pcb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6b3a"/>
      <stop offset="100%" stop-color="#0d4a25"/>
    </linearGradient>
  </defs>
  <!-- PCB Board -->
  <rect width="1280" height="640" fill="url(#pcb-bg)"/>
  <rect width="1280" height="640" fill="url(#pcb-grid)"/>
  <!-- Board edge -->
  <rect x="15" y="15" width="1250" height="610" fill="none" stroke="#2a8b4a" stroke-width="3" rx="5"/>
  <!-- Mounting holes -->
  <circle cx="40" cy="40" r="10" fill="#0d4a25" stroke="#c8943e" stroke-width="2"/>
  <circle cx="1240" cy="40" r="10" fill="#0d4a25" stroke="#c8943e" stroke-width="2"/>
  <circle cx="40" cy="600" r="10" fill="#0d4a25" stroke="#c8943e" stroke-width="2"/>
  <circle cx="1240" cy="600" r="10" fill="#0d4a25" stroke="#c8943e" stroke-width="2"/>
  <!-- Copper traces - horizontal -->
  <path d="M100,200 H350 L380,230 H500" stroke="url(#copper)" stroke-width="4" fill="none" filter="url(#copper-glow)"/>
  <path d="M100,280 H280 L310,310 H450 L480,280 H600" stroke="url(#copper)" stroke-width="4" fill="none" filter="url(#copper-glow)"/>
  <path d="M100,360 H400 L430,390 H550" stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#copper-glow)"/>
  <path d="M100,440 H320 L350,410 H500" stroke="url(#copper)" stroke-width="4" fill="none" filter="url(#copper-glow)"/>
  <path d="M780,200 H950 L980,230 H1150" stroke="url(#copper)" stroke-width="4" fill="none" filter="url(#copper-glow)"/>
  <path d="M780,280 H900 L930,310 H1050 L1080,280 H1180" stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#copper-glow)"/>
  <path d="M780,360 H1000 L1030,390 H1150" stroke="url(#copper)" stroke-width="4" fill="none" filter="url(#copper-glow)"/>
  <path d="M780,440 H920 L950,410 H1100" stroke="url(#copper)" stroke-width="4" fill="none" filter="url(#copper-glow)"/>
  <!-- Vertical traces -->
  <path d="M200,100 V180 L230,200" stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#copper-glow)"/>
  <path d="M350,100 V160 L380,180 V260" stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#copper-glow)"/>
  <path d="M900,100 V180" stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#copper-glow)"/>
  <path d="M1050,100 V170 L1080,200" stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#copper-glow)"/>
  <path d="M200,460 V540" stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#copper-glow)"/>
  <path d="M350,460 V500 L380,520 V580" stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#copper-glow)"/>
  <path d="M900,460 V540" stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#copper-glow)"/>
  <path d="M1050,460 V520 L1080,540" stroke="url(#copper)" stroke-width="3" fill="none" filter="url(#copper-glow)"/>
  <!-- Solder pads -->
  <circle cx="100" cy="200" r="8" fill="#c8943e" stroke="#d4a056" stroke-width="2"/>
  <circle cx="100" cy="280" r="8" fill="#c8943e" stroke="#d4a056" stroke-width="2"/>
  <circle cx="100" cy="360" r="8" fill="#c8943e" stroke="#d4a056" stroke-width="2"/>
  <circle cx="100" cy="440" r="8" fill="#c8943e" stroke="#d4a056" stroke-width="2"/>
  <circle cx="1150" cy="200" r="8" fill="#c8943e" stroke="#d4a056" stroke-width="2"/>
  <circle cx="1180" cy="280" r="8" fill="#c8943e" stroke="#d4a056" stroke-width="2"/>
  <circle cx="1150" cy="360" r="8" fill="#c8943e" stroke="#d4a056" stroke-width="2"/>
  <circle cx="1100" cy="440" r="8" fill="#c8943e" stroke="#d4a056" stroke-width="2"/>
  <!-- Central IC chip -->
  <rect x="540" y="180" width="200" height="280" rx="5" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
  <circle cx="570" cy="210" r="6" fill="#333"/>
  <!-- IC Pins left -->
  <rect x="520" y="210" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="520" y="240" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="520" y="270" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="520" y="300" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="520" y="330" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="520" y="360" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="520" y="390" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="520" y="420" width="25" height="6" fill="#c8943e" rx="1"/>
  <!-- IC Pins right -->
  <rect x="735" y="210" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="735" y="240" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="735" y="270" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="735" y="300" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="735" y="330" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="735" y="360" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="735" y="390" width="25" height="6" fill="#c8943e" rx="1"/>
  <rect x="735" y="420" width="25" height="6" fill="#c8943e" rx="1"/>
  <!-- IC label -->
  <text x="640" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#888" font-weight="bold">IC-2026</text>
  <!-- Element chips -->
  <g>
    <rect x="130" y="140" width="80" height="35" rx="4" fill="#1a1a1a" stroke="#ff6b35" stroke-width="1.5"/>
    <text x="170" y="163" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ff6b35">FIRE</text>
  </g>
  <g>
    <rect x="130" y="330" width="80" height="35" rx="4" fill="#1a1a1a" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="170" y="353" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#4ecdc4">WATER</text>
  </g>
  <g>
    <rect x="130" y="470" width="80" height="35" rx="4" fill="#1a1a1a" stroke="#a8e06c" stroke-width="1.5"/>
    <text x="170" y="493" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#a8e06c">EARTH</text>
  </g>
  <g>
    <rect x="1060" y="140" width="80" height="35" rx="4" fill="#1a1a1a" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1100" y="163" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#c4b5fd">WIND</text>
  </g>
  <!-- Resistors and capacitors -->
  <rect x="300" y="195" width="30" height="12" rx="3" fill="#8B4513" stroke="#d4a056" stroke-width="0.5"/>
  <line x1="300" y1="201" x2="330" y2="201" stroke="#ff6b35" stroke-width="1"/>
  <rect x="420" y="275" width="30" height="12" rx="3" fill="#336" stroke="#d4a056" stroke-width="0.5"/>
  <rect x="950" y="355" width="30" height="12" rx="3" fill="#8B4513" stroke="#d4a056" stroke-width="0.5"/>
  <!-- Silkscreen text -->
  <text x="80" y="580" font-family="'Courier New', monospace" font-size="10" fill="#2a8b4a">REV 2.0</text>
  <text x="1100" y="580" font-family="'Courier New', monospace" font-size="10" fill="#2a8b4a">PCB-2026-IC</text>
  <!-- Title -->
  <text x="640" y="560" text-anchor="middle" font-family="'Courier New', monospace" font-size="42" fill="#c8943e" font-weight="bold" letter-spacing="8" filter="url(#copper-glow)">INFINITE CRAFT</text>
  <text x="640" y="590" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#2a8b4a">ELEMENT COMBINATION ENGINE</text>
</svg>