<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg16" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#18081a"/>
      <stop offset="100%" stop-color="#08030a"/>
    </radialGradient>
    <filter id="glow16">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg16)"/>
  <g transform="translate(640,315)">
    <!-- Outer double circle -->
    <circle r="265" fill="none" stroke="#c9a96e" stroke-width="2" opacity="0.4"/>
    <circle r="255" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.25"/>
    <circle r="245" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.15"/>
    <!-- Pentagram (five-pointed star) -->
    <polygon points="0,-240 -228,-74 -141,194 141,194 228,-74"
      fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.4"/>
    <!-- Star lines (the actual pentagram) -->
    <g stroke-width="1.5" opacity="0.5" fill="none" filter="url(#glow16)">
      <line x1="0" y1="-240" x2="-141" y2="194" stroke="#ff6b35"/>
      <line x1="-141" y1="194" x2="228" y2="-74" stroke="#4ecdc4"/>
      <line x1="228" y1="-74" x2="-228" y2="-74" stroke="#a8e06c"/>
      <line x1="-228" y1="-74" x2="141" y2="194" stroke="#c4b5fd"/>
      <line x1="141" y1="194" x2="0" y2="-240" stroke="#ffd93d"/>
    </g>
    <!-- Inner pentagon formed by intersections -->
    <polygon points="0,-92 -88,-28 -54,74 54,74 88,-28"
      fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.3"/>
    <!-- Inner pentagram -->
    <g stroke="#ffd93d" stroke-width="0.5" opacity="0.2" fill="none">
      <line x1="0" y1="-92" x2="-54" y2="74"/>
      <line x1="-54" y1="74" x2="88" y2="-28"/>
      <line x1="88" y1="-28" x2="-88" y2="-28"/>
      <line x1="-88" y1="-28" x2="54" y2="74"/>
      <line x1="54" y1="74" x2="0" y2="-92"/>
    </g>
    <!-- Element circles at each point -->
    <g filter="url(#glow16)">
      <!-- Spirit (top) -->
      <circle cx="0" cy="-240" r="18" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.6"/>
      <text x="0" y="-235" text-anchor="middle" font-family="serif" font-size="14" fill="#ffd93d" opacity="0.7">&#x2641;</text>
      <text x="0" y="-265" text-anchor="middle" font-family="serif" font-size="9" fill="#ffd93d" opacity="0.5">SPIRIT</text>
      <!-- Fire (upper right) -->
      <circle cx="228" cy="-74" r="18" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.6"/>
      <text x="228" y="-69" text-anchor="middle" font-family="serif" font-size="16" fill="#ff6b35" opacity="0.7">&#x1F702;</text>
      <text x="260" y="-85" text-anchor="start" font-family="serif" font-size="9" fill="#ff6b35" opacity="0.5">FIRE</text>
      <!-- Water (lower right) -->
      <circle cx="141" cy="194" r="18" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.6"/>
      <text x="141" y="199" text-anchor="middle" font-family="serif" font-size="16" fill="#4ecdc4" opacity="0.7">&#x1F704;</text>
      <text x="170" y="210" text-anchor="start" font-family="serif" font-size="9" fill="#4ecdc4" opacity="0.5">WATER</text>
      <!-- Earth (lower left) -->
      <circle cx="-141" cy="194" r="18" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.6"/>
      <text x="-141" y="199" text-anchor="middle" font-family="serif" font-size="16" fill="#a8e06c" opacity="0.7">&#x1F703;</text>
      <text x="-172" y="210" text-anchor="end" font-family="serif" font-size="9" fill="#a8e06c" opacity="0.5">EARTH</text>
      <!-- Air (upper left) -->
      <circle cx="-228" cy="-74" r="18" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6"/>
      <text x="-228" y="-69" text-anchor="middle" font-family="serif" font-size="16" fill="#c4b5fd" opacity="0.7">&#x1F701;</text>
      <text x="-260" y="-85" text-anchor="end" font-family="serif" font-size="9" fill="#c4b5fd" opacity="0.5">AIR</text>
    </g>
    <!-- Center dot -->
    <circle r="5" fill="#ffd93d" opacity="0.3" filter="url(#glow16)"/>
  </g>
  <!-- Title -->
  <text x="640" y="48" text-anchor="middle" font-family="serif" font-size="42" fill="#c9a96e" letter-spacing="12" filter="url(#glow16)">INFINITE CRAFT</text>
  <line x1="360" y1="60" x2="920" y2="60" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
</svg>