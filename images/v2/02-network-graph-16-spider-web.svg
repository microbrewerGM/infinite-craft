<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg16" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#020508"/>
    </radialGradient>
    <filter id="silk"><feGaussianBlur stdDeviation="0.8"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="dewGlow"><feGaussianBlur stdDeviation="3"/></filter>
    <radialGradient id="dewDrop" cx="35%" cy="35%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg16)"/>
  <!-- Web center at 640,300 -->
  <!-- Radial threads (spokes) -->
  <g stroke="white" stroke-width="0.6" opacity="0.35" filter="url(#silk)">
    <line x1="640" y1="300" x2="640" y2="20"/>
    <line x1="640" y1="300" x2="870" y2="50"/>
    <line x1="640" y1="300" x2="1050" y2="150"/>
    <line x1="640" y1="300" x2="1180" y2="300"/>
    <line x1="640" y1="300" x2="1050" y2="450"/>
    <line x1="640" y1="300" x2="870" y2="560"/>
    <line x1="640" y1="300" x2="640" y2="600"/>
    <line x1="640" y1="300" x2="410" y2="560"/>
    <line x1="640" y1="300" x2="230" y2="450"/>
    <line x1="640" y1="300" x2="100" y2="300"/>
    <line x1="640" y1="300" x2="230" y2="150"/>
    <line x1="640" y1="300" x2="410" y2="50"/>
    <!-- Extra spokes -->
    <line x1="640" y1="300" x2="760" y2="30"/>
    <line x1="640" y1="300" x2="1130" y2="210"/>
    <line x1="640" y1="300" x2="1130" y2="390"/>
    <line x1="640" y1="300" x2="760" y2="580"/>
    <line x1="640" y1="300" x2="520" y2="580"/>
    <line x1="640" y1="300" x2="150" y2="390"/>
    <line x1="640" y1="300" x2="150" y2="210"/>
    <line x1="640" y1="300" x2="520" y2="30"/>
  </g>
  <!-- Spiral threads (capture silk) - concentric rings -->
  <g fill="none" stroke="white" stroke-width="0.5" opacity="0.2">
    <!-- Ring 1 (innermost) r~40 -->
    <path d="M640,260 Q660,258 670,265 Q680,275 678,295 Q676,315 668,330 Q658,342 640,340 Q622,342 612,330 Q604,315 602,295 Q600,275 610,265 Q620,258 640,260Z"/>
    <!-- Ring 2 r~80 -->
    <path d="M640,220 Q680,216 710,230 Q735,250 732,290 Q730,330 712,355 Q690,375 640,380 Q590,375 568,355 Q550,330 548,290 Q545,250 570,230 Q600,216 640,220Z"/>
    <!-- Ring 3 r~130 -->
    <path d="M640,170 Q700,164 750,185 Q795,215 790,290 Q788,365 755,400 Q720,430 640,435 Q560,430 525,400 Q492,365 490,290 Q485,215 530,185 Q580,164 640,170Z"/>
    <!-- Ring 4 r~185 -->
    <path d="M640,115 Q730,108 800,140 Q860,180 855,290 Q852,400 805,445 Q755,485 640,490 Q525,485 475,445 Q428,400 425,290 Q420,180 480,140 Q550,108 640,115Z"/>
    <!-- Ring 5 r~245 -->
    <path d="M640,55 Q760,46 860,90 Q940,145 930,290 Q925,440 870,500 Q810,550 640,555 Q470,550 410,500 Q355,440 350,290 Q340,145 420,90 Q520,46 640,55Z"/>
  </g>
  <!-- Sticky spiral (more visible, slightly irregular) -->
  <g fill="none" stroke="#4ecdc4" stroke-width="0.4" opacity="0.15">
    <path d="M640,190 Q690,186 720,200 Q745,220 742,295 Q740,360 715,385 Q690,405 640,408 Q590,405 565,385 Q540,360 538,295 Q535,220 560,200 Q590,186 640,190Z"/>
    <path d="M640,140 Q715,134 770,160 Q815,195 810,295 Q808,390 775,425 Q740,455 640,460 Q540,455 505,425 Q472,390 470,295 Q465,195 510,160 Q565,134 640,140Z"/>
  </g>
  <!-- Dew drops at intersections -->
  <g>
    <circle cx="640" cy="170" r="4" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.7"/>
    <circle cx="710" cy="185" r="3.5" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.6"/>
    <circle cx="750" cy="230" r="4" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.7"/>
    <circle cx="640" cy="435" r="4" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.7"/>
    <circle cx="530" cy="230" r="3.5" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.6"/>
    <circle cx="570" cy="185" r="3" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.6"/>
    <circle cx="790" cy="290" r="4.5" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.8"/>
    <circle cx="490" cy="290" r="4.5" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.8"/>
    <circle cx="640" cy="115" r="3.5" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.6"/>
    <circle cx="640" cy="490" r="3.5" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.6"/>
    <circle cx="855" cy="290" r="5" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.7"/>
    <circle cx="425" cy="290" r="5" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.7"/>
    <circle cx="720" cy="400" r="3" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.5"/>
    <circle cx="560" cy="400" r="3" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.5"/>
    <circle cx="805" cy="195" r="3.5" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.5"/>
    <circle cx="475" cy="195" r="3.5" fill="url(#dewDrop)" filter="url(#dewGlow)" opacity="0.5"/>
    <!-- Highlight drops -->
    <circle cx="640" cy="55" r="4" fill="#ffd93d" opacity="0.5" filter="url(#dewGlow)"/>
    <circle cx="930" cy="290" r="4" fill="#ff6b35" opacity="0.4" filter="url(#dewGlow)"/>
    <circle cx="350" cy="290" r="4" fill="#ff6b35" opacity="0.4" filter="url(#dewGlow)"/>
    <circle cx="640" cy="555" r="3.5" fill="#ffd93d" opacity="0.4" filter="url(#dewGlow)"/>
  </g>
  <!-- Title -->
  <text x="640" y="290" font-family="'Didot', 'Bodoni MT', Georgia, serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central" opacity="0.85" filter="url(#silk)">INFINITE CRAFT</text>
  <text x="640" y="340" font-family="'Didot', Georgia, serif" font-size="14" fill="#4ecdc4" text-anchor="middle" letter-spacing="8" opacity="0.45">SPIDER WEB</text>
</svg>