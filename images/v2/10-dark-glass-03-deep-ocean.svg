<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="bioGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="deepGlow">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <linearGradient id="oceanBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="40%" stop-color="#020408"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>
    <radialGradient id="jellyGrad1" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jellyGrad2" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#oceanBg)"/>

  <!-- Deep ambient light from above -->
  <ellipse cx="640" cy="-50" rx="500" ry="200" fill="#4ecdc4" opacity="0.02" filter="url(#deepGlow)"/>

  <!-- Bioluminescent jellyfish shapes -->
  <g filter="url(#bioGlow)" opacity="0.8">
    <ellipse cx="300" cy="200" rx="50" ry="35" fill="url(#jellyGrad1)"/>
    <path d="M260,230 Q270,290 255,340" stroke="#4ecdc4" stroke-opacity="0.4" fill="none" stroke-width="1.5"/>
    <path d="M280,235 Q285,300 270,360" stroke="#4ecdc4" stroke-opacity="0.3" fill="none" stroke-width="1"/>
    <path d="M300,237 Q300,310 295,370" stroke="#4ecdc4" stroke-opacity="0.35" fill="none" stroke-width="1.5"/>
    <path d="M320,235 Q315,295 325,350" stroke="#4ecdc4" stroke-opacity="0.3" fill="none" stroke-width="1"/>
    <path d="M340,230 Q330,280 340,330" stroke="#4ecdc4" stroke-opacity="0.25" fill="none" stroke-width="1"/>
  </g>

  <g filter="url(#bioGlow)" opacity="0.7">
    <ellipse cx="900" cy="280" rx="60" ry="40" fill="url(#jellyGrad2)"/>
    <path d="M855,315 Q860,380 845,430" stroke="#c4b5fd" stroke-opacity="0.35" fill="none" stroke-width="1.5"/>
    <path d="M875,318 Q878,390 870,450" stroke="#c4b5fd" stroke-opacity="0.3" fill="none" stroke-width="1"/>
    <path d="M900,320 Q900,400 895,460" stroke="#c4b5fd" stroke-opacity="0.35" fill="none" stroke-width="1.5"/>
    <path d="M925,318 Q922,385 930,440" stroke="#c4b5fd" stroke-opacity="0.3" fill="none" stroke-width="1"/>
    <path d="M945,315 Q938,370 948,420" stroke="#c4b5fd" stroke-opacity="0.25" fill="none" stroke-width="1"/>
  </g>

  <!-- Bioluminescent particles scattered -->
  <circle cx="150" cy="300" r="2" fill="#4ecdc4" opacity="0.7" filter="url(#bioGlow)"/>
  <circle cx="200" cy="450" r="1.5" fill="#a8e06c" opacity="0.6" filter="url(#bioGlow)"/>
  <circle cx="450" cy="380" r="2.5" fill="#4ecdc4" opacity="0.5" filter="url(#bioGlow)"/>
  <circle cx="550" cy="150" r="1.8" fill="#c4b5fd" opacity="0.6" filter="url(#bioGlow)"/>
  <circle cx="680" cy="420" r="2" fill="#a8e06c" opacity="0.5" filter="url(#bioGlow)"/>
  <circle cx="750" cy="180" r="1.5" fill="#4ecdc4" opacity="0.7" filter="url(#bioGlow)"/>
  <circle cx="1050" cy="150" r="2" fill="#c4b5fd" opacity="0.5" filter="url(#bioGlow)"/>
  <circle cx="1100" cy="400" r="1.8" fill="#4ecdc4" opacity="0.6" filter="url(#bioGlow)"/>
  <circle cx="1180" cy="250" r="2.2" fill="#a8e06c" opacity="0.4" filter="url(#bioGlow)"/>
  <circle cx="80" cy="500" r="1.5" fill="#c4b5fd" opacity="0.5" filter="url(#bioGlow)"/>
  <circle cx="500" cy="520" r="2" fill="#4ecdc4" opacity="0.4" filter="url(#bioGlow)"/>
  <circle cx="1000" cy="480" r="1.8" fill="#a8e06c" opacity="0.45" filter="url(#bioGlow)"/>

  <!-- Glowing deep-sea anglerfish lure -->
  <circle cx="600" cy="350" r="8" fill="#ffd93d" opacity="0.9" filter="url(#bioGlow)"/>
  <circle cx="600" cy="350" r="3" fill="white" opacity="0.9"/>
  <path d="M600,358 Q595,390 590,410 Q585,415 590,420" stroke="#111" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Element icons as deep sea creatures -->
  <text x="300" y="210" font-size="28" text-anchor="middle" opacity="0.8">💧</text>
  <text x="900" y="290" font-size="32" text-anchor="middle" opacity="0.7">💨</text>
  <text x="600" y="340" font-size="22" text-anchor="middle" opacity="0.9">🔥</text>
  <text x="1100" y="410" font-size="24" text-anchor="middle" opacity="0.5">🌍</text>

  <!-- Title -->
  <text x="640" y="80" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#4ecdc4" text-anchor="middle" letter-spacing="16" opacity="0.85" filter="url(#bioGlow)">INFINITE CRAFT</text>
  <text x="640" y="115" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4ecdc4" text-anchor="middle" letter-spacing="8" opacity="0.3">FROM THE DEPTHS</text>
</svg>