<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="640" y="50" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="62" x2="980" y2="62" stroke="#ffd93d" stroke-width="2"/>
  <text x="640" y="82" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">CHRONOGRAPH MECHANISM</text>

  <!-- Main watch case outline -->
  <circle cx="420" cy="360" r="250" fill="none" stroke="#6eaadc" stroke-width="2"/>
  <circle cx="420" cy="360" r="240" fill="none" stroke="#6eaadc" stroke-width="0.5"/>

  <!-- Main barrel (power) -->
  <g transform="translate(300,280)">
    <circle r="55" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <circle r="40" fill="none" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,3"/>
    <circle r="12" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <circle r="4" fill="#ff6b35"/>
    <!-- Spiral spring -->
    <path d="M 8 0 A 12 12 0 0 1 -12 0 A 18 18 0 0 1 18 0 A 24 24 0 0 1 -24 0 A 30 30 0 0 1 30 0 A 36 36 0 0 1 -36 0" fill="none" stroke="#ffd93d" stroke-width="0.8"/>
    <text x="0" y="-60" fill="#ff6b35" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">MAINSPRING</text>
    <text x="0" y="-48" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">[FIRE BARREL]</text>
  </g>

  <!-- Center wheel -->
  <g transform="translate(420,360)">
    <circle r="45" fill="none" stroke="#4ecdc4" stroke-width="2"/>
    <circle r="35" fill="none" stroke="#4ecdc4" stroke-width="1"/>
    <circle r="8" fill="none" stroke="#4ecdc4" stroke-width="2"/>
    <circle r="3" fill="#4ecdc4"/>
    <!-- Teeth marks -->
    <g stroke="#4ecdc4" stroke-width="0.8">
      <line x1="35" y1="-5" x2="45" y2="-5"/><line x1="35" y1="5" x2="45" y2="5"/>
      <line x1="-35" y1="-5" x2="-45" y2="-5"/><line x1="-35" y1="5" x2="-45" y2="5"/>
      <line x1="-5" y1="35" x2="-5" y2="45"/><line x1="5" y1="35" x2="5" y2="45"/>
      <line x1="-5" y1="-35" x2="-5" y2="-45"/><line x1="5" y1="-35" x2="5" y2="-45"/>
    </g>
    <text x="0" y="60" fill="#4ecdc4" font-family="monospace" font-size="9" text-anchor="middle">CENTER WHEEL</text>
    <text x="0" y="72" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle">[WATER]</text>
  </g>

  <!-- Third wheel -->
  <g transform="translate(520,280)">
    <circle r="35" fill="none" stroke="#a8e06c" stroke-width="2"/>
    <circle r="25" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <circle r="6" fill="none" stroke="#a8e06c" stroke-width="1.5"/>
    <circle r="2.5" fill="#a8e06c"/>
    <g stroke="#a8e06c" stroke-width="0.8">
      <line x1="25" y1="-4" x2="35" y2="-4"/><line x1="25" y1="4" x2="35" y2="4"/>
      <line x1="-25" y1="-4" x2="-35" y2="-4"/><line x1="-25" y1="4" x2="-35" y2="4"/>
      <line x1="-4" y1="25" x2="-4" y2="35"/><line x1="4" y1="25" x2="4" y2="35"/>
      <line x1="-4" y1="-25" x2="-4" y2="-35"/><line x1="4" y1="-25" x2="4" y2="-35"/>
    </g>
    <text x="0" y="-42" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">THIRD WHEEL</text>
    <text x="0" y="-31" fill="#a8e06c" font-family="monospace" font-size="7" text-anchor="middle">[EARTH]</text>
  </g>

  <!-- Escape wheel -->
  <g transform="translate(540,400)">
    <circle r="30" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    <circle r="20" fill="none" stroke="#c4b5fd" stroke-width="1"/>
    <circle r="5" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    <circle r="2" fill="#c4b5fd"/>
    <!-- Escape teeth (pointed) -->
    <g stroke="#c4b5fd" stroke-width="1">
      <line x1="20" y1="0" x2="30" y2="-3"/><line x1="20" y1="0" x2="30" y2="3"/>
      <line x1="-20" y1="0" x2="-30" y2="-3"/><line x1="-20" y1="0" x2="-30" y2="3"/>
      <line x1="0" y1="20" x2="-3" y2="30"/><line x1="0" y1="20" x2="3" y2="30"/>
      <line x1="0" y1="-20" x2="-3" y2="-30"/><line x1="0" y1="-20" x2="3" y2="-30"/>
      <line x1="14" y1="14" x2="19" y2="23"/><line x1="14" y1="14" x2="23" y2="19"/>
      <line x1="-14" y1="-14" x2="-19" y2="-23"/><line x1="-14" y1="-14" x2="-23" y2="-19"/>
      <line x1="14" y1="-14" x2="23" y2="-19"/><line x1="14" y1="-14" x2="19" y2="-23"/>
      <line x1="-14" y1="14" x2="-23" y2="19"/><line x1="-14" y1="14" x2="-19" y2="23"/>
    </g>
    <text x="0" y="42" fill="#c4b5fd" font-family="monospace" font-size="9" text-anchor="middle">ESCAPE WHEEL</text>
    <text x="0" y="54" fill="#c4b5fd" font-family="monospace" font-size="7" text-anchor="middle">[WIND]</text>
  </g>

  <!-- Balance wheel (oscillator) -->
  <g transform="translate(420,480)">
    <circle r="40" fill="none" stroke="#ffd93d" stroke-width="2.5"/>
    <circle r="30" fill="none" stroke="#ffd93d" stroke-width="0.8"/>
    <circle r="5" fill="none" stroke="#ffd93d" stroke-width="2"/>
    <circle r="2" fill="#ffd93d"/>
    <!-- Hairspring -->
    <path d="M 4 0 A 8 8 0 0 1 -8 0 A 13 13 0 0 1 13 0 A 18 18 0 0 1 -18 0 A 23 23 0 0 1 23 0" fill="none" stroke="#ffd93d" stroke-width="0.7"/>
    <!-- Balance arm -->
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#ffd93d" stroke-width="1.5"/>
    <!-- Weights -->
    <circle cx="-32" cy="0" r="4" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
    <circle cx="32" cy="0" r="4" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
    <!-- Oscillation arrows -->
    <path d="M -45 -10 A 45 45 0 0 1 -10 -45" fill="none" stroke="#ffd93d" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M 45 10 A 45 45 0 0 1 10 45" fill="none" stroke="#ffd93d" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="0" y="55" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">BALANCE WHEEL</text>
    <text x="0" y="67" fill="#ffd93d" font-family="monospace" font-size="7" text-anchor="middle">[CRAFT OSCILLATOR]</text>
  </g>

  <!-- Pallet fork (anchor) -->
  <g transform="translate(490,440)">
    <line x1="0" y1="0" x2="-15" y2="-15" stroke="#c4b5fd" stroke-width="2"/>
    <line x1="0" y1="0" x2="15" y2="-15" stroke="#c4b5fd" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#c4b5fd"/>
    <text x="20" y="20" fill="#c4b5fd" font-family="monospace" font-size="7">PALLET FORK</text>
  </g>

  <!-- Connection/gear mesh indicators -->
  <line x1="345" y1="300" x2="380" y2="330" stroke="#6eaadc" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="460" y1="340" x2="500" y2="300" stroke="#6eaadc" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="460" y1="380" x2="510" y2="400" stroke="#6eaadc" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="520" y1="430" x2="450" y2="460" stroke="#6eaadc" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Watch hands (center) -->
  <line x1="420" y1="360" x2="420" y2="180" stroke="white" stroke-width="2"/>
  <line x1="420" y1="360" x2="550" y2="360" stroke="white" stroke-width="1.5"/>
  <circle cx="420" cy="360" r="5" fill="white"/>

  <!-- Hour markers on case rim -->
  <g fill="white" font-family="monospace" font-size="10" text-anchor="middle">
    <text x="420" y="130">12</text>
    <text x="545" y="140">1</text>
    <text x="630" y="210">2</text>
    <text x="660" y="365">3</text>
    <text x="630" y="520">4</text>
    <text x="545" y="585">5</text>
    <text x="420" y="600">6</text>
    <text x="295" y="585">7</text>
    <text x="210" y="520">8</text>
    <text x="180" y="365">9</text>
    <text x="210" y="210">10</text>
    <text x="295" y="140">11</text>
  </g>

  <!-- Right panel: Gear train info -->
  <rect x="730" y="120" width="470" height="200" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="5"/>
  <text x="965" y="148" fill="white" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">GEAR TRAIN SPECIFICATIONS</text>
  <line x1="730" y1="158" x2="1200" y2="158" stroke="#6eaadc" stroke-width="0.5"/>

  <circle cx="760" cy="180" r="5" fill="#ff6b35"/>
  <text x="775" y="184" fill="#ff6b35" font-family="monospace" font-size="10">MAINSPRING BARREL: 42hr reserve</text>
  <circle cx="760" cy="205" r="5" fill="#4ecdc4"/>
  <text x="775" y="209" fill="#4ecdc4" font-family="monospace" font-size="10">CENTER WHEEL: 1 rev/hr</text>
  <circle cx="760" cy="230" r="5" fill="#a8e06c"/>
  <text x="775" y="234" fill="#a8e06c" font-family="monospace" font-size="10">THIRD WHEEL: 1 rev/min</text>
  <circle cx="760" cy="255" r="5" fill="#c4b5fd"/>
  <text x="775" y="259" fill="#c4b5fd" font-family="monospace" font-size="10">ESCAPE WHEEL: 21,600 bph</text>
  <circle cx="760" cy="280" r="5" fill="#ffd93d"/>
  <text x="775" y="284" fill="#ffd93d" font-family="monospace" font-size="10">BALANCE: 3Hz oscillation</text>
  <text x="775" y="305" fill="#6eaadc" font-family="monospace" font-size="9">JEWELS: 25 | ACCURACY: +/- 2s/day</text>

  <!-- Power flow diagram -->
  <rect x="730" y="360" width="470" height="100" fill="none" stroke="#6eaadc" stroke-width="1" rx="3"/>
  <text x="965" y="385" fill="white" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">ENERGY FLOW</text>

  <rect x="750" y="400" width="60" height="30" fill="none" stroke="#ff6b35" stroke-width="1.5" rx="3"/>
  <text x="780" y="420" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">SPRING</text>
  <line x1="810" y1="415" x2="840" y2="415" stroke="#6eaadc" stroke-width="1.5"/>
  <polygon points="835,411 845,415 835,419" fill="#6eaadc"/>

  <rect x="845" y="400" width="60" height="30" fill="none" stroke="#4ecdc4" stroke-width="1.5" rx="3"/>
  <text x="875" y="420" fill="#4ecdc4" font-family="monospace" font-size="8" text-anchor="middle">GEAR</text>
  <line x1="905" y1="415" x2="935" y2="415" stroke="#6eaadc" stroke-width="1.5"/>
  <polygon points="930,411 940,415 930,419" fill="#6eaadc"/>

  <rect x="940" y="400" width="60" height="30" fill="none" stroke="#c4b5fd" stroke-width="1.5" rx="3"/>
  <text x="970" y="420" fill="#c4b5fd" font-family="monospace" font-size="8" text-anchor="middle">ESCAPE</text>
  <line x1="1000" y1="415" x2="1030" y2="415" stroke="#6eaadc" stroke-width="1.5"/>
  <polygon points="1025,411 1035,415 1025,419" fill="#6eaadc"/>

  <rect x="1035" y="400" width="60" height="30" fill="none" stroke="#ffd93d" stroke-width="1.5" rx="3"/>
  <text x="1065" y="420" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">BEAT</text>
  <line x1="1095" y1="415" x2="1125" y2="415" stroke="#6eaadc" stroke-width="1.5"/>
  <polygon points="1120,411 1130,415 1120,419" fill="#6eaadc"/>

  <rect x="1130" y="400" width="60" height="30" fill="none" stroke="white" stroke-width="1.5" rx="3"/>
  <text x="1160" y="420" fill="white" font-family="monospace" font-size="8" text-anchor="middle">TIME</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#ffd93d" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#ffd93d" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#ffd93d" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#ffd93d" stroke-width="2" fill="none"/>

  <rect x="730" y="580" width="470" height="35" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="965" y="602" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-CHRONO-019 | CALIBRE IC-42</text>
</svg>