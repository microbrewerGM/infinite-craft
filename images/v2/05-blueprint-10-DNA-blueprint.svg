<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.3"/>

  <!-- Title -->
  <text x="640" y="50" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="62" x2="980" y2="62" stroke="#a8e06c" stroke-width="2"/>
  <text x="640" y="82" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">ELEMENT GENOME ENGINEERING</text>

  <!-- DNA Double Helix - left strand -->
  <path d="M 350 100 Q 450 160 350 220 Q 250 280 350 340 Q 450 400 350 460 Q 250 520 350 580"
        fill="none" stroke="#ff6b35" stroke-width="3"/>
  <!-- Right strand -->
  <path d="M 550 100 Q 450 160 550 220 Q 650 280 550 340 Q 450 400 550 460 Q 650 520 550 580"
        fill="none" stroke="#4ecdc4" stroke-width="3"/>

  <!-- Base pairs (rungs) -->
  <line x1="370" y1="130" x2="530" y2="130" stroke="#ffd93d" stroke-width="2"/>
  <circle cx="400" cy="130" r="6" fill="#ff6b35"/>
  <circle cx="500" cy="130" r="6" fill="#4ecdc4"/>
  <text x="450" y="125" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">FIRE-WATER</text>

  <line x1="395" y1="165" x2="505" y2="165" stroke="#a8e06c" stroke-width="2"/>
  <circle cx="415" cy="165" r="5" fill="#a8e06c"/>
  <circle cx="485" cy="165" r="5" fill="#c4b5fd"/>

  <line x1="410" y1="195" x2="490" y2="195" stroke="#c4b5fd" stroke-width="2"/>
  <circle cx="425" cy="195" r="5" fill="#c4b5fd"/>
  <circle cx="475" cy="195" r="5" fill="#ff6b35"/>

  <line x1="370" y1="225" x2="530" y2="225" stroke="#ffd93d" stroke-width="2"/>
  <circle cx="400" cy="225" r="6" fill="#a8e06c"/>
  <circle cx="500" cy="225" r="6" fill="#ffd93d"/>
  <text x="450" y="220" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">EARTH-WIND</text>

  <line x1="340" y1="260" x2="560" y2="260" stroke="#ff6b35" stroke-width="2"/>
  <circle cx="370" cy="260" r="5" fill="#ff6b35"/>
  <circle cx="530" cy="260" r="5" fill="#a8e06c"/>

  <line x1="320" y1="290" x2="580" y2="290" stroke="#4ecdc4" stroke-width="2"/>
  <circle cx="350" cy="290" r="5" fill="#4ecdc4"/>
  <circle cx="550" cy="290" r="5" fill="#c4b5fd"/>

  <line x1="340" y1="320" x2="560" y2="320" stroke="#a8e06c" stroke-width="2"/>
  <circle cx="365" cy="320" r="6" fill="#ff6b35"/>
  <circle cx="535" cy="320" r="6" fill="#4ecdc4"/>
  <text x="450" y="315" fill="#a8e06c" font-family="monospace" font-size="8" text-anchor="middle">FIRE-WATER</text>

  <line x1="370" y1="350" x2="530" y2="350" stroke="#c4b5fd" stroke-width="2"/>
  <circle cx="395" cy="350" r="5" fill="#c4b5fd"/>
  <circle cx="505" cy="350" r="5" fill="#ffd93d"/>

  <line x1="400" y1="380" x2="500" y2="380" stroke="#ff6b35" stroke-width="2"/>
  <circle cx="415" cy="380" r="5" fill="#a8e06c"/>
  <circle cx="485" cy="380" r="5" fill="#ff6b35"/>

  <line x1="410" y1="410" x2="490" y2="410" stroke="#ffd93d" stroke-width="2"/>
  <circle cx="425" cy="410" r="6" fill="#ffd93d"/>
  <circle cx="475" cy="410" r="6" fill="#a8e06c"/>
  <text x="450" y="405" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">EARTH-WIND</text>

  <line x1="385" y1="445" x2="515" y2="445" stroke="#4ecdc4" stroke-width="2"/>
  <circle cx="405" cy="445" r="5" fill="#4ecdc4"/>
  <circle cx="495" cy="445" r="5" fill="#ff6b35"/>

  <line x1="360" y1="480" x2="540" y2="480" stroke="#c4b5fd" stroke-width="2"/>
  <circle cx="385" cy="480" r="5" fill="#c4b5fd"/>
  <circle cx="515" cy="480" r="5" fill="#a8e06c"/>

  <line x1="335" y1="510" x2="565" y2="510" stroke="#ff6b35" stroke-width="2"/>
  <circle cx="360" cy="510" r="6" fill="#ff6b35"/>
  <circle cx="540" cy="510" r="6" fill="#4ecdc4"/>

  <line x1="335" y1="545" x2="565" y2="545" stroke="#a8e06c" stroke-width="2"/>
  <circle cx="365" cy="545" r="5" fill="#ffd93d"/>
  <circle cx="535" cy="545" r="5" fill="#c4b5fd"/>

  <!-- Gene labels (right side) -->
  <rect x="720" y="120" width="400" height="180" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="5"/>
  <text x="920" y="148" fill="white" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">ELEMENT GENOME SEQUENCE</text>
  <line x1="720" y1="158" x2="1120" y2="158" stroke="#6eaadc" stroke-width="0.5"/>

  <text x="740" y="180" fill="#ff6b35" font-family="monospace" font-size="11">GENE-F1: FIRE CATALYST</text>
  <rect x="740" y="185" width="80" height="8" fill="#ff6b35" opacity="0.3"/>

  <text x="740" y="205" fill="#4ecdc4" font-family="monospace" font-size="11">GENE-W1: WATER SOLVENT</text>
  <rect x="740" y="210" width="120" height="8" fill="#4ecdc4" opacity="0.3"/>

  <text x="740" y="230" fill="#a8e06c" font-family="monospace" font-size="11">GENE-E1: EARTH SUBSTRATE</text>
  <rect x="740" y="235" width="60" height="8" fill="#a8e06c" opacity="0.3"/>

  <text x="740" y="255" fill="#c4b5fd" font-family="monospace" font-size="11">GENE-A1: WIND DISPERSAL</text>
  <rect x="740" y="260" width="100" height="8" fill="#c4b5fd" opacity="0.3"/>

  <text x="740" y="280" fill="#ffd93d" font-family="monospace" font-size="11">GENE-C1: COMBINATION ENZYME</text>
  <rect x="740" y="285" width="150" height="8" fill="#ffd93d" opacity="0.3"/>

  <!-- Sequence readout -->
  <rect x="720" y="330" width="400" height="100" fill="none" stroke="#6eaadc" stroke-width="1" rx="3"/>
  <text x="920" y="355" fill="white" font-family="monospace" font-size="11" text-anchor="middle">SEQUENCE READOUT</text>
  <text x="740" y="380" fill="#ff6b35" font-family="monospace" font-size="10">F-W-E-A-F-W-F-E-A-W-E-F</text>
  <text x="740" y="395" fill="#4ecdc4" font-family="monospace" font-size="10">W-E-A-F-W-A-E-F-W-A-F-E</text>
  <text x="740" y="410" fill="#a8e06c" font-family="monospace" font-size="10">E-F-W-A-E-F-A-W-F-E-W-A</text>
  <text x="740" y="425" fill="#c4b5fd" font-family="monospace" font-size="10">A-E-F-W-A-E-W-F-E-A-F-W</text>

  <!-- Output element -->
  <rect x="720" y="460" width="400" height="80" fill="none" stroke="#ffd93d" stroke-width="2" rx="5"/>
  <text x="920" y="490" fill="#ffd93d" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold">RESULTING ELEMENT</text>
  <text x="920" y="515" fill="white" font-family="monospace" font-size="12" text-anchor="middle">GENOME ENCODES: STEAM (F+W)</text>

  <!-- Chromosome notation -->
  <text x="100" y="350" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">5'</text>
  <text x="100" y="600" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">3'</text>
  <line x1="100" y1="360" x2="100" y2="590" stroke="#6eaadc" stroke-width="1" stroke-dasharray="4,4"/>
  <polygon points="97,585 100,595 103,585" fill="#6eaadc"/>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#a8e06c" stroke-width="2" fill="none"/>

  <rect x="720" y="568" width="400" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="920" y="593" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-DNA-010 | GENOME BUILD v3.1</text>
</svg>