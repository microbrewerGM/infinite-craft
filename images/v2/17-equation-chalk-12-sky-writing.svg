<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6fc4"/>
      <stop offset="40%" stop-color="#4a9ee8"/>
      <stop offset="100%" stop-color="#87ceeb"/>
    </linearGradient>
    <filter id="cloud-blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="smoke-trail">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="soft-cloud">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- Sky gradient -->
  <rect width="1280" height="640" fill="url(#sky)"/>
  <!-- Background clouds -->
  <g filter="url(#soft-cloud)" opacity="0.4">
    <ellipse cx="200" cy="500" rx="180" ry="50" fill="white"/>
    <ellipse cx="250" cy="480" rx="120" ry="45" fill="white"/>
    <ellipse cx="150" cy="490" rx="100" ry="40" fill="white"/>
  </g>
  <g filter="url(#soft-cloud)" opacity="0.35">
    <ellipse cx="1000" cy="550" rx="200" ry="55" fill="white"/>
    <ellipse cx="1050" cy="530" rx="130" ry="50" fill="white"/>
    <ellipse cx="950" cy="540" rx="110" ry="45" fill="white"/>
  </g>
  <g filter="url(#soft-cloud)" opacity="0.25">
    <ellipse cx="600" cy="580" rx="250" ry="60" fill="white"/>
  </g>
  <!-- Small airplane silhouette -->
  <g transform="translate(1100, 60) scale(0.5)" fill="#333" opacity="0.6">
    <ellipse cx="0" cy="0" rx="30" ry="6"/>
    <polygon points="-10,-6 -10,-22 10,-6"/>
    <polygon points="-20,0 -28,-4 -28,4"/>
    <line x1="30" y1="0" x2="35" y2="2" stroke="#333" stroke-width="2"/>
  </g>
  <!-- Sky writing text (smoky cloud-like letters) -->
  <g filter="url(#smoke-trail)" fill="white" opacity="0.85">
    <!-- INFINITE CRAFT title -->
    <text x="640" y="110" font-family="Arial Black, sans-serif" font-size="72" text-anchor="middle" letter-spacing="6">INFINITE CRAFT</text>
  </g>
  <!-- Dissipating title echo -->
  <text x="640" y="110" font-family="Arial Black, sans-serif" font-size="72" text-anchor="middle" letter-spacing="6" fill="white" opacity="0.3" filter="url(#cloud-blur)">INFINITE CRAFT</text>
  <!-- Skywritten equations (in smoky trails) -->
  <g filter="url(#smoke-trail)" fill="white" opacity="0.8">
    <text x="150" y="210" font-family="Arial, sans-serif" font-size="38">Water + Fire = Steam</text>
  </g>
  <g filter="url(#smoke-trail)" fill="white" opacity="0.7">
    <text x="650" y="260" font-family="Arial, sans-serif" font-size="36">Earth + Wind = Dust</text>
  </g>
  <g filter="url(#smoke-trail)" fill="white" opacity="0.65">
    <text x="200" y="330" font-family="Arial, sans-serif" font-size="34">Fire + Earth = Lava</text>
  </g>
  <g filter="url(#smoke-trail)" fill="white" opacity="0.55">
    <text x="600" y="390" font-family="Arial, sans-serif" font-size="32">Lava + Water = Stone</text>
  </g>
  <!-- Fading older equations (dissipating in wind) -->
  <g filter="url(#cloud-blur)" fill="white" opacity="0.3">
    <text x="250" y="450" font-family="Arial, sans-serif" font-size="30">Dust + Water = Clay</text>
  </g>
  <g filter="url(#cloud-blur)" fill="white" opacity="0.2">
    <text x="650" y="490" font-family="Arial, sans-serif" font-size="28">Stone + Fire = Metal</text>
  </g>
  <!-- Smoke trail lines -->
  <path d="M1100 65 Q1050 70 980 90 Q900 115 850 108" stroke="white" stroke-width="2" fill="none" opacity="0.3" filter="url(#smoke-trail)"/>
  <!-- Sun -->
  <circle cx="1200" cy="60" r="45" fill="#ffd93d" opacity="0.8"/>
  <circle cx="1200" cy="60" r="55" fill="#ffd93d" opacity="0.15"/>
  <!-- Birds (V shapes) -->
  <g stroke="#333" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M300 150 L310 142 L320 150"/>
    <path d="M340 160 L350 152 L360 160"/>
    <path d="M280 165 L290 157 L300 165"/>
  </g>
</svg>