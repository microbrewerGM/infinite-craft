<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <!-- Newspaper-style background -->
  <rect width="1280" height="640" fill="#f5f0e0"/>
  <!-- Title area -->
  <text x="640" y="50" font-family="'Times New Roman', serif" font-size="42" fill="#222" text-anchor="middle" font-weight="bold">INFINITE CRAFT</text>
  <text x="640" y="72" font-family="'Times New Roman', serif" font-size="16" fill="#555" text-anchor="middle" font-style="italic">The Element Combination Crossword</text>
  <line x1="200" y1="80" x2="1080" y2="80" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="83" x2="1080" y2="83" stroke="#333" stroke-width="0.5"/>
  <!-- Crossword grid (centered) -->
  <g transform="translate(380, 100)">
    <!-- Grid cells (each 40x40) -->
    <!-- Row 0: S T E A M -->
    <rect x="0" y="0" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="40" y="0" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="80" y="0" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="120" y="0" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="160" y="0" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <!-- Letters -->
    <text x="20" y="28" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">S</text>
    <text x="60" y="28" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">T</text>
    <text x="100" y="28" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">E</text>
    <text x="140" y="28" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">A</text>
    <text x="180" y="28" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">M</text>
    <!-- Clue number -->
    <text x="5" y="13" font-family="'Times New Roman', serif" font-size="10" fill="#666">1</text>
    <!-- Row 1: blank, blank, A, blank, E -->
    <rect x="80" y="40" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="160" y="40" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <text x="100" y="68" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">A</text>
    <text x="180" y="68" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">E</text>
    <!-- Row 2: D U S T, blank, T -->
    <rect x="-80" y="80" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="-40" y="80" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="0" y="80" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="40" y="80" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="80" y="80" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="160" y="80" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <text x="-60" y="108" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">D</text>
    <text x="-20" y="108" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">U</text>
    <text x="20" y="108" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">S</text>
    <text x="60" y="108" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">T</text>
    <text x="100" y="108" font-family="'Times New Roman', serif" font-size="26" fill="#c9c4a1" text-anchor="middle">R</text>
    <text x="180" y="108" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">T</text>
    <text x="-75" y="93" font-family="'Times New Roman', serif" font-size="10" fill="#666">3</text>
    <!-- Row 3: blank, blank, T, blank, A -->
    <rect x="80" y="120" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="160" y="120" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <text x="100" y="148" font-family="'Times New Roman', serif" font-size="26" fill="#c9c4a1" text-anchor="middle">H</text>
    <text x="180" y="148" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">A</text>
    <!-- Row 4: L A V A -->
    <rect x="0" y="160" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="40" y="160" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="80" y="160" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="120" y="160" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="160" y="160" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <text x="20" y="188" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">L</text>
    <text x="60" y="188" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">A</text>
    <text x="100" y="188" font-family="'Times New Roman', serif" font-size="26" fill="#c9c4a1" text-anchor="middle">V</text>
    <text x="140" y="188" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">A</text>
    <text x="180" y="188" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">L</text>
    <text x="5" y="173" font-family="'Times New Roman', serif" font-size="10" fill="#666">5</text>
    <!-- Down from METAL: L -->
    <rect x="160" y="200" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <text x="180" y="228" font-family="'Times New Roman', serif" font-size="26" fill="#c9c4a1" text-anchor="middle">?</text>
    <!-- S T O N E row -->
    <rect x="0" y="240" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="40" y="240" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="80" y="240" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="120" y="240" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="160" y="240" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <text x="20" y="268" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">S</text>
    <text x="60" y="268" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">T</text>
    <text x="100" y="268" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">O</text>
    <text x="140" y="268" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">N</text>
    <text x="180" y="268" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">E</text>
    <text x="5" y="253" font-family="'Times New Roman', serif" font-size="10" fill="#666">7</text>
    <!-- C L A Y row -->
    <rect x="0" y="320" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="40" y="320" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="80" y="320" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <rect x="120" y="320" width="40" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <text x="20" y="348" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">C</text>
    <text x="60" y="348" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">L</text>
    <text x="100" y="348" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">A</text>
    <text x="140" y="348" font-family="'Times New Roman', serif" font-size="26" fill="#333" text-anchor="middle" font-weight="bold">Y</text>
    <text x="5" y="333" font-family="'Times New Roman', serif" font-size="10" fill="#666">8</text>
    <!-- Black squares scattered -->
    <rect x="-80" y="0" width="40" height="40" fill="#333"/><rect x="-40" y="0" width="40" height="40" fill="#333"/>
    <rect x="200" y="0" width="40" height="40" fill="#333"/>
    <rect x="-80" y="40" width="40" height="40" fill="#333"/><rect x="-40" y="40" width="40" height="40" fill="#333"/>
    <rect x="0" y="40" width="40" height="40" fill="#333"/><rect x="40" y="40" width="40" height="40" fill="#333"/>
    <rect x="120" y="40" width="40" height="40" fill="#333"/><rect x="200" y="40" width="40" height="40" fill="#333"/>
    <rect x="-80" y="120" width="40" height="40" fill="#333"/><rect x="-40" y="120" width="40" height="40" fill="#333"/>
    <rect x="0" y="120" width="40" height="40" fill="#333"/><rect x="40" y="120" width="40" height="40" fill="#333"/>
    <rect x="120" y="120" width="40" height="40" fill="#333"/>
  </g>
  <!-- Clues section -->
  <g font-family="'Times New Roman', serif" fill="#333">
    <!-- ACROSS clues -->
    <text x="730" y="125" font-size="20" font-weight="bold">ACROSS</text>
    <line x1="730" y1="130" x2="870" y2="130" stroke="#333" stroke-width="1"/>
    <text x="730" y="155" font-size="15">1. Water + Fire (5)</text>
    <text x="730" y="178" font-size="15">3. Earth + Wind (4)</text>
    <text x="730" y="201" font-size="15">5. Fire + Earth (4)</text>
    <text x="730" y="224" font-size="15">7. Lava + Water (5)</text>
    <text x="730" y="247" font-size="15">8. Dust + Water (4)</text>
    <!-- DOWN clues -->
    <text x="980" y="125" font-size="20" font-weight="bold">DOWN</text>
    <line x1="980" y1="130" x2="1100" y2="130" stroke="#333" stroke-width="1"/>
    <text x="980" y="155" font-size="15">2. Stone + Fire (5)</text>
    <text x="980" y="178" font-size="15">4. Clay + Fire (5)</text>
    <text x="980" y="201" font-size="15">6. Steam + Earth (6)</text>
  </g>
  <!-- Pencil marks / notes in margin -->
  <text x="730" y="320" font-family="'Segoe Print', cursive" font-size="16" fill="#4ecdc4" transform="rotate(-3 730 320)">Hint: everything connects!</text>
  <text x="730" y="350" font-family="'Segoe Print', cursive" font-size="14" fill="#ff6b35">2-Down = METAL (Stone+Fire)</text>
  <!-- Newspaper details -->
  <line x1="50" y1="590" x2="1230" y2="590" stroke="#ccc" stroke-width="0.5"/>
  <text x="640" y="615" font-family="'Times New Roman', serif" font-size="13" fill="#888" text-anchor="middle">The Daily Element -- Puzzle Section -- February 24, 2026</text>
  <text x="1200" y="615" font-family="'Times New Roman', serif" font-size="12" fill="#aaa" text-anchor="end">Difficulty: Infinite</text>
</svg>