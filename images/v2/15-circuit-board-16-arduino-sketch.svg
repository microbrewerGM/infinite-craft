  <rect x="660" y="195" width="280" height="10" fill="#e0d8c0"/>
  <!-- Breadboard holes (simplified) -->
  <g fill="#444" opacity="0.3">
    <circle cx="680" cy="130" r="2"/><circle cx="695" cy="130" r="2"/><circle cx="710" cy="130" r="2"/><circle cx="725" cy="130" r="2"/><circle cx="740" cy="130" r="2"/><circle cx="755" cy="130" r="2"/><circle cx="770" cy="130" r="2"/><circle cx="785" cy="130" r="2"/><circle cx="800" cy="130" r="2"/><circle cx="815" cy="130" r="2"/><circle cx="830" cy="130" r="2"/><circle cx="845" cy="130" r="2"/><circle cx="860" cy="130" r="2"/><circle cx="875" cy="130" r="2"/><circle cx="890" cy="130" r="2"/><circle cx="905" cy="130" r="2"/><circle cx="920" cy="130" r="2"/>
    <circle cx="680" cy="145" r="2"/><circle cx="695" cy="145" r="2"/><circle cx="710" cy="145" r="2"/><circle cx="725" cy="145" r="2"/><circle cx="740" cy="145" r="2"/><circle cx="755" cy="145" r="2"/><circle cx="770" cy="145" r="2"/><circle cx="785" cy="145" r="2"/><circle cx="800" cy="145" r="2"/><circle cx="815" cy="145" r="2"/><circle cx="830" cy="145" r="2"/><circle cx="845" cy="145" r="2"/><circle cx="860" cy="145" r="2"/><circle cx="875" cy="145" r="2"/><circle cx="890" cy="145" r="2"/><circle cx="905" cy="145" r="2"/><circle cx="920" cy="145" r="2"/>
    <circle cx="680" cy="160" r="2"/><circle cx="695" cy="160" r="2"/><circle cx="710" cy="160" r="2"/><circle cx="725" cy="160" r="2"/><circle cx="740" cy="160" r="2"/><circle cx="755" cy="160" r="2"/><circle cx="770" cy="160" r="2"/><circle cx="785" cy="160" r="2"/><circle cx="800" cy="160" r="2"/><circle cx="815" cy="160" r="2"/><circle cx="830" cy="160" r="2"/><circle cx="845" cy="160" r="2"/><circle cx="860" cy="160" r="2"/><circle cx="875" cy="160" r="2"/><circle cx="890" cy="160" r="2"/><circle cx="905" cy="160" r="2"/><circle cx="920" cy="160" r="2"/>
    <circle cx="680" cy="175" r="2"/><circle cx="695" cy="175" r="2"/><circle cx="710" cy="175" r="2"/><circle cx="725" cy="175" r="2"/><circle cx="740" cy="175" r="2"/><circle cx="755" cy="175" r="2"/><circle cx="770" cy="175" r="2"/><circle cx="785" cy="175" r="2"/><circle cx="800" cy="175" r="2"/><circle cx="815" cy="175" r="2"/><circle cx="830" cy="175" r="2"/><circle cx="845" cy="175" r="2"/><circle cx="860" cy="175" r="2"/><circle cx="875" cy="175" r="2"/><circle cx="890" cy="175" r="2"/><circle cx="905" cy="175" r="2"/><circle cx="920" cy="175" r="2"/>
    <circle cx="680" cy="220" r="2"/><circle cx="695" cy="220" r="2"/><circle cx="710" cy="220" r="2"/><circle cx="725" cy="220" r="2"/><circle cx="740" cy="220" r="2"/><circle cx="755" cy="220" r="2"/><circle cx="770" cy="220" r="2"/><circle cx="785" cy="220" r="2"/><circle cx="800" cy="220" r="2"/><circle cx="815" cy="220" r="2"/><circle cx="830" cy="220" r="2"/><circle cx="845" cy="220" r="2"/><circle cx="860" cy="220" r="2"/><circle cx="875" cy="220" r="2"/><circle cx="890" cy="220" r="2"/><circle cx="905" cy="220" r="2"/><circle cx="920" cy="220" r="2"/>
    <circle cx="680" cy="235" r="2"/><circle cx="695" cy="235" r="2"/><circle cx="710" cy="235" r="2"/><circle cx="725" cy="235" r="2"/><circle cx="740" cy="235" r="2"/><circle cx="755" cy="235" r="2"/><circle cx="770" cy="235" r="2"/><circle cx="785" cy="235" r="2"/><circle cx="800" cy="235" r="2"/><circle cx="815" cy="235" r="2"/><circle cx="830" cy="235" r="2"/><circle cx="845" cy="235" r="2"/><circle cx="860" cy="235" r="2"/><circle cx="875" cy="235" r="2"/><circle cx="890" cy="235" r="2"/><circle cx="905" cy="235" r="2"/><circle cx="920" cy="235" r="2"/>
    <circle cx="680" cy="250" r="2"/><circle cx="695" cy="250" r="2"/><circle cx="710" cy="250" r="2"/><circle cx="725" cy="250" r="2"/><circle cx="740" cy="250" r="2"/><circle cx="755" cy="250" r="2"/><circle cx="770" cy="250" r="2"/><circle cx="785" cy="250" r="2"/><circle cx="800" cy="250" r="2"/><circle cx="815" cy="250" r="2"/><circle cx="830" cy="250" r="2"/><circle cx="845" cy="250" r="2"/><circle cx="860" cy="250" r="2"/><circle cx="875" cy="250" r="2"/><circle cx="890" cy="250" r="2"/><circle cx="905" cy="250" r="2"/><circle cx="920" cy="250" r="2"/>
    <circle cx="680" cy="265" r="2"/><circle cx="695" cy="265" r="2"/><circle cx="710" cy="265" r="2"/><circle cx="725" cy="265" r="2"/><circle cx="740" cy="265" r="2"/><circle cx="755" cy="265" r="2"/><circle cx="770" cy="265" r="2"/><circle cx="785" cy="265" r="2"/><circle cx="800" cy="265" r="2"/><circle cx="815" cy="265" r="2"/><circle cx="830" cy="265" r="2"/><circle cx="845" cy="265" r="2"/><circle cx="860" cy="265" r="2"/><circle cx="875" cy="265" r="2"/><circle cx="890" cy="265" r="2"/><circle cx="905" cy="265" r="2"/><circle cx="920" cy="265" r="2"/>
    <circle cx="680" cy="280" r="2"/><circle cx="695" cy="280" r="2"/><circle cx="710" cy="280" r="2"/><circle cx="725" cy="280" r="2"/><circle cx="740" cy="280" r="2"/><circle cx="755" cy="280" r="2"/><circle cx="770" cy="280" r="2"/><circle cx="785" cy="280" r="2"/><circle cx="800" cy="280" r="2"/><circle cx="815" cy="280" r="2"/><circle cx="830" cy="280" r="2"/><circle cx="845" cy="280" r="2"/><circle cx="860" cy="280" r="2"/><circle cx="875" cy="280" r="2"/><circle cx="890" cy="280" r="2"/><circle cx="905" cy="280" r="2"/><circle cx="920" cy="280" r="2"/>
  </g>
  <!-- LEDs on breadboard -->
  <circle cx="710" cy="160" r="5" fill="#ff6b35" opacity="0.9"/>
  <circle cx="770" cy="160" r="5" fill="#4ecdc4" opacity="0.9"/>
  <circle cx="830" cy="160" r="5" fill="#a8e06c" opacity="0.9"/>
  <circle cx="890" cy="160" r="5" fill="#c4b5fd" opacity="0.9"/>
  <!-- Resistors on breadboard -->
  <rect x="705" y="220" width="20" height="6" rx="2" fill="#8B6914"/><rect x="765" y="220" width="20" height="6" rx="2" fill="#8B6914"/><rect x="825" y="220" width="20" height="6" rx="2" fill="#8B6914"/><rect x="885" y="220" width="20" height="6" rx="2" fill="#8B6914"/>
  <!-- Jumper wires from Arduino to breadboard -->
  <path d="M235,84 C235,60 710,50 710,100" stroke="#ff6b35" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M265,84 C265,40 770,40 770,100" stroke="#4ecdc4" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M295,84 C295,30 830,30 830,100" stroke="#a8e06c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M325,84 C325,20 890,20 890,100" stroke="#c4b5fd" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- GND wire -->
  <path d="M450,558 C450,580 680,590 680,290" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Servo motor -->
  <rect x="680" y="380" width="80" height="60" rx="5" fill="#333" stroke="#555" stroke-width="1" filter="url(#board-shadow)"/>
  <rect x="745" y="400" width="20" height="8" fill="#666"/>
  <circle cx="755" cy="404" r="6" fill="#444" stroke="#666" stroke-width="1"/>
  <text x="720" y="415" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888">SERVO</text>
  <!-- Servo wires -->
  <path d="M680,395 C650,395 580,400 580,260 C580,120 250,110 250,84" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M680,405 C640,405 630,440 620,520 C610,560 450,558 450,558" stroke="#222" stroke-width="2" fill="none"/>
  <path d="M680,415 C650,415 600,460 575,520 C560,555 435,558 435,558" stroke="#ffd93d" stroke-width="2" fill="none"/>
  <!-- Temperature sensor -->
  <rect x="850" y="380" width="40" height="50" rx="3" fill="#222" filter="url(#board-shadow)"/>
  <text x="870" y="410" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#aaa">TMP</text>
  <text x="870" y="422" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#aaa">36</text>
  <!-- Sensor pins -->
  <line x1="858" y1="430" x2="858" y2="450" stroke="#aaa" stroke-width="1.5"/>
  <line x1="870" y1="430" x2="870" y2="450" stroke="#aaa" stroke-width="1.5"/>
  <line x1="882" y1="430" x2="882" y2="450" stroke="#aaa" stroke-width="1.5"/>
  <!-- Code panel -->
  <rect x="980" y="80" width="270" height="480" rx="5" fill="#1e1e1e" filter="url(#board-shadow)"/>
  <rect x="980" y="80" width="270" height="25" fill="#2d2d2d" rx="5"/>
  <text x="1115" y="97" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#888">infinite_craft.ino</text>
  <!-- Code content -->
  <g font-family="'Courier New', monospace" font-size="9">
    <text x="995" y="125" fill="#c4b5fd">// Infinite Craft</text>
    <text x="995" y="140" fill="#c4b5fd">// Element Combiner</text>
    <text x="995" y="165" fill="#4ecdc4">#define</text><text x="1055" y="165" fill="#ff6b35"> FIRE</text><text x="1090" y="165" fill="#a8e06c"> 9</text>
    <text x="995" y="180" fill="#4ecdc4">#define</text><text x="1055" y="180" fill="#ff6b35"> WATER</text><text x="1100" y="180" fill="#a8e06c"> 10</text>
    <text x="995" y="195" fill="#4ecdc4">#define</text><text x="1055" y="195" fill="#ff6b35"> EARTH</text><text x="1100" y="195" fill="#a8e06c"> 11</text>
    <text x="995" y="210" fill="#4ecdc4">#define</text><text x="1055" y="210" fill="#ff6b35"> WIND</text><text x="1095" y="210" fill="#a8e06c"> 12</text>
    <text x="995" y="240" fill="#c4b5fd">void</text><text x="1030" y="240" fill="#ffd93d"> setup</text><text x="1070" y="240" fill="#fff">() {</text>
    <text x="1010" y="255" fill="#fff">pinMode(FIRE,</text><text x="1115" y="255" fill="#a8e06c">OUTPUT</text><text x="1155" y="255" fill="#fff">);</text>
    <text x="1010" y="270" fill="#fff">pinMode(WATER,</text><text x="1125" y="270" fill="#a8e06c">OUTPUT</text><text x="1165" y="270" fill="#fff">);</text>
    <text x="1010" y="285" fill="#fff">pinMode(EARTH,</text><text x="1125" y="285" fill="#a8e06c">OUTPUT</text><text x="1165" y="285" fill="#fff">);</text>
    <text x="1010" y="300" fill="#fff">pinMode(WIND,</text><text x="1120" y="300" fill="#a8e06c">OUTPUT</text><text x="1160" y="300" fill="#fff">);</text>
    <text x="995" y="315" fill="#fff">}</text>
    <text x="995" y="345" fill="#c4b5fd">void</text><text x="1030" y="345" fill="#ffd93d"> loop</text><text x="1060" y="345" fill="#fff">() {</text>
    <text x="1010" y="360" fill="#ffd93d">combine</text><text x="1060" y="360" fill="#fff">(FIRE, WATER);</text>
    <text x="1010" y="375" fill="#ffd93d">combine</text><text x="1060" y="375" fill="#fff">(EARTH, WIND);</text>
    <text x="1010" y="390" fill="#4ecdc4">delay</text><text x="1045" y="390" fill="#fff">(</text><text x="1050" y="390" fill="#a8e06c">1000</text><text x="1080" y="390" fill="#fff">);</text>
    <text x="995" y="405" fill="#fff">}</text>
    <text x="995" y="435" fill="#c4b5fd">void</text><text x="1030" y="435" fill="#ffd93d"> combine</text><text x="1085" y="435" fill="#fff">(</text><text x="1090" y="435" fill="#c4b5fd">int</text><text x="1110" y="435" fill="#fff"> a,</text>
    <text x="1010" y="450" fill="#c4b5fd">int</text><text x="1030" y="450" fill="#fff"> b) {</text>
    <text x="1010" y="465" fill="#fff">digitalWrite(a,</text><text x="1120" y="465" fill="#a8e06c">HIGH</text><text x="1150" y="465" fill="#fff">);</text>
    <text x="1010" y="480" fill="#fff">digitalWrite(b,</text><text x="1120" y="480" fill="#a8e06c">HIGH</text><text x="1150" y="480" fill="#fff">);</text>
    <text x="1010" y="495" fill="#4ecdc4">delay</text><text x="1045" y="495" fill="#fff">(</text><text x="1050" y="495" fill="#a8e06c">500</text><text x="1075" y="495" fill="#fff">);</text>
    <text x="1010" y="510" fill="#fff">digitalWrite(a,</text><text x="1120" y="510" fill="#a8e06c">LOW</text><text x="1145" y="510" fill="#fff">);</text>
    <text x="1010" y="525" fill="#fff">digitalWrite(b,</text><text x="1120" y="525" fill="#a8e06c">LOW</text><text x="1145" y="525" fill="#fff">);</text>
    <text x="995" y="540" fill="#fff">}</text>
  </g>
  <!-- Title -->
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#fff" font-weight="bold" letter-spacing="6">INFINITE CRAFT</text>
</svg>