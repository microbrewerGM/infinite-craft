  <text x="512" y="154" font-family="'Courier New', monospace" font-size="6" fill="#aaa">L</text>
  <circle cx="500" cy="166" r="4" fill="#ffd93d" opacity="0.6"/>
  <text x="512" y="170" font-family="'Courier New', monospace" font-size="6" fill="#aaa">TX</text>
  <circle cx="500" cy="182" r="4" fill="#4ecdc4" opacity="0.6"/>
  <text x="512" y="186" font-family="'Courier New', monospace" font-size="6" fill="#aaa">RX</text>
