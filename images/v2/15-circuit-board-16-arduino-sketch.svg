    <g fill="#c8a030">
      <rect x="160" y="545" width="6" height="11"/><rect x="175" y="545" width="6" height="11"/><rect x="190" y="545" width="6" height="11"/><rect x="205" y="545" width="6" height="11"/><rect x="220" y="545" width="6" height="11"/><rect x="235" y="545" width="6" height="11"/>
    </g>
    <g font-family="'Courier New', monospace" font-size="6" fill="#aaa">
