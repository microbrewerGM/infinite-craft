<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="board-shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="arduino-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00878F"/>
      <stop offset="100%" stop-color="#006C75"/>
    </linearGradient>
  </defs>
  <!-- Dark desk background -->
  <rect width="1280" height="640" fill="#1a1815"/>
  <!-- Arduino Uno board -->
  <rect x="80" y="80" width="500" height="480" rx="8" fill="url(#arduino-blue)" filter="url(#board-shadow)"/>
  <!-- Board edge details -->
  <rect x="85" y="85" width="490" height="470" rx="6" fill="none" stroke="#00a0a0" stroke-width="0.5" opacity="0.3"/>
  <!-- USB connector -->
  <rect x="65" y="130" width="40" height="50" rx="3" fill="#aaa" stroke="#888" stroke-width="1"/>
  <rect x="70" y="138" width="25" height="34" fill="#333"/>
  <!-- Power jack -->
  <rect x="65" y="420" width="40" height="35" rx="5" fill="#222" stroke="#555" stroke-width="1"/>
  <circle cx="85" cy="437" r="6" fill="#111" stroke="#444" stroke-width="1"/>
  <!-- Crystal oscillator -->
  <rect x="250" y="260" width="30" height="12" rx="2" fill="#c0c0c0" stroke="#999" stroke-width="0.5"/>
  <text x="265" y="269" text-anchor="middle" font-family="'Courier New', monospace" font-size="5" fill="#555">16MHz</text>
  <!-- ATmega328P chip -->
  <rect x="200" y="290" width="100" height="100" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <circle cx="215" cy="305" r="5" fill="#222" stroke="#444" stroke-width="0.5"/>
  <text x="250" y="345" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#666">ATMEGA</text>
  <text x="250" y="356" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#666">328P</text>
  <!-- IC pins -->
  <g fill="#aaa">
    <rect x="192" y="300" width="10" height="3"/><rect x="192" y="312" width="10" height="3"/><rect x="192" y="324" width="10" height="3"/><rect x="192" y="336" width="10" height="3"/><rect x="192" y="348" width="10" height="3"/><rect x="192" y="360" width="10" height="3"/><rect x="192" y="372" width="10" height="3"/><rect x="192" y="384" width="10" height="3"/>
    <rect x="298" y="300" width="10" height="3"/><rect x="298" y="312" width="10" height="3"/><rect x="298" y="324" width="10" height="3"/><rect x="298" y="336" width="10" height="3"/><rect x="298" y="348" width="10" height="3"/><rect x="298" y="360" width="10" height="3"/><rect x="298" y="372" width="10" height="3"/><rect x="298" y="384" width="10" height="3"/>
    <rect x="210" y="388" width="3" height="10"/><rect x="222" y="388" width="3" height="10"/><rect x="234" y="388" width="3" height="10"/><rect x="246" y="388" width="3" height="10"/><rect x="258" y="388" width="3" height="10"/><rect x="270" y="388" width="3" height="10"/><rect x="282" y="388" width="3" height="10"/>
  </g>
  <!-- Digital pin headers (top) -->
