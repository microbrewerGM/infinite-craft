  <text x="480" y="250" text-anchor="middle" font-family="'Courier New', monospace" font-size="6" fill="#aaa">RESET</text>
  <!-- Arduino logo text -->
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="14" fill="#00d0d0" opacity="0.3" font-weight="bold">ARDUINO UNO</text>
  <!-- Silkscreen text -->
  <text x="400" y="470" font-family="'Courier New', monospace" font-size="7" fill="#00a0a0" opacity="0.4">MADE IN ITALY</text>
  <!-- Connected components on the right side -->
