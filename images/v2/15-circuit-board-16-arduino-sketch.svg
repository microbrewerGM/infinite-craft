    <rect x="150" y="82" width="380" height="15" fill="#111" rx="1"/>
    <g fill="#c8a030">
      <rect x="160" y="84" width="6" height="11"/><rect x="175" y="84" width="6" height="11"/><rect x="190" y="84" width="6" height="11"/><rect x="205" y="84" width="6" height="11"/><rect x="220" y="84" width="6" height="11"/><rect x="235" y="84" width="6" height="11"/><rect x="250" y="84" width="6" height="11"/><rect x="265" y="84" width="6" height="11"/><rect x="280" y="84" width="6" height="11"/><rect x="295" y="84" width="6" height="11"/><rect x="310" y="84" width="6" height="11"/><rect x="325" y="84" width="6" height="11"/><rect x="340" y="84" width="6" height="11"/><rect x="355" y="84" width="6" height="11"/>
    </g>
