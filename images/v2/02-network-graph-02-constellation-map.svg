<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#020111"/>
  <!-- Star field -->
  <g fill="white" opacity="0.2">
    <circle cx="100" cy="50" r="0.8"/><circle cx="250" cy="90" r="0.5"/><circle cx="400" cy="30" r="0.7"/>
    <circle cx="550" cy="70" r="0.4"/><circle cx="700" cy="45" r="0.6"/><circle cx="850" cy="80" r="0.5"/>
    <circle cx="1000" cy="40" r="0.8"/><circle cx="1150" cy="65" r="0.4"/><circle cx="180" cy="600" r="0.6"/>
    <circle cx="350" cy="580" r="0.5"/><circle cx="900" cy="590" r="0.7"/><circle cx="1100" cy="570" r="0.4"/>
  </g>
  <!-- Constellation lines -->
  <g stroke="white" stroke-opacity="0.08" stroke-width="1">
    <line x1="200" y1="180" x2="380" y2="220"/>
    <line x1="380" y1="220" x2="520" y2="160"/>
    <line x1="520" y1="160" x2="640" y2="250"/>
    <line x1="640" y1="250" x2="760" y2="180"/>
    <line x1="760" y1="180" x2="920" y2="230"/>
    <line x1="920" y1="230" x2="1050" y2="170"/>
    <line x1="380" y1="220" x2="440" y2="350"/>
    <line x1="440" y1="350" x2="640" y2="380"/>
    <line x1="640" y1="380" x2="640" y2="250"/>
    <line x1="640" y1="380" x2="830" y2="400"/>
    <line x1="830" y1="400" x2="920" y2="230"/>
    <line x1="200" y1="180" x2="250" y2="350"/>
    <line x1="250" y1="350" x2="440" y2="350"/>
    <line x1="1050" y1="170" x2="1100" y2="340"/>
    <line x1="1100" y1="340" x2="830" y2="400"/>
  </g>
  <!-- Stars as elements -->
  <circle cx="200" cy="180" r="5" fill="#ff6b35" opacity="0.9"/>
  <text x="200" y="165" font-family="'Helvetica Neue', sans-serif" font-size="9" fill="#ff6b35" text-anchor="middle" opacity="0.5">Fire</text>
  <circle cx="380" cy="220" r="4" fill="#4ecdc4" opacity="0.8"/>
  <circle cx="520" cy="160" r="6" fill="#a8e06c" opacity="0.9"/>
  <text x="520" y="145" font-family="'Helvetica Neue', sans-serif" font-size="9" fill="#a8e06c" text-anchor="middle" opacity="0.5">Steam</text>
  <circle cx="640" cy="250" r="8" fill="white" opacity="0.95"/>
  <circle cx="760" cy="180" r="5" fill="#c4b5fd" opacity="0.8"/>
  <circle cx="920" cy="230" r="6" fill="#ffd93d" opacity="0.9"/>
  <circle cx="1050" cy="170" r="4" fill="#ff6b35" opacity="0.7"/>
  <circle cx="440" cy="350" r="4" fill="#4ecdc4" opacity="0.7"/>
  <circle cx="640" cy="380" r="5" fill="#a8e06c" opacity="0.8"/>
  <circle cx="830" cy="400" r="4" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="250" cy="350" r="3" fill="#ffd93d" opacity="0.5"/>
  <circle cx="1100" cy="340" r="3" fill="#4ecdc4" opacity="0.5"/>
  <text x="640" y="530" font-family="'Helvetica Neue', sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="100" letter-spacing="16">INFINITE CRAFT</text>
  <text x="640" y="570" font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#4ecdc4" text-anchor="middle" letter-spacing="8">MAPPING THE UNKNOWN</text>
</svg>