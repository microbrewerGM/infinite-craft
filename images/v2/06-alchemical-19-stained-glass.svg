<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg19" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>
    <filter id="glow19">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glassglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg19)"/>
  <!-- Gothic arch window frame -->
  <path d="M340,620 L340,180 Q340,40 640,40 Q940,40 940,180 L940,620" fill="none" stroke="#c9a96e" stroke-width="4" opacity="0.6"/>
  <path d="M355,615 L355,185 Q355,55 640,55 Q925,55 925,185 L925,615" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.3"/>
  <!-- Mullion (vertical divider) -->
  <line x1="640" y1="55" x2="640" y2="620" stroke="#c9a96e" stroke-width="3" opacity="0.5"/>
  <!-- Transom (horizontal divider) -->
  <line x1="355" y1="300" x2="925" y2="300" stroke="#c9a96e" stroke-width="3" opacity="0.5"/>
  <!-- Tracery in the arch -->
  <g fill="none" stroke="#c9a96e" stroke-width="2" opacity="0.4">
    <!-- Left lancet arch -->
    <path d="M370,300 L370,190 Q370,80 500,65 Q560,58 590,65"/>
    <!-- Right lancet arch -->
    <path d="M910,300 L910,190 Q910,80 780,65 Q720,58 690,65"/>
    <!-- Trefoil in the top -->
    <circle cx="640" cy="120" r="45"/>
    <circle cx="590" cy="160" r="30"/>
    <circle cx="690" cy="160" r="30"/>
  </g>
  <!-- Glass panels with colored fills -->
  <!-- Top left: Fire -->
  <path d="M370,185 Q370,80 500,65 L590,65 L590,295 L370,295 Z" fill="#ff6b35" opacity="0.06" filter="url(#glassglow)"/>
  <text x="480" y="200" text-anchor="middle" font-family="serif" font-size="40" fill="#ff6b35" opacity="0.5" filter="url(#glow19)">&#x1F702;</text>
  <text x="480" y="240" text-anchor="middle" font-family="serif" font-size="12" fill="#ff6b35" opacity="0.4">FIRE</text>
  <!-- Top right: Water -->
  <path d="M910,185 Q910,80 780,65 L690,65 L690,295 L910,295 Z" fill="#4ecdc4" opacity="0.06" filter="url(#glassglow)"/>
  <text x="800" y="200" text-anchor="middle" font-family="serif" font-size="40" fill="#4ecdc4" opacity="0.5" filter="url(#glow19)">&#x1F704;</text>
  <text x="800" y="240" text-anchor="middle" font-family="serif" font-size="12" fill="#4ecdc4" opacity="0.4">WATER</text>
  <!-- Bottom left: Earth -->
  <rect x="360" y="305" width="275" height="310" fill="#a8e06c" opacity="0.04" filter="url(#glassglow)"/>
  <text x="497" y="450" text-anchor="middle" font-family="serif" font-size="40" fill="#a8e06c" opacity="0.5" filter="url(#glow19)">&#x1F703;</text>
  <text x="497" y="490" text-anchor="middle" font-family="serif" font-size="12" fill="#a8e06c" opacity="0.4">EARTH</text>
  <!-- Bottom right: Air -->
  <rect x="645" y="305" width="275" height="310" fill="#c4b5fd" opacity="0.04" filter="url(#glassglow)"/>
  <text x="782" y="450" text-anchor="middle" font-family="serif" font-size="40" fill="#c4b5fd" opacity="0.5" filter="url(#glow19)">&#x1F701;</text>
  <text x="782" y="490" text-anchor="middle" font-family="serif" font-size="12" fill="#c4b5fd" opacity="0.4">AIR</text>
  <!-- Center rose window / medallion -->
  <circle cx="640" cy="120" r="42" fill="#ffd93d" opacity="0.05" filter="url(#glassglow)"/>
  <circle cx="640" cy="120" r="30" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.4"/>
  <circle cx="640" cy="120" r="15" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.5"/>
  <circle cx="640" cy="120" r="5" fill="#ffd93d" opacity="0.4"/>
  <!-- Lead came grid lines in panels -->
  <g stroke="#c9a96e" stroke-width="0.5" opacity="0.15">
    <!-- Horizontal dividers in bottom panels -->
    <line x1="360" y1="380" x2="635" y2="380"/>
    <line x1="645" y1="380" x2="920" y2="380"/>
    <line x1="360" y1="460" x2="635" y2="460"/>
    <line x1="645" y1="460" x2="920" y2="460"/>
    <line x1="360" y1="540" x2="635" y2="540"/>
    <line x1="645" y1="540" x2="920" y2="540"/>
    <!-- Vertical sub-dividers -->
    <line x1="497" y1="305" x2="497" y2="615"/>
    <line x1="782" y1="305" x2="782" y2="615"/>
  </g>
  <!-- Decorative diamond shapes in glass -->
  <g fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2">
    <polygon points="497,340 520,360 497,380 474,360"/>
    <polygon points="782,340 805,360 782,380 759,360"/>
    <polygon points="497,500 520,520 497,540 474,520"/>
    <polygon points="782,500 805,520 782,540 759,520"/>
  </g>
  <!-- Title in banner at bottom -->
  <rect x="400" y="580" width="480" height="35" rx="4" fill="#0a0a14" stroke="#c9a96e" stroke-width="1" opacity="0.6"/>
  <text x="640" y="604" text-anchor="middle" font-family="serif" font-size="24" fill="#c9a96e" letter-spacing="8" filter="url(#glow19)">INFINITE CRAFT</text>
  <!-- Light rays coming through -->
  <g opacity="0.03" fill="#ffd93d">
    <polygon points="640,120 580,640 700,640"/>
    <polygon points="500,180 440,640 560,640"/>
    <polygon points="780,180 720,640 840,640"/>
  </g>
</svg>