      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <filter id="nGlow"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="layerGlow"><feGaussianBlur stdDeviation="6"/></filter>
