<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg6" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#060a14"/>
    </radialGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg6)"/>
  <g transform="translate(640,320)">
    <!-- Flower of Life pattern - 7 overlapping circles -->
    <g fill="none" stroke="#4ecdc4" stroke-width="0.8" opacity="0.4">
      <circle r="80"/>
      <circle cx="80" cy="0" r="80"/>
      <circle cx="-80" cy="0" r="80"/>
      <circle cx="40" cy="-69.3" r="80"/>
      <circle cx="-40" cy="-69.3" r="80"/>
      <circle cx="40" cy="69.3" r="80"/>
      <circle cx="-40" cy="69.3" r="80"/>
    </g>
    <!-- Second ring of flower of life -->
    <g fill="none" stroke="#c4b5fd" stroke-width="0.5" opacity="0.25">
      <circle cx="120" cy="-69.3" r="80"/>
      <circle cx="120" cy="69.3" r="80"/>
      <circle cx="-120" cy="-69.3" r="80"/>
      <circle cx="-120" cy="69.3" r="80"/>
      <circle cx="0" cy="-138.6" r="80"/>
      <circle cx="0" cy="138.6" r="80"/>
    </g>
    <!-- Metatron's Cube lines connecting centers -->
    <g stroke="#c9a96e" stroke-width="0.5" opacity="0.3">
      <!-- Center to inner 6 -->
      <line x1="0" y1="0" x2="80" y2="0"/>
      <line x1="0" y1="0" x2="-80" y2="0"/>
      <line x1="0" y1="0" x2="40" y2="-69.3"/>
      <line x1="0" y1="0" x2="-40" y2="-69.3"/>
      <line x1="0" y1="0" x2="40" y2="69.3"/>
      <line x1="0" y1="0" x2="-40" y2="69.3"/>
      <!-- Inner 6 interconnected -->
      <line x1="80" y1="0" x2="40" y2="-69.3"/>
      <line x1="40" y1="-69.3" x2="-40" y2="-69.3"/>
      <line x1="-40" y1="-69.3" x2="-80" y2="0"/>
      <line x1="-80" y1="0" x2="-40" y2="69.3"/>
      <line x1="-40" y1="69.3" x2="40" y2="69.3"/>
      <line x1="40" y1="69.3" x2="80" y2="0"/>
      <!-- Cross connections (Star of David) -->
      <line x1="80" y1="0" x2="-40" y2="-69.3"/>
      <line x1="80" y1="0" x2="-40" y2="69.3"/>
      <line x1="-80" y1="0" x2="40" y2="-69.3"/>
      <line x1="-80" y1="0" x2="40" y2="69.3"/>
      <line x1="40" y1="-69.3" x2="-40" y2="69.3"/>
      <line x1="-40" y1="-69.3" x2="40" y2="69.3"/>
    </g>
    <!-- Node dots at intersections -->
    <g fill="#ffd93d" opacity="0.6" filter="url(#glow6)">
      <circle r="4"/>
      <circle cx="80" cy="0" r="3"/>
      <circle cx="-80" cy="0" r="3"/>
      <circle cx="40" cy="-69.3" r="3"/>
      <circle cx="-40" cy="-69.3" r="3"/>
      <circle cx="40" cy="69.3" r="3"/>
      <circle cx="-40" cy="69.3" r="3"/>
    </g>
    <!-- Outer containing circles -->
    <circle r="200" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.3"/>
    <circle r="220" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.15"/>
    <circle r="260" fill="none" stroke="#c9a96e" stroke-width="0.3" opacity="0.1"/>
    <!-- Element markers at cardinal points -->
    <g filter="url(#glow6)">
      <circle cx="0" cy="-200" r="8" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
      <circle cx="200" cy="0" r="8" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
      <circle cx="0" cy="200" r="8" fill="none" stroke="#a8e06c" stroke-width="1.5"/>
      <circle cx="-200" cy="0" r="8" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    </g>
  </g>
  <!-- Title -->
  <text x="640" y="48" text-anchor="middle" font-family="serif" font-size="40" fill="#c9a96e" letter-spacing="12" filter="url(#glow6)">INFINITE CRAFT</text>
  <text x="640" y="625" text-anchor="middle" font-family="serif" font-size="11" fill="#4ecdc4" opacity="0.4" letter-spacing="6">SACRED GEOMETRY OF CREATION</text>
  <!-- Decorative dots -->
  <g fill="#ffd93d" opacity="0.15">
    <circle cx="50" cy="50" r="1"/><circle cx="120" cy="200" r="1.5"/><circle cx="80" cy="400" r="1"/>
    <circle cx="1230" cy="60" r="1.5"/><circle cx="1160" cy="250" r="1"/><circle cx="1200" cy="500" r="1.5"/>
  </g>
</svg>