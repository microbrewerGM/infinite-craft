<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="640" y="50" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="62" x2="980" y2="62" stroke="#c4b5fd" stroke-width="2"/>
  <text x="640" y="82" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">ELEMENT TELESCOPE RAY DIAGRAM</text>

  <!-- Telescope tube -->
  <rect x="150" y="200" width="900" height="240" rx="10" fill="none" stroke="#6eaadc" stroke-width="2"/>

  <!-- Optical axis -->
  <line x1="100" y1="320" x2="1200" y2="320" stroke="#6eaadc" stroke-width="1" stroke-dasharray="8,6"/>
  <text x="1210" y="324" fill="#6eaadc" font-family="monospace" font-size="9">OPTICAL AXIS</text>

  <!-- Objective lens (left) -->
  <ellipse cx="200" cy="320" rx="8" ry="100" fill="none" stroke="#4ecdc4" stroke-width="3"/>
  <text x="200" y="445" fill="#4ecdc4" font-family="monospace" font-size="11" text-anchor="middle">OBJECTIVE</text>
  <text x="200" y="460" fill="#4ecdc4" font-family="monospace" font-size="9" text-anchor="middle">f=1200mm</text>
  <text x="200" y="475" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">[WATER LENS]</text>

  <!-- Incoming light rays (left) -->
  <line x1="50" y1="240" x2="200" y2="240" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="50" y1="280" x2="200" y2="280" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="50" y1="320" x2="200" y2="320" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="50" y1="360" x2="200" y2="360" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="50" y1="400" x2="200" y2="400" stroke="#ffd93d" stroke-width="1.5"/>
  <!-- Light arrows -->
  <polygon points="85,237 95,240 85,243" fill="#ffd93d"/>
  <polygon points="85,317 95,320 85,323" fill="#ffd93d"/>
  <polygon points="85,397 95,400 85,403" fill="#ffd93d"/>
  <text x="80" y="210" fill="#ffd93d" font-family="monospace" font-size="10" text-anchor="middle">INCOMING</text>
  <text x="80" y="225" fill="#ffd93d" font-family="monospace" font-size="10" text-anchor="middle">LIGHT</text>

  <!-- Refracted rays converging to focal point -->
  <line x1="200" y1="240" x2="650" y2="310" stroke="#ff6b35" stroke-width="1.2"/>
  <line x1="200" y1="280" x2="650" y2="315" stroke="#ff6b35" stroke-width="1.2"/>
  <line x1="200" y1="320" x2="650" y2="320" stroke="#ff6b35" stroke-width="1.2"/>
  <line x1="200" y1="360" x2="650" y2="325" stroke="#ff6b35" stroke-width="1.2"/>
  <line x1="200" y1="400" x2="650" y2="330" stroke="#ff6b35" stroke-width="1.2"/>

  <!-- Focal point -->
  <circle cx="650" cy="320" r="6" fill="#ff6b35"/>
  <text x="650" y="358" fill="#ff6b35" font-family="monospace" font-size="10" text-anchor="middle">FOCAL POINT</text>
  <text x="650" y="372" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">[FIRE FOCUS]</text>

  <!-- Diverging from focal point to eyepiece -->
  <line x1="650" y1="310" x2="900" y2="240" stroke="#a8e06c" stroke-width="1.2"/>
  <line x1="650" y1="315" x2="900" y2="280" stroke="#a8e06c" stroke-width="1.2"/>
  <line x1="650" y1="320" x2="900" y2="320" stroke="#a8e06c" stroke-width="1.2"/>
  <line x1="650" y1="325" x2="900" y2="360" stroke="#a8e06c" stroke-width="1.2"/>
  <line x1="650" y1="330" x2="900" y2="400" stroke="#a8e06c" stroke-width="1.2"/>

  <!-- Eyepiece lens -->
  <ellipse cx="920" cy="320" rx="8" ry="80" fill="none" stroke="#a8e06c" stroke-width="3"/>
  <text x="920" y="445" fill="#a8e06c" font-family="monospace" font-size="11" text-anchor="middle">EYEPIECE</text>
  <text x="920" y="460" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">f=25mm</text>
  <text x="920" y="475" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">[EARTH LENS]</text>

  <!-- Output rays (parallel again, collimated) -->
  <line x1="920" y1="250" x2="1100" y2="270" stroke="#c4b5fd" stroke-width="1.5"/>
  <line x1="920" y1="290" x2="1100" y2="300" stroke="#c4b5fd" stroke-width="1.5"/>
  <line x1="920" y1="320" x2="1100" y2="320" stroke="#c4b5fd" stroke-width="1.5"/>
  <line x1="920" y1="350" x2="1100" y2="340" stroke="#c4b5fd" stroke-width="1.5"/>
  <line x1="920" y1="390" x2="1100" y2="370" stroke="#c4b5fd" stroke-width="1.5"/>
  <!-- Output arrows -->
  <polygon points="1085,267 1095,270 1085,273" fill="#c4b5fd"/>
  <polygon points="1085,317 1095,320 1085,323" fill="#c4b5fd"/>
  <polygon points="1085,367 1095,370 1085,373" fill="#c4b5fd"/>

  <!-- Eye symbol -->
  <g transform="translate(1140,320)">
    <ellipse rx="30" ry="18" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    <circle r="10" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    <circle r="4" fill="#c4b5fd"/>
    <text x="0" y="35" fill="#c4b5fd" font-family="monospace" font-size="9" text-anchor="middle">OBSERVER</text>
  </g>

  <!-- Focal length dimensions -->
  <line x1="200" y1="170" x2="650" y2="170" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="200" y1="165" x2="200" y2="175" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="650" y1="165" x2="650" y2="175" stroke="#6eaadc" stroke-width="0.8"/>
  <text x="425" y="165" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">f1 = 1200mm</text>

  <line x1="650" y1="170" x2="920" y2="170" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="920" y1="165" x2="920" y2="175" stroke="#6eaadc" stroke-width="0.8"/>
  <text x="785" y="165" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">f2 = 25mm</text>

  <!-- Magnification info -->
  <rect x="80" y="510" width="350" height="90" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="3"/>
  <text x="255" y="535" fill="white" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">OPTICAL PROPERTIES</text>
  <line x1="80" y1="543" x2="430" y2="543" stroke="#6eaadc" stroke-width="0.5"/>
  <text x="100" y="560" fill="#ffd93d" font-family="monospace" font-size="10">MAGNIFICATION: 48x</text>
  <text x="100" y="578" fill="#ffd93d" font-family="monospace" font-size="10">FIELD OF VIEW: 1.2 deg</text>
  <text x="100" y="596" fill="#ffd93d" font-family="monospace" font-size="10">RESOLUTION: INFINITE</text>

  <!-- Ray color legend -->
  <rect x="500" y="510" width="300" height="90" fill="none" stroke="#6eaadc" stroke-width="1" rx="3"/>
  <text x="650" y="530" fill="white" font-family="monospace" font-size="10" text-anchor="middle">RAY LEGEND</text>
  <line x1="520" y1="548" x2="560" y2="548" stroke="#ffd93d" stroke-width="2"/>
  <text x="570" y="552" fill="#ffd93d" font-family="monospace" font-size="9">INCIDENT RAYS</text>
  <line x1="520" y1="565" x2="560" y2="565" stroke="#ff6b35" stroke-width="2"/>
  <text x="570" y="569" fill="#ff6b35" font-family="monospace" font-size="9">CONVERGING RAYS</text>
  <line x1="520" y1="582" x2="560" y2="582" stroke="#a8e06c" stroke-width="2"/>
  <text x="570" y="586" fill="#a8e06c" font-family="monospace" font-size="9">DIVERGING RAYS</text>
  <line x1="520" y1="596" x2="560" y2="596" stroke="#c4b5fd" stroke-width="2"/>
  <text x="570" y="600" fill="#c4b5fd" font-family="monospace" font-size="9">EXIT RAYS</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#c4b5fd" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#c4b5fd" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#c4b5fd" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#c4b5fd" stroke-width="2" fill="none"/>

  <rect x="900" y="560" width="360" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="1080" y="585" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-OPTICS-012</text>
</svg>