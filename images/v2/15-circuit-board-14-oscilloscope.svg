<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="scope-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="phosphor">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="screen-grad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="80%" stop-color="#050f05"/>
      <stop offset="100%" stop-color="#030a03"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a3a"/>
      <stop offset="50%" stop-color="#3a3a2a"/>
      <stop offset="100%" stop-color="#2a2a1a"/>
    </linearGradient>
  </defs>
  <!-- Dark lab background -->
  <rect width="1280" height="640" fill="#0a0a08"/>
  <!-- Oscilloscope body -->
  <rect x="80" y="30" width="1120" height="580" rx="15" fill="url(#bezel)"/>
  <rect x="85" y="35" width="1110" height="570" rx="12" fill="#333328"/>
  <!-- Screen bezel -->
  <rect x="100" y="50" width="780" height="520" rx="10" fill="#222218"/>
  <!-- CRT Screen -->
  <rect x="115" y="65" width="750" height="490" rx="8" fill="url(#screen-grad)"/>
  <!-- Grid lines -->
  <g stroke="#1a3a1a" stroke-width="0.5" opacity="0.6">
    <!-- Vertical divisions (10) -->
    <line x1="190" y1="65" x2="190" y2="555"/><line x1="265" y1="65" x2="265" y2="555"/><line x1="340" y1="65" x2="340" y2="555"/><line x1="415" y1="65" x2="415" y2="555"/><line x1="490" y1="65" x2="490" y2="555"/><line x1="565" y1="65" x2="565" y2="555"/><line x1="640" y1="65" x2="640" y2="555"/><line x1="715" y1="65" x2="715" y2="555"/><line x1="790" y1="65" x2="790" y2="555"/>
    <!-- Horizontal divisions (8) -->
    <line x1="115" y1="126" x2="865" y2="126"/><line x1="115" y1="187" x2="865" y2="187"/><line x1="115" y1="248" x2="865" y2="248"/><line x1="115" y1="310" x2="865" y2="310"/><line x1="115" y1="371" x2="865" y2="371"/><line x1="115" y1="432" x2="865" y2="432"/><line x1="115" y1="493" x2="865" y2="493"/>
  </g>
  <!-- Center crosshair with ticks -->
  <line x1="115" y1="310" x2="865" y2="310" stroke="#2a5a2a" stroke-width="1" opacity="0.8"/>
  <line x1="490" y1="65" x2="490" y2="555" stroke="#2a5a2a" stroke-width="1" opacity="0.8"/>
  <!-- Minor tick marks on center lines -->
  <g stroke="#2a5a2a" stroke-width="0.5" opacity="0.5">
    <line x1="152" y1="307" x2="152" y2="313"/><line x1="189" y1="307" x2="189" y2="313"/><line x1="227" y1="307" x2="227" y2="313"/><line x1="264" y1="307" x2="264" y2="313"/><line x1="302" y1="307" x2="302" y2="313"/><line x1="339" y1="307" x2="339" y2="313"/><line x1="377" y1="307" x2="377" y2="313"/><line x1="414" y1="307" x2="414" y2="313"/><line x1="452" y1="307" x2="452" y2="313"/><line x1="527" y1="307" x2="527" y2="313"/><line x1="565" y1="307" x2="565" y2="313"/><line x1="602" y1="307" x2="602" y2="313"/><line x1="640" y1="307" x2="640" y2="313"/><line x1="677" y1="307" x2="677" y2="313"/><line x1="715" y1="307" x2="715" y2="313"/><line x1="752" y1="307" x2="752" y2="313"/><line x1="790" y1="307" x2="790" y2="313"/><line x1="827" y1="307" x2="827" y2="313"/>
  </g>
  <!-- Channel 1 waveform - sine wave (FIRE - orange) -->
  <path d="M115,310 C145,310 155,180 190,180 S235,440 265,440 S310,180 340,180 S385,440 415,440 S460,180 490,180 S535,440 565,440 S610,180 640,180 S685,440 715,440 S760,180 790,180 S835,440 865,440" stroke="#ff6b35" stroke-width="2.5" fill="none" filter="url(#scope-glow)"/>
  <!-- Channel 2 waveform - square wave (WATER - teal) -->
  <path d="M115,370 H190 V250 H265 V370 H340 V250 H415 V370 H490 V250 H565 V370 H640 V250 H715 V370 H790 V250 H865" stroke="#4ecdc4" stroke-width="2" fill="none" filter="url(#scope-glow)" opacity="0.8"/>
  <!-- Channel 3 waveform - sawtooth (EARTH - green) -->
  <path d="M115,350 L190,210 V350 L265,210 V350 L340,210 V350 L415,210 V350 L490,210 V350 L565,210 V350 L640,210 V350 L715,210 V350 L790,210 V350 L865,210" stroke="#a8e06c" stroke-width="1.5" fill="none" filter="url(#scope-glow)" opacity="0.6"/>
  <!-- Trigger marker -->
  <polygon points="110,310 120,305 120,315" fill="#ffd93d"/>
  <!-- Channel labels on screen -->
  <text x="130" y="85" font-family="'Courier New', monospace" font-size="11" fill="#ff6b35" filter="url(#phosphor)">CH1 FIRE  2V/div</text>
  <text x="130" y="100" font-family="'Courier New', monospace" font-size="11" fill="#4ecdc4" filter="url(#phosphor)">CH2 WATER 2V/div</text>
  <text x="130" y="115" font-family="'Courier New', monospace" font-size="11" fill="#a8e06c" filter="url(#phosphor)">CH3 EARTH 2V/div</text>
  <!-- Time base -->
  <text x="600" y="85" font-family="'Courier New', monospace" font-size="11" fill="#a8e06c" filter="url(#phosphor)">TIME 1ms/div</text>
  <text x="600" y="100" font-family="'Courier New', monospace" font-size="11" fill="#ffd93d" filter="url(#phosphor)">TRIG CH1 RISING</text>
  <!-- Measurements -->
  <text x="130" y="540" font-family="'Courier New', monospace" font-size="10" fill="#a8e06c" filter="url(#phosphor)">Freq: 1.337kHz  Vpp: 5.2V  Duty: 50%</text>
  <text x="600" y="540" font-family="'Courier New', monospace" font-size="10" fill="#a8e06c" filter="url(#phosphor)">RUN  100MSa/s  10K pts</text>
  <!-- Right panel - controls -->
  <rect x="900" y="60" width="280" height="500" rx="5" fill="#2a2a20"/>
  <!-- Brand label -->
  <text x="1040" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffd93d" font-weight="bold" letter-spacing="3">INFINITE CRAFT</text>
  <text x="1040" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888" letter-spacing="2">DIGITAL OSCILLOSCOPE</text>
  <text x="1040" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#666">IC-2026  100MHz  4CH</text>
  <!-- Knobs -->
  <!-- CH1 knob -->
  <circle cx="950" cy="180" r="22" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  <circle cx="950" cy="180" r="18" fill="#333"/>
  <line x1="950" y1="165" x2="950" y2="172" stroke="#ff6b35" stroke-width="2" stroke-linecap="round"/>
  <text x="950" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ff6b35">CH1 V/DIV</text>
  <!-- CH2 knob -->
  <circle cx="1040" cy="180" r="22" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  <circle cx="1040" cy="180" r="18" fill="#333"/>
  <line x1="1040" y1="165" x2="1040" y2="172" stroke="#4ecdc4" stroke-width="2" stroke-linecap="round"/>
  <text x="1040" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#4ecdc4">CH2 V/DIV</text>
  <!-- Time knob -->
  <circle cx="1130" cy="180" r="22" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  <circle cx="1130" cy="180" r="18" fill="#333"/>
  <line x1="1130" y1="165" x2="1130" y2="172" stroke="#a8e06c" stroke-width="2" stroke-linecap="round"/>
  <text x="1130" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#a8e06c">TIME/DIV</text>
  <!-- Trigger knob -->
  <circle cx="1040" cy="280" r="25" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
  <circle cx="1040" cy="280" r="20" fill="#333"/>
  <line x1="1028" y1="264" x2="1034" y2="272" stroke="#ffd93d" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1040" y="320" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ffd93d">TRIGGER</text>
  <!-- Buttons -->
  <rect x="920" y="350" width="50" height="25" rx="3" fill="#444" stroke="#555" stroke-width="1"/>
  <text x="945" y="367" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#aaa">RUN</text>
  <rect x="980" y="350" width="50" height="25" rx="3" fill="#444" stroke="#555" stroke-width="1"/>
  <text x="1005" y="367" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#aaa">STOP</text>
  <rect x="1040" y="350" width="50" height="25" rx="3" fill="#444" stroke="#555" stroke-width="1"/>
  <text x="1065" y="367" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#aaa">AUTO</text>
  <rect x="1100" y="350" width="50" height="25" rx="3" fill="#444" stroke="#555" stroke-width="1"/>
  <text x="1125" y="367" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#aaa">MENU</text>
  <!-- BNC connectors at bottom -->
  <g>
    <circle cx="940" cy="480" r="14" fill="#222" stroke="#888" stroke-width="2"/>
    <circle cx="940" cy="480" r="6" fill="#111" stroke="#666" stroke-width="1"/>
    <text x="940" y="508" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ff6b35">CH1</text>
    <circle cx="1000" cy="480" r="14" fill="#222" stroke="#888" stroke-width="2"/>
    <circle cx="1000" cy="480" r="6" fill="#111" stroke="#666" stroke-width="1"/>
    <text x="1000" y="508" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#4ecdc4">CH2</text>
    <circle cx="1060" cy="480" r="14" fill="#222" stroke="#888" stroke-width="2"/>
    <circle cx="1060" cy="480" r="6" fill="#111" stroke="#666" stroke-width="1"/>
    <text x="1060" y="508" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#a8e06c">CH3</text>
    <circle cx="1120" cy="480" r="14" fill="#222" stroke="#888" stroke-width="2"/>
    <circle cx="1120" cy="480" r="6" fill="#111" stroke="#666" stroke-width="1"/>
    <text x="1120" y="508" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#c4b5fd">CH4</text>
  </g>
  <!-- Power LED -->
  <circle cx="920" cy="540" r="4" fill="#a8e06c" filter="url(#scope-glow)"/>
  <text x="935" y="544" font-family="'Courier New', monospace" font-size="8" fill="#666">PWR</text>
</svg>