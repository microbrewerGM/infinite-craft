<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="card-shadow">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Kitchen-themed background -->
  <rect width="1280" height="640" fill="#f5e6d3"/>
  <!-- Checkered tablecloth pattern -->
  <g opacity="0.1">
    <rect x="0" y="0" width="40" height="40" fill="#cc3333"/>
    <rect x="40" y="40" width="40" height="40" fill="#cc3333"/>
    <rect x="80" y="0" width="40" height="40" fill="#cc3333"/>
    <rect x="0" y="80" width="40" height="40" fill="#cc3333"/>
    <rect x="80" y="80" width="40" height="40" fill="#cc3333"/>
    <rect x="120" y="40" width="40" height="40" fill="#cc3333"/>
    <rect x="40" y="120" width="40" height="40" fill="#cc3333"/>
    <rect x="120" y="120" width="40" height="40" fill="#cc3333"/>
  </g>
  <!-- Main recipe card -->
  <rect x="100" y="30" width="1080" height="580" fill="#fffef5" rx="8" filter="url(#card-shadow)"/>
  <!-- Decorative top border -->
  <rect x="100" y="30" width="1080" height="12" fill="#ff6b35" rx="8"/>
  <rect x="100" y="36" width="1080" height="6" fill="#ff6b35"/>
  <!-- Card header -->
  <text x="640" y="90" font-family="'Georgia', serif" font-size="50" fill="#333" text-anchor="middle" font-style="italic">INFINITE CRAFT</text>
  <text x="640" y="118" font-family="'Georgia', serif" font-size="18" fill="#888" text-anchor="middle" letter-spacing="6">RECIPE COLLECTION</text>
  <line x1="250" y1="130" x2="1030" y2="130" stroke="#ddd" stroke-width="1"/>
  <!-- Decorative swirl dividers -->
  <path d="M580 128 Q600 120 620 128 Q640 136 660 128 Q680 120 700 128" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
  <!-- Recipe 1 -->
  <g font-family="'Georgia', serif">
    <text x="170" y="175" font-size="22" fill="#ff6b35" font-weight="bold">Recipe #1: Steam</text>
    <text x="170" y="205" font-size="16" fill="#666">Ingredients:</text>
    <text x="250" y="205" font-size="16" fill="#333">1 cup Water, 1 cup Fire</text>
    <text x="170" y="228" font-size="16" fill="#666">Method:</text>
    <text x="250" y="228" font-size="16" fill="#333">Combine and let simmer until evaporated.</text>
    <text x="170" y="248" font-size="14" fill="#4ecdc4">Yield: 1 Steam  |  Difficulty: Easy</text>
  </g>
  <line x1="170" y1="260" x2="1110" y2="260" stroke="#eee" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- Recipe 2 -->
  <g font-family="'Georgia', serif">
    <text x="170" y="290" font-size="22" fill="#ff6b35" font-weight="bold">Recipe #2: Dust</text>
    <text x="170" y="320" font-size="16" fill="#666">Ingredients:</text>
    <text x="250" y="320" font-size="16" fill="#333">1 part Earth, 1 part Wind</text>
    <text x="170" y="343" font-size="16" fill="#666">Method:</text>
    <text x="250" y="343" font-size="16" fill="#333">Blow wind across dry earth. Collect particles.</text>
    <text x="170" y="363" font-size="14" fill="#4ecdc4">Yield: 1 Dust  |  Difficulty: Easy</text>
  </g>
  <line x1="170" y1="375" x2="1110" y2="375" stroke="#eee" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- Recipe 3 -->
  <g font-family="'Georgia', serif">
    <text x="170" y="405" font-size="22" fill="#ff6b35" font-weight="bold">Recipe #3: Lava</text>
    <text x="170" y="435" font-size="16" fill="#666">Ingredients:</text>
    <text x="250" y="435" font-size="16" fill="#333">2 cups Fire, 1 cup Earth</text>
    <text x="170" y="458" font-size="16" fill="#666">Method:</text>
    <text x="250" y="458" font-size="16" fill="#333">Heat earth until molten. Warning: extremely hot!</text>
    <text x="170" y="478" font-size="14" fill="#ff6b35">Yield: 1 Lava  |  Difficulty: Medium  |  Caution!</text>
  </g>
  <line x1="170" y1="490" x2="1110" y2="490" stroke="#eee" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- Recipe 4 -->
  <g font-family="'Georgia', serif">
    <text x="170" y="520" font-size="22" fill="#ff6b35" font-weight="bold">Recipe #4: Stone</text>
    <text x="170" y="550" font-size="16" fill="#666">Ingredients:</text>
    <text x="250" y="550" font-size="16" fill="#333">1 Lava (see Recipe #3), 1 cup Water</text>
    <text x="170" y="573" font-size="16" fill="#666">Method:</text>
    <text x="250" y="573" font-size="16" fill="#333">Quench lava with water. Allow to cool and harden.</text>
    <text x="170" y="593" font-size="14" fill="#4ecdc4">Yield: 1 Stone  |  Difficulty: Medium</text>
  </g>
  <!-- Right side decorative elements -->
  <g transform="translate(950, 170)" opacity="0.15">
    <text font-family="'Georgia', serif" font-size="120" fill="#ff6b35" transform="rotate(15)">&#9749;</text>
  </g>
  <!-- Chef's note at bottom -->
  <text x="640" y="623" font-family="'Brush Script MT', cursive" font-size="20" fill="#888" text-anchor="middle">"The secret ingredient is always curiosity." - Chef Infinite</text>
  <!-- Decorative bottom border -->
  <path d="M400 605 Q440 595 480 605 Q520 615 560 605 Q600 595 640 605 Q680 615 720 605 Q760 595 800 605 Q840 615 880 605" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.5"/>
</svg>