<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>

  <!-- Title -->
  <text x="640" y="55" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="67" x2="980" y2="67" stroke="#a8e06c" stroke-width="2"/>
  <text x="640" y="87" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">ELEMENT ASSEMBLY LINE</text>

  <!-- Input hoppers -->
  <g transform="translate(80,140)">
    <polygon points="0,0 80,0 70,40 10,40" fill="none" stroke="#ff6b35" stroke-width="2"/>
    <text x="40" y="25" fill="#ff6b35" font-family="monospace" font-size="10" text-anchor="middle">FIRE</text>
    <line x1="40" y1="40" x2="40" y2="80" stroke="#ff6b35" stroke-width="2"/>
  </g>
  <g transform="translate(180,140)">
    <polygon points="0,0 80,0 70,40 10,40" fill="none" stroke="#4ecdc4" stroke-width="2"/>
    <text x="40" y="25" fill="#4ecdc4" font-family="monospace" font-size="10" text-anchor="middle">WATER</text>
    <line x1="40" y1="40" x2="40" y2="80" stroke="#4ecdc4" stroke-width="2"/>
  </g>
  <g transform="translate(280,140)">
    <polygon points="0,0 80,0 70,40 10,40" fill="none" stroke="#a8e06c" stroke-width="2"/>
    <text x="40" y="25" fill="#a8e06c" font-family="monospace" font-size="10" text-anchor="middle">EARTH</text>
    <line x1="40" y1="40" x2="40" y2="80" stroke="#a8e06c" stroke-width="2"/>
  </g>
  <g transform="translate(380,140)">
    <polygon points="0,0 80,0 70,40 10,40" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    <text x="40" y="25" fill="#c4b5fd" font-family="monospace" font-size="10" text-anchor="middle">WIND</text>
    <line x1="40" y1="40" x2="40" y2="80" stroke="#c4b5fd" stroke-width="2"/>
  </g>

  <!-- Main conveyor belt -->
  <rect x="60" y="240" width="500" height="30" fill="none" stroke="#6eaadc" stroke-width="2" rx="15"/>
  <!-- Conveyor rollers -->
  <circle cx="85" cy="255" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="135" cy="255" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="185" cy="255" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="235" cy="255" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="285" cy="255" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="335" cy="255" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="385" cy="255" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="435" cy="255" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="535" cy="255" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <!-- Direction arrows -->
  <polygon points="480,248 490,255 480,262" fill="#ffd93d"/>
  <polygon points="400,248 410,255 400,262" fill="#ffd93d"/>
  <polygon points="200,248 210,255 200,262" fill="#ffd93d"/>

  <!-- Items on conveyor -->
  <rect x="110" y="228" width="18" height="12" fill="#ff6b35" opacity="0.6" rx="2"/>
  <rect x="210" y="228" width="18" height="12" fill="#4ecdc4" opacity="0.6" rx="2"/>
  <rect x="310" y="228" width="18" height="12" fill="#a8e06c" opacity="0.6" rx="2"/>
  <rect x="450" y="228" width="18" height="12" fill="#c4b5fd" opacity="0.6" rx="2"/>

  <!-- Processing Station 1 -->
  <rect x="540" y="200" width="120" height="100" fill="none" stroke="#ff6b35" stroke-width="2.5" rx="5"/>
  <text x="600" y="240" fill="#ff6b35" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">COMBINER</text>
  <text x="600" y="260" fill="#ff6b35" font-family="monospace" font-size="10" text-anchor="middle">STATION 1</text>
  <!-- Gears inside -->
  <circle cx="580" cy="280" r="8" fill="none" stroke="#ffd93d" stroke-width="1"/>
  <circle cx="620" cy="280" r="8" fill="none" stroke="#ffd93d" stroke-width="1"/>

  <!-- Transfer conveyor -->
  <line x1="660" y1="255" x2="730" y2="255" stroke="#6eaadc" stroke-width="3"/>
  <polygon points="720,249 730,255 720,261" fill="#ffd93d"/>

  <!-- Processing Station 2 -->
  <rect x="730" y="200" width="120" height="100" fill="none" stroke="#4ecdc4" stroke-width="2.5" rx="5"/>
  <text x="790" y="240" fill="#4ecdc4" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">REFINER</text>
  <text x="790" y="260" fill="#4ecdc4" font-family="monospace" font-size="10" text-anchor="middle">STATION 2</text>
  <circle cx="770" cy="280" r="8" fill="none" stroke="#ffd93d" stroke-width="1"/>
  <circle cx="810" cy="280" r="8" fill="none" stroke="#ffd93d" stroke-width="1"/>

  <!-- Down conveyor -->
  <line x1="790" y1="300" x2="790" y2="370" stroke="#6eaadc" stroke-width="3"/>
  <polygon points="784,360 790,370 796,360" fill="#ffd93d"/>

  <!-- Lower conveyor belt -->
  <rect x="600" y="380" width="560" height="30" fill="none" stroke="#6eaadc" stroke-width="2" rx="15"/>
  <circle cx="625" cy="395" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="725" cy="395" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="825" cy="395" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="925" cy="395" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="1025" cy="395" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="1135" cy="395" r="10" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <!-- Direction -->
  <polygon points="850,388 860,395 850,402" fill="#ffd93d"/>
  <polygon points="1050,388 1060,395 1050,402" fill="#ffd93d"/>

  <!-- Quality check station -->
  <rect x="880" y="340" width="100" height="80" fill="none" stroke="#a8e06c" stroke-width="2" rx="5"/>
  <text x="930" y="370" fill="#a8e06c" font-family="monospace" font-size="10" text-anchor="middle">QUALITY</text>
  <text x="930" y="385" fill="#a8e06c" font-family="monospace" font-size="10" text-anchor="middle">CHECK</text>
  <!-- Checkmark -->
  <polyline points="915,400 925,410 945,390" fill="none" stroke="#a8e06c" stroke-width="2"/>

  <!-- Output bins -->
  <g transform="translate(1060,440)">
    <rect x="0" y="0" width="80" height="80" fill="none" stroke="#ff6b35" stroke-width="2" rx="5"/>
    <text x="40" y="40" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">NEW</text>
    <text x="40" y="55" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">ELEMENTS</text>
    <text x="40" y="75" fill="#ffd93d" font-family="monospace" font-size="11" text-anchor="middle">2847</text>
  </g>
  <line x1="1100" y1="410" x2="1100" y2="440" stroke="#6eaadc" stroke-width="2"/>

  <!-- Reject bin -->
  <g transform="translate(1060,550)">
    <rect x="0" y="0" width="80" height="50" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="3" stroke-dasharray="4,3"/>
    <text x="40" y="25" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">DUPLICATES</text>
    <text x="40" y="40" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">142</text>
  </g>

  <!-- Robot arms -->
  <g transform="translate(500,320)">
    <line x1="0" y1="0" x2="30" y2="-40" stroke="#c4b5fd" stroke-width="3"/>
    <line x1="30" y1="-40" x2="50" y2="-20" stroke="#c4b5fd" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#c4b5fd"/>
    <circle cx="50" cy="-20" r="4" fill="#c4b5fd"/>
    <text x="0" y="15" fill="#c4b5fd" font-family="monospace" font-size="8" text-anchor="middle">ARM-1</text>
  </g>

  <g transform="translate(700,320)">
    <line x1="0" y1="0" x2="-20" y2="-40" stroke="#c4b5fd" stroke-width="3"/>
    <line x1="-20" y1="-40" x2="-40" y2="-15" stroke="#c4b5fd" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#c4b5fd"/>
    <circle cx="-40" cy="-15" r="4" fill="#c4b5fd"/>
    <text x="0" y="15" fill="#c4b5fd" font-family="monospace" font-size="8" text-anchor="middle">ARM-2</text>
  </g>

  <!-- Status panel -->
  <rect x="60" y="400" width="200" height="140" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="5"/>
  <text x="160" y="425" fill="white" font-family="monospace" font-size="12" text-anchor="middle">STATUS PANEL</text>
  <line x1="60" y1="435" x2="260" y2="435" stroke="#6eaadc" stroke-width="0.5"/>
  <text x="80" y="455" fill="#a8e06c" font-family="monospace" font-size="10">THROUGHPUT: 42/hr</text>
  <text x="80" y="475" fill="#ffd93d" font-family="monospace" font-size="10">EFFICIENCY: 94.2%</text>
  <text x="80" y="495" fill="#4ecdc4" font-family="monospace" font-size="10">UPTIME: 99.8%</text>
  <text x="80" y="515" fill="#ff6b35" font-family="monospace" font-size="10">QUEUE: 18 items</text>
  <circle cx="240" cy="450" r="5" fill="#a8e06c"/>
  <circle cx="240" cy="470" r="5" fill="#ffd93d"/>
  <circle cx="240" cy="490" r="5" fill="#4ecdc4"/>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 55 M 20 20 L 55 20" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 55 M 1260 20 L 1225 20" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 585 M 20 620 L 55 620" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 585 M 1260 620 L 1225 620" stroke="#a8e06c" stroke-width="2" fill="none"/>

  <!-- Info block -->
  <rect x="900" y="580" width="360" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="1080" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-FACTORY-005</text>
</svg>