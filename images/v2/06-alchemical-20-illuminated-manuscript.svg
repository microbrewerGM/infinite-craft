<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg20" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14100a"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <filter id="glow20">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gold20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="50%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg20)"/>
  <!-- Parchment tint -->
  <rect width="1280" height="640" fill="#c9a96e" opacity="0.02"/>
  <!-- Page border with ivy/vine decoration -->
  <rect x="50" y="25" width="1180" height="590" fill="none" stroke="#c9a96e" stroke-width="2" opacity="0.4"/>
  <rect x="58" y="33" width="1164" height="574" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
  <!-- Corner vine decorations -->
  <g stroke="#a8e06c" stroke-width="1" fill="none" opacity="0.3">
    <!-- Top left -->
    <path d="M65,40 Q65,60 80,60 Q65,60 65,80"/>
    <circle cx="80" cy="48" r="3" fill="#a8e06c" opacity="0.2"/>
    <circle cx="58" cy="70" r="2.5" fill="#a8e06c" opacity="0.2"/>
    <!-- Top right -->
    <path d="M1215,40 Q1215,60 1200,60 Q1215,60 1215,80"/>
    <circle cx="1200" cy="48" r="3" fill="#a8e06c" opacity="0.2"/>
    <circle cx="1222" cy="70" r="2.5" fill="#a8e06c" opacity="0.2"/>
    <!-- Bottom left -->
    <path d="M65,600 Q65,580 80,580 Q65,580 65,560"/>
    <circle cx="80" cy="592" r="3" fill="#a8e06c" opacity="0.2"/>
    <!-- Bottom right -->
    <path d="M1215,600 Q1215,580 1200,580 Q1215,580 1215,560"/>
    <circle cx="1200" cy="592" r="3" fill="#a8e06c" opacity="0.2"/>
  </g>
  <!-- GIANT illuminated letter "I" -->
  <g transform="translate(180,120)">
    <!-- Letter background panel -->
    <rect x="-60" y="-30" width="160" height="280" rx="8" fill="none" stroke="url(#gold20)" stroke-width="2" opacity="0.5"/>
    <rect x="-55" y="-25" width="150" height="270" rx="6" fill="#c9a96e" opacity="0.03"/>
    <!-- The letter I -->
    <text x="20" y="200" font-family="serif" font-size="250" fill="url(#gold20)" opacity="0.4" filter="url(#glow20)">I</text>
    <!-- Decorative elements within the letter panel -->
    <!-- Fire symbol -->
    <polygon points="-20,30 -10,10 0,30" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.5"/>
    <!-- Water drops -->
    <circle cx="75" cy="40" r="6" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.4"/>
    <!-- Earth crystal -->
    <polygon points="-20,180 -10,160 0,180" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.5"/>
    <!-- Air swirl -->
    <path d="M70,175 Q80,165 75,155 Q70,145 80,140" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
    <!-- Vine wrapping the letter -->
    <path d="M-50,-20 Q-30,20 -45,60 Q-55,100 -40,140 Q-30,180 -50,220 Q-55,240 -45,250" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.3"/>
    <g fill="#a8e06c" opacity="0.15">
      <circle cx="-45" cy="60" r="4"/>
      <circle cx="-40" cy="140" r="3.5"/>
      <circle cx="-50" cy="220" r="4"/>
    </g>
  </g>
  <!-- Text lines following the illuminated letter -->
  <g font-family="serif" fill="#c9a96e" opacity="0.5">
    <text x="370" y="160" font-size="28" letter-spacing="4">NFINITE CRAFT</text>
    <!-- Decorative underline -->
    <line x1="370" y1="170" x2="750" y2="170" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
    <!-- Manuscript body text (smaller, simulating Latin) -->
    <text x="370" y="210" font-size="13" opacity="0.35">In principio erat creatio, et creatio erat apud elementa,</text>
    <text x="370" y="232" font-size="13" opacity="0.35">et elementa erant creatio. Ignis et Aqua, Terra et Aer,</text>
    <text x="370" y="254" font-size="13" opacity="0.35">quattuor viae ad infinitum. Omnia ex nihilo surgunt,</text>
    <text x="370" y="276" font-size="13" opacity="0.35">et in combinatione nova vita invenitur.</text>
    <text x="370" y="310" font-size="13" opacity="0.35">Hic liber continet mysteria artis combinandi.</text>
    <text x="370" y="332" font-size="13" opacity="0.35">Qui legit, intelligat: ex simplici, complexum;</text>
    <text x="370" y="354" font-size="13" opacity="0.35">ex paucis, innumerabilia; ex quattuor, universum.</text>
  </g>
  <!-- Right margin illustration: small alchemical diagram -->
  <g transform="translate(1050,300)">
    <circle r="80" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.2"/>
    <circle r="60" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.15"/>
    <!-- Small elements at cardinal points -->
    <polygon points="0,-55 -8,-40 8,-40" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
    <polygon points="55,0 40,-8 40,8" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.4"/>
    <polygon points="0,55 -8,40 8,40" fill="none" stroke="#a8e06c" stroke-width="1" opacity="0.4"/>
    <polygon points="-55,0 -40,-8 -40,8" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
    <circle r="15" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.3"/>
    <circle r="3" fill="#ffd93d" opacity="0.2"/>
  </g>
  <!-- Bottom decorative band -->
  <g transform="translate(640,520)">
    <line x1="-500" y1="0" x2="500" y2="0" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
    <!-- Small repeated ornament -->
    <g fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.2">
      <path d="M-400,0 Q-395,-8 -390,0 Q-385,8 -380,0"/>
      <path d="M-300,0 Q-295,-8 -290,0 Q-285,8 -280,0"/>
      <path d="M-200,0 Q-195,-8 -190,0 Q-185,8 -180,0"/>
      <path d="M-100,0 Q-95,-8 -90,0 Q-85,8 -80,0"/>
      <path d="M0,0 Q5,-8 10,0 Q15,8 20,0"/>
      <path d="M100,0 Q105,-8 110,0 Q115,8 120,0"/>
      <path d="M200,0 Q205,-8 210,0 Q215,8 220,0"/>
      <path d="M300,0 Q305,-8 310,0 Q315,8 320,0"/>
      <path d="M400,0 Q405,-8 410,0 Q415,8 420,0"/>
    </g>
  </g>
  <!-- Colophon text at bottom -->
  <text x="640" y="570" text-anchor="middle" font-family="serif" font-size="11" fill="#c9a96e" opacity="0.3" letter-spacing="4" font-style="italic">Scriptum et illuminatum in officina Infinitatis</text>
  <!-- Gold leaf flecks -->
  <g fill="#ffd93d" opacity="0.1">
    <rect x="390" y="140" width="3" height="2" transform="rotate(15,391,141)"/>
    <rect x="550" y="195" width="2" height="3" transform="rotate(-10,551,196)"/>
    <rect x="700" y="260" width="3" height="2" transform="rotate(30,701,261)"/>
    <rect x="450" y="300" width="2" height="3" transform="rotate(-20,451,301)"/>
  </g>
</svg>