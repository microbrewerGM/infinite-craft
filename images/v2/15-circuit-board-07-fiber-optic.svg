<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="fiber-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="core-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="cable-jacket" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="70%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <radialGradient id="bundle-center" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a1a30"/>
      <stop offset="100%" stop-color="#0a0a15"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#050510"/>
  <!-- Outer cable jacket (cross-section circle) -->
  <circle cx="640" cy="320" r="280" fill="url(#cable-jacket)" stroke="#222" stroke-width="4"/>
  <circle cx="640" cy="320" r="275" fill="none" stroke="#1a1a2a" stroke-width="2"/>
  <!-- Kevlar strength member ring -->
  <circle cx="640" cy="320" r="260" fill="none" stroke="#333320" stroke-width="3" stroke-dasharray="4 6" opacity="0.4"/>
  <!-- Inner tube / buffer -->
  <circle cx="640" cy="320" r="240" fill="url(#bundle-center)" stroke="#1a1a25" stroke-width="2"/>
  <!-- Fiber strands - arranged in concentric rings -->
  <!-- Outer ring of fibers -->
  <g filter="url(#fiber-glow)">
    <!-- Orange fibers -->
    <circle cx="640" cy="100" r="18" fill="#1a0a05" stroke="#ff6b35" stroke-width="2"/><circle cx="640" cy="100" r="6" fill="#ff6b35" filter="url(#core-glow)"/>
    <circle cx="740" cy="115" r="18" fill="#1a0a05" stroke="#ff6b35" stroke-width="2"/><circle cx="740" cy="115" r="6" fill="#ff6b35" filter="url(#core-glow)"/>
    <circle cx="825" cy="165" r="18" fill="#1a0a05" stroke="#ff6b35" stroke-width="2"/><circle cx="825" cy="165" r="6" fill="#ff6b35" filter="url(#core-glow)"/>
    <circle cx="540" cy="115" r="18" fill="#1a0a05" stroke="#ff6b35" stroke-width="2"/><circle cx="540" cy="115" r="6" fill="#ff6b35" filter="url(#core-glow)"/>
    <circle cx="455" cy="165" r="18" fill="#1a0a05" stroke="#ff6b35" stroke-width="2"/><circle cx="455" cy="165" r="6" fill="#ff6b35" filter="url(#core-glow)"/>
    <!-- Teal fibers -->
    <circle cx="880" cy="240" r="18" fill="#051a18" stroke="#4ecdc4" stroke-width="2"/><circle cx="880" cy="240" r="6" fill="#4ecdc4" filter="url(#core-glow)"/>
    <circle cx="900" cy="340" r="18" fill="#051a18" stroke="#4ecdc4" stroke-width="2"/><circle cx="900" cy="340" r="6" fill="#4ecdc4" filter="url(#core-glow)"/>
    <circle cx="880" cy="430" r="18" fill="#051a18" stroke="#4ecdc4" stroke-width="2"/><circle cx="880" cy="430" r="6" fill="#4ecdc4" filter="url(#core-glow)"/>
    <circle cx="400" cy="240" r="18" fill="#051a18" stroke="#4ecdc4" stroke-width="2"/><circle cx="400" cy="240" r="6" fill="#4ecdc4" filter="url(#core-glow)"/>
    <circle cx="380" cy="340" r="18" fill="#051a18" stroke="#4ecdc4" stroke-width="2"/><circle cx="380" cy="340" r="6" fill="#4ecdc4" filter="url(#core-glow)"/>
    <circle cx="400" cy="430" r="18" fill="#051a18" stroke="#4ecdc4" stroke-width="2"/><circle cx="400" cy="430" r="6" fill="#4ecdc4" filter="url(#core-glow)"/>
    <!-- Green fibers -->
    <circle cx="825" cy="490" r="18" fill="#0a1a05" stroke="#a8e06c" stroke-width="2"/><circle cx="825" cy="490" r="6" fill="#a8e06c" filter="url(#core-glow)"/>
    <circle cx="740" cy="530" r="18" fill="#0a1a05" stroke="#a8e06c" stroke-width="2"/><circle cx="740" cy="530" r="6" fill="#a8e06c" filter="url(#core-glow)"/>
    <circle cx="640" cy="545" r="18" fill="#0a1a05" stroke="#a8e06c" stroke-width="2"/><circle cx="640" cy="545" r="6" fill="#a8e06c" filter="url(#core-glow)"/>
    <circle cx="540" cy="530" r="18" fill="#0a1a05" stroke="#a8e06c" stroke-width="2"/><circle cx="540" cy="530" r="6" fill="#a8e06c" filter="url(#core-glow)"/>
    <circle cx="455" cy="490" r="18" fill="#0a1a05" stroke="#a8e06c" stroke-width="2"/><circle cx="455" cy="490" r="6" fill="#a8e06c" filter="url(#core-glow)"/>
  </g>
  <!-- Inner ring of fibers -->
  <g filter="url(#fiber-glow)">
    <!-- Purple fibers -->
    <circle cx="640" cy="180" r="16" fill="#0a051a" stroke="#c4b5fd" stroke-width="2"/><circle cx="640" cy="180" r="5" fill="#c4b5fd" filter="url(#core-glow)"/>
    <circle cx="720" cy="200" r="16" fill="#0a051a" stroke="#c4b5fd" stroke-width="2"/><circle cx="720" cy="200" r="5" fill="#c4b5fd" filter="url(#core-glow)"/>
    <circle cx="780" cy="260" r="16" fill="#0a051a" stroke="#c4b5fd" stroke-width="2"/><circle cx="780" cy="260" r="5" fill="#c4b5fd" filter="url(#core-glow)"/>
    <circle cx="560" cy="200" r="16" fill="#0a051a" stroke="#c4b5fd" stroke-width="2"/><circle cx="560" cy="200" r="5" fill="#c4b5fd" filter="url(#core-glow)"/>
    <circle cx="500" cy="260" r="16" fill="#0a051a" stroke="#c4b5fd" stroke-width="2"/><circle cx="500" cy="260" r="5" fill="#c4b5fd" filter="url(#core-glow)"/>
    <!-- Yellow fibers -->
    <circle cx="800" cy="340" r="16" fill="#1a1505" stroke="#ffd93d" stroke-width="2"/><circle cx="800" cy="340" r="5" fill="#ffd93d" filter="url(#core-glow)"/>
    <circle cx="780" cy="420" r="16" fill="#1a1505" stroke="#ffd93d" stroke-width="2"/><circle cx="780" cy="420" r="5" fill="#ffd93d" filter="url(#core-glow)"/>
    <circle cx="720" cy="465" r="16" fill="#1a1505" stroke="#ffd93d" stroke-width="2"/><circle cx="720" cy="465" r="5" fill="#ffd93d" filter="url(#core-glow)"/>
    <circle cx="480" cy="340" r="16" fill="#1a1505" stroke="#ffd93d" stroke-width="2"/><circle cx="480" cy="340" r="5" fill="#ffd93d" filter="url(#core-glow)"/>
    <circle cx="500" cy="420" r="16" fill="#1a1505" stroke="#ffd93d" stroke-width="2"/><circle cx="500" cy="420" r="5" fill="#ffd93d" filter="url(#core-glow)"/>
    <circle cx="560" cy="465" r="16" fill="#1a1505" stroke="#ffd93d" stroke-width="2"/><circle cx="560" cy="465" r="5" fill="#ffd93d" filter="url(#core-glow)"/>
    <circle cx="640" cy="475" r="16" fill="#1a1505" stroke="#ffd93d" stroke-width="2"/><circle cx="640" cy="475" r="5" fill="#ffd93d" filter="url(#core-glow)"/>
  </g>
  <!-- Center core fiber bundle -->
  <g filter="url(#fiber-glow)">
    <circle cx="600" cy="300" r="14" fill="#0a0510" stroke="#fff" stroke-width="2"/><circle cx="600" cy="300" r="5" fill="#fff" filter="url(#core-glow)"/>
    <circle cx="640" cy="285" r="14" fill="#0a0510" stroke="#fff" stroke-width="2"/><circle cx="640" cy="285" r="5" fill="#fff" filter="url(#core-glow)"/>
    <circle cx="680" cy="300" r="14" fill="#0a0510" stroke="#fff" stroke-width="2"/><circle cx="680" cy="300" r="5" fill="#fff" filter="url(#core-glow)"/>
    <circle cx="620" cy="335" r="14" fill="#0a0510" stroke="#fff" stroke-width="2"/><circle cx="620" cy="335" r="5" fill="#fff" filter="url(#core-glow)"/>
    <circle cx="660" cy="335" r="14" fill="#0a0510" stroke="#fff" stroke-width="2"/><circle cx="660" cy="335" r="5" fill="#fff" filter="url(#core-glow)"/>
    <circle cx="640" cy="365" r="14" fill="#0a0510" stroke="#fff" stroke-width="2"/><circle cx="640" cy="365" r="5" fill="#fff" filter="url(#core-glow)"/>
  </g>
  <!-- Labels outside cable -->
  <text x="120" y="200" font-family="'Courier New', monospace" font-size="13" fill="#ff6b35" opacity="0.7">FIRE x5</text>
  <text x="120" y="400" font-family="'Courier New', monospace" font-size="13" fill="#4ecdc4" opacity="0.7">WATER x6</text>
  <text x="1060" y="200" font-family="'Courier New', monospace" font-size="13" fill="#c4b5fd" opacity="0.7">WIND x5</text>
  <text x="1060" y="400" font-family="'Courier New', monospace" font-size="13" fill="#ffd93d" opacity="0.7">EARTH x7</text>
  <!-- Annotation lines -->
  <line x1="200" y1="205" x2="370" y2="260" stroke="#ff6b35" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="200" y1="395" x2="390" y2="370" stroke="#4ecdc4" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="1050" y1="205" x2="910" y2="260" stroke="#c4b5fd" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="1050" y1="395" x2="890" y2="370" stroke="#ffd93d" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 4"/>
  <!-- Title -->
  <text x="150" y="580" font-family="Arial, sans-serif" font-size="42" fill="#fff" font-weight="bold" letter-spacing="6">INFINITE CRAFT</text>
  <text x="150" y="610" font-family="'Courier New', monospace" font-size="14" fill="#4ecdc4" letter-spacing="3">48-STRAND FIBER OPTIC CROSS SECTION</text>
  <!-- Fiber count -->
  <text x="1100" y="580" font-family="'Courier New', monospace" font-size="11" fill="#666" text-anchor="end">SM 9/125</text>
  <text x="1100" y="600" font-family="'Courier New', monospace" font-size="11" fill="#666" text-anchor="end">OS2 RATED</text>
</svg>