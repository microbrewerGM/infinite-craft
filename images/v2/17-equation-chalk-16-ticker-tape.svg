    <rect x="20" y="292" width="800" height="30" fill="#1a0a0a" opacity="0.5"/>
    <text x="35" y="312" fill="#888">#006</text>
    <text x="180" y="312" fill="#666">Wind</text>
    <text x="320" y="312" fill="#666">Wind</text>
    <text x="460" y="312" fill="#666">???</text>
    <text x="590" y="312" fill="#ff6b35">REJECTED</text>
    <text x="710" y="312" fill="#ff6b35">&#9660;&#9660;&#9660;</text>
    <!-- Row 7 -->
    <rect x="20" y="324" width="800" height="30" fill="#111d33" opacity="0.5"/>
    <text x="35" y="344" fill="#888">#007</text>
    <text x="180" y="344" fill="#c9c4a1">Stone</text>
    <text x="320" y="344" fill="#c9c4a1">Fire</text>
    <text x="460" y="344" fill="#ffd93d">Metal</text>
    <text x="590" y="344" fill="#a8e06c">CONFIRMED</text>
    <text x="710" y="344" fill="#a8e06c">&#9650;&#9650;&#9650;</text>
  </g>
  <!-- Right panel: mini chart -->
  <rect x="850" y="100" width="410" height="260" fill="#111d33" stroke="#1a2844" stroke-width="1" rx="4"/>
  <text x="870" y="125" font-family="'Courier New', monospace" font-size="14" fill="#4ecdc4">DISCOVERY RATE (24H)</text>
