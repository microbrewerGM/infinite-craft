  <g stroke="#1a2844" stroke-width="0.5">
    <line x1="880" y1="150" x2="1240" y2="150"/><line x1="880" y1="190" x2="1240" y2="190"/>
    <line x1="880" y1="230" x2="1240" y2="230"/><line x1="880" y1="270" x2="1240" y2="270"/>
    <line x1="880" y1="310" x2="1240" y2="310"/><line x1="880" y1="340" x2="1240" y2="340"/>
  </g>
  <!-- Chart line -->
  <polyline points="880,300 920,290 960,270 1000,280 1040,240 1080,220 1120,200 1160,180 1200,160 1240,150" fill="none" stroke="#a8e06c" stroke-width="2"/>
  <!-- Chart area fill -->
  <polygon points="880,300 920,290 960,270 1000,280 1040,240 1080,220 1120,200 1160,180 1200,160 1240,150 1240,340 880,340" fill="#a8e06c" opacity="0.1"/>
  <!-- Bottom stats -->
  <rect x="20" y="380" width="1240" height="100" fill="#111d33" rx="4"/>
  <g font-family="'Courier New', monospace">
    <text x="50" y="410" font-size="12" fill="#555">MOST TRADED</text>
    <text x="50" y="435" font-size="24" fill="#ffd93d">Steam</text>
    <text x="50" y="460" font-size="14" fill="#a8e06c">+247 today</text>
    <text x="300" y="410" font-size="12" fill="#555">RAREST COMBO</text>
    <text x="300" y="435" font-size="24" fill="#c4b5fd">Geyser</text>
    <text x="300" y="460" font-size="14" fill="#ff6b35">only 3 found</text>
    <text x="560" y="410" font-size="12" fill="#555">TOTAL ELEMENTS</text>
    <text x="560" y="435" font-size="24" fill="#4ecdc4">1,247</text>
    <text x="560" y="460" font-size="14" fill="#a8e06c">&#9650; 12% this week</text>
    <text x="820" y="410" font-size="12" fill="#555">BASE ELEMENTS</text>
    <text x="820" y="435" font-size="24" fill="#ff6b35">4</text>
    <text x="820" y="460" font-size="14" fill="#888">Water Fire Earth Wind</text>
    <text x="1080" y="410" font-size="12" fill="#555">MARKET CAP</text>
    <text x="1080" y="435" font-size="24" fill="#a8e06c">&#8734;</text>
    <text x="1080" y="460" font-size="14" fill="#c9c4a1">infinite</text>
  </g>
  <!-- Bottom scrolling ticker -->
  <rect x="0" y="500" width="1280" height="30" fill="#0f1a2e"/>
  <g font-family="'Courier New', monospace" font-size="14">
    <text x="20" y="520" fill="#a8e06c">CLAY+FIRE=BRICK &#9650;</text>
    <text x="250" y="520" fill="#555">|</text>
    <text x="270" y="520" fill="#c4b5fd">STEAM+EARTH=GEYSER &#9650;</text>
    <text x="540" y="520" fill="#555">|</text>
    <text x="560" y="520" fill="#ff6b35">METAL+WATER=RUST &#9660;</text>
    <text x="790" y="520" fill="#555">|</text>
    <text x="810" y="520" fill="#a8e06c">BRICK+BRICK=WALL &#9650;</text>
    <text x="1050" y="520" fill="#555">|</text>
    <text x="1070" y="520" fill="#ffd93d">STONE+WIND=SAND &#9650;</text>
  </g>
  <!-- Disclaimer at very bottom -->
  <text x="640" y="570" font-family="'Courier New', monospace" font-size="10" fill="#333" text-anchor="middle">ELEMENT COMBINATION DATA PROVIDED FOR EDUCATIONAL PURPOSES ONLY. PAST COMBINATIONS DO NOT GUARANTEE FUTURE RESULTS.</text>
  <!-- Breaking news bar -->
  <rect x="0" y="585" width="1280" height="35" fill="#ff6b35" opacity="0.9"/>
  <text x="20" y="608" font-family="'Courier New', monospace" font-size="14" fill="white" font-weight="bold">BREAKING:</text>
  <text x="130" y="608" font-family="'Courier New', monospace" font-size="14" fill="white">New element discovered! Metal + Earth = Ore. Element count reaches all-time high. Analysts predict infinite growth.</text>
</svg>