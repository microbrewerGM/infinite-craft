<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blueprint-glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#1a3060" stroke-width="0.3"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#1a3060" stroke-width="0.3"/>
    </pattern>
    <pattern id="bp-grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none"/>
      <line x1="0" y1="0" x2="100" y2="0" stroke="#1a3060" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="100" stroke="#1a3060" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- Blueprint background -->
  <rect width="1280" height="640" fill="#0a1628"/>
  <rect width="1280" height="640" fill="url(#bp-grid)"/>
  <rect width="1280" height="640" fill="url(#bp-grid-major)"/>
  <!-- Border -->
  <rect x="20" y="20" width="1240" height="600" fill="none" stroke="#2a5090" stroke-width="2"/>
  <rect x="25" y="25" width="1230" height="590" fill="none" stroke="#2a5090" stroke-width="0.5"/>
  <!-- Title block -->
  <rect x="880" y="560" width="370" height="50" fill="none" stroke="#2a5090" stroke-width="1"/>
  <text x="1065" y="582" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#4ecdc4" font-weight="bold" letter-spacing="3">INFINITE CRAFT</text>
  <text x="1065" y="600" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#2a5090" letter-spacing="2">LOGIC GATE SCHEMATIC REV 2.0</text>
  <!-- AND Gate (Fire + Water) -->
  <g filter="url(#blueprint-glow)">
    <!-- Input lines -->
    <line x1="80" y1="140" x2="160" y2="140" stroke="#ff6b35" stroke-width="2"/>
    <line x1="80" y1="180" x2="160" y2="180" stroke="#4ecdc4" stroke-width="2"/>
    <!-- AND gate shape -->
    <path d="M160,120 H210 C260,120 280,160 260,180 C280,200 260,240 210,240 H160 Z" fill="none" stroke="#fff" stroke-width="2"/>
    <!-- Output -->
    <line x1="268" y1="180" x2="340" y2="180" stroke="#ffd93d" stroke-width="2"/>
    <!-- Labels -->
    <text x="60" y="144" font-family="'Courier New', monospace" font-size="12" fill="#ff6b35" text-anchor="end">FIRE</text>
    <text x="60" y="184" font-family="'Courier New', monospace" font-size="12" fill="#4ecdc4" text-anchor="end">WATER</text>
    <text x="210" y="185" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#fff" font-weight="bold">AND</text>
    <text x="355" y="184" font-family="'Courier New', monospace" font-size="11" fill="#ffd93d">STEAM</text>
    <!-- Signal values -->
    <text x="100" y="132" font-family="'Courier New', monospace" font-size="9" fill="#ff6b35">1</text>
    <text x="100" y="172" font-family="'Courier New', monospace" font-size="9" fill="#4ecdc4">1</text>
    <text x="310" y="172" font-family="'Courier New', monospace" font-size="9" fill="#ffd93d">1</text>
  </g>
  <!-- OR Gate (Earth + Wind) -->
  <g filter="url(#blueprint-glow)">
    <line x1="80" y1="320" x2="170" y2="320" stroke="#a8e06c" stroke-width="2"/>
    <line x1="80" y1="360" x2="170" y2="360" stroke="#c4b5fd" stroke-width="2"/>
    <!-- OR gate shape -->
    <path d="M155,300 C175,300 195,300 215,320 C235,340 245,340 265,340 C245,340 235,340 215,360 C195,380 175,380 155,380 C175,340 175,340 155,300 Z" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="265" y1="340" x2="340" y2="340" stroke="#ffd93d" stroke-width="2"/>
    <text x="60" y="324" font-family="'Courier New', monospace" font-size="12" fill="#a8e06c" text-anchor="end">EARTH</text>
    <text x="60" y="364" font-family="'Courier New', monospace" font-size="12" fill="#c4b5fd" text-anchor="end">WIND</text>
    <text x="210" y="345" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#fff" font-weight="bold">OR</text>
    <text x="355" y="344" font-family="'Courier New', monospace" font-size="11" fill="#ffd93d">DUST</text>
    <text x="100" y="312" font-family="'Courier New', monospace" font-size="9" fill="#a8e06c">0</text>
    <text x="100" y="352" font-family="'Courier New', monospace" font-size="9" fill="#c4b5fd">1</text>
    <text x="310" y="332" font-family="'Courier New', monospace" font-size="9" fill="#ffd93d">1</text>
  </g>
  <!-- NOT Gate (inverter) -->
  <g filter="url(#blueprint-glow)">
    <line x1="80" y1="500" x2="170" y2="500" stroke="#ff6b35" stroke-width="2"/>
    <!-- Triangle -->
    <polygon points="170,475 240,500 170,525" fill="none" stroke="#fff" stroke-width="2"/>
    <!-- Bubble -->
    <circle cx="248" cy="500" r="8" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="256" y1="500" x2="340" y2="500" stroke="#4ecdc4" stroke-width="2"/>
    <text x="60" y="504" font-family="'Courier New', monospace" font-size="12" fill="#ff6b35" text-anchor="end">FIRE</text>
    <text x="200" y="505" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#fff" font-weight="bold">NOT</text>
    <text x="355" y="504" font-family="'Courier New', monospace" font-size="11" fill="#4ecdc4">ICE</text>
    <text x="100" y="492" font-family="'Courier New', monospace" font-size="9" fill="#ff6b35">1</text>
    <text x="310" y="492" font-family="'Courier New', monospace" font-size="9" fill="#4ecdc4">0</text>
  </g>
  <!-- XOR Gate (combining stage) -->
  <g filter="url(#blueprint-glow)" transform="translate(460,0)">
    <line x1="80" y1="140" x2="170" y2="140" stroke="#ffd93d" stroke-width="2"/>
    <line x1="80" y1="180" x2="170" y2="180" stroke="#ffd93d" stroke-width="2"/>
    <!-- XOR gate shape (OR with extra curve) -->
    <path d="M148,120 C168,160 168,160 148,200" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M155,120 C175,120 195,120 215,140 C235,160 245,160 265,160 C245,160 235,160 215,180 C195,200 175,200 155,200 C175,160 175,160 155,120 Z" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="265" y1="160" x2="340" y2="160" stroke="#a8e06c" stroke-width="2"/>
    <text x="60" y="144" font-family="'Courier New', monospace" font-size="11" fill="#ffd93d" text-anchor="end">STEAM</text>
    <text x="60" y="184" font-family="'Courier New', monospace" font-size="11" fill="#ffd93d" text-anchor="end">DUST</text>
    <text x="210" y="165" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#fff" font-weight="bold">XOR</text>
    <text x="355" y="164" font-family="'Courier New', monospace" font-size="11" fill="#a8e06c">LIFE</text>
    <text x="100" y="132" font-family="'Courier New', monospace" font-size="9" fill="#ffd93d">1</text>
    <text x="100" y="172" font-family="'Courier New', monospace" font-size="9" fill="#ffd93d">1</text>
    <text x="310" y="152" font-family="'Courier New', monospace" font-size="9" fill="#a8e06c">0</text>
  </g>
  <!-- NAND Gate -->
  <g filter="url(#blueprint-glow)" transform="translate(460,0)">
    <line x1="80" y1="320" x2="160" y2="320" stroke="#a8e06c" stroke-width="2"/>
    <line x1="80" y1="360" x2="160" y2="360" stroke="#4ecdc4" stroke-width="2"/>
    <path d="M160,300 H210 C260,300 280,340 260,360 C280,380 260,420 210,420 H160 Z" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="272" cy="360" r="8" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="280" y1="360" x2="340" y2="360" stroke="#c4b5fd" stroke-width="2"/>
    <text x="60" y="324" font-family="'Courier New', monospace" font-size="11" fill="#a8e06c" text-anchor="end">LIFE</text>
    <text x="60" y="364" font-family="'Courier New', monospace" font-size="11" fill="#4ecdc4" text-anchor="end">ICE</text>
    <text x="207" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#fff" font-weight="bold">NAND</text>
    <text x="355" y="364" font-family="'Courier New', monospace" font-size="11" fill="#c4b5fd">ENERGY</text>
  </g>
  <!-- Final combination buffer -->
  <g filter="url(#blueprint-glow)" transform="translate(460,0)">
    <line x1="80" y1="500" x2="170" y2="500" stroke="#c4b5fd" stroke-width="2"/>
    <polygon points="170,480 230,500 170,520" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="230" y1="500" x2="340" y2="500" stroke="#fff" stroke-width="2"/>
    <text x="60" y="504" font-family="'Courier New', monospace" font-size="11" fill="#c4b5fd" text-anchor="end">ENERGY</text>
    <text x="195" y="505" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#fff" font-weight="bold">BUF</text>
    <text x="355" y="504" font-family="'Courier New', monospace" font-size="11" fill="#fff" font-weight="bold">OUTPUT</text>
  </g>
  <!-- Connecting wires between stages -->
  <g stroke="#ffd93d" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="4 4">
    <path d="M340,180 H420 V140 H540"/>
    <path d="M340,340 H440 V180 H540"/>
    <path d="M800,160 H860 V320 H920"/>
    <path d="M340,500 H440 V360 H920"/>
    <path d="M800,360 H860 V500 H920"/>
  </g>
  <!-- Connection dots -->
  <g fill="#ffd93d">
    <circle cx="340" cy="180" r="3"/><circle cx="340" cy="340" r="3"/><circle cx="340" cy="500" r="3"/>
    <circle cx="800" cy="160" r="3"/><circle cx="800" cy="360" r="3"/><circle cx="800" cy="500" r="3"/>
  </g>
  <!-- Truth table -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#2a5090">
    <text x="960" y="60">TRUTH TABLE:</text>
    <text x="960" y="78" fill="#ff6b35">F W E Wi | OUT</text>
    <text x="960" y="93" fill="#4ecdc4">0 0 0 0  |  0</text>
    <text x="960" y="108" fill="#4ecdc4">1 1 0 0  |  1</text>
    <text x="960" y="123" fill="#4ecdc4">0 0 1 1  |  1</text>
    <text x="960" y="138" fill="#ffd93d">1 1 1 1  |  1</text>
  </g>
  <!-- Title in header area -->
  <text x="640" y="50" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#2a5090" letter-spacing="4">COMBINATION ENGINE LOGIC DIAGRAM</text>
</svg>