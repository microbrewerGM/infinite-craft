<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="sfGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sfBright">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sfDust">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#020204"/>

  <!-- Very faint galactic dust -->
  <ellipse cx="640" cy="320" rx="600" ry="120" fill="#c4b5fd" opacity="0.015" filter="url(#sfDust)" transform="rotate(-5,640,320)"/>
  <ellipse cx="500" cy="300" rx="300" ry="80" fill="#4ecdc4" opacity="0.01" filter="url(#sfDust)" transform="rotate(10,500,300)"/>

  <!-- Dense star field - bright stars -->
