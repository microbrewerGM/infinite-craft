<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a3d6a" stroke-width="0.3"/>
    </pattern>
    <pattern id="pcb-trace" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.8" fill="#2a3d6a"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.6"/>

  <!-- Title -->
  <text x="640" y="42" fill="white" font-family="monospace" font-size="38" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="320" y1="52" x2="960" y2="52" stroke="#a8e06c" stroke-width="2"/>
  <text x="640" y="70" fill="#6eaadc" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="3">MOTHERBOARD LAYOUT v4.0</text>

  <!-- PCB outline -->
  <rect x="100" y="85" width="1080" height="480" fill="url(#pcb-trace)" stroke="#a8e06c" stroke-width="2" rx="5"/>

  <!-- Screw holes -->
  <circle cx="120" cy="105" r="8" fill="#1a2744" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="1160" cy="105" r="8" fill="#1a2744" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="120" cy="545" r="8" fill="#1a2744" stroke="#6eaadc" stroke-width="1"/>
  <circle cx="1160" cy="545" r="8" fill="#1a2744" stroke="#6eaadc" stroke-width="1"/>

  <!-- CPU Socket -->
  <rect x="400" y="180" width="180" height="180" fill="#1a2744" stroke="#ff6b35" stroke-width="3" rx="3"/>
  <rect x="420" y="200" width="140" height="140" fill="none" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="490" y="265" fill="#ff6b35" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">CPU</text>
  <text x="490" y="285" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">CRAFT-X1</text>
  <text x="490" y="300" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">ELEMENT CORE</text>
  <!-- Pin grid dots -->
  <g fill="#ff6b35" opacity="0.3">
    <circle cx="435" cy="215" r="2"/><circle cx="450" cy="215" r="2"/><circle cx="465" cy="215" r="2"/>
    <circle cx="480" cy="215" r="2"/><circle cx="495" cy="215" r="2"/><circle cx="510" cy="215" r="2"/>
    <circle cx="525" cy="215" r="2"/><circle cx="540" cy="215" r="2"/>
    <circle cx="435" cy="230" r="2"/><circle cx="450" cy="230" r="2"/><circle cx="465" cy="230" r="2"/>
    <circle cx="480" cy="230" r="2"/><circle cx="495" cy="230" r="2"/><circle cx="510" cy="230" r="2"/>
    <circle cx="525" cy="230" r="2"/><circle cx="540" cy="230" r="2"/>
    <circle cx="435" cy="320" r="2"/><circle cx="450" cy="320" r="2"/><circle cx="465" cy="320" r="2"/>
    <circle cx="480" cy="320" r="2"/><circle cx="495" cy="320" r="2"/><circle cx="510" cy="320" r="2"/>
    <circle cx="525" cy="320" r="2"/><circle cx="540" cy="320" r="2"/>
  </g>
  <!-- Pin 1 marker -->
  <circle cx="415" cy="195" r="4" fill="#ffd93d"/>

  <!-- RAM Slots -->
  <g transform="translate(640,140)">
    <rect x="0" y="0" width="15" height="220" fill="none" stroke="#4ecdc4" stroke-width="2" rx="2"/>
    <text x="7" y="115" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle" transform="rotate(90,7,115)">DDR5 FIRE</text>
  </g>
  <g transform="translate(665,140)">
    <rect x="0" y="0" width="15" height="220" fill="none" stroke="#4ecdc4" stroke-width="2" rx="2"/>
    <text x="7" y="115" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle" transform="rotate(90,7,115)">DDR5 WATER</text>
  </g>
  <g transform="translate(690,140)">
    <rect x="0" y="0" width="15" height="220" fill="none" stroke="#4ecdc4" stroke-width="1.5" rx="2"/>
    <text x="7" y="115" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle" transform="rotate(90,7,115)">DDR5 EARTH</text>
  </g>
  <g transform="translate(715,140)">
    <rect x="0" y="0" width="15" height="220" fill="none" stroke="#4ecdc4" stroke-width="1.5" rx="2"/>
    <text x="7" y="115" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle" transform="rotate(90,7,115)">DDR5 WIND</text>
  </g>
  <text x="680" y="130" fill="#4ecdc4" font-family="monospace" font-size="10" text-anchor="middle">DIMM SLOTS</text>

  <!-- PCIe Slots -->
  <rect x="200" y="420" width="300" height="18" fill="none" stroke="#c4b5fd" stroke-width="2" rx="2"/>
  <text x="350" y="433" fill="#c4b5fd" font-family="monospace" font-size="8" text-anchor="middle">PCIe x16 CRAFT ACCELERATOR</text>
  <rect x="200" y="450" width="200" height="14" fill="none" stroke="#c4b5fd" stroke-width="1.5" rx="2"/>
  <text x="300" y="461" fill="#c4b5fd" font-family="monospace" font-size="7" text-anchor="middle">PCIe x8 ELEMENT CACHE</text>
  <rect x="200" y="475" width="200" height="14" fill="none" stroke="#c4b5fd" stroke-width="1" rx="2"/>
  <text x="300" y="486" fill="#c4b5fd" font-family="monospace" font-size="7" text-anchor="middle">PCIe x4</text>

  <!-- Chipset -->
  <rect x="550" y="400" width="100" height="80" fill="#1a2744" stroke="#ffd93d" stroke-width="2" rx="3"/>
  <text x="600" y="435" fill="#ffd93d" font-family="monospace" font-size="10" text-anchor="middle">CHIPSET</text>
  <text x="600" y="455" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">IC-Z890</text>
  <text x="600" y="470" fill="#ffd93d" font-family="monospace" font-size="7" text-anchor="middle">COMBINER</text>

  <!-- VRM (top) -->
  <g transform="translate(250,100)">
    <rect x="0" y="0" width="20" height="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <rect x="25" y="0" width="20" height="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <rect x="50" y="0" width="20" height="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <rect x="75" y="0" width="20" height="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <rect x="100" y="0" width="20" height="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <rect x="125" y="0" width="20" height="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <rect x="150" y="0" width="20" height="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <rect x="175" y="0" width="20" height="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
    <text x="100" y="30" fill="#a8e06c" font-family="monospace" font-size="8" text-anchor="middle">VRM POWER PHASES</text>
  </g>

  <!-- I/O Panel (left edge) -->
  <rect x="100" y="100" width="80" height="200" fill="none" stroke="white" stroke-width="1.5"/>
  <text x="140" y="125" fill="white" font-family="monospace" font-size="8" text-anchor="middle">I/O PANEL</text>
  <rect x="108" y="135" width="30" height="12" fill="none" stroke="#4ecdc4" stroke-width="1"/>
  <text x="123" y="145" fill="#4ecdc4" font-family="monospace" font-size="5" text-anchor="middle">USB</text>
  <rect x="145" y="135" width="30" height="12" fill="none" stroke="#4ecdc4" stroke-width="1"/>
  <text x="160" y="145" fill="#4ecdc4" font-family="monospace" font-size="5" text-anchor="middle">USB</text>
  <rect x="108" y="155" width="30" height="12" fill="none" stroke="#ff6b35" stroke-width="1"/>
  <text x="123" y="165" fill="#ff6b35" font-family="monospace" font-size="5" text-anchor="middle">ETH</text>
  <rect x="108" y="175" width="65" height="18" fill="none" stroke="#a8e06c" stroke-width="1"/>
  <text x="140" y="188" fill="#a8e06c" font-family="monospace" font-size="6" text-anchor="middle">HDMI OUT</text>
  <rect x="108" y="200" width="65" height="18" fill="none" stroke="#c4b5fd" stroke-width="1"/>
  <text x="140" y="213" fill="#c4b5fd" font-family="monospace" font-size="6" text-anchor="middle">AUDIO</text>

  <!-- SATA ports -->
  <g transform="translate(800,400)">
    <rect x="0" y="0" width="12" height="30" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <rect x="18" y="0" width="12" height="30" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <rect x="36" y="0" width="12" height="30" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <rect x="54" y="0" width="12" height="30" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <text x="33" y="45" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">SATA III</text>
  </g>

  <!-- M.2 slot -->
  <rect x="780" y="250" width="180" height="16" fill="none" stroke="#ffd93d" stroke-width="1.5" rx="2"/>
  <text x="870" y="262" fill="#ffd93d" font-family="monospace" font-size="7" text-anchor="middle">M.2 NVMe ELEMENT STORAGE</text>
  <rect x="780" y="280" width="180" height="16" fill="none" stroke="#ffd93d" stroke-width="1" rx="2"/>
  <text x="870" y="292" fill="#ffd93d" font-family="monospace" font-size="7" text-anchor="middle">M.2 NVMe CRAFT CACHE</text>

  <!-- Power connectors -->
  <rect x="1050" y="100" width="100" height="40" fill="none" stroke="white" stroke-width="2" rx="2"/>
  <text x="1100" y="125" fill="white" font-family="monospace" font-size="8" text-anchor="middle">24-PIN ATX</text>
  <rect x="250" y="155" width="40" height="20" fill="none" stroke="white" stroke-width="1.5" rx="2"/>
  <text x="270" y="169" fill="white" font-family="monospace" font-size="6" text-anchor="middle">8-PIN</text>

  <!-- PCB traces -->
  <path d="M 580 270 L 640 270 L 640 180" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
  <path d="M 580 290 L 620 290 L 620 400" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.4"/>
  <path d="M 400 360 L 400 420" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
  <path d="M 550 440 L 500 440 L 500 420" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.4"/>
  <path d="M 650 440 L 780 400" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
  <path d="M 650 430 L 780 260" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.4"/>

  <!-- BIOS chip -->
  <rect x="950" y="430" width="60" height="40" fill="#1a2744" stroke="#a8e06c" stroke-width="1.5" rx="2"/>
  <text x="980" y="453" fill="#a8e06c" font-family="monospace" font-size="8" text-anchor="middle">BIOS</text>
  <text x="980" y="463" fill="#a8e06c" font-family="monospace" font-size="6" text-anchor="middle">CRAFT OS</text>
  <circle cx="955" cy="435" r="2" fill="#a8e06c"/>

  <!-- CMOS Battery -->
  <circle cx="1050" cy="350" r="18" fill="none" stroke="#6eaadc" stroke-width="1.5"/>
  <text x="1050" y="354" fill="#6eaadc" font-family="monospace" font-size="7" text-anchor="middle">CR2032</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#a8e06c" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#a8e06c" stroke-width="2" fill="none"/>

  <rect x="100" y="580" width="1080" height="30" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="640" y="600" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-MOBO-013 | CRAFT MOTHERBOARD | REV 4.0 | ATX FORM FACTOR</text>
</svg>