<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="640" y="50" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="62" x2="980" y2="62" stroke="#4ecdc4" stroke-width="2"/>
  <text x="640" y="82" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">SUBMARINE CROSS-SECTION</text>

  <!-- Water effect (light rays) -->
  <line x1="200" y1="90" x2="180" y2="600" stroke="#4ecdc4" stroke-width="0.5" opacity="0.1"/>
  <line x1="400" y1="90" x2="380" y2="600" stroke="#4ecdc4" stroke-width="0.5" opacity="0.1"/>
  <line x1="600" y1="90" x2="580" y2="600" stroke="#4ecdc4" stroke-width="0.5" opacity="0.1"/>
  <line x1="800" y1="90" x2="780" y2="600" stroke="#4ecdc4" stroke-width="0.5" opacity="0.1"/>
  <line x1="1000" y1="90" x2="980" y2="600" stroke="#4ecdc4" stroke-width="0.5" opacity="0.1"/>

  <!-- Submarine hull -->
  <path d="M 180 320 Q 100 320 100 370 Q 100 420 180 420 L 1050 420 Q 1150 420 1180 370 Q 1150 320 1050 320 Z" fill="none" stroke="#4ecdc4" stroke-width="2.5"/>

  <!-- Bow (front, right side) -->
  <path d="M 1050 320 Q 1150 320 1180 370 Q 1150 420 1050 420" fill="none" stroke="#4ecdc4" stroke-width="2.5"/>
  <!-- Sonar dome -->
  <ellipse cx="1160" cy="370" rx="20" ry="15" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
  <text x="1160" y="374" fill="#ffd93d" font-family="monospace" font-size="7" text-anchor="middle">SONAR</text>

  <!-- Stern (back, left side) -->
  <path d="M 180 320 Q 100 320 100 370 Q 100 420 180 420" fill="none" stroke="#4ecdc4" stroke-width="2.5"/>

  <!-- Propeller -->
  <g transform="translate(80,370)">
    <circle r="4" fill="#4ecdc4"/>
    <ellipse rx="5" ry="25" fill="none" stroke="#4ecdc4" stroke-width="1.5" transform="rotate(30)"/>
    <ellipse rx="5" ry="25" fill="none" stroke="#4ecdc4" stroke-width="1.5" transform="rotate(-30)"/>
    <ellipse rx="5" ry="25" fill="none" stroke="#4ecdc4" stroke-width="1.5" transform="rotate(90)"/>
    <text x="0" y="35" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle">PROP</text>
  </g>

  <!-- Conning tower / sail -->
  <rect x="600" y="260" width="120" height="60" rx="8" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <!-- Periscope -->
  <line x1="640" y1="260" x2="640" y2="200" stroke="#ff6b35" stroke-width="2"/>
  <rect x="635" y="195" width="10" height="15" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="660" y="195" fill="#ff6b35" font-family="monospace" font-size="8">PERISCOPE</text>
  <!-- Mast -->
  <line x1="680" y1="260" x2="680" y2="220" stroke="#6eaadc" stroke-width="1.5"/>
  <text x="695" y="225" fill="#6eaadc" font-family="monospace" font-size="7">COMM</text>
  <text x="660" y="310" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">BRIDGE</text>

  <!-- Deck lines inside hull -->
  <line x1="180" y1="370" x2="1050" y2="370" stroke="#6eaadc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Bulkhead divisions -->
  <line x1="280" y1="320" x2="280" y2="420" stroke="#6eaadc" stroke-width="1.5"/>
  <line x1="450" y1="320" x2="450" y2="420" stroke="#6eaadc" stroke-width="1.5"/>
  <line x1="590" y1="320" x2="590" y2="420" stroke="#6eaadc" stroke-width="1.5"/>
  <line x1="730" y1="320" x2="730" y2="420" stroke="#6eaadc" stroke-width="1.5"/>
  <line x1="880" y1="320" x2="880" y2="420" stroke="#6eaadc" stroke-width="1.5"/>
  <line x1="1000" y1="320" x2="1000" y2="420" stroke="#6eaadc" stroke-width="1.5"/>

  <!-- Compartment: Engine Room (aft) -->
  <text x="230" y="350" fill="#ff6b35" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">ENGINE</text>
  <text x="230" y="363" fill="#ff6b35" font-family="monospace" font-size="8" text-anchor="middle">[FIRE]</text>
  <!-- Engine detail -->
  <circle cx="210" cy="390" r="10" fill="none" stroke="#ff6b35" stroke-width="1"/>
  <circle cx="250" cy="390" r="10" fill="none" stroke="#ff6b35" stroke-width="1"/>

  <!-- Compartment: Reactor -->
  <text x="365" y="345" fill="#ffd93d" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">REACTOR</text>
  <text x="365" y="358" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">CORE</text>
  <!-- Reactor symbol -->
  <circle cx="365" cy="390" r="15" fill="none" stroke="#ffd93d" stroke-width="2"/>
  <circle cx="365" cy="390" r="5" fill="#ffd93d" opacity="0.3"/>
  <line x1="365" y1="375" x2="365" y2="405" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="350" y1="390" x2="380" y2="390" stroke="#ffd93d" stroke-width="0.5"/>

  <!-- Compartment: Crew -->
  <text x="520" y="345" fill="#a8e06c" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">CREW</text>
  <text x="520" y="358" fill="#a8e06c" font-family="monospace" font-size="8" text-anchor="middle">[EARTH]</text>
  <!-- Bunks -->
  <line x1="470" y1="380" x2="500" y2="380" stroke="#a8e06c" stroke-width="1"/>
  <line x1="470" y1="390" x2="500" y2="390" stroke="#a8e06c" stroke-width="1"/>
  <line x1="470" y1="400" x2="500" y2="400" stroke="#a8e06c" stroke-width="1"/>
  <line x1="540" y1="380" x2="570" y2="380" stroke="#a8e06c" stroke-width="1"/>
  <line x1="540" y1="390" x2="570" y2="390" stroke="#a8e06c" stroke-width="1"/>

  <!-- Compartment: Command -->
  <text x="660" y="345" fill="white" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">COMMAND</text>
  <text x="660" y="358" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">CENTER</text>
  <!-- Screens -->
  <rect x="640" y="380" width="15" height="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
  <rect x="660" y="380" width="15" height="10" fill="none" stroke="#a8e06c" stroke-width="1"/>
  <rect x="650" y="395" width="20" height="8" fill="none" stroke="#ffd93d" stroke-width="1"/>

  <!-- Compartment: Craft Lab -->
  <text x="805" y="340" fill="#c4b5fd" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">CRAFT</text>
  <text x="805" y="353" fill="#c4b5fd" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">LAB</text>
  <text x="805" y="366" fill="#c4b5fd" font-family="monospace" font-size="8" text-anchor="middle">[WIND]</text>
  <!-- Lab equipment -->
  <circle cx="780" cy="395" r="8" fill="none" stroke="#ff6b35" stroke-width="1"/>
  <text x="780" y="398" fill="#ff6b35" font-family="monospace" font-size="6" text-anchor="middle">F</text>
  <circle cx="805" cy="395" r="8" fill="none" stroke="#4ecdc4" stroke-width="1"/>
  <text x="805" y="398" fill="#4ecdc4" font-family="monospace" font-size="6" text-anchor="middle">W</text>
  <circle cx="830" cy="395" r="8" fill="none" stroke="#a8e06c" stroke-width="1"/>
  <text x="830" y="398" fill="#a8e06c" font-family="monospace" font-size="6" text-anchor="middle">E</text>

  <!-- Compartment: Torpedo / Storage -->
  <text x="940" y="350" fill="#4ecdc4" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">ELEMENT</text>
  <text x="940" y="363" fill="#4ecdc4" font-family="monospace" font-size="9" text-anchor="middle">STORAGE</text>
  <!-- Torpedo tubes -->
  <rect x="910" y="385" width="60" height="8" fill="none" stroke="#4ecdc4" stroke-width="1" rx="4"/>
  <rect x="910" y="398" width="60" height="8" fill="none" stroke="#4ecdc4" stroke-width="1" rx="4"/>

  <!-- Forward -->
  <text x="1040" y="365" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">FWD</text>
  <text x="1040" y="378" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">SCAN</text>

  <!-- Ballast tanks -->
  <ellipse cx="300" cy="430" rx="50" ry="12" fill="none" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="300" y="455" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle">BALLAST TANK</text>
  <ellipse cx="800" cy="430" rx="50" ry="12" fill="none" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="800" y="455" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle">BALLAST TANK</text>

  <!-- Dive planes -->
  <line x1="160" y1="370" x2="120" y2="355" stroke="#6eaadc" stroke-width="2"/>
  <line x1="160" y1="370" x2="120" y2="385" stroke="#6eaadc" stroke-width="2"/>
  <text x="105" y="375" fill="#6eaadc" font-family="monospace" font-size="7" text-anchor="end">PLANES</text>

  <!-- Dimension line -->
  <line x1="100" y1="480" x2="1180" y2="480" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="100" y1="475" x2="100" y2="485" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="1180" y1="475" x2="1180" y2="485" stroke="#6eaadc" stroke-width="0.8"/>
  <text x="640" y="500" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">OVERALL LENGTH: 110m</text>

  <!-- Depth indicator -->
  <text x="70" y="530" fill="#4ecdc4" font-family="monospace" font-size="9">DEPTH: 300m</text>
  <text x="70" y="545" fill="#4ecdc4" font-family="monospace" font-size="9">CRUSH: 580m</text>
  <text x="70" y="560" fill="#6eaadc" font-family="monospace" font-size="9">SPEED: 25 kts</text>
  <text x="70" y="575" fill="#6eaadc" font-family="monospace" font-size="9">CREW: 42</text>

  <!-- Specs -->
  <rect x="400" y="520" width="480" height="65" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="3"/>
  <text x="640" y="545" fill="white" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">IC-CLASS RESEARCH SUBMARINE</text>
  <text x="640" y="562" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">DISPLACEMENT: 4,200t SURFACED | 5,800t SUBMERGED</text>
  <text x="640" y="577" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">MISSION: DEEP ELEMENT EXPLORATION AND COMBINATION</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#4ecdc4" stroke-width="2" fill="none"/>

  <rect x="960" y="590" width="300" height="30" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="1110" y="610" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-SUB-018</text>
</svg>