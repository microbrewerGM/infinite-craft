<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="tideGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tideSoft">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="tideWave">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.005" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="tideBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020205"/>
      <stop offset="60%" stop-color="#030308"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>
    <linearGradient id="waveGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#tideBg)"/>

  <!-- Stars in night sky -->
  <circle cx="120" cy="50" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="300" cy="80" r="1" fill="white" opacity="0.4"/>
  <circle cx="500" cy="30" r="0.7" fill="white" opacity="0.45"/>
  <circle cx="700" cy="60" r="0.9" fill="white" opacity="0.4"/>
  <circle cx="900" cy="40" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="1100" cy="70" r="1" fill="white" opacity="0.35"/>
  <circle cx="200" cy="130" r="0.6" fill="white" opacity="0.3"/>
  <circle cx="800" cy="110" r="0.7" fill="white" opacity="0.3"/>
  <circle cx="1050" cy="120" r="0.6" fill="white" opacity="0.25"/>

  <!-- Dark beach/shore -->
  <path d="M0,420 Q320,400 640,415 Q960,430 1280,410 L1280,640 L0,640Z" fill="#0a0a08"/>

  <!-- Wet sand reflection -->
  <path d="M0,410 Q320,390 640,405 Q960,420 1280,400 L1280,430 Q960,450 640,435 Q320,420 0,440Z" fill="#4ecdc4" opacity="0.02" filter="url(#tideSoft)"/>

  <!-- Bioluminescent wave - main crest -->
  <path d="M-50,380 Q160,350 320,370 Q480,390 640,365 Q800,340 960,370 Q1120,395 1330,375" stroke="#4ecdc4" stroke-width="4" fill="none" opacity="0.7" filter="url(#tideGlow)"/>
  <path d="M-50,385 Q160,360 320,375 Q480,395 640,370 Q800,345 960,375 Q1120,400 1330,380" stroke="#4ecdc4" stroke-width="8" fill="none" opacity="0.3" filter="url(#tideSoft)"/>

  <!-- Wave foam - bioluminescent edge -->
  <path d="M-50,378 Q160,348 320,368 Q480,388 640,363 Q800,338 960,368 Q1120,393 1330,373" fill="url(#waveGlow)" filter="url(#tideWave)" opacity="0.6"/>

  <!-- Scattered bioluminescent particles in the surf -->
  <circle cx="100" cy="395" r="2" fill="#4ecdc4" opacity="0.7" filter="url(#tideGlow)"/>
  <circle cx="180" cy="385" r="1.5" fill="#4ecdc4" opacity="0.6" filter="url(#tideGlow)"/>
  <circle cx="270" cy="390" r="2.5" fill="#4ecdc4" opacity="0.5" filter="url(#tideGlow)"/>
  <circle cx="350" cy="380" r="1.8" fill="#4ecdc4" opacity="0.65" filter="url(#tideGlow)"/>
  <circle cx="440" cy="388" r="2" fill="#4ecdc4" opacity="0.55" filter="url(#tideGlow)"/>
  <circle cx="530" cy="378" r="2.2" fill="#4ecdc4" opacity="0.6" filter="url(#tideGlow)"/>
  <circle cx="620" cy="372" r="1.5" fill="#4ecdc4" opacity="0.7" filter="url(#tideGlow)"/>
  <circle cx="710" cy="365" r="2" fill="#4ecdc4" opacity="0.55" filter="url(#tideGlow)"/>
  <circle cx="800" cy="358" r="2.5" fill="#4ecdc4" opacity="0.65" filter="url(#tideGlow)"/>
  <circle cx="890" cy="370" r="1.8" fill="#4ecdc4" opacity="0.5" filter="url(#tideGlow)"/>
  <circle cx="980" cy="378" r="2" fill="#4ecdc4" opacity="0.6" filter="url(#tideGlow)"/>
  <circle cx="1070" cy="385" r="1.5" fill="#4ecdc4" opacity="0.55" filter="url(#tideGlow)"/>
  <circle cx="1160" cy="390" r="2.2" fill="#4ecdc4" opacity="0.5" filter="url(#tideGlow)"/>

  <!-- Second wave further out -->
  <path d="M-50,340 Q320,310 640,330 Q960,350 1330,325" stroke="#4ecdc4" stroke-width="2" fill="none" opacity="0.25" filter="url(#tideGlow)"/>

  <!-- Particles in water -->
  <circle cx="150" cy="360" r="1" fill="#4ecdc4" opacity="0.3" filter="url(#tideGlow)"/>
  <circle cx="400" cy="345" r="0.8" fill="#4ecdc4" opacity="0.25" filter="url(#tideGlow)"/>
  <circle cx="650" cy="350" r="1.2" fill="#4ecdc4" opacity="0.2" filter="url(#tideGlow)"/>
  <circle cx="900" cy="340" r="0.8" fill="#4ecdc4" opacity="0.25" filter="url(#tideGlow)"/>
  <circle cx="1100" cy="355" r="1" fill="#4ecdc4" opacity="0.2" filter="url(#tideGlow)"/>

  <!-- Elements along the shore -->
  <text x="250" y="440" font-size="34" text-anchor="middle" opacity="0.5">🔥</text>
  <text x="500" y="435" font-size="32" text-anchor="middle" opacity="0.55">💧</text>
  <text x="780" y="430" font-size="34" text-anchor="middle" opacity="0.5">🌍</text>
  <text x="1030" y="435" font-size="30" text-anchor="middle" opacity="0.45">💨</text>

  <!-- Title -->
  <text x="640" y="200" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#4ecdc4" text-anchor="middle" letter-spacing="18" opacity="0.85" filter="url(#tideGlow)">INFINITE CRAFT</text>
  <text x="640" y="235" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" letter-spacing="8" opacity="0.25">LUMINOUS SHORE</text>
</svg>