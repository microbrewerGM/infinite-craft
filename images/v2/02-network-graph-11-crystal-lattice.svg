<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#101030"/>
    </linearGradient>
    <filter id="glow11"><feGaussianBlur stdDeviation="2.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="facetGlow"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg11)"/>
  <!-- Lattice grid - isometric crystal structure -->
  <!-- Horizontal bonds -->
  <g stroke="#c4b5fd" stroke-width="1.2" opacity="0.3">
    <!-- Row 1 -->
    <line x1="240" y1="120" x2="400" y2="120"/><line x1="400" y1="120" x2="560" y2="120"/>
    <line x1="560" y1="120" x2="720" y2="120"/><line x1="720" y1="120" x2="880" y2="120"/>
    <line x1="880" y1="120" x2="1040" y2="120"/>
    <!-- Row 2 -->
    <line x1="160" y1="240" x2="320" y2="240"/><line x1="320" y1="240" x2="480" y2="240"/>
    <line x1="480" y1="240" x2="640" y2="240"/><line x1="640" y1="240" x2="800" y2="240"/>
    <line x1="800" y1="240" x2="960" y2="240"/><line x1="960" y1="240" x2="1120" y2="240"/>
    <!-- Row 3 -->
    <line x1="240" y1="360" x2="400" y2="360"/><line x1="400" y1="360" x2="560" y2="360"/>
    <line x1="560" y1="360" x2="720" y2="360"/><line x1="720" y1="360" x2="880" y2="360"/>
    <line x1="880" y1="360" x2="1040" y2="360"/>
    <!-- Row 4 -->
    <line x1="160" y1="480" x2="320" y2="480"/><line x1="320" y1="480" x2="480" y2="480"/>
    <line x1="480" y1="480" x2="640" y2="480"/><line x1="640" y1="480" x2="800" y2="480"/>
    <line x1="800" y1="480" x2="960" y2="480"/><line x1="960" y1="480" x2="1120" y2="480"/>
  </g>
  <!-- Diagonal bonds -->
  <g stroke="#4ecdc4" stroke-width="0.8" opacity="0.25">
    <!-- Down-right diagonals -->
    <line x1="240" y1="120" x2="320" y2="240"/><line x1="400" y1="120" x2="480" y2="240"/>
    <line x1="560" y1="120" x2="640" y2="240"/><line x1="720" y1="120" x2="800" y2="240"/>
    <line x1="880" y1="120" x2="960" y2="240"/>
    <line x1="160" y1="240" x2="240" y2="360"/><line x1="320" y1="240" x2="400" y2="360"/>
    <line x1="480" y1="240" x2="560" y2="360"/><line x1="640" y1="240" x2="720" y2="360"/>
    <line x1="800" y1="240" x2="880" y2="360"/><line x1="960" y1="240" x2="1040" y2="360"/>
    <line x1="240" y1="360" x2="320" y2="480"/><line x1="400" y1="360" x2="480" y2="480"/>
    <line x1="560" y1="360" x2="640" y2="480"/><line x1="720" y1="360" x2="800" y2="480"/>
    <line x1="880" y1="360" x2="960" y2="480"/>
    <!-- Down-left diagonals -->
    <line x1="400" y1="120" x2="320" y2="240"/><line x1="560" y1="120" x2="480" y2="240"/>
    <line x1="720" y1="120" x2="640" y2="240"/><line x1="880" y1="120" x2="800" y2="240"/>
    <line x1="1040" y1="120" x2="960" y2="240"/>
    <line x1="320" y1="240" x2="240" y2="360"/><line x1="480" y1="240" x2="400" y2="360"/>
    <line x1="640" y1="240" x2="560" y2="360"/><line x1="800" y1="240" x2="720" y2="360"/>
    <line x1="960" y1="240" x2="880" y2="360"/><line x1="1120" y1="240" x2="1040" y2="360"/>
    <line x1="400" y1="360" x2="320" y2="480"/><line x1="560" y1="360" x2="480" y2="480"/>
    <line x1="720" y1="360" x2="640" y2="480"/><line x1="880" y1="360" x2="800" y2="480"/>
    <line x1="1040" y1="360" x2="960" y2="480"/>
  </g>
  <!-- Lattice nodes - alternating colors -->
  <g filter="url(#glow11)">
    <!-- Row 1 -->
    <circle cx="240" cy="120" r="7" fill="#c4b5fd" opacity="0.8"/>
    <circle cx="400" cy="120" r="8" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="560" cy="120" r="7" fill="#c4b5fd" opacity="0.8"/>
    <circle cx="720" cy="120" r="8" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="880" cy="120" r="7" fill="#c4b5fd" opacity="0.8"/>
    <circle cx="1040" cy="120" r="8" fill="#4ecdc4" opacity="0.8"/>
    <!-- Row 2 -->
    <circle cx="160" cy="240" r="8" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="320" cy="240" r="7" fill="#ffd93d" opacity="0.8"/>
    <circle cx="480" cy="240" r="8" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="640" cy="240" r="9" fill="#ff6b35" opacity="0.8"/>
    <circle cx="800" cy="240" r="8" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="960" cy="240" r="7" fill="#ffd93d" opacity="0.8"/>
    <circle cx="1120" cy="240" r="8" fill="#4ecdc4" opacity="0.8"/>
    <!-- Row 3 -->
    <circle cx="240" cy="360" r="7" fill="#c4b5fd" opacity="0.8"/>
    <circle cx="400" cy="360" r="8" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="560" cy="360" r="9" fill="#ff6b35" opacity="0.8"/>
    <circle cx="720" cy="360" r="8" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="880" cy="360" r="7" fill="#c4b5fd" opacity="0.8"/>
    <circle cx="1040" cy="360" r="8" fill="#4ecdc4" opacity="0.8"/>
    <!-- Row 4 -->
    <circle cx="160" cy="480" r="8" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="320" cy="480" r="7" fill="#ffd93d" opacity="0.8"/>
    <circle cx="480" cy="480" r="8" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="640" cy="480" r="9" fill="#ff6b35" opacity="0.8"/>
    <circle cx="800" cy="480" r="8" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="960" cy="480" r="7" fill="#ffd93d" opacity="0.8"/>
    <circle cx="1120" cy="480" r="8" fill="#4ecdc4" opacity="0.8"/>
  </g>
  <!-- Facet highlight polygons -->
  <g fill="#c4b5fd" opacity="0.04">
    <polygon points="400,120 480,240 320,240"/>
    <polygon points="720,120 800,240 640,240"/>
    <polygon points="480,240 560,360 400,360"/>
    <polygon points="800,240 880,360 720,360"/>
    <polygon points="560,360 640,480 480,480"/>
    <polygon points="880,360 960,480 800,480"/>
  </g>
  <!-- Title -->
  <text x="640" y="300" font-family="'Palatino', 'Book Antiqua', serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central" letter-spacing="4" opacity="0.9" filter="url(#glow11)">INFINITE CRAFT</text>
  <text x="640" y="355" font-family="'Palatino', serif" font-size="15" fill="#c4b5fd" text-anchor="middle" letter-spacing="10" opacity="0.5">CRYSTAL LATTICE</text>
</svg>