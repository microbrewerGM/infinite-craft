<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="sb-glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="sb-soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <radialGradient id="sb-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8e06c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sb-org1" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="sb-org2" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.05"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>

  <!-- Central shared aura -->
  <ellipse cx="640" cy="320" rx="350" ry="250" fill="url(#sb-aura)"/>

  <!-- Organism A (orange) - flowing organic form, like a sea anemone/coral -->
  <g transform="translate(420, 320)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="100" ry="80" fill="url(#sb-org1)"/>
    <ellipse cx="0" cy="0" rx="80" ry="65" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.5"/>
    <!-- Central core -->
    <circle cx="0" cy="0" r="30" fill="#ff6b35" opacity="0.3"/>
    <circle cx="0" cy="0" r="15" fill="#ff6b35" opacity="0.5"/>
    <!-- Tendrils reaching toward partner -->
    <path d="M 60 -20 Q 100 -30 140 -25 Q 180 -18 200 -10" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.5"/>
    <path d="M 70 0 Q 110 5 150 0 Q 190 -5 220 0" fill="none" stroke="#ff6b35" stroke-width="3.5" opacity="0.55"/>
    <path d="M 60 20 Q 100 30 140 25 Q 180 18 200 10" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.5"/>
    <!-- Outer tendrils (reaching away) -->
    <path d="M -70 -40 Q -110 -60 -140 -50" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
    <path d="M -80 -10 Q -120 -15 -150 -5" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.25"/>
    <path d="M -80 20 Q -120 30 -145 25" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.25"/>
    <path d="M -60 50 Q -90 70 -120 65" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
    <!-- Pulsing dots along body -->
    <circle cx="40" cy="-30" r="4" fill="#ffd93d" opacity="0.4"/>
    <circle cx="-30" cy="25" r="3" fill="#ffd93d" opacity="0.3"/>
    <circle cx="20" cy="40" r="3.5" fill="#ffd93d" opacity="0.35"/>
  </g>

  <!-- Organism B (teal) - complementary organic form -->
  <g transform="translate(860, 320)">
    <ellipse cx="0" cy="0" rx="100" ry="80" fill="url(#sb-org2)"/>
    <ellipse cx="0" cy="0" rx="80" ry="65" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="30" fill="#4ecdc4" opacity="0.3"/>
    <circle cx="0" cy="0" r="15" fill="#4ecdc4" opacity="0.5"/>
    <!-- Tendrils reaching toward partner -->
    <path d="M -60 -20 Q -100 -30 -140 -25 Q -180 -18 -200 -10" fill="none" stroke="#4ecdc4" stroke-width="3" opacity="0.5"/>
    <path d="M -70 0 Q -110 5 -150 0 Q -190 -5 -220 0" fill="none" stroke="#4ecdc4" stroke-width="3.5" opacity="0.55"/>
    <path d="M -60 20 Q -100 30 -140 25 Q -180 18 -200 10" fill="none" stroke="#4ecdc4" stroke-width="3" opacity="0.5"/>
    <!-- Outer tendrils -->
    <path d="M 70 -40 Q 110 -60 140 -50" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
    <path d="M 80 -10 Q 120 -15 150 -5" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.25"/>
    <path d="M 80 20 Q 120 30 145 25" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.25"/>
    <path d="M 60 50 Q 90 70 120 65" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
    <circle cx="-40" cy="-30" r="4" fill="#a8e06c" opacity="0.4"/>
    <circle cx="30" cy="25" r="3" fill="#a8e06c" opacity="0.3"/>
    <circle cx="-20" cy="40" r="3.5" fill="#a8e06c" opacity="0.35"/>
  </g>

  <!-- Exchange zone (center) - nutrients/energy flowing between -->
  <g transform="translate(640, 320)">
    <!-- Shared glow -->
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="#a8e06c" opacity="0.08" filter="url(#sb-glow)"/>
    <!-- Exchange particles flowing left to right -->
    <circle cx="-30" cy="-12" r="3" fill="#ff6b35" opacity="0.5"/>
    <circle cx="-10" cy="-8" r="2.5" fill="#ff6b35" opacity="0.4"/>
    <circle cx="15" cy="-5" r="2" fill="#ff6b35" opacity="0.3"/>
    <!-- Exchange particles flowing right to left -->
    <circle cx="30" cy="12" r="3" fill="#4ecdc4" opacity="0.5"/>
    <circle cx="10" cy="8" r="2.5" fill="#4ecdc4" opacity="0.4"/>
    <circle cx="-15" cy="5" r="2" fill="#4ecdc4" opacity="0.3"/>
    <!-- Shared benefit glow particles -->
    <circle cx="0" cy="-3" r="4" fill="#a8e06c" opacity="0.5"/>
    <circle cx="-5" cy="5" r="3" fill="#ffd93d" opacity="0.4"/>
    <circle cx="8" cy="0" r="2.5" fill="#c4b5fd" opacity="0.35"/>
    <!-- Circular exchange arrows -->
    <path d="M -40 -20 Q -15 -35 10 -25" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.3"/>
    <polygon points="10,-28 15,-22 7,-22" fill="#a8e06c" opacity="0.3"/>
    <path d="M 40 20 Q 15 35 -10 25" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.3"/>
    <polygon points="-10,28 -15,22 -7,22" fill="#a8e06c" opacity="0.3"/>
  </g>

  <!-- Subtle yin-yang suggestion in background -->
  <path d="M 640 260 Q 680 320 640 380" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.08"/>
  <path d="M 640 260 Q 600 320 640 380" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.08"/>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#a8e06c" opacity="0.6" letter-spacing="4">SYMBIOSIS</text>
</svg>