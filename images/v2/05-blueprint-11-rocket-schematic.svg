<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="640" y="50" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="62" x2="980" y2="62" stroke="#ff6b35" stroke-width="2"/>
  <text x="640" y="82" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">ELEMENT LAUNCH VEHICLE</text>

  <!-- Rocket body -->
  <!-- Nose cone -->
  <path d="M 440 120 L 480 90 L 520 120" fill="none" stroke="#ff6b35" stroke-width="2.5"/>
  <!-- Payload fairing -->
  <rect x="440" y="120" width="80" height="80" fill="none" stroke="#c4b5fd" stroke-width="2"/>
  <text x="480" y="155" fill="#c4b5fd" font-family="monospace" font-size="9" text-anchor="middle">PAYLOAD</text>
  <text x="480" y="170" fill="#c4b5fd" font-family="monospace" font-size="8" text-anchor="middle">NEW ELEMENTS</text>

  <!-- Stage 2 -->
  <rect x="435" y="200" width="90" height="120" fill="none" stroke="#4ecdc4" stroke-width="2"/>
  <text x="480" y="240" fill="#4ecdc4" font-family="monospace" font-size="10" text-anchor="middle">STAGE 2</text>
  <text x="480" y="258" fill="#4ecdc4" font-family="monospace" font-size="8" text-anchor="middle">WATER</text>
  <text x="480" y="272" fill="#4ecdc4" font-family="monospace" font-size="8" text-anchor="middle">ENGINE</text>
  <!-- Tank detail -->
  <line x1="435" y1="280" x2="525" y2="280" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="480" cy="300" r="10" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="480" y="304" fill="#4ecdc4" font-family="monospace" font-size="7" text-anchor="middle">W</text>

  <!-- Interstage -->
  <rect x="430" y="320" width="100" height="20" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
  <text x="480" y="334" fill="#ffd93d" font-family="monospace" font-size="7" text-anchor="middle">INTERSTAGE</text>

  <!-- Stage 1 -->
  <rect x="425" y="340" width="110" height="200" fill="none" stroke="#ff6b35" stroke-width="2.5"/>
  <text x="480" y="380" fill="#ff6b35" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">STAGE 1</text>
  <text x="480" y="400" fill="#ff6b35" font-family="monospace" font-size="9" text-anchor="middle">FIRE ENGINE</text>
  <!-- Fuel tank -->
  <rect x="440" y="415" width="80" height="50" fill="none" stroke="#ff6b35" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="440" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">FUEL</text>
  <text x="480" y="453" fill="#ffd93d" font-family="monospace" font-size="7" text-anchor="middle">LOX/RP-1</text>
  <!-- Oxidizer -->
  <rect x="440" y="475" width="80" height="40" fill="none" stroke="#ff6b35" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="500" fill="#a8e06c" font-family="monospace" font-size="8" text-anchor="middle">OXIDIZER</text>

  <!-- Engine bells -->
  <path d="M 445 540 L 435 580 L 455 580 L 455 540" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
  <path d="M 465 540 L 455 580 L 475 580 L 475 540" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
  <path d="M 485 540 L 475 580 L 495 580 L 495 540" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
  <path d="M 505 540 L 495 580 L 515 580 L 515 540" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
  <path d="M 525 540 L 515 580 L 535 580 L 535 540" fill="none" stroke="#ff6b35" stroke-width="1.5"/>

  <!-- Exhaust -->
  <path d="M 450 580 Q 480 620 510 580" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.5"/>
  <path d="M 440 580 Q 480 630 520 580" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.3"/>

  <!-- Fins -->
  <path d="M 425 480 L 395 540 L 425 540" fill="none" stroke="#a8e06c" stroke-width="2"/>
  <path d="M 535 480 L 565 540 L 535 540" fill="none" stroke="#a8e06c" stroke-width="2"/>
  <text x="400" y="555" fill="#a8e06c" font-family="monospace" font-size="7" text-anchor="middle">FIN</text>
  <text x="560" y="555" fill="#a8e06c" font-family="monospace" font-size="7" text-anchor="middle">FIN</text>

  <!-- Leader lines and labels -->
  <g font-family="monospace" font-size="11">
    <line x1="520" y1="105" x2="680" y2="105" stroke="#ff6b35" stroke-width="0.8"/>
    <circle cx="520" cy="105" r="3" fill="#ff6b35"/>
    <text x="690" y="110" fill="#ff6b35">NOSE CONE (AERODYNAMIC)</text>

    <line x1="520" y1="160" x2="680" y2="145" stroke="#c4b5fd" stroke-width="0.8"/>
    <circle cx="520" cy="160" r="3" fill="#c4b5fd"/>
    <text x="690" y="150" fill="#c4b5fd">PAYLOAD FAIRING</text>
    <text x="690" y="165" fill="#6eaadc" font-size="9">CAPACITY: 2847 ELEMENTS</text>

    <line x1="525" y1="260" x2="680" y2="210" stroke="#4ecdc4" stroke-width="0.8"/>
    <circle cx="525" cy="260" r="3" fill="#4ecdc4"/>
    <text x="690" y="215" fill="#4ecdc4">SECOND STAGE</text>
    <text x="690" y="230" fill="#6eaadc" font-size="9">WATER-COOLED ENGINE</text>
    <text x="690" y="245" fill="#6eaadc" font-size="9">THRUST: 220 kN</text>

    <line x1="535" y1="430" x2="680" y2="310" stroke="#ff6b35" stroke-width="0.8"/>
    <circle cx="535" cy="430" r="3" fill="#ff6b35"/>
    <text x="690" y="300" fill="#ff6b35">FIRST STAGE</text>
    <text x="690" y="315" fill="#6eaadc" font-size="9">FIRE-CORE ENGINES x5</text>
    <text x="690" y="330" fill="#6eaadc" font-size="9">THRUST: 1,500 kN</text>
    <text x="690" y="345" fill="#6eaadc" font-size="9">BURN TIME: 162s</text>

    <line x1="535" y1="500" x2="680" y2="385" stroke="#a8e06c" stroke-width="0.8"/>
    <circle cx="535" cy="500" r="3" fill="#a8e06c"/>
    <text x="690" y="390" fill="#a8e06c">EARTH-ELEMENT OXIDIZER</text>

    <line x1="565" y1="520" x2="680" y2="430" stroke="#a8e06c" stroke-width="0.8"/>
    <circle cx="565" cy="520" r="3" fill="#a8e06c"/>
    <text x="690" y="435" fill="#a8e06c">STABILIZER FINS</text>
  </g>

  <!-- Specifications -->
  <rect x="680" y="470" width="370" height="120" fill="none" stroke="#6eaadc" stroke-width="1.5" rx="3"/>
  <text x="865" y="495" fill="white" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">LAUNCH SPECIFICATIONS</text>
  <line x1="680" y1="503" x2="1050" y2="503" stroke="#6eaadc" stroke-width="0.5"/>
  <text x="700" y="520" fill="#6eaadc" font-family="monospace" font-size="9">VEHICLE: CRAFT-V HEAVY</text>
  <text x="700" y="535" fill="#6eaadc" font-family="monospace" font-size="9">HEIGHT: 70m | MASS: 549,054 kg</text>
  <text x="700" y="550" fill="#6eaadc" font-family="monospace" font-size="9">ORBIT: LEO 200km</text>
  <text x="700" y="565" fill="#6eaadc" font-family="monospace" font-size="9">PAYLOAD TO ORBIT: ALL ELEMENTS</text>
  <text x="700" y="580" fill="#6eaadc" font-family="monospace" font-size="9">STATUS: NOMINAL</text>

  <!-- Height dimension -->
  <line x1="380" y1="90" x2="380" y2="580" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="375" y1="90" x2="385" y2="90" stroke="#6eaadc" stroke-width="0.8"/>
  <line x1="375" y1="580" x2="385" y2="580" stroke="#6eaadc" stroke-width="0.8"/>
  <text x="370" y="340" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="end" transform="rotate(-90,370,340)">70m TOTAL HEIGHT</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#ff6b35" stroke-width="2" fill="none"/>

  <rect x="1070" y="580" width="190" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="1165" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-ROCKET-011</text>
</svg>