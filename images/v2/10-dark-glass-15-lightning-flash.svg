<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="ltGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ltFlash">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="ltSharp">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="stormSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#stormSky)"/>

  <!-- Storm clouds illuminated by lightning -->
  <ellipse cx="300" cy="80" rx="250" ry="80" fill="#c4b5fd" opacity="0.04" filter="url(#ltFlash)"/>
  <ellipse cx="640" cy="60" rx="300" ry="90" fill="#c4b5fd" opacity="0.06" filter="url(#ltFlash)"/>
  <ellipse cx="1000" cy="90" rx="220" ry="70" fill="#c4b5fd" opacity="0.03" filter="url(#ltFlash)"/>

  <!-- Cloud base details -->
  <ellipse cx="500" cy="100" rx="180" ry="50" fill="#0e0e14" opacity="0.8"/>
  <ellipse cx="750" cy="90" rx="200" ry="60" fill="#0c0c12" opacity="0.7"/>
  <ellipse cx="350" cy="110" rx="150" ry="40" fill="#0d0d13" opacity="0.6"/>

  <!-- Main lightning bolt -->
  <g filter="url(#ltGlow)">
    <polyline points="640,80 620,160 660,180 630,280 670,300 640,420 680,440 650,560" stroke="white" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polyline points="640,80 620,160 660,180 630,280 670,300 640,420 680,440 650,560" stroke="#c4b5fd" stroke-width="6" fill="none" stroke-linejoin="round" opacity="0.4"/>
  </g>

  <!-- Lightning branches -->
  <g filter="url(#ltSharp)" opacity="0.6">
    <polyline points="620,160 590,200 600,220 570,260" stroke="white" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <polyline points="660,180 690,210 680,240" stroke="white" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <polyline points="670,300 710,330 700,360 730,390" stroke="white" stroke-width="1" fill="none" stroke-linejoin="round"/>
    <polyline points="640,420 610,450 620,470" stroke="white" stroke-width="1" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- Flash illumination on ground/scene -->
  <ellipse cx="640" cy="560" rx="400" ry="80" fill="#c4b5fd" opacity="0.03" filter="url(#ltFlash)"/>
  <ellipse cx="640" cy="300" rx="200" ry="300" fill="white" opacity="0.01" filter="url(#ltFlash)"/>

  <!-- Element emojis momentarily illuminated -->
  <g filter="url(#ltSharp)">
    <text x="350" y="350" font-size="42" text-anchor="middle" opacity="0.65">🔥</text>
    <text x="500" y="420" font-size="38" text-anchor="middle" opacity="0.55">💧</text>
    <text x="780" y="400" font-size="40" text-anchor="middle" opacity="0.6">🌍</text>
    <text x="930" y="350" font-size="36" text-anchor="middle" opacity="0.5">💨</text>
  </g>

  <!-- Rain streaks near lightning -->
  <g opacity="0.08">
    <line x1="500" y1="100" x2="490" y2="640" stroke="white" stroke-width="0.5"/>
    <line x1="550" y1="80" x2="540" y2="640" stroke="white" stroke-width="0.5"/>
    <line x1="700" y1="90" x2="690" y2="640" stroke="white" stroke-width="0.5"/>
    <line x1="750" y1="100" x2="740" y2="640" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="85" x2="590" y2="640" stroke="white" stroke-width="0.5"/>
    <line x1="680" y1="95" x2="670" y2="640" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="640" y="600" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="white" text-anchor="middle" letter-spacing="18" opacity="0.95" filter="url(#ltSharp)">INFINITE CRAFT</text>
</svg>