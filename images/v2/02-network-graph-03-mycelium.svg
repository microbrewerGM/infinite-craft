<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0a0a08"/>
  <!-- Underground mycelium network -->
  <g stroke="#a8e06c" stroke-linecap="round" fill="none">
    <!-- Main hyphae -->
    <path d="M100,580 Q200,500 340,480 Q450,460 550,400 Q620,360 640,320" stroke-width="3" stroke-opacity="0.3"/>
    <path d="M1180,580 Q1050,490 920,470 Q800,450 720,390 Q660,350 640,320" stroke-width="3" stroke-opacity="0.3"/>
    <path d="M640,320 Q640,250 600,180 Q560,120 500,80" stroke-width="2" stroke-opacity="0.25"/>
    <path d="M640,320 Q680,240 750,170 Q800,120 860,90" stroke-width="2" stroke-opacity="0.25"/>
    <!-- Branching threads -->
    <path d="M340,480 Q300,440 230,430" stroke-width="1" stroke-opacity="0.15"/>
    <path d="M340,480 Q360,520 380,560" stroke-width="1" stroke-opacity="0.12"/>
    <path d="M550,400 Q520,350 470,310" stroke-width="1" stroke-opacity="0.15"/>
    <path d="M920,470 Q960,430 1020,420" stroke-width="1" stroke-opacity="0.15"/>
    <path d="M920,470 Q900,510 880,560" stroke-width="1" stroke-opacity="0.12"/>
    <path d="M720,390 Q750,350 800,330" stroke-width="1" stroke-opacity="0.15"/>
  </g>
  <!-- Fruiting bodies (elements emerging above ground) -->
  <line x1="0" y1="460" x2="1280" y2="460" stroke="#2a2a20" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Mushroom-like nodes -->
  <g font-family="'Helvetica Neue', sans-serif" font-size="11">
    <circle cx="200" cy="440" r="8" fill="#ff6b35" opacity="0.6"/>
    <text x="200" y="425" fill="#ff6b35" text-anchor="middle" opacity="0.5" font-size="9">Fire</text>
    <circle cx="400" cy="430" r="10" fill="#4ecdc4" opacity="0.7"/>
    <text x="400" y="415" fill="#4ecdc4" text-anchor="middle" opacity="0.5" font-size="9">Water</text>
    <circle cx="640" cy="420" r="14" fill="white" opacity="0.8"/>
    <circle cx="880" cy="430" r="10" fill="#a8e06c" opacity="0.7"/>
    <text x="880" y="415" fill="#a8e06c" text-anchor="middle" opacity="0.5" font-size="9">Earth</text>
    <circle cx="1060" cy="440" r="8" fill="#c4b5fd" opacity="0.6"/>
    <text x="1060" y="425" fill="#c4b5fd" text-anchor="middle" opacity="0.5" font-size="9">Wind</text>
  </g>
  <!-- Central fruiting body glow -->
  <circle cx="640" cy="320" r="40" fill="#a8e06c" opacity="0.03"/>
  <circle cx="640" cy="320" r="20" fill="#a8e06c" opacity="0.06"/>
  <circle cx="640" cy="320" r="6" fill="white" opacity="0.8"/>
  <text x="640" y="120" font-family="'Helvetica Neue', sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="200" letter-spacing="10">INFINITE CRAFT</text>
  <text x="640" y="155" font-family="'Helvetica Neue', sans-serif" font-size="13" fill="#a8e06c" text-anchor="middle" letter-spacing="6">UNDERGROUND NETWORK</text>
</svg>