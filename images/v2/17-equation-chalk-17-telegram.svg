<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="telegram-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4"/>
      <feDiffuseLighting lighting-color="#f0e4c4" surfaceScale="1">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  <!-- Aged telegram paper -->
  <rect width="1280" height="640" fill="#f0e4c4"/>
  <rect width="1280" height="640" filter="url(#telegram-paper)" opacity="0.2"/>
  <!-- Telegram border (double line) -->
  <rect x="40" y="30" width="1200" height="580" fill="none" stroke="#8b7355" stroke-width="3"/>
  <rect x="50" y="40" width="1180" height="560" fill="none" stroke="#8b7355" stroke-width="1"/>
  <!-- Header -->
  <rect x="50" y="40" width="1180" height="60" fill="#8b7355" opacity="0.15"/>
  <text x="640" y="60" font-family="'Courier New', monospace" font-size="14" fill="#8b7355" text-anchor="middle" letter-spacing="8">WESTERN UNION</text>
  <text x="640" y="82" font-family="'Courier New', monospace" font-size="28" fill="#333" text-anchor="middle" letter-spacing="6" font-weight="bold">TELEGRAM</text>
  <!-- Decorative line -->
  <line x1="80" y1="105" x2="1200" y2="105" stroke="#8b7355" stroke-width="2"/>
  <!-- Telegram form fields -->
  <g font-family="'Courier New', monospace" fill="#8b7355" font-size="12">
    <text x="80" y="130">SEND THE FOLLOWING MESSAGE, SUBJECT TO THE TERMS ON BACK HEREOF, WHICH ARE HEREBY AGREED TO</text>
  </g>
  <line x1="80" y1="140" x2="1200" y2="140" stroke="#8b7355" stroke-width="0.5"/>
  <!-- To/From -->
  <g font-family="'Courier New', monospace" font-size="14" fill="#8b7355">
    <text x="80" y="162">TO:</text>
    <text x="130" y="162" fill="#333" font-size="16">ALL ELEMENT RESEARCHERS</text>
    <text x="700" y="162">DATE:</text>
    <text x="760" y="162" fill="#333" font-size="16">FEB 24 1926</text>
  </g>
  <line x1="80" y1="172" x2="1200" y2="172" stroke="#8b7355" stroke-width="0.5"/>
  <g font-family="'Courier New', monospace" font-size="14" fill="#8b7355">
    <text x="80" y="192">FROM:</text>
    <text x="145" y="192" fill="#333" font-size="16">INFINITE CRAFT LABORATORIES</text>
    <text x="700" y="192">CLASS OF SERVICE:</text>
    <text x="880" y="192" fill="#333" font-size="16">URGENT</text>
  </g>
  <line x1="80" y1="202" x2="1200" y2="202" stroke="#8b7355" stroke-width="2"/>
  <!-- Title in message -->
  <text x="640" y="240" font-family="'Courier New', monospace" font-size="26" fill="#333" text-anchor="middle" letter-spacing="4" font-weight="bold">INFINITE CRAFT</text>
  <!-- Message body (all caps, telegram style) -->
  <g font-family="'Courier New', monospace" font-size="20" fill="#333" letter-spacing="2">
    <text x="100" y="285">BREAKTHROUGH DISCOVERIES CONFIRMED STOP</text>
    <text x="100" y="320">WATER PLUS FIRE EQUALS STEAM STOP</text>
    <text x="100" y="355">EARTH PLUS WIND EQUALS DUST STOP</text>
    <text x="100" y="390">FIRE PLUS EARTH EQUALS LAVA STOP</text>
    <text x="100" y="425">LAVA PLUS WATER EQUALS STONE STOP</text>
    <text x="100" y="460">DUST PLUS WATER EQUALS CLAY STOP</text>
    <text x="100" y="495">STONE PLUS FIRE EQUALS METAL STOP</text>
    <text x="100" y="530">COMBINATIONS APPEAR INFINITE STOP</text>
    <text x="100" y="558" fill="#ff6b35" font-size="18">SEND MORE FUNDING IMMEDIATELY STOP</text>
  </g>
  <!-- Bottom of telegram -->
  <line x1="80" y1="575" x2="1200" y2="575" stroke="#8b7355" stroke-width="2"/>
  <g font-family="'Courier New', monospace" font-size="11" fill="#8b7355">
    <text x="80" y="593">THE FILING TIME SHOWN IN THE DATE LINE ON TELEGRAMS IS STANDARD TIME AT POINT OF ORIGIN.</text>
    <text x="80" y="607">TIME OF RECEIPT IS STANDARD TIME AT POINT OF DESTINATION</text>
  </g>
  <!-- "URGENT" stamp -->
  <g transform="translate(1000, 230) rotate(12)" opacity="0.4">
    <rect x="-60" y="-20" width="120" height="40" fill="none" stroke="#cc0000" stroke-width="3" rx="5"/>
    <text x="0" y="8" font-family="Impact, sans-serif" font-size="28" fill="#cc0000" text-anchor="middle">URGENT</text>
  </g>
  <!-- Fold marks -->
  <line x1="0" y1="320" x2="1280" y2="320" stroke="#d4c4a0" stroke-width="1" opacity="0.3" stroke-dasharray="2,4"/>
  <line x1="640" y1="0" x2="640" y2="640" stroke="#d4c4a0" stroke-width="1" opacity="0.2" stroke-dasharray="2,4"/>
</svg>