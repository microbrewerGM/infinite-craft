<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tube-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="warm-glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tube-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a3a" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#3a3a4a" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#4a4a5a" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#3a3a4a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a2a3a" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="heater-glow" cx="50%" cy="60%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ff4500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="1280" height="640" fill="#0a0808"/>
  <!-- Warm ambient glow -->
  <ellipse cx="640" cy="300" rx="600" ry="280" fill="#ff6b35" opacity="0.03" filter="url(#warm-glow)"/>
  <!-- Chassis/mounting plate -->
  <rect x="60" y="400" width="1160" height="220" fill="url(#chassis)" rx="5"/>
  <rect x="60" y="400" width="1160" height="5" fill="#3a3530"/>
  <!-- Ventilation slots -->
  <g opacity="0.3">
    <rect x="100" y="560" width="60" height="4" rx="2" fill="#000"/><rect x="180" y="560" width="60" height="4" rx="2" fill="#000"/><rect x="260" y="560" width="60" height="4" rx="2" fill="#000"/><rect x="340" y="560" width="60" height="4" rx="2" fill="#000"/>
    <rect x="880" y="560" width="60" height="4" rx="2" fill="#000"/><rect x="960" y="560" width="60" height="4" rx="2" fill="#000"/><rect x="1040" y="560" width="60" height="4" rx="2" fill="#000"/><rect x="1120" y="560" width="60" height="4" rx="2" fill="#000"/>
    <rect x="100" y="575" width="60" height="4" rx="2" fill="#000"/><rect x="180" y="575" width="60" height="4" rx="2" fill="#000"/><rect x="260" y="575" width="60" height="4" rx="2" fill="#000"/><rect x="340" y="575" width="60" height="4" rx="2" fill="#000"/>
    <rect x="880" y="575" width="60" height="4" rx="2" fill="#000"/><rect x="960" y="575" width="60" height="4" rx="2" fill="#000"/><rect x="1040" y="575" width="60" height="4" rx="2" fill="#000"/><rect x="1120" y="575" width="60" height="4" rx="2" fill="#000"/>
  </g>
  <!-- Tube sockets on chassis -->
  <circle cx="200" cy="420" r="35" fill="#1a1510" stroke="#3a3530" stroke-width="2"/>
  <circle cx="200" cy="420" r="25" fill="#111" stroke="#555" stroke-width="1"/>
  <circle cx="420" cy="420" r="35" fill="#1a1510" stroke="#3a3530" stroke-width="2"/>
  <circle cx="420" cy="420" r="25" fill="#111" stroke="#555" stroke-width="1"/>
  <circle cx="640" cy="420" r="40" fill="#1a1510" stroke="#3a3530" stroke-width="2"/>
  <circle cx="640" cy="420" r="30" fill="#111" stroke="#555" stroke-width="1"/>
  <circle cx="860" cy="420" r="35" fill="#1a1510" stroke="#3a3530" stroke-width="2"/>
  <circle cx="860" cy="420" r="25" fill="#111" stroke="#555" stroke-width="1"/>
  <circle cx="1080" cy="420" r="35" fill="#1a1510" stroke="#3a3530" stroke-width="2"/>
  <circle cx="1080" cy="420" r="25" fill="#111" stroke="#555" stroke-width="1"/>
  <!-- Socket pins -->
  <g fill="#888">
    <circle cx="185" cy="408" r="2"/><circle cx="215" cy="408" r="2"/><circle cx="185" cy="432" r="2"/><circle cx="215" cy="432" r="2"/><circle cx="200" cy="400" r="2"/><circle cx="200" cy="440" r="2"/><circle cx="178" cy="420" r="2"/><circle cx="222" cy="420" r="2"/>
    <circle cx="405" cy="408" r="2"/><circle cx="435" cy="408" r="2"/><circle cx="405" cy="432" r="2"/><circle cx="435" cy="432" r="2"/><circle cx="420" cy="400" r="2"/><circle cx="420" cy="440" r="2"/><circle cx="398" cy="420" r="2"/><circle cx="442" cy="420" r="2"/>
    <circle cx="625" cy="408" r="2.5"/><circle cx="655" cy="408" r="2.5"/><circle cx="625" cy="432" r="2.5"/><circle cx="655" cy="432" r="2.5"/><circle cx="640" cy="396" r="2.5"/><circle cx="640" cy="444" r="2.5"/><circle cx="614" cy="420" r="2.5"/><circle cx="666" cy="420" r="2.5"/>
    <circle cx="845" cy="408" r="2"/><circle cx="875" cy="408" r="2"/><circle cx="845" cy="432" r="2"/><circle cx="875" cy="432" r="2"/><circle cx="860" cy="400" r="2"/><circle cx="860" cy="440" r="2"/><circle cx="838" cy="420" r="2"/><circle cx="882" cy="420" r="2"/>
    <circle cx="1065" cy="408" r="2"/><circle cx="1095" cy="408" r="2"/><circle cx="1065" cy="432" r="2"/><circle cx="1095" cy="432" r="2"/><circle cx="1080" cy="400" r="2"/><circle cx="1080" cy="440" r="2"/><circle cx="1058" cy="420" r="2"/><circle cx="1102" cy="420" r="2"/>
  </g>
  <!-- Vacuum tubes - glass envelopes -->
  <!-- Tube 1 - FIRE (small triode) -->
  <ellipse cx="200" cy="250" rx="35" ry="100" fill="url(#tube-glass)" stroke="#4a4a5a" stroke-width="1"/>
  <ellipse cx="200" cy="250" rx="25" ry="70" fill="url(#heater-glow)" filter="url(#tube-glow)"/>
  <!-- Internal plates -->
  <rect x="188" y="200" width="24" height="80" fill="none" stroke="#666" stroke-width="1" opacity="0.4"/>
  <line x1="194" y1="210" x2="194" y2="270" stroke="#ff6b35" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="210" x2="200" y2="270" stroke="#ff6b35" stroke-width="1.5" opacity="0.8"/>
  <line x1="206" y1="210" x2="206" y2="270" stroke="#ff6b35" stroke-width="1.5" opacity="0.6"/>
  <text x="200" y="380" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ff6b35">FIRE</text>
  <!-- Tube 2 - WATER -->
  <ellipse cx="420" cy="250" rx="35" ry="100" fill="url(#tube-glass)" stroke="#4a4a5a" stroke-width="1"/>
  <ellipse cx="420" cy="260" rx="22" ry="60" fill="#4ecdc4" opacity="0.08" filter="url(#tube-glow)"/>
  <rect x="408" y="210" width="24" height="80" fill="none" stroke="#666" stroke-width="1" opacity="0.4"/>
  <line x1="414" y1="220" x2="414" y2="280" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5"/>
  <line x1="420" y1="220" x2="420" y2="280" stroke="#4ecdc4" stroke-width="1.5" opacity="0.7"/>
  <line x1="426" y1="220" x2="426" y2="280" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5"/>
  <text x="420" y="380" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#4ecdc4">WATER</text>
  <!-- Tube 3 - CENTER (large power tube) -->
  <ellipse cx="640" cy="230" rx="45" ry="120" fill="url(#tube-glass)" stroke="#4a4a5a" stroke-width="1.5"/>
  <ellipse cx="640" cy="240" rx="30" ry="80" fill="#ffd93d" opacity="0.06" filter="url(#tube-glow)"/>
  <ellipse cx="640" cy="250" rx="20" ry="50" fill="#ff6b35" opacity="0.15" filter="url(#tube-glow)"/>
  <!-- Power tube internal structure -->
  <rect x="624" y="190" width="32" height="100" fill="none" stroke="#888" stroke-width="1.5" opacity="0.3"/>
  <line x1="632" y1="200" x2="632" y2="280" stroke="#ffd93d" stroke-width="2" opacity="0.6"/>
  <line x1="640" y1="195" x2="640" y2="285" stroke="#ffd93d" stroke-width="2" opacity="0.8"/>
  <line x1="648" y1="200" x2="648" y2="280" stroke="#ffd93d" stroke-width="2" opacity="0.6"/>
  <!-- Top getter flash -->
  <ellipse cx="640" cy="140" rx="25" ry="15" fill="#666" opacity="0.3"/>
  <!-- Tube 4 - EARTH -->
  <ellipse cx="860" cy="250" rx="35" ry="100" fill="url(#tube-glass)" stroke="#4a4a5a" stroke-width="1"/>
  <ellipse cx="860" cy="260" rx="22" ry="60" fill="#a8e06c" opacity="0.06" filter="url(#tube-glow)"/>
  <rect x="848" y="210" width="24" height="80" fill="none" stroke="#666" stroke-width="1" opacity="0.4"/>
  <line x1="854" y1="220" x2="854" y2="280" stroke="#a8e06c" stroke-width="1.5" opacity="0.5"/>
  <line x1="860" y1="220" x2="860" y2="280" stroke="#a8e06c" stroke-width="1.5" opacity="0.7"/>
  <line x1="866" y1="220" x2="866" y2="280" stroke="#a8e06c" stroke-width="1.5" opacity="0.5"/>
  <text x="860" y="380" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#a8e06c">EARTH</text>
  <!-- Tube 5 - WIND -->
  <ellipse cx="1080" cy="250" rx="35" ry="100" fill="url(#tube-glass)" stroke="#4a4a5a" stroke-width="1"/>
  <ellipse cx="1080" cy="260" rx="22" ry="60" fill="#c4b5fd" opacity="0.06" filter="url(#tube-glow)"/>
  <rect x="1068" y="210" width="24" height="80" fill="none" stroke="#666" stroke-width="1" opacity="0.4"/>
  <line x1="1074" y1="220" x2="1074" y2="280" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="1080" y1="220" x2="1080" y2="280" stroke="#c4b5fd" stroke-width="1.5" opacity="0.7"/>
  <line x1="1086" y1="220" x2="1086" y2="280" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="1080" y="380" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#c4b5fd">WIND</text>
  <!-- Wiring between tubes -->
  <path d="M235,300 C300,290 350,300 385,300" stroke="#ff6b35" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M455,280 C520,260 560,270 595,280" stroke="#4ecdc4" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M685,280 C750,260 800,270 825,280" stroke="#a8e06c" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M895,300 C960,290 1010,300 1045,300" stroke="#c4b5fd" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Title plate -->
  <rect x="440" y="485" width="400" height="55" rx="3" fill="#1a1510" stroke="#4a4030" stroke-width="1.5"/>
  <text x="640" y="518" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#ffd93d" font-weight="bold" letter-spacing="6">INFINITE CRAFT</text>
  <text x="640" y="535" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#888" letter-spacing="4">VACUUM TUBE AMPLIFIER</text>
</svg>