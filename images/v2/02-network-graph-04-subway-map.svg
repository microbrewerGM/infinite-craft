<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#f5f0e8"/>
  <!-- Transit-style network map with bold colored lines -->
  <!-- Red line -->
  <path d="M60,200 H300 L400,300 H640 L740,200 H1220" stroke="#ff6b35" stroke-width="8" fill="none" stroke-linejoin="round"/>
  <!-- Teal line -->
  <path d="M60,400 H250 L350,300 H640 L780,400 H1220" stroke="#4ecdc4" stroke-width="8" fill="none" stroke-linejoin="round"/>
  <!-- Purple line -->
  <path d="M400,60 V200 L500,300 H640 V500 L700,560" stroke="#c4b5fd" stroke-width="8" fill="none" stroke-linejoin="round"/>
  <!-- Green line -->
  <path d="M900,60 V200 L800,300 H640" stroke="#a8e06c" stroke-width="8" fill="none" stroke-linejoin="round"/>
  <!-- Station dots -->
  <g fill="white" stroke="#333" stroke-width="2">
    <circle cx="200" cy="200" r="8"/><circle cx="300" cy="200" r="8"/>
    <circle cx="400" cy="300" r="8"/><circle cx="500" cy="300" r="8"/>
    <circle cx="640" cy="300" r="12" stroke-width="3"/>
    <circle cx="740" cy="200" r="8"/><circle cx="900" cy="200" r="8"/>
    <circle cx="250" cy="400" r="8"/><circle cx="350" cy="300" r="8"/>
    <circle cx="780" cy="400" r="8"/><circle cx="1000" cy="400" r="8"/>
    <circle cx="640" cy="200" r="8"/><circle cx="640" cy="500" r="8"/>
    <circle cx="800" cy="300" r="8"/>
  </g>
  <!-- Station labels -->
  <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#333">
    <text x="200" y="185">Fire</text>
    <text x="300" y="185">Lava</text>
    <text x="400" y="325">Steam</text>
    <text x="640" y="335" text-anchor="middle" font-weight="bold" font-size="13">Central</text>
    <text x="740" y="185">Earth</text>
    <text x="250" y="425">Water</text>
    <text x="780" y="425">Wind</text>
    <text x="640" y="520">Dust</text>
    <text x="900" y="185">Stone</text>
  </g>
  <!-- Title -->
  <text x="1100" y="560" font-family="'Helvetica Neue', sans-serif" font-size="36" fill="#333" text-anchor="middle" font-weight="800">INFINITE</text>
  <text x="1100" y="595" font-family="'Helvetica Neue', sans-serif" font-size="36" fill="#333" text-anchor="middle" font-weight="800">CRAFT</text>
  <text x="1100" y="615" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#999" text-anchor="middle" letter-spacing="3">ELEMENT TRANSIT MAP</text>
</svg>