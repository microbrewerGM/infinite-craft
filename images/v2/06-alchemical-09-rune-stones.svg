<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <filter id="glow9">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rough9">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg9)"/>
  <!-- Ground/moss texture line -->
  <path d="M0,520 Q100,515 200,520 Q300,518 400,522 Q500,517 640,520 Q780,523 880,518 Q1000,522 1100,519 Q1200,521 1280,520" fill="none" stroke="#2a3a2a" stroke-width="2" opacity="0.3"/>
  <!-- Stone 1: Fire rune (Kenaz) -->
  <g transform="translate(200,340)">
    <path d="M-50,-90 L-40,-100 L40,-100 L50,-90 L55,70 L40,100 L-40,100 L-55,70 Z" fill="url(#stone)" stroke="#4a4a4a" stroke-width="1" opacity="0.8"/>
    <path d="M-50,-90 L-40,-100 L40,-100 L50,-90 L55,70 L40,100 L-40,100 L-55,70 Z" fill="#2a2a2a" opacity="0.3" filter="url(#rough9)"/>
    <!-- Rune carving: Kenaz (fire) -->
    <g stroke="#ff6b35" stroke-width="3" stroke-linecap="round" filter="url(#glow9)" opacity="0.8">
      <line x1="-15" y1="-50" x2="-15" y2="50"/>
      <line x1="-15" y1="-30" x2="20" y2="0"/>
      <line x1="20" y1="0" x2="-15" y2="30"/>
    </g>
    <text x="0" y="130" text-anchor="middle" font-family="serif" font-size="12" fill="#ff6b35" opacity="0.5">KENAZ</text>
  </g>
  <!-- Stone 2: Water rune (Laguz) -->
  <g transform="translate(430,330)">
    <path d="M-45,-85 L-35,-95 L35,-95 L45,-85 L50,65 L35,95 L-35,95 L-50,65 Z" fill="url(#stone)" stroke="#4a4a4a" stroke-width="1" opacity="0.8"/>
    <g stroke="#4ecdc4" stroke-width="3" stroke-linecap="round" filter="url(#glow9)" opacity="0.8">
      <line x1="-10" y1="-45" x2="-10" y2="45"/>
      <line x1="-10" y1="-45" x2="15" y2="-20"/>
    </g>
    <text x="0" y="125" text-anchor="middle" font-family="serif" font-size="12" fill="#4ecdc4" opacity="0.5">LAGUZ</text>
  </g>
  <!-- Stone 3: Earth rune (Berkano) - center, larger -->
  <g transform="translate(640,320)">
    <path d="M-55,-100 L-45,-110 L45,-110 L55,-100 L60,80 L45,110 L-45,110 L-60,80 Z" fill="url(#stone)" stroke="#5a5a5a" stroke-width="1" opacity="0.85"/>
    <g stroke="#a8e06c" stroke-width="3" stroke-linecap="round" filter="url(#glow9)" opacity="0.8">
      <line x1="-12" y1="-55" x2="-12" y2="55"/>
      <line x1="-12" y1="-55" x2="18" y2="-30"/>
      <line x1="18" y1="-30" x2="-12" y2="0"/>
      <line x1="-12" y1="0" x2="18" y2="25"/>
      <line x1="18" y1="25" x2="-12" y2="55"/>
    </g>
    <text x="0" y="140" text-anchor="middle" font-family="serif" font-size="12" fill="#a8e06c" opacity="0.5">BERKANO</text>
  </g>
  <!-- Stone 4: Air rune (Ansuz) -->
  <g transform="translate(850,335)">
    <path d="M-45,-85 L-35,-95 L35,-95 L45,-85 L50,65 L35,95 L-35,95 L-50,65 Z" fill="url(#stone)" stroke="#4a4a4a" stroke-width="1" opacity="0.8"/>
    <g stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" filter="url(#glow9)" opacity="0.8">
      <line x1="-10" y1="-45" x2="-10" y2="45"/>
      <line x1="-10" y1="-25" x2="15" y2="-45"/>
      <line x1="-10" y1="0" x2="15" y2="-20"/>
    </g>
    <text x="0" y="125" text-anchor="middle" font-family="serif" font-size="12" fill="#c4b5fd" opacity="0.5">ANSUZ</text>
  </g>
  <!-- Stone 5: Gold/quintessence rune (Dagaz) -->
  <g transform="translate(1080,340)">
    <path d="M-50,-90 L-40,-100 L40,-100 L50,-90 L55,70 L40,100 L-40,100 L-55,70 Z" fill="url(#stone)" stroke="#4a4a4a" stroke-width="1" opacity="0.8"/>
    <g stroke="#ffd93d" stroke-width="3" stroke-linecap="round" filter="url(#glow9)" opacity="0.8">
      <line x1="-15" y1="-40" x2="-15" y2="40"/>
      <line x1="15" y1="-40" x2="15" y2="40"/>
      <line x1="-15" y1="-40" x2="15" y2="40"/>
      <line x1="-15" y1="40" x2="15" y2="-40"/>
    </g>
    <text x="0" y="130" text-anchor="middle" font-family="serif" font-size="12" fill="#ffd93d" opacity="0.5">DAGAZ</text>
  </g>
  <!-- Title -->
  <text x="640" y="65" text-anchor="middle" font-family="serif" font-size="48" fill="#c9a96e" letter-spacing="12" filter="url(#glow9)">INFINITE CRAFT</text>
  <line x1="340" y1="80" x2="940" y2="80" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
  <!-- Faint moss/ground details -->
  <g fill="#1a2a1a" opacity="0.2">
    <circle cx="160" cy="510" r="3"/><circle cx="350" cy="515" r="4"/><circle cx="550" cy="512" r="3"/>
    <circle cx="750" cy="518" r="4"/><circle cx="950" cy="513" r="3"/><circle cx="1120" cy="516" r="4"/>
  </g>
</svg>