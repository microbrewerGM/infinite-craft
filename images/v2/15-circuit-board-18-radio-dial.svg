<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dial-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="warm-light">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="radio-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="100%" stop-color="#2a1a0a"/>
    </linearGradient>
    <linearGradient id="dial-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e8c8"/>
      <stop offset="100%" stop-color="#e8d8b0"/>
    </linearGradient>
    <radialGradient id="dial-backlight" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="30%" stop-color="#aaa"/>
      <stop offset="50%" stop-color="#ccc"/>
      <stop offset="70%" stop-color="#999"/>
      <stop offset="100%" stop-color="#bbb"/>
    </linearGradient>
  </defs>
  <!-- Dark room background -->
  <rect width="1280" height="640" fill="#0a0808"/>
  <!-- Radio cabinet -->
  <rect x="90" y="40" width="1100" height="560" rx="20" fill="url(#radio-body)"/>
  <!-- Wood grain -->
  <g opacity="0.1">
    <path d="M90,100 C400,95 700,105 1190,98" stroke="#5a4a30" stroke-width="2" fill="none"/>
    <path d="M90,200 C400,205 700,195 1190,202" stroke="#5a4a30" stroke-width="1.5" fill="none"/>
    <path d="M90,350 C400,345 700,355 1190,348" stroke="#5a4a30" stroke-width="2" fill="none"/>
    <path d="M90,500 C400,505 700,495 1190,502" stroke="#5a4a30" stroke-width="1.5" fill="none"/>
  </g>
  <!-- Speaker grille (left side) -->
  <rect x="130" y="80" width="320" height="400" rx="10" fill="#1a1008"/>
  <g stroke="#3a2a1a" stroke-width="1" opacity="0.6">
    <line x1="150" y1="100" x2="430" y2="100"/><line x1="150" y1="115" x2="430" y2="115"/><line x1="150" y1="130" x2="430" y2="130"/><line x1="150" y1="145" x2="430" y2="145"/><line x1="150" y1="160" x2="430" y2="160"/><line x1="150" y1="175" x2="430" y2="175"/><line x1="150" y1="190" x2="430" y2="190"/><line x1="150" y1="205" x2="430" y2="205"/><line x1="150" y1="220" x2="430" y2="220"/><line x1="150" y1="235" x2="430" y2="235"/><line x1="150" y1="250" x2="430" y2="250"/><line x1="150" y1="265" x2="430" y2="265"/><line x1="150" y1="280" x2="430" y2="280"/><line x1="150" y1="295" x2="430" y2="295"/><line x1="150" y1="310" x2="430" y2="310"/><line x1="150" y1="325" x2="430" y2="325"/><line x1="150" y1="340" x2="430" y2="340"/><line x1="150" y1="355" x2="430" y2="355"/><line x1="150" y1="370" x2="430" y2="370"/><line x1="150" y1="385" x2="430" y2="385"/><line x1="150" y1="400" x2="430" y2="400"/><line x1="150" y1="415" x2="430" y2="415"/><line x1="150" y1="430" x2="430" y2="430"/><line x1="150" y1="445" x2="430" y2="445"/><line x1="150" y1="460" x2="430" y2="460"/>
  </g>
  <!-- Speaker cone visible through grille -->
  <circle cx="290" cy="280" r="120" fill="none" stroke="#2a1a08" stroke-width="2" opacity="0.3"/>
  <circle cx="290" cy="280" r="80" fill="none" stroke="#2a1a08" stroke-width="1.5" opacity="0.2"/>
  <circle cx="290" cy="280" r="30" fill="#1a1008" stroke="#2a1a08" stroke-width="1" opacity="0.3"/>
  <!-- Dial face (main tuning display) -->
  <rect x="500" y="80" width="640" height="250" rx="8" fill="url(#dial-face)"/>
  <rect x="500" y="80" width="640" height="250" fill="url(#dial-backlight)"/>
  <!-- Dial glass frame -->
  <rect x="498" y="78" width="644" height="254" rx="10" fill="none" stroke="#8a7a5a" stroke-width="3"/>
  <!-- Frequency bands -->
  <!-- AM Band -->
  <text x="520" y="110" font-family="Georgia, serif" font-size="12" fill="#8a6a3a" font-weight="bold">AM</text>
  <line x1="560" y1="105" x2="1120" y2="105" stroke="#8a6a3a" stroke-width="1"/>
  <g font-family="Georgia, serif" font-size="9" fill="#8a6a3a">
    <text x="570" y="100">530</text><text x="650" y="100">700</text><text x="740" y="100">900</text><text x="830" y="100">1100</text><text x="920" y="100">1300</text><text x="1010" y="100">1500</text><text x="1090" y="100">1700</text>
  </g>
  <!-- Tick marks for AM -->
  <g stroke="#8a6a3a" stroke-width="0.5">
    <line x1="580" y1="107" x2="580" y2="112"/><line x1="610" y1="107" x2="610" y2="110"/><line x1="640" y1="107" x2="640" y2="110"/><line x1="660" y1="107" x2="660" y2="112"/><line x1="690" y1="107" x2="690" y2="110"/><line x1="720" y1="107" x2="720" y2="110"/><line x1="750" y1="107" x2="750" y2="112"/><line x1="780" y1="107" x2="780" y2="110"/><line x1="810" y1="107" x2="810" y2="110"/><line x1="840" y1="107" x2="840" y2="112"/><line x1="870" y1="107" x2="870" y2="110"/><line x1="900" y1="107" x2="900" y2="110"/><line x1="930" y1="107" x2="930" y2="112"/><line x1="960" y1="107" x2="960" y2="110"/><line x1="990" y1="107" x2="990" y2="110"/><line x1="1020" y1="107" x2="1020" y2="112"/><line x1="1050" y1="107" x2="1050" y2="110"/><line x1="1080" y1="107" x2="1080" y2="110"/><line x1="1100" y1="107" x2="1100" y2="112"/>
  </g>
  <!-- FM Band -->
  <text x="520" y="155" font-family="Georgia, serif" font-size="12" fill="#5a3a1a" font-weight="bold">FM</text>
  <line x1="560" y1="150" x2="1120" y2="150" stroke="#5a3a1a" stroke-width="1"/>
  <g font-family="Georgia, serif" font-size="9" fill="#5a3a1a">
    <text x="570" y="145">88</text><text x="650" y="145">92</text><text x="740" y="145">96</text><text x="830" y="145">100</text><text x="920" y="145">104</text><text x="1010" y="145">108</text>
  </g>
  <!-- Element stations -->
  <g font-family="Georgia, serif" font-size="14" font-weight="bold" filter="url(#dial-glow)">
    <text x="600" y="190" fill="#ff6b35">FIRE</text>
    <text x="600" y="205" font-size="8" fill="#8a6a3a" font-weight="normal">89.7 MHz</text>
    <text x="730" y="190" fill="#4ecdc4">WATER</text>
    <text x="730" y="205" font-size="8" fill="#8a6a3a" font-weight="normal">95.3 MHz</text>
    <text x="870" y="190" fill="#a8e06c">EARTH</text>
    <text x="870" y="205" font-size="8" fill="#8a6a3a" font-weight="normal">101.1 MHz</text>
    <text x="1010" y="190" fill="#c4b5fd">WIND</text>
    <text x="1010" y="205" font-size="8" fill="#8a6a3a" font-weight="normal">106.5 MHz</text>
  </g>
  <!-- Tuning needle -->
  <line x1="840" y1="85" x2="840" y2="240" stroke="#cc0000" stroke-width="1.5"/>
  <polygon points="837,240 843,240 840,248" fill="#cc0000"/>
  <!-- Station frequency readout at bottom of dial -->
  <rect x="680" y="260" width="140" height="30" rx="3" fill="#3a2a10" opacity="0.8"/>
  <text x="750" y="282" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#ffd93d" filter="url(#dial-glow)">100.7 FM</text>
  <!-- Dial decorative text -->
  <text x="820" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#8a7a5a" font-weight="bold" letter-spacing="6">INFINITE CRAFT</text>
  <!-- Control knobs -->
  <!-- Volume knob -->
  <circle cx="580" cy="440" r="45" fill="url(#chrome)"/>
  <circle cx="580" cy="440" r="40" fill="#3a3a3a"/>
  <circle cx="580" cy="440" r="35" fill="#444"/>
  <g stroke="#333" stroke-width="1">
    <line x1="580" y1="410" x2="580" y2="425" stroke="#ddd" stroke-width="2"/>
  </g>
  <!-- Volume markings -->
  <g font-family="Georgia, serif" font-size="8" fill="#8a7a5a">
    <text x="530" y="470">0</text><text x="525" y="450">2</text><text x="530" y="425">4</text><text x="545" y="408">6</text><text x="568" y="398">8</text><text x="592" y="398">10</text>
  </g>
  <text x="580" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8a7a5a">VOLUME</text>
  <!-- Tuning knob -->
  <circle cx="820" cy="440" r="55" fill="url(#chrome)"/>
  <circle cx="820" cy="440" r="50" fill="#3a3a3a"/>
  <circle cx="820" cy="440" r="45" fill="#444"/>
  <line x1="808" y1="400" x2="814" y2="412" stroke="#ddd" stroke-width="2.5"/>
  <text x="820" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8a7a5a">TUNING</text>
  <!-- Tone knob -->
  <circle cx="1060" cy="440" r="45" fill="url(#chrome)"/>
  <circle cx="1060" cy="440" r="40" fill="#3a3a3a"/>
  <circle cx="1060" cy="440" r="35" fill="#444"/>
  <line x1="1060" y1="410" x2="1060" y2="425" stroke="#ddd" stroke-width="2"/>
  <text x="1060" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#8a7a5a">TONE</text>
  <!-- Band selector buttons -->
  <g transform="translate(520,530)">
    <rect x="0" y="0" width="50" height="20" rx="3" fill="#c4a050"/>
    <text x="25" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#2a1a0a" font-weight="bold">AM</text>
    <rect x="60" y="0" width="50" height="20" rx="3" fill="#2a1a0a" stroke="#8a7a5a" stroke-width="1"/>
    <text x="85" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8a7a5a" font-weight="bold">FM</text>
    <rect x="120" y="0" width="50" height="20" rx="3" fill="#2a1a0a" stroke="#8a7a5a" stroke-width="1"/>
    <text x="145" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#8a7a5a" font-weight="bold">SW</text>
  </g>
  <!-- Power indicator -->
  <circle cx="1100" cy="540" r="5" fill="#a8e06c" filter="url(#dial-glow)"/>
  <text x="1115" y="544" font-family="Georgia, serif" font-size="9" fill="#8a7a5a">ON</text>
  <!-- Title at bottom -->
  <text x="640" y="615" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4a30" letter-spacing="8">EST. 2026 | HANDCRAFTED RECEIVER</text>
</svg>