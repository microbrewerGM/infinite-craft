<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg13" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <filter id="glow13"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cityGlow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg13)"/>
  <!-- Globe silhouette -->
  <circle cx="640" cy="320" r="260" fill="none" stroke="#1a3050" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="640" cy="320" rx="260" ry="100" fill="none" stroke="#1a3050" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="640" cy="320" rx="100" ry="260" fill="none" stroke="#1a3050" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="640" cy="320" rx="200" ry="260" fill="none" stroke="#1a3050" stroke-width="0.5" opacity="0.2"/>
  <!-- Simplified continent outlines -->
  <g fill="#0d2040" stroke="#1a4060" stroke-width="0.5" opacity="0.5">
    <!-- North America shape -->
    <path d="M460,180 Q480,170 510,175 Q530,180 540,200 Q535,230 520,250 Q500,260 480,255 Q460,250 450,230 Q445,210 460,180Z"/>
    <!-- Europe/Africa -->
    <path d="M660,190 Q680,185 700,200 Q710,230 705,260 Q700,300 690,340 Q680,370 670,380 Q660,370 655,340 Q650,300 655,250 Q655,220 660,190Z"/>
    <!-- Asia -->
    <path d="M720,170 Q760,165 800,180 Q830,200 840,230 Q835,260 820,280 Q790,290 760,280 Q730,265 715,240 Q710,210 720,170Z"/>
    <!-- South America -->
    <path d="M520,360 Q535,350 540,370 Q538,400 530,430 Q520,450 510,440 Q505,420 510,390 Q515,370 520,360Z"/>
    <!-- Australia -->
    <path d="M800,380 Q820,375 835,390 Q840,410 830,420 Q815,425 800,415 Q795,400 800,380Z"/>
  </g>
  <!-- Flight path arcs -->
  <g fill="none" stroke-linecap="round" filter="url(#glow13)">
    <!-- Major routes - bright -->
    <path d="M490,210 Q580,140 680,195" stroke="#ff6b35" stroke-width="1.8" opacity="0.7"/>
    <path d="M500,220 Q640,100 770,200" stroke="#4ecdc4" stroke-width="1.5" opacity="0.6"/>
    <path d="M680,200 Q730,160 780,195" stroke="#ffd93d" stroke-width="1.5" opacity="0.7"/>
    <path d="M490,215 Q600,80 780,200" stroke="#c4b5fd" stroke-width="1.2" opacity="0.5"/>
    <path d="M670,250 Q720,300 810,390" stroke="#a8e06c" stroke-width="1.3" opacity="0.6"/>
    <path d="M530,250 Q580,330 525,380" stroke="#ff6b35" stroke-width="1.2" opacity="0.5"/>
    <path d="M680,260 Q650,330 680,370" stroke="#ffd93d" stroke-width="1.2" opacity="0.5"/>
    <path d="M780,210 Q850,280 820,390" stroke="#4ecdc4" stroke-width="1.3" opacity="0.5"/>
    <path d="M490,220 Q450,320 510,400" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
    <!-- Trans-pacific -->
    <path d="M470,200 Q420,150 400,200 Q390,280 420,350" stroke="#ff6b35" stroke-width="0.8" opacity="0.3"/>
    <path d="M830,220 Q880,180 900,220 Q910,300 880,370" stroke="#4ecdc4" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- City/airport dots with glow -->
  <g filter="url(#cityGlow)">
    <circle cx="490" cy="210" r="6" fill="#ff6b35" opacity="0.5"/>
    <circle cx="680" cy="195" r="7" fill="#ffd93d" opacity="0.5"/>
    <circle cx="780" cy="195" r="6" fill="#4ecdc4" opacity="0.5"/>
    <circle cx="525" cy="380" r="5" fill="#c4b5fd" opacity="0.4"/>
    <circle cx="810" cy="390" r="5" fill="#a8e06c" opacity="0.4"/>
  </g>
  <!-- City dots bright -->
  <g>
    <circle cx="490" cy="210" r="3" fill="#ff6b35" opacity="0.9"/>
    <circle cx="680" cy="195" r="3.5" fill="#ffd93d" opacity="0.9"/>
    <circle cx="780" cy="195" r="3" fill="#4ecdc4" opacity="0.9"/>
    <circle cx="525" cy="380" r="2.5" fill="#c4b5fd" opacity="0.8"/>
    <circle cx="810" cy="390" r="2.5" fill="#a8e06c" opacity="0.8"/>
    <circle cx="670" cy="250" r="2.5" fill="#ffd93d" opacity="0.8"/>
    <circle cx="530" cy="250" r="2" fill="#ff6b35" opacity="0.7"/>
    <circle cx="780" cy="210" r="2" fill="#4ecdc4" opacity="0.7"/>
  </g>
  <!-- Airplane icons (tiny triangles along paths) -->
  <g fill="white" opacity="0.6">
    <polygon points="580,160 575,167 585,167" transform="rotate(-30,580,163)"/>
    <polygon points="730,175 725,182 735,182" transform="rotate(-10,730,178)"/>
    <polygon points="650,110 645,117 655,117" transform="rotate(-20,650,113)"/>
    <polygon points="750,310 745,317 755,317" transform="rotate(50,750,313)"/>
  </g>
  <!-- Title -->
  <text x="640" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central" letter-spacing="3" opacity="0.9">INFINITE CRAFT</text>
  <text x="640" y="362" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4ecdc4" text-anchor="middle" letter-spacing="10" opacity="0.5">FLIGHT PATHS</text>
</svg>