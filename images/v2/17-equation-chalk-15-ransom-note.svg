<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="cut-shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rough paper background -->
  <rect width="1280" height="640" fill="#e8e0d0"/>
  <!-- Subtle crumple texture -->
  <g opacity="0.05">
    <path d="M0 0 L400 100 L200 300 L600 200 L800 400 L1000 300 L1280 500 L1280 0Z" fill="#000"/>
    <path d="M0 640 L300 500 L600 600 L900 450 L1280 640Z" fill="#000"/>
  </g>
  <!-- Title - cut-out magazine letters -->
  <g filter="url(#cut-shadow)">
    <!-- I -->
    <rect x="200" y="25" width="42" height="52" fill="#ff6b35" rx="2" transform="rotate(-3 221 51)"/>
    <text x="221" y="62" font-family="'Times New Roman', serif" font-size="38" fill="white" text-anchor="middle" font-weight="bold" transform="rotate(-3 221 51)">I</text>
    <!-- N -->
    <rect x="250" y="28" width="48" height="52" fill="#4ecdc4" rx="2" transform="rotate(2 274 54)"/>
    <text x="274" y="65" font-family="Impact, sans-serif" font-size="36" fill="white" text-anchor="middle" transform="rotate(2 274 54)">N</text>
    <!-- F -->
    <rect x="306" y="22" width="42" height="52" fill="#c4b5fd" rx="2" transform="rotate(-1 327 48)"/>
    <text x="327" y="59" font-family="Georgia, serif" font-size="38" fill="#333" text-anchor="middle" font-style="italic" transform="rotate(-1 327 48)">F</text>
    <!-- I -->
    <rect x="356" y="30" width="36" height="52" fill="#ffd93d" rx="2" transform="rotate(3 374 56)"/>
    <text x="374" y="66" font-family="'Courier New', monospace" font-size="34" fill="#333" text-anchor="middle" font-weight="bold" transform="rotate(3 374 56)">I</text>
    <!-- N -->
    <rect x="400" y="24" width="48" height="52" fill="#a8e06c" rx="2" transform="rotate(-2 424 50)"/>
    <text x="424" y="61" font-family="Arial Black, sans-serif" font-size="36" fill="#333" text-anchor="middle" transform="rotate(-2 424 50)">N</text>
    <!-- I -->
    <rect x="456" y="28" width="36" height="52" fill="#ff6b35" rx="2" transform="rotate(1 474 54)"/>
    <text x="474" y="64" font-family="'Times New Roman', serif" font-size="38" fill="white" text-anchor="middle" transform="rotate(1 474 54)">I</text>
    <!-- T -->
    <rect x="500" y="22" width="42" height="52" fill="#333" rx="2" transform="rotate(-2 521 48)"/>
    <text x="521" y="59" font-family="Georgia, serif" font-size="36" fill="#c9c4a1" text-anchor="middle" font-weight="bold" transform="rotate(-2 521 48)">T</text>
    <!-- E -->
    <rect x="550" y="30" width="42" height="52" fill="#4ecdc4" rx="2" transform="rotate(2 571 56)"/>
    <text x="571" y="66" font-family="Impact, sans-serif" font-size="36" fill="white" text-anchor="middle" transform="rotate(2 571 56)">E</text>
    <!-- space -->
    <!-- C -->
    <rect x="630" y="25" width="44" height="52" fill="#c4b5fd" rx="2" transform="rotate(-1 652 51)"/>
    <text x="652" y="62" font-family="'Courier New', monospace" font-size="36" fill="#333" text-anchor="middle" font-weight="bold" transform="rotate(-1 652 51)">C</text>
    <!-- R -->
    <rect x="682" y="28" width="44" height="52" fill="#ffd93d" rx="2" transform="rotate(3 704 54)"/>
    <text x="704" y="65" font-family="'Times New Roman', serif" font-size="38" fill="#333" text-anchor="middle" transform="rotate(3 704 54)">R</text>
    <!-- A -->
    <rect x="734" y="23" width="44" height="52" fill="#ff6b35" rx="2" transform="rotate(-2 756 49)"/>
    <text x="756" y="60" font-family="Arial Black, sans-serif" font-size="34" fill="white" text-anchor="middle" transform="rotate(-2 756 49)">A</text>
    <!-- F -->
    <rect x="786" y="30" width="42" height="52" fill="#a8e06c" rx="2" transform="rotate(1 807 56)"/>
    <text x="807" y="66" font-family="Impact, sans-serif" font-size="36" fill="#333" text-anchor="middle" transform="rotate(1 807 56)">F</text>
    <!-- T -->
    <rect x="836" y="24" width="42" height="52" fill="#333" rx="2" transform="rotate(-3 857 50)"/>
    <text x="857" y="61" font-family="Georgia, serif" font-size="38" fill="#c9c4a1" text-anchor="middle" transform="rotate(-3 857 50)">T</text>
  </g>
  <!-- Equation 1: Water + Fire = Steam -->
  <g filter="url(#cut-shadow)">
    <rect x="80" y="110" width="120" height="42" fill="#4ecdc4" rx="2" transform="rotate(1 140 131)"/>
    <text x="140" y="139" font-family="Georgia, serif" font-size="24" fill="white" text-anchor="middle" transform="rotate(1 140 131)">Water</text>
    <rect x="215" y="115" width="35" height="38" fill="#ffd93d" rx="2" transform="rotate(-2 232 134)"/>
    <text x="232" y="141" font-family="Impact" font-size="28" fill="#333" text-anchor="middle" transform="rotate(-2 232 134)">+</text>
    <rect x="265" y="108" width="100" height="42" fill="#ff6b35" rx="2" transform="rotate(2 315 129)"/>
    <text x="315" y="137" font-family="'Courier New', monospace" font-size="24" fill="white" text-anchor="middle" font-weight="bold" transform="rotate(2 315 129)">Fire</text>
    <rect x="380" y="114" width="35" height="38" fill="#c9c4a1" rx="2"/>
    <text x="397" y="140" font-family="Arial" font-size="28" fill="#333" text-anchor="middle">=</text>
    <rect x="430" y="108" width="130" height="42" fill="#c4b5fd" rx="2" transform="rotate(-1 495 129)"/>
    <text x="495" y="137" font-family="Arial Black" font-size="24" fill="#333" text-anchor="middle" transform="rotate(-1 495 129)">Steam</text>
  </g>
  <!-- Equation 2: Earth + Wind = Dust -->
  <g filter="url(#cut-shadow)">
    <rect x="80" y="180" width="120" height="42" fill="#a8e06c" rx="2" transform="rotate(-2 140 201)"/>
    <text x="140" y="209" font-family="Impact" font-size="24" fill="#333" text-anchor="middle" transform="rotate(-2 140 201)">Earth</text>
    <rect x="215" y="185" width="35" height="38" fill="#333" rx="2" transform="rotate(1 232 204)"/>
    <text x="232" y="211" font-family="Georgia" font-size="28" fill="#c9c4a1" text-anchor="middle" transform="rotate(1 232 204)">+</text>
    <rect x="265" y="178" width="110" height="42" fill="#4ecdc4" rx="2" transform="rotate(-1 320 199)"/>
    <text x="320" y="207" font-family="'Times New Roman'" font-size="26" fill="white" text-anchor="middle" font-style="italic" transform="rotate(-1 320 199)">Wind</text>
    <rect x="390" y="184" width="35" height="38" fill="#ffd93d" rx="2" transform="rotate(2 407 203)"/>
    <text x="407" y="210" font-family="Arial" font-size="28" fill="#333" text-anchor="middle" transform="rotate(2 407 203)">=</text>
    <rect x="440" y="178" width="110" height="42" fill="#ff6b35" rx="2" transform="rotate(1 495 199)"/>
    <text x="495" y="207" font-family="'Courier New'" font-size="24" fill="white" text-anchor="middle" font-weight="bold" transform="rotate(1 495 199)">Dust</text>
  </g>
  <!-- Equation 3: Fire + Earth = Lava -->
  <g filter="url(#cut-shadow)">
    <rect x="80" y="250" width="100" height="42" fill="#ff6b35" rx="2" transform="rotate(2 130 271)"/>
    <text x="130" y="279" font-family="Georgia" font-size="26" fill="white" text-anchor="middle" transform="rotate(2 130 271)">Fire</text>
    <rect x="195" y="255" width="35" height="38" fill="#c4b5fd" rx="2"/>
    <text x="212" y="281" font-family="Impact" font-size="28" fill="#333" text-anchor="middle">+</text>
    <rect x="245" y="248" width="120" height="42" fill="#a8e06c" rx="2" transform="rotate(-2 305 269)"/>
    <text x="305" y="277" font-family="Arial Black" font-size="22" fill="#333" text-anchor="middle" transform="rotate(-2 305 269)">Earth</text>
    <rect x="380" y="254" width="35" height="38" fill="#333" rx="2" transform="rotate(1 397 273)"/>
    <text x="397" y="280" font-family="Georgia" font-size="28" fill="#ffd93d" text-anchor="middle" transform="rotate(1 397 273)">=</text>
    <rect x="430" y="248" width="110" height="42" fill="#ffd93d" rx="2" transform="rotate(-1 485 269)"/>
    <text x="485" y="277" font-family="Impact" font-size="26" fill="#333" text-anchor="middle" transform="rotate(-1 485 269)">Lava</text>
  </g>
  <!-- Right side equations -->
  <!-- Equation 4: Lava + Water = Stone -->
  <g filter="url(#cut-shadow)">
    <rect x="650" y="120" width="100" height="42" fill="#ffd93d" rx="2" transform="rotate(-1 700 141)"/>
    <text x="700" y="149" font-family="Impact" font-size="24" fill="#333" text-anchor="middle" transform="rotate(-1 700 141)">Lava</text>
    <rect x="765" y="125" width="35" height="38" fill="#4ecdc4" rx="2" transform="rotate(2 782 144)"/>
    <text x="782" y="151" font-family="Georgia" font-size="28" fill="white" text-anchor="middle" transform="rotate(2 782 144)">+</text>
    <rect x="815" y="118" width="120" height="42" fill="#c4b5fd" rx="2" transform="rotate(-2 875 139)"/>
    <text x="875" y="147" font-family="'Courier New'" font-size="22" fill="#333" text-anchor="middle" font-weight="bold" transform="rotate(-2 875 139)">Water</text>
    <rect x="950" y="124" width="35" height="38" fill="#333" rx="2"/>
    <text x="967" y="150" font-family="Arial" font-size="28" fill="#c9c4a1" text-anchor="middle">=</text>
    <rect x="1000" y="118" width="120" height="42" fill="#a8e06c" rx="2" transform="rotate(1 1060 139)"/>
    <text x="1060" y="147" font-family="Arial Black" font-size="22" fill="#333" text-anchor="middle" transform="rotate(1 1060 139)">Stone</text>
  </g>
  <!-- Equation 5: Dust + Water = Clay -->
  <g filter="url(#cut-shadow)">
    <rect x="650" y="195" width="100" height="42" fill="#ff6b35" rx="2" transform="rotate(2 700 216)"/>
    <text x="700" y="224" font-family="Georgia" font-size="24" fill="white" text-anchor="middle" font-style="italic" transform="rotate(2 700 216)">Dust</text>
    <rect x="765" y="200" width="35" height="38" fill="#ffd93d" rx="2" transform="rotate(-1 782 219)"/>
    <text x="782" y="226" font-family="Impact" font-size="28" fill="#333" text-anchor="middle" transform="rotate(-1 782 219)">+</text>
    <rect x="815" y="193" width="120" height="42" fill="#4ecdc4" rx="2" transform="rotate(1 875 214)"/>
    <text x="875" y="222" font-family="Arial Black" font-size="22" fill="white" text-anchor="middle" transform="rotate(1 875 214)">Water</text>
    <rect x="950" y="199" width="35" height="38" fill="#c4b5fd" rx="2" transform="rotate(-2 967 218)"/>
    <text x="967" y="225" font-family="Georgia" font-size="28" fill="#333" text-anchor="middle" transform="rotate(-2 967 218)">=</text>
    <rect x="1000" y="193" width="100" height="42" fill="#333" rx="2" transform="rotate(1 1050 214)"/>
    <text x="1050" y="222" font-family="'Courier New'" font-size="24" fill="#c9c4a1" text-anchor="middle" font-weight="bold" transform="rotate(1 1050 214)">Clay</text>
  </g>
  <!-- Scattered extra letters and scraps -->
  <g filter="url(#cut-shadow)" opacity="0.4">
    <rect x="100" y="400" width="28" height="34" fill="#c4b5fd" rx="1" transform="rotate(15 114 417)"/>
    <text x="114" y="424" font-family="Impact" font-size="22" fill="#333" text-anchor="middle" transform="rotate(15 114 417)">X</text>
    <rect x="300" y="450" width="28" height="34" fill="#ff6b35" rx="1" transform="rotate(-20 314 467)"/>
    <text x="314" y="474" font-family="Georgia" font-size="22" fill="white" text-anchor="middle" transform="rotate(-20 314 467)">Q</text>
    <rect x="500" y="380" width="28" height="34" fill="#a8e06c" rx="1" transform="rotate(8 514 397)"/>
    <text x="514" y="404" font-family="Arial" font-size="22" fill="#333" text-anchor="middle" transform="rotate(8 514 397)">Z</text>
    <rect x="900" y="350" width="28" height="34" fill="#ffd93d" rx="1" transform="rotate(-12 914 367)"/>
    <text x="914" y="374" font-family="'Courier New'" font-size="22" fill="#333" text-anchor="middle" transform="rotate(-12 914 367)">M</text>
  </g>
  <!-- Glue stick marks -->
  <g fill="#d4c8a0" opacity="0.15">
    <ellipse cx="200" cy="550" rx="40" ry="20"/>
    <ellipse cx="800" cy="500" rx="35" ry="18"/>
    <ellipse cx="1100" cy="450" rx="30" ry="15"/>
  </g>
  <!-- Scissors -->
  <g transform="translate(1050, 530) rotate(30)" stroke="#888" stroke-width="2" fill="none">
    <ellipse cx="0" cy="-12" rx="10" ry="18"/>
    <ellipse cx="0" cy="12" rx="10" ry="18"/>
    <line x1="10" y1="-5" x2="50" y2="-15"/>
    <line x1="10" y1="5" x2="50" y2="15"/>
  </g>
  <!-- Magazine scraps on floor -->
  <rect x="600" y="450" width="200" height="30" fill="#ddd" rx="2" transform="rotate(-5 700 465)" filter="url(#cut-shadow)" opacity="0.3"/>
  <rect x="150" y="500" width="150" height="25" fill="#eee" rx="2" transform="rotate(8 225 512)" filter="url(#cut-shadow)" opacity="0.3"/>
</svg>