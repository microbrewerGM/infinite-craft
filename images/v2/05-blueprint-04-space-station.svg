<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
    <pattern id="stars" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="25" r="0.8" fill="#6eaadc" opacity="0.4"/>
      <circle cx="75" cy="10" r="0.5" fill="#6eaadc" opacity="0.3"/>
      <circle cx="50" cy="70" r="0.6" fill="#6eaadc" opacity="0.3"/>
      <circle cx="90" cy="85" r="0.7" fill="#6eaadc" opacity="0.4"/>
      <circle cx="30" cy="90" r="0.4" fill="#6eaadc" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#0d1525"/>
  <rect width="1280" height="640" fill="url(#stars)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.3"/>

  <!-- Title -->
  <text x="640" y="50" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="62" x2="980" y2="62" stroke="#ff6b35" stroke-width="2"/>
  <text x="640" y="82" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">ORBITAL STATION BLUEPRINT</text>

  <!-- Central hub -->
  <ellipse cx="640" cy="340" rx="60" ry="40" fill="none" stroke="#ff6b35" stroke-width="2.5"/>
  <ellipse cx="640" cy="340" rx="40" ry="25" fill="none" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="640" y="345" fill="white" font-family="monospace" font-size="11" text-anchor="middle">CORE HUB</text>

  <!-- Left solar array truss -->
  <line x1="580" y1="340" x2="300" y2="340" stroke="#4ecdc4" stroke-width="3"/>
  <!-- Solar panel 1 -->
  <rect x="200" y="250" width="100" height="180" fill="none" stroke="#ffd93d" stroke-width="2"/>
  <line x1="200" y1="280" x2="300" y2="280" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="200" y1="310" x2="300" y2="310" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="200" y1="340" x2="300" y2="340" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="200" y1="370" x2="300" y2="370" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="200" y1="400" x2="300" y2="400" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="250" y1="250" x2="250" y2="430" stroke="#ffd93d" stroke-width="0.5"/>
  <text x="250" y="245" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="middle">SOLAR ARRAY A</text>

  <!-- Solar panel 2 (far left) -->
  <rect x="80" y="270" width="80" height="140" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="80" y1="305" x2="160" y2="305" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="80" y1="340" x2="160" y2="340" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="80" y1="375" x2="160" y2="375" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="120" y1="270" x2="120" y2="410" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="160" y1="340" x2="200" y2="340" stroke="#4ecdc4" stroke-width="2"/>

  <!-- Right solar array truss -->
  <line x1="700" y1="340" x2="980" y2="340" stroke="#4ecdc4" stroke-width="3"/>
  <!-- Solar panel 3 -->
  <rect x="980" y="250" width="100" height="180" fill="none" stroke="#ffd93d" stroke-width="2"/>
  <line x1="980" y1="280" x2="1080" y2="280" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="980" y1="310" x2="1080" y2="310" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="980" y1="340" x2="1080" y2="340" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="980" y1="370" x2="1080" y2="370" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="980" y1="400" x2="1080" y2="400" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="1030" y1="250" x2="1030" y2="430" stroke="#ffd93d" stroke-width="0.5"/>
  <text x="1030" y="245" fill="#ffd93d" font-family="monospace" font-size="9" text-anchor="middle">SOLAR ARRAY B</text>

  <!-- Solar panel 4 -->
  <rect x="1120" y="270" width="80" height="140" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="1120" y1="305" x2="1200" y2="305" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="1120" y1="340" x2="1200" y2="340" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="1120" y1="375" x2="1200" y2="375" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="1160" y1="270" x2="1160" y2="410" stroke="#ffd93d" stroke-width="0.5"/>
  <line x1="1080" y1="340" x2="1120" y2="340" stroke="#4ecdc4" stroke-width="2"/>

  <!-- Upper module - Fire Lab -->
  <line x1="640" y1="300" x2="640" y2="200" stroke="#4ecdc4" stroke-width="3"/>
  <rect x="590" y="140" width="100" height="60" rx="15" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <text x="640" y="168" fill="#ff6b35" font-family="monospace" font-size="11" text-anchor="middle">FIRE LAB</text>
  <text x="640" y="182" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">MODULE A-1</text>

  <!-- Lower module - Water Lab -->
  <line x1="640" y1="380" x2="640" y2="480" stroke="#4ecdc4" stroke-width="3"/>
  <rect x="590" y="480" width="100" height="60" rx="15" fill="none" stroke="#4ecdc4" stroke-width="2"/>
  <text x="640" y="508" fill="#4ecdc4" font-family="monospace" font-size="11" text-anchor="middle">WATER LAB</text>
  <text x="640" y="522" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">MODULE B-1</text>

  <!-- Left module - Earth Lab -->
  <rect x="340" y="310" width="100" height="60" rx="15" fill="none" stroke="#a8e06c" stroke-width="2"/>
  <text x="390" y="338" fill="#a8e06c" font-family="monospace" font-size="11" text-anchor="middle">EARTH LAB</text>
  <text x="390" y="352" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">MODULE C-1</text>

  <!-- Right module - Wind Lab -->
  <rect x="840" y="310" width="100" height="60" rx="15" fill="none" stroke="#c4b5fd" stroke-width="2"/>
  <text x="890" y="338" fill="#c4b5fd" font-family="monospace" font-size="11" text-anchor="middle">WIND LAB</text>
  <text x="890" y="352" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">MODULE D-1</text>

  <!-- Docking ports -->
  <g transform="translate(640,130)">
    <rect x="-15" y="-20" width="30" height="20" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="0" y="-25" fill="#c4b5fd" font-family="monospace" font-size="8" text-anchor="middle">DOCK-1</text>
  </g>
  <g transform="translate(640,550)">
    <rect x="-15" y="0" width="30" height="20" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="0" y="35" fill="#c4b5fd" font-family="monospace" font-size="8" text-anchor="middle">DOCK-2</text>
  </g>

  <!-- Radiator panels -->
  <g transform="translate(460,170)">
    <rect x="0" y="0" width="60" height="15" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.7"/>
    <rect x="0" y="20" width="60" height="15" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.7"/>
    <text x="30" y="-5" fill="#ff6b35" font-family="monospace" font-size="7" text-anchor="middle">RADIATOR</text>
  </g>
  <g transform="translate(760,170)">
    <rect x="0" y="0" width="60" height="15" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.7"/>
    <rect x="0" y="20" width="60" height="15" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.7"/>
    <text x="30" y="-5" fill="#ff6b35" font-family="monospace" font-size="7" text-anchor="middle">RADIATOR</text>
  </g>

  <!-- Dimension annotations -->
  <line x1="200" y1="460" x2="300" y2="460" stroke="#6eaadc" stroke-width="0.5"/>
  <text x="250" y="475" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">35m</text>
  <line x1="580" y1="590" x2="700" y2="590" stroke="#6eaadc" stroke-width="0.5"/>
  <text x="640" y="605" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">42m</text>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 50 M 1260 20 L 1230 20" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 590 M 20 620 L 50 620" stroke="#ff6b35" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 590 M 1260 620 L 1230 620" stroke="#ff6b35" stroke-width="2" fill="none"/>

  <!-- Info block -->
  <rect x="900" y="580" width="360" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <text x="1080" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-STATION-004</text>
</svg>