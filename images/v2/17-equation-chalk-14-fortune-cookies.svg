<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="paper-shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="table-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3a1e"/>
      <stop offset="100%" stop-color="#4a2e15"/>
    </linearGradient>
    <linearGradient id="cookie-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c870"/>
      <stop offset="50%" stop-color="#d4a840"/>
      <stop offset="100%" stop-color="#c89830"/>
    </linearGradient>
  </defs>
  <!-- Dark wood table surface -->
  <rect width="1280" height="640" fill="url(#table-wood)"/>
  <!-- Wood grain lines -->
  <g stroke="#6b4425" stroke-width="0.5" opacity="0.3">
    <path d="M0 100 Q300 95 600 102 Q900 108 1280 100" fill="none"/>
    <path d="M0 200 Q400 195 800 205 Q1100 210 1280 200" fill="none"/>
    <path d="M0 340 Q350 335 700 342 Q1000 348 1280 340" fill="none"/>
    <path d="M0 480 Q500 475 900 482 Q1100 486 1280 480" fill="none"/>
    <path d="M0 560 Q300 556 600 562 Q900 566 1280 560" fill="none"/>
  </g>
  <!-- Title fortune strip (large, centered) -->
  <g transform="translate(340, 15) rotate(-1)">
    <rect width="600" height="45" fill="#faf0d4" rx="2" filter="url(#paper-shadow)"/>
    <text x="300" y="32" font-family="'Times New Roman', serif" font-size="28" fill="#333" text-anchor="middle" font-weight="bold">INFINITE CRAFT</text>
  </g>
  <!-- Fortune cookie 1 + strip -->
  <g transform="translate(60, 90)">
    <!-- Cookie shape -->
    <path d="M30 60 Q60 20 100 50 Q80 70 100 90 Q60 120 30 60Z" fill="url(#cookie-grad)" stroke="#b8882a" stroke-width="1"/>
    <!-- Fortune strip -->
    <g transform="translate(120, 35) rotate(3)">
      <rect width="350" height="40" fill="#faf0d4" rx="1" filter="url(#paper-shadow)"/>
      <text x="175" y="18" font-family="'Times New Roman', serif" font-size="14" fill="#333" text-anchor="middle">Water + Fire = Steam</text>
      <text x="175" y="33" font-family="'Times New Roman', serif" font-size="11" fill="#ff6b35" text-anchor="middle" font-style="italic">Lucky elements: 7, 14, 21</text>
    </g>
  </g>
  <!-- Fortune cookie 2 + strip -->
  <g transform="translate(580, 80)">
    <path d="M30 60 Q60 20 100 50 Q80 70 100 90 Q60 120 30 60Z" fill="url(#cookie-grad)" stroke="#b8882a" stroke-width="1" transform="rotate(15 65 65)"/>
    <g transform="translate(130, 30) rotate(-2)">
      <rect width="350" height="40" fill="#faf0d4" rx="1" filter="url(#paper-shadow)"/>
      <text x="175" y="18" font-family="'Times New Roman', serif" font-size="14" fill="#333" text-anchor="middle">Earth + Wind = Dust</text>
      <text x="175" y="33" font-family="'Times New Roman', serif" font-size="11" fill="#4ecdc4" text-anchor="middle" font-style="italic">A new combination awaits you</text>
    </g>
  </g>
  <!-- Fortune cookie 3 + strip -->
  <g transform="translate(80, 230)">
    <path d="M30 60 Q60 20 100 50 Q80 70 100 90 Q60 120 30 60Z" fill="url(#cookie-grad)" stroke="#b8882a" stroke-width="1" transform="rotate(-10 65 65)"/>
    <g transform="translate(125, 40) rotate(1)">
      <rect width="350" height="40" fill="#faf0d4" rx="1" filter="url(#paper-shadow)"/>
      <text x="175" y="18" font-family="'Times New Roman', serif" font-size="14" fill="#333" text-anchor="middle">Fire + Earth = Lava</text>
      <text x="175" y="33" font-family="'Times New Roman', serif" font-size="11" fill="#ff6b35" text-anchor="middle" font-style="italic">Handle with care</text>
    </g>
  </g>
  <!-- Fortune cookie 4 + strip -->
  <g transform="translate(600, 225)">
    <path d="M30 60 Q60 20 100 50 Q80 70 100 90 Q60 120 30 60Z" fill="url(#cookie-grad)" stroke="#b8882a" stroke-width="1" transform="rotate(5 65 65)"/>
    <g transform="translate(120, 35) rotate(-3)">
      <rect width="350" height="40" fill="#faf0d4" rx="1" filter="url(#paper-shadow)"/>
      <text x="175" y="18" font-family="'Times New Roman', serif" font-size="14" fill="#333" text-anchor="middle">Lava + Water = Stone</text>
      <text x="175" y="33" font-family="'Times New Roman', serif" font-size="11" fill="#c4b5fd" text-anchor="middle" font-style="italic">Patience turns liquid to solid</text>
    </g>
  </g>
  <!-- Fortune cookie 5 + strip -->
  <g transform="translate(100, 380)">
    <path d="M30 60 Q60 20 100 50 Q80 70 100 90 Q60 120 30 60Z" fill="url(#cookie-grad)" stroke="#b8882a" stroke-width="1" transform="rotate(8 65 65)"/>
    <g transform="translate(130, 30) rotate(2)">
      <rect width="350" height="40" fill="#faf0d4" rx="1" filter="url(#paper-shadow)"/>
      <text x="175" y="18" font-family="'Times New Roman', serif" font-size="14" fill="#333" text-anchor="middle">Dust + Water = Clay</text>
      <text x="175" y="33" font-family="'Times New Roman', serif" font-size="11" fill="#a8e06c" text-anchor="middle" font-style="italic">From nothing, create everything</text>
    </g>
  </g>
  <!-- Fortune cookie 6 + strip -->
  <g transform="translate(620, 370)">
    <path d="M30 60 Q60 20 100 50 Q80 70 100 90 Q60 120 30 60Z" fill="url(#cookie-grad)" stroke="#b8882a" stroke-width="1" transform="rotate(-12 65 65)"/>
    <g transform="translate(125, 38) rotate(-1)">
      <rect width="350" height="40" fill="#faf0d4" rx="1" filter="url(#paper-shadow)"/>
      <text x="175" y="18" font-family="'Times New Roman', serif" font-size="14" fill="#333" text-anchor="middle">Stone + Fire = Metal</text>
      <text x="175" y="33" font-family="'Times New Roman', serif" font-size="11" fill="#ffd93d" text-anchor="middle" font-style="italic">The forge of discovery never cools</text>
    </g>
  </g>
  <!-- Scattered cookie crumbs -->
  <g fill="#d4a840" opacity="0.5">
    <circle cx="550" cy="180" r="3"/><circle cx="560" cy="190" r="2"/>
    <circle cx="540" cy="185" r="2.5"/><circle cx="200" cy="350" r="2"/>
    <circle cx="210" cy="360" r="3"/><circle cx="850" cy="330" r="2"/>
    <circle cx="400" cy="520" r="2.5"/><circle cx="700" cy="520" r="2"/>
  </g>
  <!-- Bottom fortune strip -->
  <g transform="translate(340, 540) rotate(1)">
    <rect width="600" height="40" fill="#faf0d4" rx="1" filter="url(#paper-shadow)"/>
    <text x="300" y="17" font-family="'Times New Roman', serif" font-size="13" fill="#333" text-anchor="middle" font-style="italic">"The combinations are truly infinite."</text>
    <text x="300" y="33" font-family="'Times New Roman', serif" font-size="11" fill="#888" text-anchor="middle">Learn Mandarin: Infinite = Wu Xian</text>
  </g>
  <!-- Chopsticks -->
  <line x1="1050" y1="500" x2="1200" y2="600" stroke="#c89830" stroke-width="5" stroke-linecap="round"/>
  <line x1="1070" y1="510" x2="1220" y2="590" stroke="#d4a840" stroke-width="5" stroke-linecap="round"/>
</svg>