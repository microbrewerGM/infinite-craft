<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="yyGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softYY">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="leftLoop">
      <path d="M260,300 C260,180 390,140 475,205 C535,248 568,285 640,285 L640,315 C568,315 535,352 475,395 C390,460 260,420 260,300Z"/>
    </clipPath>
    <clipPath id="rightLoop">
      <path d="M640,285 C712,285 745,248 805,205 C890,140 1020,180 1020,300 C1020,420 890,460 805,395 C745,352 712,315 640,315Z"/>
    </clipPath>
  </defs>
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- Background radiance -->
  <ellipse cx="420" cy="300" rx="200" ry="180" fill="#ff6b35" opacity="0.02" filter="url(#softYY)"/>
  <ellipse cx="860" cy="300" rx="200" ry="180" fill="#4ecdc4" opacity="0.02" filter="url(#softYY)"/>
  <!-- Infinity outline -->
  <path d="M260,300 C260,180 390,140 475,205 C535,248 568,285 640,285 C712,285 745,248 805,205 C890,140 1020,180 1020,300 C1020,420 890,460 805,395 C745,352 712,315 640,315 C568,315 535,352 475,395 C390,460 260,420 260,300Z" fill="none" stroke="#fff" stroke-width="3" opacity="0.15"/>
  <!-- LEFT LOOP - Yin-Yang -->
  <!-- Dark half (top of left loop) -->
  <path d="M260,300 C260,180 390,140 475,205 C535,248 568,285 640,285 L640,300 C590,300 540,290 475,300 C410,310 370,300 330,300 C295,300 260,300 260,300Z" fill="#1a1a2e" opacity="0.8"/>
  <!-- Light half (bottom of left loop) -->
  <path d="M260,300 C260,300 295,300 330,300 C370,300 410,290 475,300 C540,310 590,300 640,300 L640,315 C568,315 535,352 475,395 C390,460 260,420 260,300Z" fill="#ff6b35" opacity="0.3"/>
  <!-- S-curve divider -->
  <path d="M640,285 C590,285 540,260 475,300 C410,340 350,315 260,300" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.6" filter="url(#yyGlow)"/>
  <!-- Small circles (dots in yin-yang) -->
  <circle cx="380" cy="250" r="12" fill="#ff6b35" opacity="0.5"/>
  <circle cx="380" cy="250" r="5" fill="#1a1a2e" opacity="0.8"/>
  <circle cx="500" cy="350" r="12" fill="#1a1a2e" opacity="0.5"/>
  <circle cx="500" cy="350" r="5" fill="#ff6b35" opacity="0.6"/>
  <!-- RIGHT LOOP - Yin-Yang (complementary) -->
  <!-- Dark half (bottom of right loop) -->
  <path d="M1020,300 C1020,420 890,460 805,395 C745,352 712,315 640,315 L640,300 C690,300 740,310 805,300 C870,290 910,300 950,300 C985,300 1020,300 1020,300Z" fill="#1a1a2e" opacity="0.8"/>
  <!-- Light half (top of right loop) -->
  <path d="M640,285 C712,285 745,248 805,205 C890,140 1020,180 1020,300 C1020,300 985,300 950,300 C910,300 870,310 805,300 C740,290 690,300 640,300Z" fill="#4ecdc4" opacity="0.3"/>
  <!-- S-curve divider -->
  <path d="M640,315 C690,315 740,340 805,300 C870,260 930,285 1020,300" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.6" filter="url(#yyGlow)"/>
  <!-- Small circles -->
  <circle cx="780" cy="250" r="12" fill="#1a1a2e" opacity="0.5"/>
  <circle cx="780" cy="250" r="5" fill="#4ecdc4" opacity="0.6"/>
  <circle cx="900" cy="350" r="12" fill="#4ecdc4" opacity="0.5"/>
  <circle cx="900" cy="350" r="5" fill="#1a1a2e" opacity="0.8"/>
  <!-- Infinity outline (over everything) -->
  <path d="M260,300 C260,180 390,140 475,205 C535,248 568,285 640,285 C712,285 745,248 805,205 C890,140 1020,180 1020,300 C1020,420 890,460 805,395 C745,352 712,315 640,315 C568,315 535,352 475,395 C390,460 260,420 260,300Z" fill="none" stroke="#fff" stroke-width="2" opacity="0.4" filter="url(#yyGlow)"/>
  <!-- Energy flow lines -->
  <g opacity="0.15" fill="none" stroke-width="1">
    <path d="M280,300 C280,200 390,165 468,218 C530,258 568,290 640,290" stroke="#ff6b35"/>
    <path d="M640,290 C712,290 750,258 812,218 C890,165 1000,200 1000,300" stroke="#4ecdc4"/>
    <path d="M1000,300 C1000,400 890,435 812,382 C750,342 712,310 640,310" stroke="#4ecdc4"/>
    <path d="M640,310 C568,310 530,342 468,382 C390,435 280,400 280,300" stroke="#ff6b35"/>
  </g>
  <!-- Transition sparks at center -->
  <g filter="url(#yyGlow)" opacity="0.5">
    <circle cx="640" cy="285" r="4" fill="#ffd93d"/>
    <circle cx="640" cy="315" r="4" fill="#c4b5fd"/>
    <circle cx="640" cy="300" r="3" fill="#fff" opacity="0.6"/>
  </g>
  <!-- Balance dots at extremities -->
  <circle cx="260" cy="300" r="5" fill="#ff6b35" opacity="0.7" filter="url(#yyGlow)"/>
  <circle cx="1020" cy="300" r="5" fill="#4ecdc4" opacity="0.7" filter="url(#yyGlow)"/>
  <!-- Title -->
  <text x="640" y="558" text-anchor="middle" font-family="'Georgia', serif" font-size="40" font-weight="bold" fill="#ffffff" letter-spacing="14" opacity="0.9">INFINITE CRAFT</text>
</svg>