<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="knob-shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="panel-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <radialGradient id="knob-grad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="50%" stop-color="#333"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <radialGradient id="jack-hole" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="80%" stop-color="#111"/>
      <stop offset="100%" stop-color="#333"/>
    </radialGradient>
  </defs>
  <!-- Panel background -->
  <rect width="1280" height="640" fill="url(#panel-bg)"/>
  <!-- Panel screws -->
  <g fill="#333" stroke="#222" stroke-width="1">
    <circle cx="15" cy="15" r="6"/><circle cx="1265" cy="15" r="6"/><circle cx="15" cy="625" r="6"/><circle cx="1265" cy="625" r="6"/>
    <line x1="12" y1="15" x2="18" y2="15" stroke="#444" stroke-width="1.5"/>
    <line x1="1262" y1="15" x2="1268" y2="15" stroke="#444" stroke-width="1.5"/>
    <line x1="12" y1="625" x2="18" y2="625" stroke="#444" stroke-width="1.5"/>
    <line x1="1262" y1="625" x2="1268" y2="625" stroke="#444" stroke-width="1.5"/>
  </g>
  <!-- Module dividers -->
  <line x1="256" y1="0" x2="256" y2="640" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="512" y1="0" x2="512" y2="640" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="768" y1="0" x2="768" y2="640" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="1024" y1="0" x2="1024" y2="640" stroke="#2a2a2a" stroke-width="2"/>
  <!-- MODULE 1: FIRE OSC -->
  <text x="128" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#ff6b35" font-weight="bold" letter-spacing="2">FIRE OSC</text>
  <!-- Knobs -->
  <circle cx="80" cy="110" r="25" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <line x1="80" y1="90" x2="80" y2="100" stroke="#ff6b35" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888">FREQ</text>
  <circle cx="176" cy="110" r="25" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <line x1="162" y1="98" x2="170" y2="104" stroke="#ff6b35" stroke-width="3" stroke-linecap="round"/>
  <text x="176" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888">SHAPE</text>
  <!-- Small knobs -->
  <circle cx="60" cy="200" r="14" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <line x1="60" y1="188" x2="60" y2="194" stroke="#ff6b35" stroke-width="2" stroke-linecap="round"/>
  <text x="60" y="225" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#666">PW</text>
  <circle cx="128" cy="200" r="14" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <text x="128" y="225" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#666">FM</text>
  <circle cx="196" cy="200" r="14" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <text x="196" y="225" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#666">SYNC</text>
  <!-- Jacks -->
  <circle cx="60" cy="280" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <circle cx="128" cy="280" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <circle cx="196" cy="280" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <text x="60" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#ff6b35">CV</text>
  <text x="128" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#ff6b35">FM</text>
  <text x="196" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#ff6b35">OUT</text>
  <!-- MODULE 2: WATER FILTER -->
  <text x="384" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#4ecdc4" font-weight="bold" letter-spacing="2">WATER FLT</text>
  <circle cx="336" cy="110" r="30" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <line x1="336" y1="85" x2="336" y2="98" stroke="#4ecdc4" stroke-width="3" stroke-linecap="round"/>
  <text x="336" y="155" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888">CUTOFF</text>
  <circle cx="432" cy="110" r="30" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <line x1="420" y1="88" x2="426" y2="98" stroke="#4ecdc4" stroke-width="3" stroke-linecap="round"/>
  <text x="432" y="155" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888">RES</text>
  <circle cx="315" cy="200" r="14" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <text x="315" y="225" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#666">ENV</text>
  <circle cx="384" cy="200" r="14" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <text x="384" y="225" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#666">KEY</text>
  <circle cx="453" cy="200" r="14" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <text x="453" y="225" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#666">MOD</text>
  <circle cx="315" cy="280" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <circle cx="384" cy="280" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <circle cx="453" cy="280" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <text x="315" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#4ecdc4">IN</text>
  <text x="384" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#4ecdc4">CV</text>
  <text x="453" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#4ecdc4">OUT</text>
  <!-- MODULE 3: EARTH ENV -->
  <text x="640" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#a8e06c" font-weight="bold" letter-spacing="2">EARTH ENV</text>
  <!-- ADSR sliders -->
  <rect x="555" y="70" width="10" height="120" rx="3" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="555" y="100" width="10" height="20" rx="2" fill="#a8e06c"/>
  <text x="560" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888">A</text>
  <rect x="595" y="70" width="10" height="120" rx="3" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="595" y="85" width="10" height="20" rx="2" fill="#a8e06c"/>
  <text x="600" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888">D</text>
  <rect x="635" y="70" width="10" height="120" rx="3" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="635" y="120" width="10" height="20" rx="2" fill="#a8e06c"/>
  <text x="640" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888">S</text>
  <rect x="675" y="70" width="10" height="120" rx="3" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="675" y="110" width="10" height="20" rx="2" fill="#a8e06c"/>
  <text x="680" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888">R</text>
  <rect x="715" y="70" width="10" height="120" rx="3" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="715" y="90" width="10" height="20" rx="2" fill="#a8e06c"/>
  <text x="720" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888">LVL</text>
  <circle cx="580" cy="270" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <circle cx="640" cy="270" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <circle cx="700" cy="270" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <text x="580" y="295" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#a8e06c">GATE</text>
  <text x="640" y="295" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#a8e06c">TRIG</text>
  <text x="700" y="295" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#a8e06c">OUT</text>
  <!-- MODULE 4: WIND LFO -->
  <text x="896" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#c4b5fd" font-weight="bold" letter-spacing="2">WIND LFO</text>
  <circle cx="848" cy="110" r="25" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <line x1="848" y1="90" x2="848" y2="100" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
  <text x="848" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888">RATE</text>
  <circle cx="944" cy="110" r="25" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <text x="944" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888">DEPTH</text>
  <!-- Waveform selector buttons -->
  <rect x="830" y="180" width="24" height="16" rx="2" fill="#c4b5fd" opacity="0.8"/>
  <rect x="862" y="180" width="24" height="16" rx="2" fill="#333"/>
  <rect x="894" y="180" width="24" height="16" rx="2" fill="#333"/>
  <rect x="926" y="180" width="24" height="16" rx="2" fill="#333"/>
  <text x="842" y="192" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#111">SIN</text>
  <text x="874" y="192" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#888">TRI</text>
  <text x="906" y="192" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#888">SAW</text>
  <text x="938" y="192" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#888">SQR</text>
  <circle cx="848" cy="270" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <circle cx="944" cy="270" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <text x="848" y="295" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#c4b5fd">SYNC</text>
  <text x="944" y="295" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#c4b5fd">OUT</text>
  <!-- MODULE 5: MIXER / VCA -->
  <text x="1152" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#ffd93d" font-weight="bold" letter-spacing="2">MIX VCA</text>
  <circle cx="1100" cy="100" r="20" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <text x="1100" y="135" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888">CH1</text>
  <circle cx="1152" cy="100" r="20" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <text x="1152" y="135" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888">CH2</text>
  <circle cx="1204" cy="100" r="20" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <text x="1204" y="135" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#888">CH3</text>
  <circle cx="1152" cy="200" r="28" fill="url(#knob-grad)" filter="url(#knob-shadow)"/>
  <line x1="1140" y1="180" x2="1146" y2="188" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  <text x="1152" y="240" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888">MASTER</text>
  <circle cx="1100" cy="280" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <circle cx="1152" cy="280" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <circle cx="1204" cy="280" r="10" fill="url(#jack-hole)" stroke="#444" stroke-width="2"/>
  <text x="1100" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#ffd93d">IN</text>
  <text x="1152" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#ffd93d">CV</text>
  <text x="1204" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#ffd93d">OUT</text>
  <!-- Patch cables (spanning lower half) -->
  <path d="M196,280 C196,400 315,400 315,280" stroke="#ff6b35" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M453,280 C453,450 580,450 580,270" stroke="#4ecdc4" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M700,270 C700,420 848,420 848,270" stroke="#a8e06c" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M944,270 C944,480 1100,480 1100,280" stroke="#c4b5fd" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M128,280 C128,520 640,540 640,270" stroke="#ffd93d" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Title -->
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" fill="#fff" font-weight="bold" letter-spacing="8">INFINITE CRAFT</text>
  <text x="640" y="615" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#888" letter-spacing="4">MODULAR SYNTHESIS SYSTEM</text>
</svg>