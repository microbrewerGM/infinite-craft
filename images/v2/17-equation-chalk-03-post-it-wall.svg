<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="sticky-shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <filter id="slight-rotate">
      <feOffset dx="0" dy="0"/>
    </filter>
  </defs>
  <!-- Cork board background -->
  <rect width="1280" height="640" fill="#b8956a"/>
  <rect width="1280" height="640" fill="#a0845e" opacity="0.3"/>
  <!-- Cork texture dots -->
  <g fill="#c4a070" opacity="0.4">
    <circle cx="50" cy="40" r="3"/><circle cx="150" cy="80" r="2"/><circle cx="300" cy="30" r="4"/>
    <circle cx="450" cy="90" r="2"/><circle cx="600" cy="50" r="3"/><circle cx="750" cy="70" r="2"/>
    <circle cx="900" cy="40" r="3"/><circle cx="1050" cy="85" r="2"/><circle cx="1200" cy="45" r="4"/>
    <circle cx="100" cy="200" r="2"/><circle cx="350" cy="350" r="3"/><circle cx="550" cy="500" r="2"/>
    <circle cx="800" cy="400" r="3"/><circle cx="1000" cy="300" r="2"/><circle cx="1150" cy="550" r="3"/>
    <circle cx="200" cy="600" r="2"/><circle cx="700" cy="580" r="3"/><circle cx="950" cy="150" r="2"/>
  </g>
  <!-- Title sticky note (large, centered top) -->
  <g transform="translate(440, 15) rotate(-1)">
    <rect width="400" height="100" fill="#ffd93d" rx="2" filter="url(#sticky-shadow)"/>
    <rect width="400" height="20" fill="#e8c42a" opacity="0.4"/>
    <text x="200" y="70" font-family="'Comic Sans MS', cursive" font-size="38" fill="#333" text-anchor="middle" font-weight="bold">INFINITE CRAFT</text>
  </g>
  <!-- Post-it 1 - Orange -->
  <g transform="translate(40, 140) rotate(-3)">
    <rect width="220" height="180" fill="#ff6b35" rx="2" filter="url(#sticky-shadow)"/>
    <rect width="220" height="18" fill="#e05a28" opacity="0.3"/>
    <text x="15" y="55" font-family="'Comic Sans MS', cursive" font-size="20" fill="#fff">Water + Fire</text>
    <text x="15" y="85" font-family="'Comic Sans MS', cursive" font-size="18" fill="#fff">= Steam!</text>
    <text x="110" y="140" font-family="'Comic Sans MS', cursive" font-size="50" fill="#fff" text-anchor="middle" opacity="0.3">&#9786;</text>
  </g>
  <!-- Post-it 2 - Teal -->
  <g transform="translate(290, 130) rotate(2)">
    <rect width="220" height="180" fill="#4ecdc4" rx="2" filter="url(#sticky-shadow)"/>
    <rect width="220" height="18" fill="#3bb8b0" opacity="0.3"/>
    <text x="15" y="55" font-family="'Comic Sans MS', cursive" font-size="20" fill="#fff">Earth + Wind</text>
    <text x="15" y="85" font-family="'Comic Sans MS', cursive" font-size="18" fill="#fff">= Dust</text>
    <text x="15" y="130" font-family="'Comic Sans MS', cursive" font-size="14" fill="#fff" opacity="0.7">confirmed!</text>
  </g>
  <!-- Post-it 3 - Purple -->
  <g transform="translate(540, 145) rotate(-1)">
    <rect width="220" height="180" fill="#c4b5fd" rx="2" filter="url(#sticky-shadow)"/>
    <rect width="220" height="18" fill="#a99de8" opacity="0.3"/>
    <text x="15" y="55" font-family="'Comic Sans MS', cursive" font-size="20" fill="#333">Fire + Earth</text>
    <text x="15" y="85" font-family="'Comic Sans MS', cursive" font-size="18" fill="#333">= Lava</text>
    <text x="160" y="150" font-family="'Comic Sans MS', cursive" font-size="40" fill="#ff6b35">&#9733;</text>
  </g>
  <!-- Post-it 4 - Yellow -->
  <g transform="translate(790, 135) rotate(3)">
    <rect width="220" height="180" fill="#ffd93d" rx="2" filter="url(#sticky-shadow)"/>
    <rect width="220" height="18" fill="#e8c42a" opacity="0.3"/>
    <text x="15" y="55" font-family="'Comic Sans MS', cursive" font-size="20" fill="#333">Lava + Water</text>
    <text x="15" y="85" font-family="'Comic Sans MS', cursive" font-size="18" fill="#333">= Stone</text>
    <text x="15" y="130" font-family="'Comic Sans MS', cursive" font-size="14" fill="#666">try with ice?</text>
  </g>
  <!-- Post-it 5 - Green -->
  <g transform="translate(1020, 140) rotate(-2)">
    <rect width="220" height="180" fill="#a8e06c" rx="2" filter="url(#sticky-shadow)"/>
    <rect width="220" height="18" fill="#96c85e" opacity="0.3"/>
    <text x="15" y="55" font-family="'Comic Sans MS', cursive" font-size="20" fill="#333">Dust + Water</text>
    <text x="15" y="85" font-family="'Comic Sans MS', cursive" font-size="18" fill="#333">= Clay</text>
    <text x="15" y="130" font-family="'Comic Sans MS', cursive" font-size="14" fill="#555">neat!</text>
  </g>
  <!-- Post-it 6 - Orange -->
  <g transform="translate(80, 370) rotate(1)">
    <rect width="220" height="180" fill="#ff6b35" rx="2" filter="url(#sticky-shadow)"/>
    <rect width="220" height="18" fill="#e05a28" opacity="0.3"/>
    <text x="15" y="55" font-family="'Comic Sans MS', cursive" font-size="20" fill="#fff">Clay + Fire</text>
    <text x="15" y="85" font-family="'Comic Sans MS', cursive" font-size="18" fill="#fff">= Brick</text>
  </g>
  <!-- Post-it 7 - Teal -->
  <g transform="translate(340, 380) rotate(-2)">
    <rect width="220" height="180" fill="#4ecdc4" rx="2" filter="url(#sticky-shadow)"/>
    <rect width="220" height="18" fill="#3bb8b0" opacity="0.3"/>
    <text x="15" y="55" font-family="'Comic Sans MS', cursive" font-size="20" fill="#fff">Stone + Fire</text>
    <text x="15" y="85" font-family="'Comic Sans MS', cursive" font-size="18" fill="#fff">= Metal</text>
    <text x="15" y="130" font-family="'Comic Sans MS', cursive" font-size="14" fill="#fff" opacity="0.7">IMPORTANT</text>
  </g>
  <!-- Post-it 8 - crossed out wrong -->
  <g transform="translate(600, 375) rotate(2)">
    <rect width="220" height="180" fill="#ffb3b3" rx="2" filter="url(#sticky-shadow)"/>
    <rect width="220" height="18" fill="#e89999" opacity="0.3"/>
    <text x="15" y="55" font-family="'Comic Sans MS', cursive" font-size="20" fill="#666" text-decoration="line-through">Wind + Wind</text>
    <text x="15" y="85" font-family="'Comic Sans MS', cursive" font-size="18" fill="#666" text-decoration="line-through">= Tornado??</text>
    <text x="15" y="130" font-family="'Comic Sans MS', cursive" font-size="16" fill="#c00">WRONG!</text>
  </g>
  <!-- Post-it 9 - Purple -->
  <g transform="translate(850, 365) rotate(-1)">
    <rect width="220" height="180" fill="#c4b5fd" rx="2" filter="url(#sticky-shadow)"/>
    <rect width="220" height="18" fill="#a99de8" opacity="0.3"/>
    <text x="15" y="55" font-family="'Comic Sans MS', cursive" font-size="20" fill="#333">Steam + Earth</text>
    <text x="15" y="85" font-family="'Comic Sans MS', cursive" font-size="18" fill="#333">= Geyser</text>
    <text x="110" y="150" font-family="'Comic Sans MS', cursive" font-size="12" fill="#555" text-anchor="middle">day 3 discovery</text>
  </g>
  <!-- Thumbtacks -->
  <g fill="#cc3333">
    <circle cx="550" cy="30" r="6"/><circle cx="150" cy="155" r="5"/>
    <circle cx="400" cy="145" r="5"/><circle cx="650" cy="160" r="5"/>
    <circle cx="900" cy="150" r="5"/><circle cx="1130" cy="155" r="5"/>
    <circle cx="190" cy="385" r="5"/><circle cx="450" cy="395" r="5"/>
    <circle cx="710" cy="390" r="5"/><circle cx="960" cy="380" r="5"/>
  </g>
  <!-- String connecting some notes -->
  <path d="M155 160 Q220 330 195 385" stroke="#c9c4a1" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M650 320 Q680 350 715 390" stroke="#c9c4a1" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
</svg>