<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="q-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="q-soft">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="cryo-center" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a1a3a"/>
      <stop offset="50%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <linearGradient id="gold-connector" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4a050"/>
      <stop offset="50%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#c4a050"/>
    </linearGradient>
  </defs>
  <!-- Deep space black background -->
  <rect width="1280" height="640" fill="#020208"/>
  <!-- Quantum interference pattern background -->
  <g opacity="0.05">
    <circle cx="640" cy="320" r="300" fill="none" stroke="#c4b5fd" stroke-width="1"/>
    <circle cx="640" cy="320" r="260" fill="none" stroke="#c4b5fd" stroke-width="0.8"/>
    <circle cx="640" cy="320" r="220" fill="none" stroke="#c4b5fd" stroke-width="0.6"/>
    <circle cx="640" cy="320" r="180" fill="none" stroke="#c4b5fd" stroke-width="0.5"/>
    <circle cx="640" cy="320" r="140" fill="none" stroke="#c4b5fd" stroke-width="0.4"/>
    <circle cx="640" cy="320" r="100" fill="none" stroke="#c4b5fd" stroke-width="0.3"/>
  </g>
  <!-- Dilution refrigerator stages (concentric rings) -->
  <!-- Outer stage - 300K -->
  <circle cx="640" cy="320" r="290" fill="none" stroke="#333" stroke-width="2"/>
  <text x="640" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#444">300K STAGE</text>
  <!-- 40K stage -->
  <circle cx="640" cy="320" r="240" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="900" y="320" font-family="'Courier New', monospace" font-size="9" fill="#555">40K</text>
  <!-- 4K stage -->
  <circle cx="640" cy="320" r="190" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="850" y="320" font-family="'Courier New', monospace" font-size="9" fill="#666">4K</text>
  <!-- Still plate -->
  <circle cx="640" cy="320" r="150" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.3"/>
  <text x="808" y="320" font-family="'Courier New', monospace" font-size="9" fill="#4ecdc4" opacity="0.5">800mK</text>
  <!-- Mixing chamber plate -->
  <circle cx="640" cy="320" r="110" fill="url(#cryo-center)" stroke="#c4b5fd" stroke-width="1" opacity="0.5"/>
  <text x="770" y="320" font-family="'Courier New', monospace" font-size="9" fill="#c4b5fd" opacity="0.6">15mK</text>
  <!-- Quantum processor chip at center -->
  <rect x="590" y="270" width="100" height="100" rx="3" fill="#0a0a20" stroke="#ffd93d" stroke-width="1.5" opacity="0.8"/>
  <!-- Qubit grid (4x4) -->
  <g filter="url(#q-glow)">
    <!-- Row 1 -->
    <circle cx="615" cy="295" r="6" fill="#c4b5fd" opacity="0.9"/>
    <circle cx="640" cy="295" r="6" fill="#ff6b35" opacity="0.9"/>
    <circle cx="665" cy="295" r="6" fill="#c4b5fd" opacity="0.9"/>
    <!-- Row 2 -->
    <circle cx="615" cy="320" r="6" fill="#4ecdc4" opacity="0.9"/>
    <circle cx="640" cy="320" r="6" fill="#ffd93d" opacity="0.9"/>
    <circle cx="665" cy="320" r="6" fill="#4ecdc4" opacity="0.9"/>
    <!-- Row 3 -->
    <circle cx="615" cy="345" r="6" fill="#a8e06c" opacity="0.9"/>
    <circle cx="640" cy="345" r="6" fill="#ff6b35" opacity="0.9"/>
    <circle cx="665" cy="345" r="6" fill="#a8e06c" opacity="0.9"/>
  </g>
  <!-- Qubit coupling lines -->
  <g stroke="#c4b5fd" stroke-width="1" opacity="0.4">
    <!-- Horizontal couplings -->
    <line x1="621" y1="295" x2="634" y2="295"/><line x1="646" y1="295" x2="659" y2="295"/>
    <line x1="621" y1="320" x2="634" y2="320"/><line x1="646" y1="320" x2="659" y2="320"/>
    <line x1="621" y1="345" x2="634" y2="345"/><line x1="646" y1="345" x2="659" y2="345"/>
    <!-- Vertical couplings -->
    <line x1="615" y1="301" x2="615" y2="314"/><line x1="615" y1="326" x2="615" y2="339"/>
    <line x1="640" y1="301" x2="640" y2="314"/><line x1="640" y1="326" x2="640" y2="339"/>
    <line x1="665" y1="301" x2="665" y2="314"/><line x1="665" y1="326" x2="665" y2="339"/>
  </g>
  <!-- Microwave control lines radiating outward -->
  <g stroke="url(#gold-connector)" stroke-width="1" opacity="0.5">
    <!-- From top qubits upward -->
    <line x1="615" y1="289" x2="580" y2="180"/>
    <line x1="640" y1="289" x2="640" y2="170"/>
    <line x1="665" y1="289" x2="700" y2="180"/>
    <!-- From bottom qubits downward -->
    <line x1="615" y1="351" x2="580" y2="460"/>
    <line x1="640" y1="351" x2="640" y2="470"/>
    <line x1="665" y1="351" x2="700" y2="460"/>
    <!-- From left qubits -->
    <line x1="609" y1="295" x2="500" y2="270"/>
    <line x1="609" y1="320" x2="490" y2="320"/>
    <line x1="609" y1="345" x2="500" y2="370"/>
    <!-- From right qubits -->
    <line x1="671" y1="295" x2="780" y2="270"/>
    <line x1="671" y1="320" x2="790" y2="320"/>
    <line x1="671" y1="345" x2="780" y2="370"/>
  </g>
  <!-- Readout resonators (wavy lines) -->
  <path d="M580,180 C560,170 540,175 520,165 S480,160 460,155" stroke="#4ecdc4" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M640,170 C640,150 635,140 640,120 S635,100 640,80" stroke="#4ecdc4" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M700,180 C720,170 740,175 760,165 S800,160 820,155" stroke="#4ecdc4" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M580,460 C560,470 540,465 520,475 S480,480 460,485" stroke="#ff6b35" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M640,470 C640,490 635,500 640,520 S635,540 640,560" stroke="#ff6b35" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M700,460 C720,470 740,465 760,475 S800,480 820,485" stroke="#ff6b35" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Quantum state visualization (Bloch sphere outlines) -->
  <g transform="translate(160,180)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="#c4b5fd" stroke-width="0.5"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#c4b5fd" stroke-width="0.5"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#c4b5fd" stroke-width="0.5"/>
    <!-- State vector -->
    <line x1="0" y1="0" x2="30" y2="-45" stroke="#ff6b35" stroke-width="2" filter="url(#q-glow)"/>
    <circle cx="30" cy="-45" r="3" fill="#ff6b35" filter="url(#q-glow)"/>
    <text x="0" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#c4b5fd">|FIRE&#x27E9;</text>
    <text x="0" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#666">q0: 0.71|0&#x27E9;+0.71|1&#x27E9;</text>
  </g>
  <g transform="translate(1120,180)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="#c4b5fd" stroke-width="0.5"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#c4b5fd" stroke-width="0.5"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#c4b5fd" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-40" y2="-35" stroke="#4ecdc4" stroke-width="2" filter="url(#q-glow)"/>
    <circle cx="-40" cy="-35" r="3" fill="#4ecdc4" filter="url(#q-glow)"/>
    <text x="0" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#c4b5fd">|WATER&#x27E9;</text>
    <text x="0" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#666">q1: 0.50|0&#x27E9;+0.87|1&#x27E9;</text>
  </g>
  <g transform="translate(160,460)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="#c4b5fd" stroke-width="0.5"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#c4b5fd" stroke-width="0.5"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#c4b5fd" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="50" y2="20" stroke="#a8e06c" stroke-width="2" filter="url(#q-glow)"/>
    <circle cx="50" cy="20" r="3" fill="#a8e06c" filter="url(#q-glow)"/>
    <text x="0" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#c4b5fd">|EARTH&#x27E9;</text>
    <text x="0" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#666">q2: 0.87|0&#x27E9;+0.50|1&#x27E9;</text>
  </g>
  <g transform="translate(1120,460)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="#c4b5fd" stroke-width="0.5"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#c4b5fd" stroke-width="0.5"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#c4b5fd" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-20" y2="-55" stroke="#c4b5fd" stroke-width="2" filter="url(#q-glow)"/>
    <circle cx="-20" cy="-55" r="3" fill="#c4b5fd" filter="url(#q-glow)"/>
    <text x="0" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#c4b5fd">|WIND&#x27E9;</text>
    <text x="0" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#666">q3: 0.95|0&#x27E9;+0.31|1&#x27E9;</text>
  </g>
  <!-- Chip label -->
  <text x="640" y="386" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#ffd93d" opacity="0.6">9-QUBIT TRANSMON</text>
  <!-- Title -->
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" fill="#fff" font-weight="bold" letter-spacing="8" filter="url(#q-soft)">INFINITE CRAFT</text>
  <text x="640" y="620" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#c4b5fd" letter-spacing="4" opacity="0.6">QUANTUM COMBINATION PROCESSOR</text>
</svg>