<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="cave-rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#8b7355" surfaceScale="3">
        <feDistantLight azimuth="135" elevation="40"/>
      </feDiffuseLighting>
    </filter>
    <filter id="paint-rough">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
    <filter id="ochre-glow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <!-- Cave wall -->
  <rect width="1280" height="640" fill="#6b5b45"/>
  <rect width="1280" height="640" filter="url(#cave-rough)" opacity="0.6"/>
  <!-- Dark crevices -->
  <path d="M0 200 Q200 180 400 220 Q600 260 800 200 Q1000 160 1280 210" fill="none" stroke="#4a3f30" stroke-width="8" opacity="0.3"/>
  <path d="M0 450 Q300 470 600 430 Q900 400 1280 460" fill="none" stroke="#4a3f30" stroke-width="6" opacity="0.25"/>
  <!-- Title in cave paint style -->
  <text x="640" y="90" font-family="'Papyrus', fantasy" font-size="58" fill="#d4a06a" text-anchor="middle" filter="url(#paint-rough)" opacity="0.9">INFINITE CRAFT</text>
  <!-- Hand prints -->
  <g fill="#8b3a3a" opacity="0.4" filter="url(#paint-rough)">
    <ellipse cx="80" cy="150" rx="20" ry="28"/>
    <ellipse cx="68" cy="118" rx="7" ry="16" transform="rotate(-15 68 118)"/>
    <ellipse cx="82" cy="112" rx="7" ry="18" transform="rotate(-5 82 112)"/>
    <ellipse cx="96" cy="115" rx="7" ry="17" transform="rotate(5 96 115)"/>
    <ellipse cx="108" cy="122" rx="6" ry="15" transform="rotate(15 108 122)"/>
  </g>
  <g fill="#8b3a3a" opacity="0.35" filter="url(#paint-rough)">
    <ellipse cx="1180" cy="520" rx="22" ry="30"/>
    <ellipse cx="1168" cy="486" rx="7" ry="17" transform="rotate(-15 1168 486)"/>
    <ellipse cx="1182" cy="480" rx="7" ry="19" transform="rotate(-5 1182 480)"/>
    <ellipse cx="1196" cy="483" rx="7" ry="18" transform="rotate(5 1196 483)"/>
    <ellipse cx="1208" cy="490" rx="6" ry="16" transform="rotate(15 1208 490)"/>
  </g>
  <!-- Cave painting style: Water symbol (wavy lines) + Fire symbol (flame) = Steam (spirals) -->
  <g filter="url(#paint-rough)">
    <!-- Water symbol -->
    <path d="M120 220 Q145 200 170 220 Q195 240 220 220 Q245 200 270 220" stroke="#d4a06a" stroke-width="5" fill="none"/>
    <path d="M130 245 Q155 225 180 245 Q205 265 230 245 Q255 225 280 245" stroke="#d4a06a" stroke-width="4" fill="none"/>
    <!-- Plus -->
    <line x1="320" y1="230" x2="370" y2="230" stroke="#c9c4a1" stroke-width="5"/>
    <line x1="345" y1="205" x2="345" y2="255" stroke="#c9c4a1" stroke-width="5"/>
    <!-- Fire symbol -->
    <path d="M420 260 Q430 220 450 200 Q460 230 470 210 Q490 180 480 240 Q475 260 450 270 Q425 265 420 260Z" fill="#d4a06a" stroke="#b8863a" stroke-width="2"/>
    <!-- Equals -->
    <line x1="530" y1="220" x2="580" y2="220" stroke="#c9c4a1" stroke-width="5"/>
    <line x1="530" y1="245" x2="580" y2="245" stroke="#c9c4a1" stroke-width="5"/>
    <!-- Steam spirals -->
    <path d="M630 250 Q640 230 660 235 Q680 240 670 220 Q660 200 680 195" stroke="#d4a06a" stroke-width="4" fill="none"/>
    <path d="M670 260 Q680 240 700 245 Q720 250 710 230 Q700 210 720 205" stroke="#d4a06a" stroke-width="3.5" fill="none"/>
  </g>
  <!-- Earth symbol + Wind = Dust -->
  <g filter="url(#paint-rough)">
    <!-- Earth (circle with cross) -->
    <circle cx="180" cy="380" r="35" fill="none" stroke="#d4a06a" stroke-width="4"/>
    <line x1="180" y1="345" x2="180" y2="415" stroke="#d4a06a" stroke-width="3"/>
    <line x1="145" y1="380" x2="215" y2="380" stroke="#d4a06a" stroke-width="3"/>
    <!-- Plus -->
    <line x1="270" y1="380" x2="320" y2="380" stroke="#c9c4a1" stroke-width="5"/>
    <line x1="295" y1="355" x2="295" y2="405" stroke="#c9c4a1" stroke-width="5"/>
    <!-- Wind (curved lines) -->
    <path d="M370 370 Q400 350 430 370 Q450 385 470 365" stroke="#d4a06a" stroke-width="4" fill="none"/>
    <path d="M375 395 Q405 375 435 395 Q455 410 475 390" stroke="#d4a06a" stroke-width="3" fill="none"/>
    <!-- Equals -->
    <line x1="520" y1="370" x2="570" y2="370" stroke="#c9c4a1" stroke-width="5"/>
    <line x1="520" y1="395" x2="570" y2="395" stroke="#c9c4a1" stroke-width="5"/>
    <!-- Dust (dots scatter) -->
    <circle cx="630" cy="370" r="4" fill="#d4a06a"/><circle cx="650" cy="385" r="3" fill="#d4a06a"/>
    <circle cx="670" cy="365" r="5" fill="#d4a06a"/><circle cx="690" cy="390" r="3" fill="#d4a06a"/>
    <circle cx="710" cy="375" r="4" fill="#d4a06a"/><circle cx="660" cy="350" r="3" fill="#d4a06a"/>
  </g>
  <!-- Stick figure hunting scene (right side, decorative) -->
  <g filter="url(#paint-rough)" opacity="0.6">
    <!-- Stick figures with elements -->
    <line x1="850" y1="200" x2="850" y2="280" stroke="#8b3a3a" stroke-width="4"/>
    <circle cx="850" cy="185" r="15" fill="none" stroke="#8b3a3a" stroke-width="3"/>
    <line x1="820" y1="230" x2="880" y2="230" stroke="#8b3a3a" stroke-width="3"/>
    <line x1="850" y1="280" x2="825" y2="320" stroke="#8b3a3a" stroke-width="3"/>
    <line x1="850" y1="280" x2="875" y2="320" stroke="#8b3a3a" stroke-width="3"/>
    <!-- Holding fire -->
    <path d="M880 225 Q888 210 895 218 Q900 205 895 228" fill="#d4a06a" stroke="#b8863a" stroke-width="1.5"/>
  </g>
  <!-- Animal figures -->
  <g filter="url(#paint-rough)" opacity="0.5">
    <path d="M1000 350 Q1030 330 1060 340 L1080 335 L1060 340 L1070 370 L1060 365 L1050 375 L1040 365 L1030 375 L1020 365 L1010 370 Q1000 355 1000 350Z" fill="#8b3a3a"/>
    <path d="M1100 360 Q1130 340 1160 350 L1180 345 L1160 350 L1170 380 L1160 375 L1150 385 L1140 375 L1130 385 L1120 375 L1110 380 Q1100 365 1100 360Z" fill="#8b3a3a"/>
  </g>
  <!-- Torch glow (bottom corners) -->
  <radialGradient id="torch1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#d4a06a" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#d4a06a" stop-opacity="0"/>
  </radialGradient>
  <circle cx="100" cy="600" r="120" fill="url(#torch1)"/>
  <circle cx="1180" cy="600" r="120" fill="url(#torch1)"/>
</svg>