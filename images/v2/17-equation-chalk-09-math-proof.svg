<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <!-- Cream paper -->
  <rect width="1280" height="640" fill="#faf8f0"/>
  <!-- Title block -->
  <text x="640" y="55" font-family="'Times New Roman', serif" font-size="32" fill="#222" text-anchor="middle" font-weight="bold">INFINITE CRAFT</text>
  <text x="640" y="82" font-family="'Times New Roman', serif" font-size="16" fill="#555" text-anchor="middle" font-style="italic">On the Completeness of Elemental Combination Spaces</text>
  <text x="640" y="105" font-family="'Times New Roman', serif" font-size="13" fill="#888" text-anchor="middle">Journal of Combinatorial Element Theory, Vol. XLVII, No. 3, pp. 247-263</text>
  <line x1="200" y1="115" x2="1080" y2="115" stroke="#333" stroke-width="0.5"/>
  <!-- Theorem and proof content -->
  <g font-family="'Times New Roman', serif" fill="#222">
    <!-- Abstract -->
    <text x="140" y="145" font-size="14" font-weight="bold">Abstract.</text>
    <text x="210" y="145" font-size="14" font-style="italic">We present a formal framework for element combination, proving that the craft space</text>
    <text x="140" y="163" font-size="14" font-style="italic">is countably infinite under the standard combination operator.</text>
    <!-- Definition -->
    <text x="140" y="200" font-size="16" font-weight="bold">Definition 1.</text>
    <text x="268" y="200" font-size="16">Let E = {Water, Fire, Earth, Wind} be the set of base elements.</text>
    <text x="140" y="222" font-size="16">Define the combination operator</text>
    <text x="425" y="222" font-size="20" font-style="italic" fill="#4ecdc4"> + : E x E </text>
    <text x="555" y="222" font-size="20" fill="#222">&#8594;</text>
    <text x="580" y="222" font-size="20" font-style="italic" fill="#4ecdc4"> E'</text>
    <!-- Axioms -->
    <text x="140" y="260" font-size="16" font-weight="bold">Axiom 1</text>
    <text x="220" y="260" font-size="16"> (Closure). For all a, b </text>
    <text x="410" y="260" font-size="18">&#8712;</text>
    <text x="430" y="260" font-size="16"> E, the result a + b </text>
    <text x="620" y="260" font-size="18">&#8712;</text>
    <text x="640" y="260" font-size="16"> E' is well-defined.</text>
    <!-- Theorem -->
    <rect x="130" y="285" width="1020" height="65" fill="#f0f4ff" stroke="#4ecdc4" stroke-width="1" rx="3"/>
    <text x="150" y="310" font-size="16" font-weight="bold">Theorem 1</text>
    <text x="260" y="310" font-size="16"> (Fundamental Theorem of Crafting).</text>
    <text x="150" y="335" font-size="16" font-style="italic">Water + Fire = Steam,   Earth + Wind = Dust,   Fire + Earth = Lava</text>
    <!-- Proof -->
    <text x="140" y="380" font-size="16" font-weight="bold" font-style="italic">Proof.</text>
    <text x="200" y="380" font-size="16">We proceed by direct construction.</text>
    <text x="160" y="410" font-size="16">Step 1.  Consider f(Water, Fire). By Axiom 1, </text>
    <text x="580" y="410" font-size="18" font-style="italic">&#8707;</text>
    <text x="598" y="410" font-size="16">! r </text>
    <text x="630" y="410" font-size="18">&#8712;</text>
    <text x="650" y="410" font-size="16"> E' such that f(W, F) = r.</text>
    <text x="160" y="435" font-size="16">Step 2.  Empirically, r = Steam. By induction on |E'|,</text>
    <text x="160" y="460" font-size="16">         the result extends to all subsequent combinations.</text>
    <!-- Corollary -->
    <text x="140" y="500" font-size="16" font-weight="bold">Corollary 1.1.</text>
    <text x="285" y="500" font-size="16"> |E'| = </text>
    <text x="345" y="500" font-size="20" fill="#ff6b35">&#8734;</text>
    <text x="370" y="500" font-size="16">  (the craft space is infinite).</text>
    <!-- QED box -->
    <rect x="1110" y="490" width="14" height="14" fill="#222"/>
    <!-- Lemma -->
    <text x="140" y="540" font-size="16" font-weight="bold">Lemma 2.</text>
    <text x="240" y="540" font-size="16"> Stone + Fire &#8594; Metal.  Clay + Fire &#8594; Brick.  Dust + Water &#8594; Clay.</text>
    <text x="140" y="565" font-size="14" font-style="italic" fill="#888">The proof is left as an exercise to the reader.</text>
  </g>
  <!-- Page footer -->
  <line x1="200" y1="590" x2="1080" y2="590" stroke="#ccc" stroke-width="0.5"/>
  <text x="640" y="615" font-family="'Times New Roman', serif" font-size="13" fill="#888" text-anchor="middle">247</text>
  <!-- Margin annotation -->
  <text x="1150" y="310" font-family="'Segoe Print', cursive" font-size="14" fill="#ff6b35" transform="rotate(5 1150 310)">beautiful!</text>
</svg>