<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="vine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8e06c"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
    <filter id="flowerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="leafShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- Subtle radial background -->
  <circle cx="640" cy="300" r="350" fill="#0a1a0a" opacity="0.3"/>
  <!-- Main vine/infinity path -->
  <path d="M270,300 C270,185 395,148 475,205 C530,245 565,282 640,282 C715,282 750,245 805,205 C885,148 1010,185 1010,300 C1010,415 885,452 805,395 C750,355 715,318 640,318 C565,318 530,355 475,395 C395,452 270,415 270,300Z" fill="none" stroke="url(#vine)" stroke-width="6" opacity="0.6"/>
  <!-- Second vine strand intertwined -->
  <path d="M275,305 C275,190 398,152 478,210 C532,248 568,286 640,286 C712,286 748,248 802,210 C882,152 1005,190 1005,305 C1005,418 882,456 802,398 C748,358 712,318 640,318 C568,318 532,358 478,398 C398,456 275,418 275,305Z" fill="none" stroke="#a8e06c" stroke-width="3" opacity="0.3" stroke-dasharray="8,12"/>
  <!-- Leaves along the vine -->
  <g filter="url(#leafShadow)" opacity="0.7">
    <!-- Leaf shapes -->
    <path d="M310,250 C320,235 335,235 335,250 C335,265 320,265 310,250Z" fill="#a8e06c" opacity="0.6"/>
    <path d="M375,200 C388,188 402,190 400,205 C398,220 384,218 375,200Z" fill="#4ecdc4" opacity="0.5"/>
    <path d="M500,240 C490,225 492,210 508,215 C520,220 518,235 500,240Z" fill="#a8e06c" opacity="0.6"/>
    <path d="M575,268 C565,255 568,240 582,245 C595,250 590,265 575,268Z" fill="#a8e06c" opacity="0.5"/>
    <path d="M705,268 C715,255 712,240 698,245 C685,250 690,265 705,268Z" fill="#4ecdc4" opacity="0.5"/>
    <path d="M780,240 C790,225 788,210 772,215 C760,220 762,235 780,240Z" fill="#a8e06c" opacity="0.6"/>
    <path d="M905,200 C892,188 878,190 880,205 C882,220 896,218 905,200Z" fill="#4ecdc4" opacity="0.5"/>
    <path d="M970,250 C960,235 945,235 945,250 C945,265 960,265 970,250Z" fill="#a8e06c" opacity="0.6"/>
    <!-- Bottom leaves -->
    <path d="M310,350 C320,365 335,365 335,350 C335,335 320,335 310,350Z" fill="#a8e06c" opacity="0.5"/>
    <path d="M420,410 C430,425 445,422 442,408 C440,395 425,398 420,410Z" fill="#4ecdc4" opacity="0.5"/>
    <path d="M560,345 C550,358 552,372 565,368 C578,364 575,350 560,345Z" fill="#a8e06c" opacity="0.55"/>
    <path d="M720,345 C730,358 728,372 715,368 C702,364 705,350 720,345Z" fill="#4ecdc4" opacity="0.55"/>
    <path d="M860,410 C850,425 835,422 838,408 C840,395 855,398 860,410Z" fill="#a8e06c" opacity="0.5"/>
    <path d="M970,350 C960,365 945,365 945,350 C945,335 960,335 970,350Z" fill="#4ecdc4" opacity="0.5"/>
  </g>
  <!-- Flowers -->
  <g filter="url(#flowerGlow)">
    <!-- Flower 1 - orange rose at left -->
    <circle cx="290" cy="295" r="12" fill="#ff6b35" opacity="0.8"/>
    <circle cx="290" cy="295" r="8" fill="#ffd93d" opacity="0.6"/>
    <circle cx="290" cy="295" r="4" fill="#fff" opacity="0.5"/>
    <circle cx="280" cy="288" r="6" fill="#ff6b35" opacity="0.5"/>
    <circle cx="300" cy="288" r="6" fill="#ff6b35" opacity="0.5"/>
    <circle cx="282" cy="302" r="5" fill="#ff6b35" opacity="0.4"/>
    <circle cx="298" cy="302" r="5" fill="#ff6b35" opacity="0.4"/>
    <!-- Flower 2 - purple at top-left -->
    <circle cx="420" cy="192" r="10" fill="#c4b5fd" opacity="0.8"/>
    <circle cx="420" cy="192" r="6" fill="#fff" opacity="0.4"/>
    <circle cx="412" cy="186" r="5" fill="#c4b5fd" opacity="0.5"/>
    <circle cx="428" cy="186" r="5" fill="#c4b5fd" opacity="0.5"/>
    <circle cx="414" cy="198" r="4.5" fill="#c4b5fd" opacity="0.4"/>
    <circle cx="426" cy="198" r="4.5" fill="#c4b5fd" opacity="0.4"/>
    <!-- Flower 3 - yellow at center top -->
    <circle cx="640" cy="278" r="10" fill="#ffd93d" opacity="0.8"/>
    <circle cx="640" cy="278" r="6" fill="#fff" opacity="0.5"/>
    <circle cx="632" cy="272" r="5" fill="#ffd93d" opacity="0.5"/>
    <circle cx="648" cy="272" r="5" fill="#ffd93d" opacity="0.5"/>
    <circle cx="634" cy="284" r="4.5" fill="#ffd93d" opacity="0.4"/>
    <circle cx="646" cy="284" r="4.5" fill="#ffd93d" opacity="0.4"/>
    <!-- Flower 4 - teal at top-right -->
    <circle cx="860" cy="192" r="10" fill="#4ecdc4" opacity="0.8"/>
    <circle cx="860" cy="192" r="6" fill="#fff" opacity="0.4"/>
    <circle cx="852" cy="186" r="5" fill="#4ecdc4" opacity="0.5"/>
    <circle cx="868" cy="186" r="5" fill="#4ecdc4" opacity="0.5"/>
    <!-- Flower 5 - orange at right -->
    <circle cx="990" cy="295" r="12" fill="#ff6b35" opacity="0.8"/>
    <circle cx="990" cy="295" r="8" fill="#ffd93d" opacity="0.6"/>
    <circle cx="990" cy="295" r="4" fill="#fff" opacity="0.5"/>
    <circle cx="980" cy="288" r="6" fill="#ff6b35" opacity="0.5"/>
    <circle cx="1000" cy="288" r="6" fill="#ff6b35" opacity="0.5"/>
    <!-- Flower 6 - purple at bottom -->
    <circle cx="640" cy="322" r="9" fill="#c4b5fd" opacity="0.7"/>
    <circle cx="640" cy="322" r="5" fill="#fff" opacity="0.4"/>
    <circle cx="634" cy="316" r="4.5" fill="#c4b5fd" opacity="0.4"/>
    <circle cx="646" cy="316" r="4.5" fill="#c4b5fd" opacity="0.4"/>
    <!-- Small buds -->
    <circle cx="350" cy="215" r="4" fill="#ff6b35" opacity="0.5"/>
    <circle cx="530" cy="258" r="4" fill="#a8e06c" opacity="0.5"/>
    <circle cx="750" cy="258" r="4" fill="#ffd93d" opacity="0.5"/>
    <circle cx="930" cy="215" r="4" fill="#c4b5fd" opacity="0.5"/>
    <circle cx="390" cy="415" r="3.5" fill="#ffd93d" opacity="0.4"/>
    <circle cx="500" cy="380" r="3.5" fill="#ff6b35" opacity="0.4"/>
    <circle cx="780" cy="380" r="3.5" fill="#4ecdc4" opacity="0.4"/>
    <circle cx="890" cy="415" r="3.5" fill="#a8e06c" opacity="0.4"/>
  </g>
  <!-- Floating petals -->
  <g opacity="0.3">
    <ellipse cx="200" cy="180" rx="5" ry="3" fill="#ff6b35" transform="rotate(30 200 180)"/>
    <ellipse cx="450" cy="130" rx="4" ry="2.5" fill="#c4b5fd" transform="rotate(-20 450 130)"/>
    <ellipse cx="830" cy="130" rx="4" ry="2.5" fill="#ffd93d" transform="rotate(15 830 130)"/>
    <ellipse cx="1080" cy="180" rx="5" ry="3" fill="#4ecdc4" transform="rotate(-30 1080 180)"/>
    <ellipse cx="350" cy="470" rx="4" ry="2.5" fill="#a8e06c" transform="rotate(25 350 470)"/>
    <ellipse cx="930" cy="470" rx="4" ry="2.5" fill="#ff6b35" transform="rotate(-25 930 470)"/>
  </g>
  <!-- Title -->
  <text x="640" y="558" text-anchor="middle" font-family="'Georgia', serif" font-size="40" font-weight="normal" fill="#ffffff" letter-spacing="12" opacity="0.85" font-style="italic">INFINITE CRAFT</text>
</svg>