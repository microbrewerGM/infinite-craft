<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a0a2a"/>
    </linearGradient>
    <filter id="elec8">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bigGlow8">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="medGlow8">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg8)"/>
  <!-- Background electric field -->
  <ellipse cx="640" cy="80" rx="300" ry="60" fill="#c4b5fd" opacity="0.08" filter="url(#bigGlow8)"/>
  <!-- Main lightning bolt from top center -->
  <g fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" filter="url(#elec8)">
    <!-- Central trunk -->
    <path d="M640,20 L635,60 L650,100 L630,150 L655,200 L625,260 L660,320 L620,380 L650,440 L615,500 L645,560 L630,620" stroke-width="5"/>
    <!-- Major left branches -->
    <path d="M635,60 L580,90 L540,80 L490,100 L440,85 L390,110" stroke-width="3.5"/>
    <path d="M630,150 L560,180 L500,160 L440,190 L380,170 L310,200" stroke-width="3"/>
    <path d="M625,260 L550,290 L480,270 L410,300 L340,280 L260,310" stroke-width="3"/>
    <path d="M620,380 L540,400 L470,385 L400,410 L330,390 L250,420" stroke-width="2.5"/>
    <path d="M615,500 L550,520 L490,505 L420,530 L360,510" stroke-width="2"/>
    <!-- Major right branches -->
    <path d="M650,100 L720,80 L780,100 L840,85 L900,110" stroke-width="3.5"/>
    <path d="M655,200 L730,180 L800,200 L870,185 L940,210" stroke-width="3"/>
    <path d="M660,320 L740,300 L810,320 L880,305 L960,330" stroke-width="3"/>
    <path d="M650,440 L730,420 L800,440 L870,425 L950,450" stroke-width="2.5"/>
    <path d="M645,560 L720,540 L790,560 L860,545" stroke-width="2"/>
  </g>
  <!-- Sub-branches -->
  <g fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <path d="M390,110 L350,100 L310,115"/><path d="M390,110 L370,140 L340,150"/>
    <path d="M310,200 L270,190 L230,210"/><path d="M310,200 L290,230 L260,240"/>
    <path d="M260,310 L220,300 L180,320"/><path d="M260,310 L240,340 L210,350"/>
    <path d="M250,420 L210,410 L170,430"/><path d="M250,420 L230,450 L200,460"/>
    <path d="M900,110 L940,100 L980,115"/><path d="M900,110 L920,140 L950,150"/>
    <path d="M940,210 L980,200 L1020,220"/><path d="M940,210 L960,240 L990,250"/>
    <path d="M960,330 L1000,320 L1040,340"/><path d="M960,330 L980,360 L1010,370"/>
    <path d="M950,450 L990,440 L1030,460"/><path d="M950,450 L970,480 L1000,490"/>
    <!-- Tiny forks -->
    <path d="M540,80 L520,60 L500,65"/><path d="M500,160 L480,140 L460,145"/>
    <path d="M480,270 L460,250 L440,255"/><path d="M470,385 L450,365 L430,370"/>
    <path d="M780,100 L800,80 L820,85"/><path d="M800,200 L820,180 L840,185"/>
    <path d="M810,320 L830,300 L850,305"/><path d="M800,440 L820,420 L840,425"/>
  </g>
  <!-- Micro filaments -->
  <g fill="none" stroke="#ddd6fe" stroke-width="0.7" opacity="0.35">
    <path d="M310,115 L280,105 L250,115"/><path d="M230,210 L200,200 L170,215"/>
    <path d="M180,320 L150,310 L120,325"/><path d="M170,430 L140,420 L110,435"/>
    <path d="M980,115 L1010,105 L1040,115"/><path d="M1020,220 L1050,210 L1080,225"/>
    <path d="M1040,340 L1070,330 L1100,345"/><path d="M1030,460 L1060,450 L1090,465"/>
    <path d="M360,510 L330,520 L300,510"/><path d="M860,545 L890,555 L920,545"/>
  </g>
  <!-- Bright hotspots at branch points -->
  <g fill="#ffd93d" opacity="0.6">
    <circle cx="640" cy="20" r="6" filter="url(#medGlow8)"/>
    <circle cx="635" cy="60" r="3"/><circle cx="650" cy="100" r="3"/>
    <circle cx="630" cy="150" r="3"/><circle cx="655" cy="200" r="3"/>
    <circle cx="625" cy="260" r="3"/><circle cx="660" cy="320" r="3"/>
    <circle cx="620" cy="380" r="3"/><circle cx="650" cy="440" r="3"/>
  </g>
  <!-- Title -->
  <text x="640" y="310" font-family="'Courier New', monospace" font-size="68" font-weight="bold" fill="#ffd93d" text-anchor="middle" dominant-baseline="central" filter="url(#elec8)" opacity="0.95">INFINITE CRAFT</text>
  <text x="640" y="360" font-family="'Courier New', monospace" font-size="16" fill="#c4b5fd" text-anchor="middle" letter-spacing="10" opacity="0.6">LICHTENBERG FIGURE</text>
</svg>