<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="ocean1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="ocean2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="50%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="waveGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spray">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <!-- Deep ocean background -->
  <ellipse cx="640" cy="300" rx="500" ry="200" fill="#0a1a2a" opacity="0.5"/>
  <!-- Main infinity wave path - outer -->
  <path d="M260,300 C260,180 390,140 475,205 C535,248 568,285 640,285 C712,285 745,248 805,205 C890,140 1020,180 1020,300 C1020,420 890,460 805,395 C745,352 712,315 640,315 C568,315 535,352 475,395 C390,460 260,420 260,300Z" fill="none" stroke="#4ecdc4" stroke-width="20" opacity="0.6" filter="url(#waveGlow)"/>
  <!-- Wave crests - top of left loop -->
  <path d="M310,240 C320,225 340,218 355,222 C370,226 375,238 365,248" fill="none" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <path d="M370,215 C382,200 400,195 418,200 C430,205 432,218 422,228" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.45"/>
  <path d="M430,210 C440,198 458,195 475,202" fill="none" stroke="#fff" stroke-width="2" opacity="0.4"/>
  <!-- Wave crests - top of right loop -->
  <path d="M805,202 C822,195 840,198 850,210" fill="none" stroke="#fff" stroke-width="2" opacity="0.4"/>
  <path d="M858,200 C870,195 890,200 898,215 C905,226 900,235 888,228" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.45"/>
  <path d="M915,222 C930,218 948,225 955,240 C960,250 952,258 940,248" fill="none" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <!-- Inner wave detail -->
  <path d="M280,300 C280,195 398,160 478,218 C535,255 568,288 640,288" fill="none" stroke="#4ecdc4" stroke-width="6" opacity="0.35"/>
  <path d="M640,288 C712,288 745,255 802,218 C882,160 1000,195 1000,300" fill="none" stroke="#4ecdc4" stroke-width="6" opacity="0.35"/>
  <path d="M1000,300 C1000,405 882,440 802,382 C745,345 712,312 640,312" fill="none" stroke="#4ecdc4" stroke-width="6" opacity="0.3"/>
  <path d="M640,312 C568,312 535,345 478,382 C398,440 280,405 280,300" fill="none" stroke="#4ecdc4" stroke-width="6" opacity="0.3"/>
  <!-- Foam/spray particles -->
  <g filter="url(#spray)" opacity="0.4">
    <circle cx="320" cy="220" r="3" fill="#fff"/><circle cx="345" cy="210" r="2" fill="#fff"/>
    <circle cx="380" cy="205" r="2.5" fill="#fff"/><circle cx="430" cy="200" r="2" fill="#fff"/>
    <circle cx="500" cy="230" r="1.5" fill="#fff"/><circle cx="540" cy="255" r="2" fill="#fff"/>
    <circle cx="740" cy="255" r="2" fill="#fff"/><circle cx="780" cy="230" r="1.5" fill="#fff"/>
    <circle cx="850" cy="200" r="2" fill="#fff"/><circle cx="900" cy="205" r="2.5" fill="#fff"/>
    <circle cx="935" cy="210" r="2" fill="#fff"/><circle cx="960" cy="220" r="3" fill="#fff"/>
  </g>
  <!-- Water droplets -->
  <g opacity="0.3">
    <circle cx="350" cy="195" r="1.5" fill="#4ecdc4"/><circle cx="400" cy="185" r="1" fill="#fff"/>
    <circle cx="460" cy="190" r="1.2" fill="#4ecdc4"/><circle cx="820" cy="190" r="1.2" fill="#4ecdc4"/>
    <circle cx="880" cy="185" r="1" fill="#fff"/><circle cx="930" cy="195" r="1.5" fill="#4ecdc4"/>
    <circle cx="360" cy="410" r="1" fill="#4ecdc4"/><circle cx="920" cy="410" r="1" fill="#4ecdc4"/>
  </g>
  <!-- Moonlight reflection -->
  <ellipse cx="640" cy="300" rx="20" ry="50" fill="#fff" opacity="0.03"/>
  <ellipse cx="640" cy="300" rx="5" ry="20" fill="#fff" opacity="0.06"/>
  <!-- Title -->
  <text x="640" y="560" text-anchor="middle" font-family="'Georgia', serif" font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="10" opacity="0.85">INFINITE CRAFT</text>
  <text x="640" y="560" text-anchor="middle" font-family="'Georgia', serif" font-size="42" font-weight="bold" fill="#4ecdc4" letter-spacing="10" opacity="0.2">INFINITE CRAFT</text>
</svg>