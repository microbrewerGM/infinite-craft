<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg17" cx="50%" cy="60%">
      <stop offset="0%" stop-color="#0e0e20"/>
      <stop offset="100%" stop-color="#040408"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#1a2040" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#10153a" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#0a0e28" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#060818" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="glow17">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orb_glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg17)"/>
  <g transform="translate(640,290)">
    <!-- Pedestal/base -->
    <ellipse cx="0" cy="220" rx="100" ry="15" fill="#1a1a1a" stroke="#c9a96e" stroke-width="1" opacity="0.4"/>
    <path d="M-60,220 Q-70,200 -40,190 Q0,180 40,190 Q70,200 60,220" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.3"/>
    <ellipse cx="0" cy="190" rx="40" ry="8" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
    <!-- Crystal ball -->
    <circle r="170" fill="url(#orb)" stroke="#4ecdc4" stroke-width="1" opacity="0.3"/>
    <!-- Glass highlight -->
    <ellipse cx="-50" cy="-60" rx="40" ry="60" fill="white" opacity="0.03" transform="rotate(-20)"/>
    <ellipse cx="-60" cy="-70" rx="15" ry="30" fill="white" opacity="0.04" transform="rotate(-25)"/>
    <!-- Swirling elements inside -->
    <!-- Fire swirl -->
    <g filter="url(#orb_glow)">
      <path d="M-60,-80 Q-20,-120 30,-80 Q60,-50 20,-20 Q-20,10 -50,-30" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.4"/>
      <circle cx="-60" cy="-80" r="8" fill="#ff6b35" opacity="0.15"/>
      <text x="-60" y="-76" text-anchor="middle" font-family="serif" font-size="12" fill="#ff6b35" opacity="0.6">&#x1F702;</text>
    </g>
    <!-- Water swirl -->
    <g filter="url(#orb_glow)">
      <path d="M60,40 Q100,0 80,-50 Q60,-80 30,-60 Q0,-40 20,0" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.4"/>
      <circle cx="60" cy="40" r="8" fill="#4ecdc4" opacity="0.15"/>
      <text x="60" y="44" text-anchor="middle" font-family="serif" font-size="12" fill="#4ecdc4" opacity="0.6">&#x1F704;</text>
    </g>
    <!-- Earth swirl -->
    <g filter="url(#orb_glow)">
      <path d="M-30,80 Q20,120 60,80 Q80,40 40,30 Q0,20 -20,50" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.4"/>
      <circle cx="-30" cy="80" r="8" fill="#a8e06c" opacity="0.15"/>
      <text x="-30" y="84" text-anchor="middle" font-family="serif" font-size="12" fill="#a8e06c" opacity="0.6">&#x1F703;</text>
    </g>
    <!-- Air swirl -->
    <g filter="url(#orb_glow)">
      <path d="M-80,0 Q-100,-40 -70,-70 Q-40,-90 -20,-60 Q0,-30 -30,-10" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
      <circle cx="-80" cy="0" r="8" fill="#c4b5fd" opacity="0.15"/>
      <text x="-80" y="4" text-anchor="middle" font-family="serif" font-size="12" fill="#c4b5fd" opacity="0.6">&#x1F701;</text>
    </g>
    <!-- Central convergence point -->
    <circle r="12" fill="#ffd93d" opacity="0.1" filter="url(#orb_glow)"/>
    <circle r="4" fill="#ffd93d" opacity="0.3"/>
    <!-- Inner sparkles -->
    <g fill="#ffd93d" opacity="0.3">
      <circle cx="15" cy="-30" r="1.5"/><circle cx="-40" cy="30" r="1"/>
      <circle cx="30" cy="-100" r="1"/><circle cx="-70" cy="-40" r="1.5"/>
      <circle cx="50" cy="80" r="1"/><circle cx="-20" cy="110" r="1.5"/>
    </g>
    <!-- Outer glow ring -->
    <circle r="175" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.08" filter="url(#orb_glow)"/>
  </g>
  <!-- Title -->
  <text x="640" y="52" text-anchor="middle" font-family="serif" font-size="44" fill="#c9a96e" letter-spacing="12" filter="url(#glow17)">INFINITE CRAFT</text>
  <text x="640" y="625" text-anchor="middle" font-family="serif" font-size="11" fill="#c4b5fd" opacity="0.4" letter-spacing="6">GAZE WITHIN</text>
</svg>