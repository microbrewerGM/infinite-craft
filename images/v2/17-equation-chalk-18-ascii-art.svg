<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <!-- Terminal background -->
  <rect width="1280" height="640" fill="#0c0c0c"/>
  <!-- CRT scanline effect -->
  <g opacity="0.03">
    <rect x="0" y="0" width="1280" height="2" fill="#fff"/>
    <rect x="0" y="4" width="1280" height="2" fill="#fff"/>
    <rect x="0" y="8" width="1280" height="2" fill="#fff"/>
    <rect x="0" y="12" width="1280" height="2" fill="#fff"/>
    <rect x="0" y="16" width="1280" height="2" fill="#fff"/>
    <rect x="0" y="20" width="1280" height="2" fill="#fff"/>
  </g>
  <!-- Terminal window frame -->
  <rect x="10" y="5" width="1260" height="30" fill="#333" rx="5"/>
  <circle cx="30" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="640" y="24" font-family="monospace" font-size="13" fill="#aaa" text-anchor="middle">infinite-craft ~ bash</text>
  <!-- Terminal content -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="13">
    <!-- Prompt -->
    <text x="20" y="58" fill="#a8e06c">$ cat infinite_craft.txt</text>
    <!-- ASCII art title -->
    <text x="20" y="80" fill="#4ecdc4"> ___        __ _       _ _          ____            __ _   </text>
    <text x="20" y="95" fill="#4ecdc4">|_ _|_ __  / _(_)_ __ (_) |_ ___   / ___|_ __ __ _ / _| |_ </text>
    <text x="20" y="110" fill="#4ecdc4"> | || '_ \| |_| | '_ \| | __/ _ \ | |   | '__/ _` | |_| __|</text>
    <text x="20" y="125" fill="#4ecdc4"> | || | | |  _| | | | | | ||  __/ | |___| | | (_| |  _| |_ </text>
    <text x="20" y="140" fill="#4ecdc4">|___|_| |_|_| |_|_| |_|_|\__\___|  \____|_|  \__,_|_|  \__|</text>
    <!-- Separator -->
    <text x="20" y="165" fill="#555">================================================================</text>
    <!-- Equations section -->
    <text x="20" y="185" fill="#c4b5fd">    ELEMENT COMBINATION TABLE</text>
    <text x="20" y="205" fill="#555">----------------------------------------------------------------</text>
    <!-- Table header -->
    <text x="20" y="225" fill="#ffd93d"> INPUT A    |  INPUT B    |  OUTPUT     |  STATUS</text>
    <text x="20" y="240" fill="#555">-----------|-------------|-------------|----------</text>
    <!-- Rows -->
    <text x="20" y="260" fill="#c9c4a1"> Water      |  Fire       |  Steam      |  </text>
    <text x="610" y="260" fill="#a8e06c">[OK]</text>
    <text x="20" y="278" fill="#c9c4a1"> Earth      |  Wind       |  Dust       |  </text>
    <text x="610" y="278" fill="#a8e06c">[OK]</text>
    <text x="20" y="296" fill="#c9c4a1"> Fire       |  Earth      |  Lava       |  </text>
    <text x="610" y="296" fill="#a8e06c">[OK]</text>
    <text x="20" y="314" fill="#c9c4a1"> Lava       |  Water      |  Stone      |  </text>
    <text x="610" y="314" fill="#a8e06c">[OK]</text>
    <text x="20" y="332" fill="#c9c4a1"> Dust       |  Water      |  Clay       |  </text>
    <text x="610" y="332" fill="#a8e06c">[OK]</text>
    <text x="20" y="350" fill="#666"> Wind       |  Wind       |  ???        |  </text>
    <text x="610" y="350" fill="#ff6b35">[FAIL]</text>
    <text x="20" y="368" fill="#c9c4a1"> Stone      |  Fire       |  Metal      |  </text>
    <text x="610" y="368" fill="#a8e06c">[OK]</text>
    <text x="20" y="386" fill="#c9c4a1"> Clay       |  Fire       |  Brick      |  </text>
    <text x="610" y="386" fill="#a8e06c">[OK]</text>
    <text x="20" y="404" fill="#555">-----------|-------------|-------------|----------</text>
    <!-- Stats -->
    <text x="20" y="428" fill="#c4b5fd">    STATS:</text>
    <text x="20" y="448" fill="#c9c4a1">    Total combinations tried:  1,247</text>
    <text x="20" y="466" fill="#c9c4a1">    Successful:                1,246</text>
    <text x="20" y="484" fill="#ff6b35">    Failed:                    1</text>
    <text x="20" y="502" fill="#a8e06c">    Success rate:              99.9%</text>
    <text x="20" y="528" fill="#555">================================================================</text>
    <!-- Progress bar -->
    <text x="20" y="552" fill="#ffd93d">  Exploring combinations...</text>
    <text x="20" y="572" fill="#c9c4a1">  [</text>
    <text x="38" y="572" fill="#a8e06c">##############################</text>
    <text x="318" y="572" fill="#555">.......................</text>
    <text x="530" y="572" fill="#c9c4a1">]  56%</text>
    <!-- Blinking cursor -->
    <text x="20" y="600" fill="#a8e06c">$</text>
    <rect x="35" y="590" width="8" height="15" fill="#a8e06c" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Right side: ASCII art flask -->
  <g font-family="'Fira Code', monospace" font-size="12" fill="#4ecdc4" opacity="0.4">
    <text x="780" y="195">        ____</text>
    <text x="780" y="210">       |    |</text>
    <text x="780" y="225">       |    |</text>
    <text x="780" y="240">      /      \</text>
    <text x="780" y="255">     /  ~~~~  \</text>
    <text x="780" y="270">    /  ~~~~~~  \</text>
    <text x="780" y="285">   /  ~~~~~~~~  \</text>
    <text x="780" y="300">  |  ~~~~~~~~~~  |</text>
    <text x="780" y="315">  |  ~~~~~~~~~~  |</text>
    <text x="780" y="330">   \~~~~~~~~~~~~/</text>
    <text x="780" y="345">    \~~~~~~~~~~/</text>
    <text x="780" y="360">     \________/</text>
  </g>
  <!-- Right side: fire ASCII art -->
  <g font-family="'Fira Code', monospace" font-size="12" fill="#ff6b35" opacity="0.4">
    <text x="1000" y="250">     (</text>
    <text x="1000" y="265">    ) )</text>
    <text x="1000" y="280">   ( ( )</text>
    <text x="1000" y="295">    ) )</text>
    <text x="1000" y="310">   ( (</text>
    <text x="1000" y="325">    ) )</text>
    <text x="1000" y="340">   ( ( )</text>
    <text x="1000" y="355">  _)_)_)</text>
    <text x="1000" y="370"> |_____|</text>
  </g>
</svg>