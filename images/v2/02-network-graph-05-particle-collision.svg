<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#000"/>
  <!-- Particle accelerator ring -->
  <ellipse cx="640" cy="320" rx="400" ry="200" fill="none" stroke="#1a1a3a" stroke-width="40"/>
  <ellipse cx="640" cy="320" rx="400" ry="200" fill="none" stroke="#222255" stroke-width="1"/>
  <!-- Particle trails spiraling from collision -->
  <g fill="none" stroke-linecap="round">
    <path d="M640,320 Q580,280 520,200 Q480,140 500,80" stroke="#ff6b35" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M640,320 Q600,260 540,220 Q500,180 480,120" stroke="#ff6b35" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M640,320 Q700,280 780,220 Q830,180 820,100" stroke="#4ecdc4" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M640,320 Q710,290 760,240 Q810,200 840,140" stroke="#4ecdc4" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M640,320 Q580,360 500,420 Q440,470 420,540" stroke="#a8e06c" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M640,320 Q700,370 780,430 Q850,480 880,550" stroke="#c4b5fd" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M640,320 Q620,380 600,460 Q580,520 560,580" stroke="#ffd93d" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M640,320 Q660,370 700,450 Q730,510 740,580" stroke="#ffd93d" stroke-width="1" stroke-opacity="0.3"/>
  </g>
  <!-- Collision point -->
  <circle cx="640" cy="320" r="25" fill="#fff" opacity="0.05"/>
  <circle cx="640" cy="320" r="10" fill="#fff" opacity="0.15"/>
  <circle cx="640" cy="320" r="3" fill="white"/>
  <!-- Particle endpoints -->
  <circle cx="500" cy="80" r="4" fill="#ff6b35" opacity="0.9"/>
  <circle cx="820" cy="100" r="4" fill="#4ecdc4" opacity="0.9"/>
  <circle cx="420" cy="540" r="3" fill="#a8e06c" opacity="0.7"/>
  <circle cx="880" cy="550" r="3" fill="#c4b5fd" opacity="0.7"/>
  <text x="640" y="60" font-family="'Helvetica Neue', sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="700" letter-spacing="6">INFINITE CRAFT</text>
  <text x="640" y="90" font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#555" text-anchor="middle" letter-spacing="5">COLLISION EXPLORER</text>
</svg>