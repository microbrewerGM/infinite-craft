<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="dsGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dsSoft">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="dsFar">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <radialGradient id="distantStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="20%" stop-color="#ffd93d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#010101"/>

  <!-- The void - almost nothing -->
  <!-- A single distant star/sun -->
  <circle cx="1100" cy="200" r="3" fill="url(#distantStar)" filter="url(#dsGlow)"/>
  <circle cx="1100" cy="200" r="1" fill="white"/>
  <!-- Light rays from distant star -->
  <line x1="1100" y1="200" x2="1085" y2="200" stroke="white" stroke-opacity="0.15" stroke-width="0.5"/>
  <line x1="1100" y1="200" x2="1115" y2="200" stroke="white" stroke-opacity="0.15" stroke-width="0.5"/>
  <line x1="1100" y1="200" x2="1100" y2="185" stroke="white" stroke-opacity="0.15" stroke-width="0.5"/>
  <line x1="1100" y1="200" x2="1100" y2="215" stroke="white" stroke-opacity="0.15" stroke-width="0.5"/>

  <!-- Very faint galaxy/nebula in far background -->
  <ellipse cx="300" cy="180" rx="80" ry="20" fill="#c4b5fd" opacity="0.02" filter="url(#dsFar)" transform="rotate(-20,300,180)"/>
  <ellipse cx="900" cy="450" rx="60" ry="15" fill="#4ecdc4" opacity="0.015" filter="url(#dsFar)" transform="rotate(30,900,450)"/>

  <!-- Sparse stars -->
  <circle cx="200" cy="100" r="0.5" fill="white" opacity="0.3"/>
  <circle cx="400" cy="300" r="0.4" fill="white" opacity="0.2"/>
  <circle cx="600" cy="150" r="0.6" fill="white" opacity="0.25"/>
  <circle cx="800" cy="400" r="0.4" fill="white" opacity="0.2"/>
  <circle cx="1000" cy="350" r="0.5" fill="white" opacity="0.22"/>
  <circle cx="150" cy="450" r="0.3" fill="white" opacity="0.15"/>
  <circle cx="500" cy="500" r="0.4" fill="white" opacity="0.18"/>
  <circle cx="750" cy="100" r="0.5" fill="white" opacity="0.2"/>
  <circle cx="350" cy="550" r="0.3" fill="white" opacity="0.12"/>
  <circle cx="1050" cy="500" r="0.4" fill="white" opacity="0.15"/>

  <!-- Voyager-style spacecraft silhouette (tiny, in the void) -->
  <g transform="translate(580,310) scale(0.5)" opacity="0.25">
    <!-- Dish -->
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="white" stroke-width="1" transform="rotate(-30)"/>
    <!-- Body -->
    <line x1="15" y1="5" x2="60" y2="20" stroke="white" stroke-width="1.5"/>
    <!-- Boom arms -->
    <line x1="35" y1="12" x2="25" y2="45" stroke="white" stroke-width="0.8"/>
    <line x1="40" y1="14" x2="55" y2="50" stroke="white" stroke-width="0.8"/>
    <!-- RTG -->
    <rect x="20" y="42" width="10" height="6" fill="white" opacity="0.3" transform="rotate(-10,25,45)"/>
  </g>

  <!-- Element icons as distant signals/beacons -->
  <g opacity="0.4" filter="url(#dsGlow)">
    <text x="200" y="290" font-size="18" text-anchor="middle">🔥</text>
    <text x="420" y="380" font-size="16" text-anchor="middle">💧</text>
    <text x="760" y="280" font-size="17" text-anchor="middle">🌍</text>
    <text x="950" cy="320" y="320" font-size="16" text-anchor="middle">💨</text>
  </g>

  <!-- Faint radio wave lines emanating from craft -->
  <circle cx="610" cy="320" r="30" fill="none" stroke="#4ecdc4" stroke-opacity="0.04" stroke-width="0.5"/>
  <circle cx="610" cy="320" r="60" fill="none" stroke="#4ecdc4" stroke-opacity="0.03" stroke-width="0.5"/>
  <circle cx="610" cy="320" r="100" fill="none" stroke="#4ecdc4" stroke-opacity="0.02" stroke-width="0.5"/>

  <!-- Title - large and stark against the void -->
  <text x="640" y="560" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="white" text-anchor="middle" letter-spacing="20" opacity="0.85">INFINITE CRAFT</text>
  <text x="640" y="600" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" letter-spacing="10" opacity="0.2">BEYOND THE EDGE</text>
</svg>