<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="sandstone">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#d4b896" surfaceScale="3">
        <feDistantLight azimuth="200" elevation="40"/>
      </feDiffuseLighting>
    </filter>
    <filter id="carved">
      <feOffset dx="1" dy="1" in="SourceGraphic" result="offset"/>
      <feGaussianBlur in="offset" stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Sandstone wall -->
  <rect width="1280" height="640" fill="#d4b896"/>
  <rect width="1280" height="640" filter="url(#sandstone)" opacity="0.5"/>
  <!-- Stone block divisions -->
  <g stroke="#c0a07a" stroke-width="2" opacity="0.4">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="160"/>
    <line x1="640" y1="0" x2="640" y2="160"/>
    <line x1="960" y1="0" x2="960" y2="160"/>
    <line x1="160" y1="160" x2="160" y2="320"/>
    <line x1="480" y1="160" x2="480" y2="320"/>
    <line x1="800" y1="160" x2="800" y2="320"/>
    <line x1="1120" y1="160" x2="1120" y2="320"/>
    <line x1="320" y1="320" x2="320" y2="480"/>
    <line x1="640" y1="320" x2="640" y2="480"/>
    <line x1="960" y1="320" x2="960" y2="480"/>
    <line x1="160" y1="480" x2="160" y2="640"/>
    <line x1="480" y1="480" x2="480" y2="640"/>
    <line x1="800" y1="480" x2="800" y2="640"/>
    <line x1="1120" y1="480" x2="1120" y2="640"/>
  </g>
  <!-- Title cartouche (oval border) -->
  <ellipse cx="640" cy="55" rx="300" ry="40" fill="none" stroke="#8b6914" stroke-width="4" filter="url(#carved)"/>
  <line x1="340" y1="55" x2="340" y2="15" stroke="#8b6914" stroke-width="4"/>
  <line x1="340" y1="15" x2="940" y2="15" stroke="#8b6914" stroke-width="4"/>
  <line x1="940" y1="15" x2="940" y2="55" stroke="#8b6914" stroke-width="4"/>
  <text x="640" y="68" font-family="'Papyrus', fantasy" font-size="42" fill="#5a3e1b" text-anchor="middle" filter="url(#carved)">INFINITE CRAFT</text>
  <!-- Decorative winged sun disk -->
  <g transform="translate(640, 110)" fill="#8b6914" filter="url(#carved)" opacity="0.7">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#8b6914" stroke-width="3"/>
    <circle cx="0" cy="0" r="8"/>
    <path d="M-15 0 Q-60 -15 -120 -5 Q-80 0 -60 5 Q-40 8 -15 0Z"/>
    <path d="M15 0 Q60 -15 120 -5 Q80 0 60 5 Q40 8 15 0Z"/>
    <!-- Uraeus serpents -->
    <path d="M-120 -5 Q-130 -15 -125 -25 Q-120 -15 -115 -10" fill="none" stroke="#8b6914" stroke-width="2"/>
    <path d="M120 -5 Q130 -15 125 -25 Q120 -15 115 -10" fill="none" stroke="#8b6914" stroke-width="2"/>
  </g>
  <!-- Equation Row 1: Water + Fire = Steam -->
  <g transform="translate(60, 150)" filter="url(#carved)">
    <!-- Water hieroglyph (wavy lines) -->
    <g stroke="#5a3e1b" stroke-width="3" fill="none">
      <path d="M10 30 Q25 15 40 30 Q55 45 70 30"/>
      <path d="M10 50 Q25 35 40 50 Q55 65 70 50"/>
      <path d="M10 70 Q25 55 40 70 Q55 85 70 70"/>
    </g>
    <!-- Plus (ankh-like cross) -->
    <g transform="translate(110, 30)" stroke="#5a3e1b" stroke-width="3" fill="none">
      <line x1="0" y1="10" x2="0" y2="50"/>
      <line x1="-15" y1="30" x2="15" y2="30"/>
      <circle cx="0" cy="5" r="8"/>
    </g>
    <!-- Fire hieroglyph (flame/torch) -->
    <g transform="translate(160, 15)" fill="#5a3e1b">
      <path d="M20 80 L25 40 Q30 20 35 30 Q40 10 45 25 Q50 5 48 40 L50 80Z" stroke="#5a3e1b" stroke-width="2"/>
    </g>
    <!-- Equals (two parallel reeds) -->
    <g transform="translate(250, 20)" stroke="#5a3e1b" stroke-width="3">
      <line x1="0" y1="20" x2="30" y2="20"/>
      <line x1="0" y1="45" x2="30" y2="45"/>
    </g>
    <!-- Steam hieroglyph (rising vapors from vessel) -->
    <g transform="translate(310, 10)" fill="#5a3e1b" stroke="#5a3e1b" stroke-width="2">
      <path d="M10 80 Q5 60 20 55 Q35 50 40 60 Q45 50 50 80Z"/>
      <path d="M20 50 Q25 35 22 20" fill="none"/>
      <path d="M30 48 Q35 30 32 15" fill="none"/>
      <path d="M40 52 Q45 38 42 25" fill="none"/>
    </g>
  </g>
  <!-- Equation Row 2: Earth + Wind = Dust -->
  <g transform="translate(500, 150)" filter="url(#carved)">
    <!-- Earth hieroglyph (flat land with plants) -->
    <g stroke="#5a3e1b" stroke-width="3" fill="none">
      <line x1="0" y1="75" x2="70" y2="75"/>
      <path d="M20 75 L20 50 Q25 40 30 50 L30 75"/>
      <path d="M40 75 L40 45 Q45 35 50 45 L50 75"/>
    </g>
    <!-- Plus -->
    <g transform="translate(100, 30)" stroke="#5a3e1b" stroke-width="3" fill="none">
      <line x1="0" y1="10" x2="0" y2="50"/>
      <line x1="-15" y1="30" x2="15" y2="30"/>
      <circle cx="0" cy="5" r="8"/>
    </g>
    <!-- Wind hieroglyph (sail/fan shape) -->
    <g transform="translate(145, 20)" fill="#5a3e1b" stroke="#5a3e1b" stroke-width="2">
      <path d="M0 65 L30 10 L60 65Z" fill="none"/>
      <path d="M65 40 Q80 35 90 45" fill="none"/>
      <path d="M65 50 Q85 45 95 55" fill="none"/>
      <path d="M65 60 Q80 55 90 65" fill="none"/>
    </g>
    <!-- Equals -->
    <g transform="translate(260, 20)" stroke="#5a3e1b" stroke-width="3">
      <line x1="0" y1="20" x2="30" y2="20"/>
      <line x1="0" y1="45" x2="30" y2="45"/>
    </g>
    <!-- Dust hieroglyph (scattered dots) -->
    <g fill="#5a3e1b">
      <circle cx="320" cy="40" r="4"/><circle cx="340" cy="55" r="3"/>
      <circle cx="360" cy="35" r="5"/><circle cx="345" cy="70" r="3"/>
      <circle cx="370" cy="60" r="4"/><circle cx="325" cy="65" r="3"/>
      <circle cx="355" cy="45" r="2"/><circle cx="335" cy="80" r="4"/>
      <circle cx="365" cy="78" r="3"/>
    </g>
  </g>
  <!-- Equation Row 3: Fire + Earth = Lava -->
  <g transform="translate(60, 310)" filter="url(#carved)">
    <!-- Fire -->
    <g transform="translate(0, 15)" fill="#5a3e1b">
      <path d="M20 80 L25 40 Q30 20 35 30 Q40 10 45 25 Q50 5 48 40 L50 80Z" stroke="#5a3e1b" stroke-width="2"/>
    </g>
    <!-- Plus -->
    <g transform="translate(90, 30)" stroke="#5a3e1b" stroke-width="3" fill="none">
      <line x1="0" y1="10" x2="0" y2="50"/><line x1="-15" y1="30" x2="15" y2="30"/>
      <circle cx="0" cy="5" r="8"/>
    </g>
    <!-- Earth -->
    <g transform="translate(130, 0)" stroke="#5a3e1b" stroke-width="3" fill="none">
      <line x1="0" y1="75" x2="70" y2="75"/>
      <path d="M20 75 L20 50 Q25 40 30 50 L30 75"/>
      <path d="M40 75 L40 45 Q45 35 50 45 L50 75"/>
    </g>
    <!-- Equals -->
    <g transform="translate(240, 20)" stroke="#5a3e1b" stroke-width="3">
      <line x1="0" y1="20" x2="30" y2="20"/><line x1="0" y1="45" x2="30" y2="45"/>
    </g>
    <!-- Lava hieroglyph (mountain with flow) -->
    <g transform="translate(290, 5)" fill="#5a3e1b" stroke="#5a3e1b" stroke-width="2">
      <path d="M0 80 L40 15 L80 80Z" fill="none"/>
      <path d="M40 15 Q45 25 50 20 Q55 30 55 40 Q60 50 55 60 Q50 70 55 80" fill="none"/>
    </g>
  </g>
  <!-- Equation Row 4: Stone + Fire = Metal -->
  <g transform="translate(500, 310)" filter="url(#carved)">
    <!-- Stone hieroglyph (block) -->
    <g fill="none" stroke="#5a3e1b" stroke-width="3">
      <rect x="5" y="30" width="55" height="45" rx="3"/>
      <line x1="15" y1="50" x2="50" y2="50"/>
    </g>
    <!-- Plus -->
    <g transform="translate(95, 25)" stroke="#5a3e1b" stroke-width="3" fill="none">
      <line x1="0" y1="10" x2="0" y2="50"/><line x1="-15" y1="30" x2="15" y2="30"/>
      <circle cx="0" cy="5" r="8"/>
    </g>
    <!-- Fire -->
    <g transform="translate(135, 10)" fill="#5a3e1b">
      <path d="M20 80 L25 40 Q30 20 35 30 Q40 10 45 25 Q50 5 48 40 L50 80Z" stroke="#5a3e1b" stroke-width="2"/>
    </g>
    <!-- Equals -->
    <g transform="translate(230, 20)" stroke="#5a3e1b" stroke-width="3">
      <line x1="0" y1="20" x2="30" y2="20"/><line x1="0" y1="45" x2="30" y2="45"/>
    </g>
    <!-- Metal hieroglyph (ingot/bar shape) -->
    <g transform="translate(280, 20)" fill="#5a3e1b" stroke="#5a3e1b" stroke-width="2">
      <path d="M10 60 L20 20 L60 20 L70 60Z"/>
      <line x1="30" y1="25" x2="25" y2="55"/>
      <line x1="50" y1="25" x2="45" y2="55"/>
    </g>
  </g>
  <!-- Egyptian Eye of Horus (decorative) -->
  <g transform="translate(1050, 450)" fill="#5a3e1b" filter="url(#carved)" opacity="0.5">
    <ellipse cx="40" cy="20" rx="40" ry="18" fill="none" stroke="#5a3e1b" stroke-width="3"/>
    <circle cx="40" cy="20" r="10"/>
    <path d="M80 20 Q100 25 110 40" fill="none" stroke="#5a3e1b" stroke-width="3"/>
    <path d="M0 20 Q-10 25 -15 35" fill="none" stroke="#5a3e1b" stroke-width="3"/>
    <path d="M30 38 Q35 55 25 70" fill="none" stroke="#5a3e1b" stroke-width="3"/>
  </g>
  <!-- Scarab beetle decoration -->
  <g transform="translate(80, 490)" fill="none" stroke="#5a3e1b" stroke-width="2" filter="url(#carved)" opacity="0.4">
    <ellipse cx="30" cy="30" rx="25" ry="20"/>
    <path d="M5 30 Q-10 15 -5 0"/>
    <path d="M55 30 Q70 15 65 0"/>
    <line x1="20" y1="50" x2="15" y2="70"/>
    <line x1="30" y1="50" x2="30" y2="75"/>
    <line x1="40" y1="50" x2="45" y2="70"/>
  </g>
  <!-- Bottom inscription band -->
  <rect x="100" y="555" width="1080" height="50" fill="none" stroke="#8b6914" stroke-width="2" filter="url(#carved)"/>
  <text x="640" y="585" font-family="'Papyrus', fantasy" font-size="22" fill="#5a3e1b" text-anchor="middle" filter="url(#carved)">The sacred combinations are eternal and without limit</text>
</svg>