<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="aged-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f0e6c8" surfaceScale="1.2">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
    </filter>
    <filter id="ink-stamp">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
  </defs>
  <!-- Aged paper background -->
  <rect width="1280" height="640" fill="#f0e6c8"/>
  <rect width="1280" height="640" filter="url(#aged-paper)" opacity="0.25"/>
  <!-- Coffee ring stain -->
  <circle cx="1050" cy="150" r="55" fill="none" stroke="#c8a870" stroke-width="8" opacity="0.25"/>
  <circle cx="1050" cy="150" r="50" fill="none" stroke="#c8a870" stroke-width="3" opacity="0.15"/>
  <!-- Age spots -->
  <ellipse cx="200" cy="550" rx="60" ry="40" fill="#d4c4a0" opacity="0.3"/>
  <ellipse cx="1100" cy="500" rx="45" ry="30" fill="#d4c4a0" opacity="0.25"/>
  <!-- Title -->
  <text x="640" y="80" font-family="'Courier New', monospace" font-size="48" fill="#333" text-anchor="middle" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="105" font-family="'Courier New', monospace" font-size="14" fill="#666" text-anchor="middle" letter-spacing="4">ELEMENT COMBINATION REGISTRY</text>
  <line x1="200" y1="115" x2="1080" y2="115" stroke="#333" stroke-width="1"/>
  <line x1="200" y1="118" x2="1080" y2="118" stroke="#333" stroke-width="0.5"/>
  <!-- Typewritten equations -->
  <g font-family="'Courier New', monospace" font-size="24" fill="#333">
    <text x="180" y="170">COMBINATION No. 001 .... Water + Fire = Steam</text>
    <text x="180" y="210">COMBINATION No. 002 .... Earth + Wind = Dust</text>
    <text x="180" y="250">COMBINATION No. 003 .... Fire + Earth = Lava</text>
    <text x="180" y="290">COMBINATION No. 004 .... Lava + Water = Stone</text>
    <text x="180" y="330">COMBINATION No. 005 .... Dust + Water = Clay</text>
    <text x="180" y="370">COMBINATION No. 006 .... Clay + Fire = Brick</text>
    <text x="180" y="410">COMBINATION No. 007 .... Stone + Fire = Metal</text>
    <text x="180" y="450">COMBINATION No. 008 .... Steam + Earth = Geyser</text>
  </g>
  <!-- Typewriter correction (xxx'd out) -->
  <text x="180" y="490" font-family="'Courier New', monospace" font-size="24" fill="#333">COMBINATION No. 009 .... Wind + Wind = xxxxx</text>
  <text x="850" y="490" font-family="'Courier New', monospace" font-size="20" fill="#666">[REJECTED]</text>
  <!-- Hand-written correction -->
  <text x="180" y="530" font-family="'Segoe Print', cursive" font-size="20" fill="#4ecdc4" transform="rotate(-2 180 530)">^ actually = Tornado -- need to verify!</text>
  <!-- Page number -->
  <text x="640" y="610" font-family="'Courier New', monospace" font-size="16" fill="#666" text-anchor="middle">- page 47 of 312 -</text>
  <!-- Red "CLASSIFIED" stamp -->
  <g transform="translate(900, 50) rotate(15)" filter="url(#ink-stamp)">
    <rect x="-10" y="-30" width="260" height="50" fill="none" stroke="#cc0000" stroke-width="4" rx="5" opacity="0.6"/>
    <text x="120" y="-2" font-family="Impact, sans-serif" font-size="36" fill="#cc0000" text-anchor="middle" opacity="0.6">CLASSIFIED</text>
  </g>
  <!-- Paper clip top right -->
  <path d="M1180 0 Q1200 10 1195 40 Q1190 70 1175 75 Q1160 80 1165 50 Q1170 20 1190 15" fill="none" stroke="#aaa" stroke-width="3"/>
  <!-- Date stamp -->
  <text x="180" y="140" font-family="'Courier New', monospace" font-size="14" fill="#888">DATE: FEB 24, 2026    FILED BY: ___________    STATUS: ONGOING</text>
</svg>