<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d0015"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="50%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg1)"/>
  <!-- Outer tarot border -->
  <rect x="340" y="30" width="600" height="580" rx="20" fill="none" stroke="url(#gold1)" stroke-width="4"/>
  <rect x="350" y="40" width="580" height="560" rx="16" fill="none" stroke="#c9a96e" stroke-width="1.5"/>
  <rect x="358" y="48" width="564" height="544" rx="12" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.6"/>
  <!-- Corner ornaments -->
  <g fill="none" stroke="#c9a96e" stroke-width="1.5">
    <path d="M370 60 Q370 80 390 80 M370 60 Q390 60 390 80"/>
    <path d="M910 60 Q910 80 890 80 M910 60 Q890 60 890 80"/>
    <path d="M370 580 Q370 560 390 560 M370 580 Q390 580 390 560"/>
    <path d="M910 580 Q910 560 890 560 M910 580 Q890 580 890 560"/>
    <!-- Extended corner filigree -->
    <circle cx="375" cy="65" r="4"/>
    <circle cx="905" cy="65" r="4"/>
    <circle cx="375" cy="575" r="4"/>
    <circle cx="905" cy="575" r="4"/>
  </g>
  <!-- Roman numeral at top -->
  <text x="640" y="90" text-anchor="middle" font-family="serif" font-size="24" fill="#c9a96e" letter-spacing="8">— XXI —</text>
  <!-- Central radiating sun/star -->
  <g transform="translate(640,300)" filter="url(#glow1)">
    <circle r="80" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.3"/>
    <circle r="60" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.5"/>
    <circle r="40" fill="none" stroke="#4ecdc4" stroke-width="1"/>
    <!-- Rays -->
    <g stroke="#c9a96e" stroke-width="1" opacity="0.7">
      <line x1="0" y1="-90" x2="0" y2="-130"/>
      <line x1="90" y1="0" x2="130" y2="0"/>
      <line x1="0" y1="90" x2="0" y2="130"/>
      <line x1="-90" y1="0" x2="-130" y2="0"/>
      <line x1="63" y1="-63" x2="92" y2="-92"/>
      <line x1="63" y1="63" x2="92" y2="92"/>
      <line x1="-63" y1="-63" x2="-92" y2="-92"/>
      <line x1="-63" y1="63" x2="-92" y2="92"/>
    </g>
    <!-- Inner star -->
    <polygon points="0,-50 14,-18 50,-18 22,4 34,40 0,20 -34,40 -22,4 -50,-18 -14,-18" fill="none" stroke="#ffd93d" stroke-width="1.5"/>
    <!-- Element symbols at cardinal points -->
    <text x="0" y="-105" text-anchor="middle" font-family="serif" font-size="22" fill="#ff6b35">🜂</text>
    <text x="105" y="6" text-anchor="middle" font-family="serif" font-size="22" fill="#4ecdc4">🜄</text>
    <text x="0" y="118" text-anchor="middle" font-family="serif" font-size="22" fill="#a8e06c">🜃</text>
    <text x="-105" y="6" text-anchor="middle" font-family="serif" font-size="22" fill="#c4b5fd">🜁</text>
  </g>
  <!-- Decorative side elements -->
  <g opacity="0.4" fill="none" stroke="#c9a96e" stroke-width="0.8">
    <path d="M380 150 Q420 160 380 170 Q420 180 380 190"/>
    <path d="M900 150 Q860 160 900 170 Q860 180 900 190"/>
    <path d="M380 430 Q420 440 380 450 Q420 460 380 470"/>
    <path d="M900 430 Q860 440 900 450 Q860 460 900 470"/>
  </g>
  <!-- Title -->
  <text x="640" y="510" text-anchor="middle" font-family="serif" font-size="42" fill="url(#gold1)" letter-spacing="12" filter="url(#glow1)">INFINITE CRAFT</text>
  <!-- Subtitle -->
  <text x="640" y="545" text-anchor="middle" font-family="serif" font-size="14" fill="#c9a96e" opacity="0.7" letter-spacing="6">THE WORLD AWAITS</text>
  <!-- Stars scattered -->
  <g fill="#ffd93d" opacity="0.3">
    <circle cx="100" cy="80" r="1.5"/><circle cx="200" cy="150" r="1"/><circle cx="150" cy="400" r="1.5"/>
    <circle cx="80" cy="300" r="1"/><circle cx="250" cy="500" r="1.5"/><circle cx="1100" cy="100" r="1"/>
    <circle cx="1180" cy="250" r="1.5"/><circle cx="1050" cy="400" r="1"/><circle cx="1150" cy="520" r="1.5"/>
    <circle cx="1200" cy="80" r="1"/><circle cx="50" cy="550" r="1"/><circle cx="1230" cy="450" r="1.5"/>
  </g>
</svg>