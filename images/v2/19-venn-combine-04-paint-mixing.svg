<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="paint-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8e06c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <filter id="paint-blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="paint-soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>
  <ellipse cx="640" cy="360" rx="350" ry="200" fill="url(#paint-glow)" opacity="0.4"/>

  <!-- Left paint drop - large orange blob -->
  <g transform="translate(380, 280)">
    <!-- Drop shadow/glow -->
    <ellipse cx="0" cy="40" rx="100" ry="60" fill="#ff6b35" opacity="0.1" filter="url(#paint-blur)"/>
    <!-- Main drop body -->
    <path d="M 0 -80 Q 60 -20 80 40 Q 90 80 60 100 Q 30 120 0 120 Q -30 120 -60 100 Q -90 80 -80 40 Q -60 -20 0 -80 Z" fill="#ff6b35" opacity="0.85"/>
    <!-- Highlight -->
    <ellipse cx="-20" cy="-20" rx="20" ry="30" fill="#fff" opacity="0.15" transform="rotate(-15)"/>
    <!-- Tendril reaching right -->
    <path d="M 70 60 Q 120 80 180 100 Q 220 110 260 105" fill="none" stroke="#ff6b35" stroke-width="20" stroke-linecap="round" opacity="0.7"/>
    <path d="M 60 80 Q 100 110 160 130 Q 200 140 240 130" fill="none" stroke="#ff6b35" stroke-width="14" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Right paint drop - large teal blob -->
  <g transform="translate(900, 280)">
    <ellipse cx="0" cy="40" rx="100" ry="60" fill="#4ecdc4" opacity="0.1" filter="url(#paint-blur)"/>
    <path d="M 0 -80 Q 60 -20 80 40 Q 90 80 60 100 Q 30 120 0 120 Q -30 120 -60 100 Q -90 80 -80 40 Q -60 -20 0 -80 Z" fill="#4ecdc4" opacity="0.85"/>
    <ellipse cx="-20" cy="-20" rx="20" ry="30" fill="#fff" opacity="0.15" transform="rotate(-15)"/>
    <!-- Tendril reaching left -->
    <path d="M -70 60 Q -120 80 -180 100 Q -220 110 -260 105" fill="none" stroke="#4ecdc4" stroke-width="20" stroke-linecap="round" opacity="0.7"/>
    <path d="M -60 80 Q -100 110 -160 130 Q -200 140 -240 130" fill="none" stroke="#4ecdc4" stroke-width="14" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Central merge zone -->
  <g transform="translate(640, 370)">
    <!-- Mixed color pool -->
    <ellipse cx="0" cy="0" rx="90" ry="50" fill="#a8e06c" opacity="0.6" filter="url(#paint-soft)"/>
    <ellipse cx="-20" cy="-10" rx="40" ry="25" fill="#ffd93d" opacity="0.4"/>
    <ellipse cx="20" cy="10" rx="35" ry="20" fill="#a8e06c" opacity="0.5"/>
    <!-- Swirl patterns -->
    <path d="M -40 -10 Q -10 -30 20 -10 Q 40 5 20 20 Q 0 30 -20 20 Q -35 10 -20 0" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
    <path d="M 10 -20 Q 30 -15 35 5 Q 35 20 15 25" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Small splatter dots -->
  <circle cx="520" cy="420" r="6" fill="#ff6b35" opacity="0.4"/>
  <circle cx="760" cy="430" r="5" fill="#4ecdc4" opacity="0.4"/>
  <circle cx="600" cy="450" r="4" fill="#a8e06c" opacity="0.5"/>
  <circle cx="680" cy="440" r="3" fill="#ffd93d" opacity="0.4"/>
  <circle cx="550" cy="300" r="3" fill="#ff6b35" opacity="0.3"/>
  <circle cx="730" cy="290" r="3" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="640" cy="280" r="2" fill="#c4b5fd" opacity="0.5"/>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#a8e06c" opacity="0.6" letter-spacing="4">PAINT MIXING</text>
</svg>