<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg15" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0a0a18"/>
      <stop offset="100%" stop-color="#020206"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="75%" stop-color="#ff6b35" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#ffd93d" stop-opacity="0.08"/>
      <stop offset="95%" stop-color="#ffd93d" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow15">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="corona_glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg15)"/>
  <g transform="translate(640,300)">
    <!-- Corona glow layers -->
    <circle r="300" fill="url(#corona)"/>
    <!-- Outer corona streamers -->
    <g stroke="#ffd93d" stroke-width="1" opacity="0.15" filter="url(#corona_glow)">
      <path d="M0,-140 Q-30,-200 -10,-280" fill="none"/>
      <path d="M0,-140 Q30,-200 10,-280" fill="none"/>
      <path d="M140,0 Q200,-30 280,-10" fill="none"/>
      <path d="M140,0 Q200,30 280,10" fill="none"/>
      <path d="M0,140 Q-30,200 -10,260" fill="none"/>
      <path d="M0,140 Q30,200 10,260" fill="none"/>
      <path d="M-140,0 Q-200,-30 -280,-10" fill="none"/>
      <path d="M-140,0 Q-200,30 -280,10" fill="none"/>
      <!-- Diagonal streamers -->
      <path d="M99,-99 Q160,-160 220,-200" fill="none"/>
      <path d="M99,99 Q160,160 200,220" fill="none"/>
      <path d="M-99,-99 Q-160,-160 -220,-200" fill="none"/>
      <path d="M-99,99 Q-160,160 -200,220" fill="none"/>
    </g>
    <!-- Inner corona ring -->
    <circle r="155" fill="none" stroke="#ffd93d" stroke-width="3" opacity="0.12" filter="url(#glow15)"/>
    <circle r="150" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.15" filter="url(#glow15)"/>
    <circle r="145" fill="none" stroke="#ffd93d" stroke-width="1" opacity="0.2" filter="url(#glow15)"/>
    <!-- Chromosphere (thin red ring) -->
    <circle r="141" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.3" filter="url(#glow15)"/>
    <!-- Moon (dark disc) -->
    <circle r="138" fill="#020206"/>
    <circle r="138" fill="none" stroke="#1a1a2a" stroke-width="0.5" opacity="0.3"/>
    <!-- Baily's beads (bright spots on edge) -->
    <g filter="url(#glow15)">
      <circle cx="0" cy="-138" r="4" fill="#ffd93d" opacity="0.6"/>
      <circle cx="97" cy="-97" r="2.5" fill="#ffd93d" opacity="0.4"/>
      <circle cx="-120" cy="68" r="3" fill="#ffd93d" opacity="0.5"/>
      <circle cx="130" cy="48" r="2" fill="#ffd93d" opacity="0.3"/>
    </g>
    <!-- Diamond ring effect (top) -->
    <circle cx="0" cy="-140" r="8" fill="#ffd93d" opacity="0.3" filter="url(#corona_glow)"/>
    <!-- Element symbols in corona field -->
    <g filter="url(#glow15)" font-family="serif" font-size="20" opacity="0.5">
      <text x="0" y="-200" text-anchor="middle" fill="#ff6b35">&#x1F702;</text>
      <text x="200" y="5" text-anchor="middle" fill="#4ecdc4">&#x1F704;</text>
      <text x="0" y="215" text-anchor="middle" fill="#a8e06c">&#x1F703;</text>
      <text x="-200" y="5" text-anchor="middle" fill="#c4b5fd">&#x1F701;</text>
    </g>
  </g>
  <!-- Stars in background -->
  <g fill="white" opacity="0.15">
    <circle cx="80" cy="50" r="1"/><circle cx="200" cy="100" r="1.5"/><circle cx="60" cy="500" r="1"/>
    <circle cx="300" cy="580" r="1.5"/><circle cx="1200" cy="60" r="1"/><circle cx="1100" cy="120" r="1.5"/>
    <circle cx="1220" cy="500" r="1"/><circle cx="1000" cy="580" r="1.5"/><circle cx="400" cy="40" r="1"/>
    <circle cx="900" cy="30" r="1"/><circle cx="150" cy="300" r="1.5"/><circle cx="1150" cy="350" r="1"/>
  </g>
  <!-- Title -->
  <text x="640" y="590" text-anchor="middle" font-family="serif" font-size="44" fill="#c9a96e" letter-spacing="14" filter="url(#glow15)">INFINITE CRAFT</text>
  <text x="640" y="620" text-anchor="middle" font-family="serif" font-size="11" fill="#ffd93d" opacity="0.4" letter-spacing="6">TOTALITY</text>
</svg>