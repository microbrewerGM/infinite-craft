<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="hs-spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <filter id="hs-glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>

  <!-- Background glow -->
  <ellipse cx="640" cy="340" rx="250" ry="180" fill="url(#hs-spark)" opacity="0.5"/>

  <!-- Left hand/arm (orange) -->
  <g transform="translate(640, 340)">
    <!-- Left arm -->
    <path d="M -350 -20 Q -280 -25 -200 -10 Q -140 0 -80 20 L -40 30" fill="none" stroke="#ff6b35" stroke-width="28" stroke-linecap="round" opacity="0.8"/>
    <!-- Left hand outline -->
    <path d="M -40 30 Q -20 20 0 15" fill="none" stroke="#ff6b35" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
    <!-- Fingers -->
    <path d="M -60 10 Q -45 -5 -30 -10" fill="none" stroke="#ff6b35" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <path d="M -50 0 Q -35 -15 -20 -20" fill="none" stroke="#ff6b35" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
    <path d="M -45 -10 Q -30 -25 -15 -28" fill="none" stroke="#ff6b35" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <!-- Thumb -->
    <path d="M -30 35 Q -20 45 -10 42" fill="none" stroke="#ff6b35" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Right hand/arm (teal) -->
  <g transform="translate(640, 340)">
    <!-- Right arm -->
    <path d="M 350 -20 Q 280 -25 200 -10 Q 140 0 80 20 L 40 30" fill="none" stroke="#4ecdc4" stroke-width="28" stroke-linecap="round" opacity="0.8"/>
    <!-- Right hand -->
    <path d="M 40 30 Q 20 20 0 15" fill="none" stroke="#4ecdc4" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
    <!-- Fingers -->
    <path d="M 60 10 Q 45 -5 30 -10" fill="none" stroke="#4ecdc4" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <path d="M 50 0 Q 35 -15 20 -20" fill="none" stroke="#4ecdc4" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
    <path d="M 45 -10 Q 30 -25 15 -28" fill="none" stroke="#4ecdc4" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <!-- Thumb -->
    <path d="M 30 35 Q 20 45 10 42" fill="none" stroke="#4ecdc4" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Central spark/energy at handshake point -->
  <g transform="translate(640, 340)">
    <!-- Glow -->
    <circle cx="0" cy="15" r="40" fill="#ffd93d" opacity="0.15" filter="url(#hs-glow)"/>
    <!-- Spark rays -->
    <line x1="0" y1="-15" x2="0" y2="-50" stroke="#ffd93d" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="-10" x2="45" y2="-35" stroke="#ffd93d" stroke-width="2" opacity="0.5"/>
    <line x1="-20" y1="-10" x2="-45" y2="-35" stroke="#ffd93d" stroke-width="2" opacity="0.5"/>
    <line x1="30" y1="10" x2="55" y2="5" stroke="#a8e06c" stroke-width="1.5" opacity="0.4"/>
    <line x1="-30" y1="10" x2="-55" y2="5" stroke="#a8e06c" stroke-width="1.5" opacity="0.4"/>
    <line x1="15" y1="40" x2="25" y2="65" stroke="#ffd93d" stroke-width="1.5" opacity="0.3"/>
    <line x1="-15" y1="40" x2="-25" y2="65" stroke="#ffd93d" stroke-width="1.5" opacity="0.3"/>
    <!-- Spark particles -->
    <circle cx="0" cy="-55" r="3" fill="#fff" opacity="0.7"/>
    <circle cx="50" cy="-38" r="2.5" fill="#ffd93d" opacity="0.6"/>
    <circle cx="-48" cy="-40" r="2.5" fill="#a8e06c" opacity="0.6"/>
    <circle cx="35" cy="30" r="2" fill="#c4b5fd" opacity="0.5"/>
    <circle cx="-35" cy="28" r="2" fill="#c4b5fd" opacity="0.5"/>
    <circle cx="58" cy="8" r="1.5" fill="#fff" opacity="0.4"/>
    <circle cx="-60" cy="6" r="1.5" fill="#fff" opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#ffd93d" opacity="0.6" letter-spacing="4">HANDSHAKE</text>
</svg>