<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d6a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#1a2744"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>

  <!-- Title -->
  <text x="640" y="55" fill="white" font-family="monospace" font-size="42" font-weight="bold" text-anchor="middle" letter-spacing="8">INFINITE CRAFT</text>
  <line x1="300" y1="67" x2="980" y2="67" stroke="#4ecdc4" stroke-width="2"/>
  <text x="640" y="87" fill="#6eaadc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">ELEMENT FLOW PLUMBING SYSTEM</text>

  <!-- Tank 1 - Fire -->
  <rect x="80" y="150" width="120" height="160" rx="10" fill="none" stroke="#ff6b35" stroke-width="2.5"/>
  <line x1="80" y1="200" x2="200" y2="200" stroke="#ff6b35" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="140" y="185" fill="#ff6b35" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">FIRE</text>
  <!-- Liquid level -->
  <rect x="85" y="230" width="110" height="75" fill="#ff6b35" opacity="0.15"/>
  <path d="M 85 230 Q 110 220 140 230 Q 170 240 195 230" fill="none" stroke="#ff6b35" stroke-width="1"/>
  <text x="140" y="275" fill="#ff6b35" font-family="monospace" font-size="10" text-anchor="middle">78%</text>

  <!-- Tank 2 - Water -->
  <rect x="80" y="380" width="120" height="160" rx="10" fill="none" stroke="#4ecdc4" stroke-width="2.5"/>
  <line x1="80" y1="430" x2="200" y2="430" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="140" y="415" fill="#4ecdc4" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">WATER</text>
  <rect x="85" y="450" width="110" height="85" fill="#4ecdc4" opacity="0.15"/>
  <path d="M 85 450 Q 115 440 140 450 Q 165 460 195 450" fill="none" stroke="#4ecdc4" stroke-width="1"/>
  <text x="140" y="500" fill="#4ecdc4" font-family="monospace" font-size="10" text-anchor="middle">92%</text>

  <!-- Pipes from Fire tank -->
  <line x1="200" y1="260" x2="300" y2="260" stroke="#ff6b35" stroke-width="4"/>
  <line x1="300" y1="260" x2="300" y2="340" stroke="#ff6b35" stroke-width="4"/>
  <!-- Valve on fire pipe -->
  <g transform="translate(250,260)">
    <circle r="10" fill="#1a2744" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#ffd93d" stroke-width="2"/>
    <text x="0" y="-18" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">V1</text>
  </g>

  <!-- Pipes from Water tank -->
  <line x1="200" y1="460" x2="300" y2="460" stroke="#4ecdc4" stroke-width="4"/>
  <line x1="300" y1="460" x2="300" y2="380" stroke="#4ecdc4" stroke-width="4"/>
  <!-- Valve -->
  <g transform="translate(250,460)">
    <circle r="10" fill="#1a2744" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#ffd93d" stroke-width="2"/>
    <text x="0" y="-18" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">V2</text>
  </g>

  <!-- T-junction merge -->
  <line x1="300" y1="340" x2="300" y2="380" stroke="#c4b5fd" stroke-width="4"/>
  <circle cx="300" cy="360" r="8" fill="#1a2744" stroke="#c4b5fd" stroke-width="2"/>

  <!-- Main pipe to mixer -->
  <line x1="300" y1="360" x2="450" y2="360" stroke="#c4b5fd" stroke-width="4"/>

  <!-- Pump symbol -->
  <g transform="translate(380,360)">
    <circle r="18" fill="#1a2744" stroke="#a8e06c" stroke-width="2"/>
    <polygon points="-8,-8 8,0 -8,8" fill="#a8e06c"/>
    <text x="0" y="30" fill="#a8e06c" font-family="monospace" font-size="9" text-anchor="middle">PUMP-01</text>
  </g>

  <!-- Mixer vessel -->
  <ellipse cx="520" cy="360" rx="50" ry="70" fill="none" stroke="#ff6b35" stroke-width="2.5"/>
  <line x1="520" y1="290" x2="520" y2="250" stroke="#6eaadc" stroke-width="1.5"/>
  <line x1="510" y1="250" x2="530" y2="250" stroke="#6eaadc" stroke-width="1.5"/>
  <!-- Agitator -->
  <line x1="520" y1="330" x2="520" y2="400" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="505" y1="350" x2="535" y2="370" stroke="#ffd93d" stroke-width="1.5"/>
  <line x1="535" y1="350" x2="505" y2="370" stroke="#ffd93d" stroke-width="1.5"/>
  <text x="520" y="310" fill="white" font-family="monospace" font-size="11" text-anchor="middle">MIXER</text>

  <!-- Output pipe from mixer -->
  <line x1="570" y1="360" x2="700" y2="360" stroke="#a8e06c" stroke-width="4"/>

  <!-- Flow meter -->
  <g transform="translate(640,360)">
    <rect x="-20" y="-15" width="40" height="30" fill="#1a2744" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="0" y="5" fill="#ffd93d" font-family="monospace" font-size="10" text-anchor="middle">FM</text>
    <text x="0" y="-22" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">12.4 L/min</text>
  </g>

  <!-- Splitter -->
  <circle cx="730" cy="360" r="8" fill="#1a2744" stroke="#a8e06c" stroke-width="2"/>

  <!-- Upper output pipe -->
  <line x1="730" y1="360" x2="730" y2="220" stroke="#a8e06c" stroke-width="4"/>
  <line x1="730" y1="220" x2="900" y2="220" stroke="#a8e06c" stroke-width="4"/>
  <!-- Valve -->
  <g transform="translate(810,220)">
    <circle r="10" fill="#1a2744" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#ffd93d" stroke-width="2"/>
    <text x="0" y="-18" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">V3</text>
  </g>

  <!-- Lower output pipe -->
  <line x1="730" y1="360" x2="730" y2="500" stroke="#a8e06c" stroke-width="4"/>
  <line x1="730" y1="500" x2="900" y2="500" stroke="#a8e06c" stroke-width="4"/>
  <!-- Valve -->
  <g transform="translate(810,500)">
    <circle r="10" fill="#1a2744" stroke="#ffd93d" stroke-width="1.5"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ffd93d" stroke-width="2"/>
    <text x="0" y="-18" fill="#ffd93d" font-family="monospace" font-size="8" text-anchor="middle">V4</text>
  </g>

  <!-- Output Tank 1 -->
  <rect x="930" y="170" width="130" height="100" rx="8" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <text x="995" y="215" fill="#ff6b35" font-family="monospace" font-size="12" text-anchor="middle">STEAM</text>
  <text x="995" y="235" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">ELEMENT #5</text>
  <rect x="935" y="240" width="120" height="25" fill="#ff6b35" opacity="0.1"/>

  <!-- Output Tank 2 -->
  <rect x="930" y="450" width="130" height="100" rx="8" fill="none" stroke="#4ecdc4" stroke-width="2"/>
  <text x="995" y="495" fill="#4ecdc4" font-family="monospace" font-size="12" text-anchor="middle">MUD</text>
  <text x="995" y="515" fill="#6eaadc" font-family="monospace" font-size="9" text-anchor="middle">ELEMENT #9</text>
  <rect x="935" y="520" width="120" height="25" fill="#4ecdc4" opacity="0.1"/>

  <!-- Overflow/recirculation pipe -->
  <line x1="1060" y1="220" x2="1140" y2="220" stroke="#6eaadc" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="1140" y1="220" x2="1140" y2="500" stroke="#6eaadc" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="1060" y1="500" x2="1140" y2="500" stroke="#6eaadc" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1155" y="365" fill="#6eaadc" font-family="monospace" font-size="9" transform="rotate(90,1155,365)" text-anchor="middle">RECIRCULATE</text>

  <!-- Pressure gauges -->
  <g transform="translate(520,200)">
    <circle r="20" fill="#1a2744" stroke="#6eaadc" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="10" y2="-12" stroke="#ff6b35" stroke-width="1.5"/>
    <circle r="2" fill="#ff6b35"/>
    <text x="0" y="35" fill="#6eaadc" font-family="monospace" font-size="8" text-anchor="middle">3.2 bar</text>
  </g>

  <!-- Flow arrows -->
  <polygon points="440,355 450,360 440,365" fill="#c4b5fd"/>
  <polygon points="690,355 700,360 690,365" fill="#a8e06c"/>
  <polygon points="890,215 900,220 890,225" fill="#a8e06c"/>
  <polygon points="890,495 900,500 890,505" fill="#a8e06c"/>

  <!-- Corner marks -->
  <path d="M 20 20 L 20 60 M 20 20 L 60 20" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 1260 20 L 1260 60 M 1260 20 L 1220 20" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 20 620 L 20 580 M 20 620 L 60 620" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <path d="M 1260 620 L 1260 580 M 1260 620 L 1220 620" stroke="#4ecdc4" stroke-width="2" fill="none"/>

  <!-- Info block -->
  <rect x="900" y="580" width="360" height="40" fill="none" stroke="#6eaadc" stroke-width="1"/>
  <line x1="1080" y1="580" x2="1080" y2="620" stroke="#6eaadc" stroke-width="0.5"/>
  <text x="990" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">DWG: IC-PLUMB-003</text>
  <text x="1170" y="605" fill="#6eaadc" font-family="monospace" font-size="10" text-anchor="middle">SCALE: NTS</text>
</svg>