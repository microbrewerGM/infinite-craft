<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <filter id="gr-glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="gr-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>
  <ellipse cx="640" cy="320" rx="350" ry="250" fill="url(#gr-center)" opacity="0.3"/>

  <!-- Left gear (orange) - 12 teeth -->
  <g transform="translate(460, 320)">
    <!-- Gear body -->
    <circle cx="0" cy="0" r="120" fill="#0a0a14" stroke="#ff6b35" stroke-width="3" opacity="0.8"/>
    <!-- Teeth -->
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(30)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(60)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(90)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(120)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(150)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(180)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(210)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(240)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(270)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(300)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#ff6b35" opacity="0.7" transform="rotate(330)"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.4"/>
    <!-- Spokes -->
    <line x1="0" y1="-70" x2="0" y2="-30" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="70" x2="0" y2="30" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
    <line x1="-70" y1="0" x2="-30" y2="0" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
    <line x1="70" y1="0" x2="30" y2="0" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
    <line x1="-50" y1="-50" x2="-21" y2="-21" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
    <line x1="50" y1="50" x2="21" y2="21" stroke="#ff6b35" stroke-width="2" opacity="0.3"/>
    <!-- Center hub -->
    <circle cx="0" cy="0" r="25" fill="#0a0a14" stroke="#ff6b35" stroke-width="2.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="8" fill="#ff6b35" opacity="0.5"/>
    <!-- Rotation arrow -->
    <path d="M -20 -95 Q -40 -100 -35 -80" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Right gear (teal) - 12 teeth, offset by 15 degrees to mesh -->
  <g transform="translate(820, 320) rotate(15)">
    <circle cx="0" cy="0" r="120" fill="#0a0a14" stroke="#4ecdc4" stroke-width="3" opacity="0.8"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(30)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(60)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(90)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(120)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(150)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(180)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(210)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(240)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(270)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(300)"/>
    <rect x="-12" y="-140" width="24" height="30" rx="3" fill="#4ecdc4" opacity="0.7" transform="rotate(330)"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="-70" x2="0" y2="-30" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="70" x2="0" y2="30" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
    <line x1="-70" y1="0" x2="-30" y2="0" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
    <line x1="70" y1="0" x2="30" y2="0" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
    <line x1="50" y1="-50" x2="21" y2="-21" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
    <line x1="-50" y1="50" x2="-21" y2="21" stroke="#4ecdc4" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="25" fill="#0a0a14" stroke="#4ecdc4" stroke-width="2.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="8" fill="#4ecdc4" opacity="0.5"/>
  </g>

  <!-- Mesh point sparks -->
  <circle cx="640" cy="250" r="4" fill="#ffd93d" opacity="0.6"/>
  <circle cx="640" cy="390" r="4" fill="#ffd93d" opacity="0.6"/>
  <circle cx="640" cy="250" r="10" fill="#ffd93d" opacity="0.1" filter="url(#gr-glow)"/>
  <circle cx="640" cy="390" r="10" fill="#ffd93d" opacity="0.1" filter="url(#gr-glow)"/>
  <!-- Small sparks -->
  <circle cx="635" cy="240" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="645" cy="245" r="1" fill="#a8e06c" opacity="0.4"/>
  <circle cx="638" cy="395" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="648" cy="385" r="1" fill="#a8e06c" opacity="0.4"/>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#c4b5fd" opacity="0.6" letter-spacing="4">GEAR MESH</text>
</svg>