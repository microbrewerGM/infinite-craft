<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon-grad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#0a0a14" stop-opacity="0"/>
      <stop offset="75%" stop-color="#ff6b35" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#ffd93d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0"/>
    </radialGradient>
    <filter id="ec-glow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="ec-soft">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0a0a14"/>

  <!-- Distant stars -->
  <circle cx="120" cy="80" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="300" cy="150" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="980" cy="100" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="1100" cy="200" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="200" cy="500" r="1" fill="#fff" opacity="0.35"/>
  <circle cx="1050" cy="480" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="400" cy="550" r="1.5" fill="#fff" opacity="0.25"/>
  <circle cx="850" cy="530" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="150" cy="320" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="1150" cy="350" r="1" fill="#fff" opacity="0.25"/>

  <!-- Sun (behind) -->
  <circle cx="640" cy="320" r="160" fill="url(#sun-grad)" opacity="0.9"/>
  <!-- Sun outer glow -->
  <circle cx="640" cy="320" r="200" fill="#ff6b35" opacity="0.08" filter="url(#ec-glow)"/>
  <circle cx="640" cy="320" r="250" fill="#ffd93d" opacity="0.04" filter="url(#ec-glow)"/>

  <!-- Corona visible around eclipse -->
  <circle cx="640" cy="320" r="170" fill="url(#corona)"/>

  <!-- Corona streamers -->
  <path d="M 640 145 Q 650 130 640 110" fill="none" stroke="#ffd93d" stroke-width="2" opacity="0.3"/>
  <path d="M 750 185 Q 770 170 780 155" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.25"/>
  <path d="M 530 185 Q 510 170 500 155" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.25"/>
  <path d="M 800 280 Q 820 270 840 265" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.2"/>
  <path d="M 480 280 Q 460 270 440 265" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.2"/>
  <path d="M 800 370 Q 825 380 845 385" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.2"/>
  <path d="M 480 370 Q 455 380 435 385" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.2"/>
  <path d="M 745 455 Q 765 470 775 485" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.2"/>
  <path d="M 535 455 Q 515 470 505 485" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.2"/>
  <path d="M 640 495 Q 645 510 640 530" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.2"/>

  <!-- Moon (foreground, overlapping) -->
  <circle cx="660" cy="310" r="150" fill="url(#moon-grad)"/>
  <!-- Moon surface detail -->
  <circle cx="620" cy="280" r="20" fill="#1a1a2a" opacity="0.5"/>
  <circle cx="700" cy="340" r="15" fill="#1a1a2a" opacity="0.4"/>
  <circle cx="650" cy="370" r="12" fill="#181828" opacity="0.4"/>
  <circle cx="690" cy="270" r="8" fill="#1a1a2a" opacity="0.3"/>

  <!-- Diamond ring effect -->
  <circle cx="510" cy="280" r="8" fill="#fff" opacity="0.8"/>
  <circle cx="510" cy="280" r="15" fill="#fff" opacity="0.2" filter="url(#ec-soft)"/>
  <circle cx="510" cy="280" r="30" fill="#fff" opacity="0.06" filter="url(#ec-glow)"/>

  <!-- Baily's beads -->
  <circle cx="520" cy="230" r="3" fill="#ffd93d" opacity="0.5"/>
  <circle cx="540" cy="195" r="2.5" fill="#ffd93d" opacity="0.4"/>
  <circle cx="580" cy="175" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="510" cy="340" r="2.5" fill="#ffd93d" opacity="0.4"/>

  <!-- Title -->
  <text x="640" y="80" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="white" letter-spacing="12">INFINITE CRAFT</text>
  <text x="640" y="610" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#ffd93d" opacity="0.6" letter-spacing="4">ECLIPSE OVERLAP</text>
</svg>