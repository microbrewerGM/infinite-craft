<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg14" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#10101e"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <filter id="glow14">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg14)"/>
  <g transform="translate(640,320)">
    <!-- Paths (channels) connecting sephirot -->
    <g stroke="#c9a96e" stroke-width="1" opacity="0.3">
      <!-- Pillar of Severity (left) -->
      <line x1="-100" y1="-180" x2="-100" y2="-60"/>
      <line x1="-100" y1="-60" x2="-100" y2="80"/>
      <line x1="-100" y1="80" x2="-50" y2="200"/>
      <!-- Pillar of Mercy (right) -->
      <line x1="100" y1="-180" x2="100" y2="-60"/>
      <line x1="100" y1="-60" x2="100" y2="80"/>
      <line x1="100" y1="80" x2="50" y2="200"/>
      <!-- Middle Pillar -->
      <line x1="0" y1="-260" x2="0" y2="-120"/>
      <line x1="0" y1="-120" x2="0" y2="20"/>
      <line x1="0" y1="20" x2="0" y2="200"/>
      <line x1="0" y1="200" x2="0" y2="280"/>
      <!-- Cross paths -->
      <line x1="0" y1="-260" x2="-100" y2="-180"/>
      <line x1="0" y1="-260" x2="100" y2="-180"/>
      <line x1="-100" y1="-180" x2="100" y2="-180"/>
      <line x1="-100" y1="-180" x2="0" y2="-120"/>
      <line x1="100" y1="-180" x2="0" y2="-120"/>
      <line x1="-100" y1="-60" x2="100" y2="-60"/>
      <line x1="-100" y1="-60" x2="0" y2="-120"/>
      <line x1="100" y1="-60" x2="0" y2="-120"/>
      <line x1="-100" y1="-60" x2="0" y2="20"/>
      <line x1="100" y1="-60" x2="0" y2="20"/>
      <line x1="-100" y1="80" x2="100" y2="80"/>
      <line x1="-100" y1="80" x2="0" y2="20"/>
      <line x1="100" y1="80" x2="0" y2="20"/>
      <line x1="-100" y1="80" x2="0" y2="200"/>
      <line x1="100" y1="80" x2="0" y2="200"/>
    </g>
    <!-- Sephirot (10 spheres) -->
    <!-- 1 Kether (Crown) -->
    <circle cx="0" cy="-260" r="22" fill="none" stroke="#ffd93d" stroke-width="1.5" opacity="0.6" filter="url(#glow14)"/>
    <circle cx="0" cy="-260" r="8" fill="#ffd93d" opacity="0.2"/>
    <text x="0" y="-256" text-anchor="middle" font-family="serif" font-size="8" fill="#ffd93d" opacity="0.7">1</text>
    <!-- 2 Chokmah (Wisdom) -->
    <circle cx="100" cy="-180" r="20" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5" filter="url(#glow14)"/>
    <circle cx="100" cy="-180" r="7" fill="#c4b5fd" opacity="0.15"/>
    <text x="100" y="-176" text-anchor="middle" font-family="serif" font-size="8" fill="#c4b5fd" opacity="0.7">2</text>
    <!-- 3 Binah (Understanding) -->
    <circle cx="-100" cy="-180" r="20" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5" filter="url(#glow14)"/>
    <circle cx="-100" cy="-180" r="7" fill="#4ecdc4" opacity="0.15"/>
    <text x="-100" y="-176" text-anchor="middle" font-family="serif" font-size="8" fill="#4ecdc4" opacity="0.7">3</text>
    <!-- Da'at (hidden, dashed) -->
    <circle cx="0" cy="-120" r="16" fill="none" stroke="#c9a96e" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3"/>
    <!-- 4 Chesed -->
    <circle cx="100" cy="-60" r="20" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5" filter="url(#glow14)"/>
    <circle cx="100" cy="-60" r="7" fill="#4ecdc4" opacity="0.15"/>
    <text x="100" y="-56" text-anchor="middle" font-family="serif" font-size="8" fill="#4ecdc4" opacity="0.7">4</text>
    <!-- 5 Geburah -->
    <circle cx="-100" cy="-60" r="20" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.5" filter="url(#glow14)"/>
    <circle cx="-100" cy="-60" r="7" fill="#ff6b35" opacity="0.15"/>
    <text x="-100" y="-56" text-anchor="middle" font-family="serif" font-size="8" fill="#ff6b35" opacity="0.7">5</text>
    <!-- 6 Tiphareth (Beauty) - center -->
    <circle cx="0" cy="20" r="24" fill="none" stroke="#ffd93d" stroke-width="2" opacity="0.6" filter="url(#glow14)"/>
    <circle cx="0" cy="20" r="10" fill="#ffd93d" opacity="0.15"/>
    <text x="0" y="24" text-anchor="middle" font-family="serif" font-size="8" fill="#ffd93d" opacity="0.7">6</text>
    <!-- 7 Netzach -->
    <circle cx="100" cy="80" r="20" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.5" filter="url(#glow14)"/>
    <circle cx="100" cy="80" r="7" fill="#a8e06c" opacity="0.15"/>
    <text x="100" y="84" text-anchor="middle" font-family="serif" font-size="8" fill="#a8e06c" opacity="0.7">7</text>
    <!-- 8 Hod -->
    <circle cx="-100" cy="80" r="20" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.5" filter="url(#glow14)"/>
    <circle cx="-100" cy="80" r="7" fill="#ff6b35" opacity="0.15"/>
    <text x="-100" y="84" text-anchor="middle" font-family="serif" font-size="8" fill="#ff6b35" opacity="0.7">8</text>
    <!-- 9 Yesod -->
    <circle cx="0" cy="200" r="20" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5" filter="url(#glow14)"/>
    <circle cx="0" cy="200" r="7" fill="#c4b5fd" opacity="0.15"/>
    <text x="0" y="204" text-anchor="middle" font-family="serif" font-size="8" fill="#c4b5fd" opacity="0.7">9</text>
    <!-- 10 Malkuth -->
    <circle cx="0" cy="280" r="20" fill="none" stroke="#a8e06c" stroke-width="1.5" opacity="0.5" filter="url(#glow14)"/>
    <circle cx="0" cy="280" r="7" fill="#a8e06c" opacity="0.15"/>
    <text x="0" y="284" text-anchor="middle" font-family="serif" font-size="8" fill="#a8e06c" opacity="0.7">10</text>
    <!-- Labels -->
    <g font-family="serif" font-size="9" fill="#c9a96e" opacity="0.35">
      <text x="0" y="-288" text-anchor="middle">KETHER</text>
      <text x="135" y="-176" text-anchor="start">CHOKMAH</text>
      <text x="-135" y="-176" text-anchor="end">BINAH</text>
      <text x="135" y="-56" text-anchor="start">CHESED</text>
      <text x="-135" y="-56" text-anchor="end">GEBURAH</text>
      <text x="40" y="18" text-anchor="start">TIPHARETH</text>
      <text x="135" y="84" text-anchor="start">NETZACH</text>
      <text x="-135" y="84" text-anchor="end">HOD</text>
      <text x="35" y="204" text-anchor="start">YESOD</text>
      <text x="35" y="284" text-anchor="start">MALKUTH</text>
    </g>
  </g>
  <!-- Title at top left and right -->
  <text x="160" y="320" text-anchor="middle" font-family="serif" font-size="36" fill="#c9a96e" letter-spacing="6" transform="rotate(-90,160,320)" filter="url(#glow14)">INFINITE</text>
  <text x="1120" y="320" text-anchor="middle" font-family="serif" font-size="36" fill="#c9a96e" letter-spacing="6" transform="rotate(90,1120,320)" filter="url(#glow14)">CRAFT</text>
</svg>