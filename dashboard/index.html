<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Craft Explorer</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- d3 v7.9.0, vendored in dashboard/vendor/. Served from our own origin so the
     dashboard has no third-party runtime dependency and the CSP can stay
     script-src 'self'. The integrity hash matches the upstream release. -->
<script src="vendor/d3.v7.min.js"
  integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
  crossorigin="anonymous"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a1a; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 320px; min-width: 220px; background: #12122a; border-right: 1px solid #2a2a4a; display: flex; flex-direction: column; flex-shrink: 0; }
  #sidebar h1 { font-size: 16px; padding: 16px; border-bottom: 1px solid #2a2a4a; color: #fff; display: flex; align-items: center; gap: 8px; }
  #sidebar h1 .badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: #22c55e22; border: 1px solid #22c55e44; color: #4ade80; }
  #stats { padding: 12px 16px; border-bottom: 1px solid #2a2a4a; font-size: 12px; color: #999; }
  #stats .stat { display: flex; justify-content: space-between; margin-bottom: 4px; }
  #stats .stat-value { color: #fff; font-weight: 600; }
  #search-box { padding: 8px 16px; border-bottom: 1px solid #2a2a4a; }
  #search-box input { width: 100%; padding: 6px 10px; background: #1a1a3a; border: 1px solid #3a3a5a; border-radius: 4px; color: #e0e0e0; font-size: 13px; outline: none; }
  #search-box input:focus { border-color: #6366f1; }
  #sort-bar { padding: 4px 16px; border-bottom: 1px solid #2a2a4a; display: flex; gap: 4px; }
  #sort-bar button { padding: 3px 8px; background: #1a1a3a; border: 1px solid #2a2a4a; border-radius: 3px; color: #888; font-size: 10px; cursor: pointer; }
  #sort-bar button:hover { border-color: #6366f1; color: #ccc; }
  #sort-bar button.active { background: #6366f122; border-color: #6366f1; color: #a5b4fc; }
  #element-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .element-item { padding: 6px 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .element-item:hover { background: #1a1a3a; }
  .element-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .element-emoji { font-size: 14px; flex-shrink: 0; }
  .element-name { flex: 1; }
  .element-gen { font-size: 11px; color: #666; }
  .element-new { font-size: 10px; color: #f59e0b; }
  #update-status { padding: 8px 16px; border-top: 1px solid #2a2a4a; font-size: 11px; color: #666; display: flex; align-items: center; gap: 6px; }
  #update-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
  #update-status .dot.error { background: #ef4444; }
  #main { flex: 1; position: relative; }
  #graph-svg { width: 100%; height: 100%; }
  #tooltip { position: absolute; background: #1e1e3a; border: 1px solid #4a4a6a; border-radius: 8px; padding: 12px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity 0.15s; max-width: 320px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  #tooltip.visible { opacity: 1; }
  #legend { position: absolute; top: 12px; right: 12px; background: #12122ae0; border: 1px solid #2a2a4a; border-radius: 6px; padding: 8px 12px; font-size: 11px; backdrop-filter: blur(8px); max-height: calc(100vh - 120px); overflow-y: auto; }
  #legend::-webkit-scrollbar { width: 4px; }
  #legend::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 2px; }
  #legend .legend-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #legend .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  #legend .legend-section { color: #a5b4fc; font-weight: 600; margin-top: 8px; margin-bottom: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  #legend .legend-section:first-child { margin-top: 0; }
  #legend .size-option { display: flex; align-items: center; gap: 6px; margin: 2px 0; cursor: pointer; padding: 2px 4px; border-radius: 3px; }
  #legend .size-option:hover { background: #1a1a3a; }
  #legend .size-option.active { background: #1a1a3a; color: #a5b4fc; }
  #legend .size-option .radio { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #555; flex-shrink: 0; }
  #legend .size-option.active .radio { border-color: #a5b4fc; background: #a5b4fc; }
  #view-toggle { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; background: #12122ae0; border: 1px solid #2a2a4a; border-radius: 6px; overflow: hidden; backdrop-filter: blur(8px); }
  #view-toggle button { padding: 6px 14px; background: transparent; border: none; color: #888; font-size: 12px; cursor: pointer; }
  #view-toggle button:hover { color: #ccc; }
  #view-toggle button.active { background: #6366f1; color: #fff; }
  .node-circle { stroke: #fff; stroke-width: 1; cursor: pointer; transition: r 0.2s; }
  .node-circle.base { stroke-width: 2; }
  .node-circle.highlighted { stroke: #f59e0b; stroke-width: 3; }
  .node-circle.dimmed { opacity: 0.15; }
  .node-label { fill: #ccc; font-size: 10px; pointer-events: none; text-anchor: middle; }
  .node-label.dimmed { opacity: 0.1; }
  .link-line { stroke: #2a2a4a; stroke-width: 1; }
  .link-line.highlighted { stroke: #6366f1; stroke-width: 2; }
  .link-line.dimmed { opacity: 0.05; }
  @keyframes focus-pulse { 0%, 100% { r: 18; opacity: 0.6; } 50% { r: 24; opacity: 0.2; } }
  .focus-ring { fill: none; stroke: #f59e0b; stroke-width: 2; opacity: 0.6; animation: focus-pulse 1.2s ease-in-out infinite; pointer-events: none; }
  .node-circle.focused { stroke: #f59e0b; stroke-width: 3; filter: drop-shadow(0 0 8px #f59e0b88); }
  .element-item.selected { background: #6366f122; border-left: 2px solid #6366f1; }
  #element-card { position: absolute; bottom: 16px; left: 16px; right: 16px; background: #12122af0; border: 1px solid #2a2a4a; border-radius: 8px; padding: 14px 16px; display: none; font-size: 12px; backdrop-filter: blur(10px); z-index: 10; }
  #element-card.visible { display: block; }
  #element-card .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #element-card .card-name { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
  #element-card .card-close { cursor: pointer; color: #666; font-size: 18px; padding: 2px 6px; }
  #element-card .card-close:hover { color: #fff; }
  #element-card .card-meta { display: flex; gap: 16px; margin-bottom: 10px; font-size: 11px; color: #888; }
  #element-card .card-meta span { color: #a5b4fc; font-weight: 600; }
  #element-card .card-actions { display: flex; gap: 6px; }
  #element-card .card-actions button { padding: 5px 14px; background: #1a1a3a; border: 1px solid #2a2a4a; border-radius: 4px; color: #a5b4fc; font-size: 11px; cursor: pointer; }
  #element-card .card-actions button:hover { border-color: #6366f1; background: #6366f122; color: #fff; }
  #chain-overlay { position: absolute; inset: 0; background: #0a0a1af0; z-index: 20; display: none; backdrop-filter: blur(6px); }
  #chain-overlay.visible { display: flex; }
  #chain-overlay .chain-header { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #12122af0; border-bottom: 1px solid #2a2a4a; z-index: 2; }
  #chain-overlay .chain-title { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
  #chain-overlay .chain-meta { display: flex; gap: 12px; font-size: 11px; color: #888; }
  #chain-overlay .chain-meta span { color: #a5b4fc; font-weight: 600; }
  #chain-overlay .chain-close { cursor: pointer; color: #666; font-size: 22px; padding: 2px 8px; line-height: 1; }
  #chain-overlay .chain-close:hover { color: #fff; }
  #chain-overlay .chain-controls { display: flex; gap: 6px; }
  #chain-overlay .chain-controls button { padding: 4px 12px; background: #1a1a3a; border: 1px solid #2a2a4a; border-radius: 4px; color: #888; font-size: 11px; cursor: pointer; }
  #chain-overlay .chain-controls button:hover { border-color: #6366f1; color: #ccc; }
  #chain-overlay .chain-controls button.active { background: #6366f122; border-color: #6366f1; color: #a5b4fc; }
  #chain-graph-area { flex: 1; overflow: hidden; margin-top: 48px; }
  #chain-graph-area svg { width: 100%; height: 100%; }
  .chain-node circle { stroke: #fff; stroke-width: 1; cursor: pointer; }
  .chain-node.target circle { stroke-width: 2.5; }
  .chain-node text { fill: #ccc; font-size: 10px; text-anchor: middle; pointer-events: none; }
  .chain-node .recipe-label { fill: #666; font-size: 8px; text-anchor: middle; }
  .chain-link { fill: none; stroke: #3a3a5a; stroke-width: 1.5; }
  .chain-link.path-highlight { stroke: #f59e0b; stroke-width: 2.5; }
  .chain-node.path-highlight circle { stroke: #f59e0b; stroke-width: 2.5; filter: drop-shadow(0 0 6px #f59e0b88); }
  .chain-node.path-dimmed circle { opacity: 0.15; }
  .chain-node.path-dimmed text { opacity: 0.1; }
  .chain-link.path-dimmed { opacity: 0.07; }
  .gen-line { stroke: #1a1a3a; stroke-width: 1; stroke-dasharray: 4,4; }
  .gen-label { fill: #444; font-size: 10px; }
  #build-order-panel { width: 260px; min-width: 200px; background: #12122a; border-left: 1px solid #2a2a4a; margin-top: 48px; overflow-y: auto; padding: 12px; flex-shrink: 0; }
  #build-order-panel h3 { font-size: 12px; color: #a5b4fc; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .build-step { padding: 6px 8px; margin-bottom: 4px; border-radius: 4px; cursor: pointer; font-size: 11px; border: 1px solid transparent; }
  .build-step:hover { background: #1a1a3a; border-color: #2a2a4a; }
  .build-step.step-highlight { background: #f59e0b11; border-color: #f59e0b44; }
  .build-step .step-num { font-size: 9px; color: #666; margin-bottom: 2px; }
  .build-step .step-recipe { color: #a5b4fc; }
  .build-step .step-result { color: #fff; font-weight: 600; }
  .build-step.step-highlight .step-result { color: #f59e0b; }
  #content-pane { display: none; width: 100%; height: 100%; overflow-y: auto; padding: 60px 24px 24px; }
  #content-pane.visible { display: block; }
  /* The graph view hides #content-pane, so the missing-library notice has to
     unhide it and drop the top padding meant for the view toggle. */
  #content-pane.pane-notice { padding: 24px; color: #999; }
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 16px; }
  .chart-card { background: #12122a; border: 1px solid #2a2a4a; border-radius: 8px; padding: 16px; }
  .chart-card h3 { font-size: 13px; color: #a5b4fc; margin-bottom: 12px; font-weight: 600; }
  .chart-card h3:hover { color: #c4b5fd; }
  .chart-card-expanded { grid-column: 1 / -1; min-height: 400px; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th { text-align: left; color: #888; font-weight: 500; padding: 8px; border-bottom: 1px solid #2a2a4a; user-select: none; }
  .data-table th[style*="cursor"] { color: #a5b4fc; }
  .data-table th[style*="cursor"]:hover { color: #fff; }
  .data-table td { padding: 8px; border-bottom: 1px solid #1a1a3a; }
  .data-table tr:hover td { background: #1a1a3a; }
  .num { text-align: right; font-weight: 600; color: #fff; }
  .disc { color: #f59e0b; }
  .err { color: #ef4444; }
  .loading { text-align: center; padding: 60px; color: #666; font-size: 14px; }
  .stat-card { background: #1a1a3a; border-radius: 8px; padding: 16px; text-align: center; }
  .stat-card-value { font-size: 28px; font-weight: 700; }
  .stat-card-label { font-size: 11px; color: #888; margin-top: 4px; }
  .gen-bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .gen-bar-label { color: #888; font-size: 11px; width: 40px; text-align: right; }
  .gen-bar-track { flex: 1; height: 20px; background: #1a1a3a; border-radius: 3px; overflow: hidden; }
  .gen-bar-fill { height: 100%; border-radius: 3px; }
  .gen-bar-count { color: #fff; font-size: 11px; width: 40px; font-weight: 600; }
  .bar-value { fill: #ccc; font-size: 10px; }
  .analytics-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .analytics-table th { text-align: left; color: #888; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #2a2a4a; }
  .analytics-table td { padding: 6px 8px; border-bottom: 1px solid #1a1a3a; }
  .analytics-table tr:hover td { background: #1a1a3a; }
  .analytics-table .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; }
  .view-all-link { color: #a5b4fc; font-size: 12px; cursor: pointer; margin-top: 8px; display: inline-block; }
  .view-all-link:hover { text-decoration: underline; }
  .gen-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; color: #fff; font-weight: 600; }
  .strategy-badge { background: #6366f122; border: 1px solid #6366f144; padding: 1px 6px; border-radius: 3px; font-size: 10px; color: #a5b4fc; }
  .worker-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .worker-summary .stat-card { padding: 12px; }
  .worker-summary .stat-card-value { font-size: 22px; }
  .run-card { background: #12122a; border: 1px solid #2a2a4a; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .run-card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #1a1a3a; cursor: pointer; }
  .run-card-header:hover { background: #1a1a3a; }
  .run-card-id { font-family: monospace; font-size: 12px; color: #a5b4fc; }
  .run-card-time { font-size: 11px; color: #888; }
  .run-card-meta { display: flex; gap: 12px; align-items: center; }
  .run-card-body { padding: 12px 16px; display: none; }
  .run-card-body.open { display: block; }
  .run-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .run-detail-item { background: #0a0a1a; border-radius: 6px; padding: 10px 12px; }
  .run-detail-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .run-detail-value { font-size: 16px; font-weight: 600; color: #fff; }
  .run-detail-value.highlight { color: #f59e0b; }
  .run-detail-value.error { color: #ef4444; }
  .run-detail-value.success { color: #4ade80; }
  .run-efficiency { margin-top: 8px; font-size: 11px; color: #888; }
  .run-efficiency span { color: #a5b4fc; font-weight: 600; }
  .run-bar { height: 4px; background: #1a1a3a; border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .run-bar-fill { height: 100%; border-radius: 2px; }
  .source-badge { padding: 1px 6px; border-radius: 3px; font-size: 10px; }
  .source-scheduled { background: #22c55e22; border: 1px solid #22c55e44; color: #4ade80; }
  .source-manual { background: #f59e0b22; border: 1px solid #f59e0b44; color: #fbbf24; }
  .scheduled-upcoming { background: #0a0a1a; border: 1px solid #2a2a4a; border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; }
  .scheduled-upcoming h3 { font-size: 13px; color: #4ade80; margin: 0 0 10px; }
  .scheduled-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1a1a3a; font-size: 12px; }
  .scheduled-row:last-child { border-bottom: none; }
  .scheduled-row .sched-time { color: #a5b4fc; font-family: monospace; }
  .scheduled-row .sched-countdown { color: #888; font-size: 11px; }
  .scheduled-row .sched-strategy { color: #c4b5fd; font-size: 11px; }
  .time-filter { display: flex; gap: 6px; margin-bottom: 16px; }
  .time-filter button { padding: 4px 10px; background: #1a1a3a; border: 1px solid #2a2a4a; border-radius: 4px; color: #888; font-size: 11px; cursor: pointer; }
  .time-filter button:hover { border-color: #6366f1; color: #ccc; }
  .time-filter button.active { background: #6366f122; border-color: #6366f1; color: #a5b4fc; }

  /* ── Mobile / Tablet Responsive ────────────────────────── */
  #sidebar-toggle { display: none; position: fixed; top: 12px; left: 12px; z-index: 50; width: 44px; height: 44px; background: #12122ae0; border: 1px solid #2a2a4a; border-radius: 6px; cursor: pointer; padding: 11px 9px; backdrop-filter: blur(8px); }
  #sidebar-toggle span { display: block; width: 26px; height: 2px; background: #e0e0e0; border-radius: 1px; transition: transform 0.25s, opacity 0.25s; }
  #sidebar-toggle span:nth-child(2) { margin: 6px 0; }
  #sidebar-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  #sidebar-toggle.open span:nth-child(2) { opacity: 0; }
  #sidebar-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
  #sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 29; }
  #sidebar-backdrop.visible { display: block; }

  @media (max-width: 1023px) {
    #sidebar-toggle { display: block; }
    /* The toggle is fixed at top-left and sat on top of the sidebar title. */
    #sidebar h1 { padding-left: 68px; }
    #sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 30; transform: translateX(-100%); transition: transform 0.3s ease; }
    #sidebar.open { transform: translateX(0); }
    body { display: block; }
    #main { width: 100%; height: 100vh; }
    #view-toggle { left: 60px; overflow-x: auto; max-width: calc(100vw - 80px); }
    #view-toggle button { min-height: 44px; white-space: nowrap; }
    #element-card { left: 8px; right: 8px; bottom: 8px; }
  }

  @media (max-width: 767px) {
    #sidebar { width: 100%; }
    #search-box input { font-size: 16px; }
    .element-item { min-height: 44px; }
    #sort-bar button { min-height: 44px; padding: 6px 12px; font-size: 12px; }
    .chart-grid { grid-template-columns: 1fr; }
    .worker-summary { grid-template-columns: repeat(2, 1fr); }
    .run-detail-grid { grid-template-columns: 1fr 1fr; }
    .data-table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #legend { top: auto; bottom: 12px; right: 12px; max-width: 160px; max-height: 30vh; font-size: 10px; }
    #chain-overlay.visible { flex-direction: column; }
    #build-order-panel { width: 100%; max-height: 40vh; border-left: none; border-top: 1px solid #2a2a4a; margin-top: 0; }
    #chain-graph-area { flex: 1; min-height: 40vh; }
    .chain-header { flex-wrap: wrap; gap: 8px; }
    .chain-controls button { min-height: 44px; }
    .chain-close { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    .time-filter { flex-wrap: wrap; }
    .time-filter button { min-height: 44px; }
    .card-actions button { min-height: 44px; }
    .card-close { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  }

  /* WCAG 2.5.8 asks for 24px; these controls were 19-22px at every width
     above the mobile breakpoint. */
  #sort-bar button, .time-filter button, .card-actions button, .chain-controls button {
    min-height: 28px;
  }

  @media (min-width: 768px) and (max-width: 1023px) {
    #sidebar { width: 320px; }
    .chart-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .sort-bar button { min-height: 44px; }
    .chain-controls button { min-height: 44px; }
    .card-actions button { min-height: 44px; }
  }
</style>
</head>
<body>

<button id="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="false">
  <span></span><span></span><span></span>
</button>

<div id="sidebar">
  <h1>Infinite Craft Explorer <span style="font-size:10px;color:#444;font-weight:400;margin-left:auto">v1.4.2</span></h1>
  <div id="stats">
    <div class="stat"><span>Elements</span><span class="stat-value" id="stat-elements">--</span></div>
    <div class="stat"><span>Recipes</span><span class="stat-value" id="stat-recipes">--</span></div>
    <div class="stat"><span>First Discoveries</span><span class="stat-value" id="stat-firsts">--</span></div>
    <div class="stat"><span>Max Generation</span><span class="stat-value" id="stat-maxgen">--</span></div>
    <div class="stat"><span>Last Run</span><span class="stat-value" id="stat-lastrun">--</span></div>
  </div>
  <div id="search-box"><input type="text" placeholder="Search elements..." id="search-input"></div>
  <div id="sort-bar"></div>
  <div id="element-list"></div>
  <div id="update-status">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">Loading...</span>
  </div>
</div>

<div id="sidebar-backdrop"></div>

<div id="main">
  <div id="view-toggle">
    <button class="active" data-view="graph">Graph</button>
    <button data-view="analytics">Analytics</button>
    <button data-view="first-disc">First Discoveries</button>
    <button data-view="workers">Worker Runs</button>
  </div>
